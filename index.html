<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JHEILER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff304f%22/><polygon points=%2238,28 78,50 38,72%22 fill=%22white%22/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   RESET / BASE
============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Roboto","Segoe UI",Arial,sans-serif;
  background:#0f0f0f;
  color:#ffffff;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;color:#fff;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#0f0f0f;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#ff304f;}

:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#212121;
  --text:#ffffff;
  --text-secondary:#aaaaaa;
  --accent:#ff304f;
  --accent-dark:#c9223c;
  --border:#303030;
  --header-h:56px;
  --sidebar-w:240px;
  --sidebar-w-mini:72px;
}

.hidden{display:none !important;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ============================================================
   HEADER
============================================================ */
#appHeader{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  z-index:200;
  border-bottom:1px solid transparent;
}
.header-left{display:flex;align-items:center;gap:20px;min-width:0;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:20px;
  transition:background .15s;
  flex-shrink:0;
}
.icon-btn:hover{background:#3a3a3a;}
.brand{
  display:flex;align-items:center;gap:4px;
  font-size:20px;font-weight:700;letter-spacing:-0.5px;
  color:var(--text);white-space:nowrap;
}
.brand .play-ico{color:var(--accent);font-size:22px;transform:translateY(-1px);}
.brand span.hl{color:var(--accent);}

.header-center{
  flex:1;display:flex;justify-content:center;align-items:center;
  gap:8px;max-width:720px;margin:0 32px;
}
.search-form{
  display:flex;flex:1;align-items:center;
  border:1px solid var(--border);border-radius:20px 0 0 20px;
  background:var(--bg);height:40px;overflow:hidden;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:0 16px;font-size:15px;color:var(--text);
}
.search-btn{
  width:64px;height:40px;background:var(--panel2);
  border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;
}
.search-btn:hover{background:#3a3a3a;}
.mic-btn{
  width:40px;height:40px;border-radius:50%;background:var(--panel2);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
}
.mic-btn:hover{background:#3a3a3a;}

.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.create-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;background:var(--panel2);
  font-size:14px;font-weight:500;white-space:nowrap;
}
.create-btn:hover{background:#3a3a3a;}
.avatar-circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;overflow:hidden;flex-shrink:0;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}
.auth-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border:1px solid var(--border);border-radius:20px;
  color:#3ea6ff;font-size:14px;font-weight:500;white-space:nowrap;
}
.auth-btn:hover{background:rgba(62,166,255,0.1);}
.badge-dot{
  position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);
}
.icon-btn-wrap{position:relative;}

/* ============================================================
   SIDEBAR
============================================================ */
#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg);overflow-y:auto;z-index:150;
  transition:transform .2s ease, width .2s ease;
  padding-bottom:24px;
}
#sidebar.mini{width:var(--sidebar-w-mini);}
.sb-section{padding:12px 0;border-bottom:1px solid var(--border);}
.sb-section:last-child{border-bottom:none;}
.sb-title{
  padding:6px 24px;font-size:13px;font-weight:600;color:var(--text-secondary);
  text-transform:none;
}
.sb-item{
  display:flex;align-items:center;gap:20px;
  padding:10px 24px;font-size:14px;border-radius:0 20px 20px 0;
  white-space:nowrap;overflow:hidden;
}
#sidebar.mini .sb-item{
  flex-direction:column;gap:4px;padding:14px 4px;font-size:10px;
  border-radius:8px;margin:0 4px;text-align:center;
}
#sidebar.mini .sb-title{display:none;}
.sb-item .sb-ico{font-size:20px;width:24px;text-align:center;flex-shrink:0;}
#sidebar.mini .sb-item .sb-ico{width:auto;font-size:20px;}
.sb-item:hover{background:#3a3a3a;}
.sb-item.active{background:var(--panel2);font-weight:600;}
.sb-item.active .sb-ico{color:var(--accent);}

#sidebarOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:140;
}

/* ============================================================
   LAYOUT / MAIN
============================================================ */
#appBody{padding-top:var(--header-h);display:flex;min-height:100vh;}
#mainContent{
  flex:1;margin-left:var(--sidebar-w);padding:24px;min-width:0;
  transition:margin-left .2s ease;
}
#mainContent.mini-margin{margin-left:var(--sidebar-w-mini);}

@media (max-width:900px){
  #sidebar{transform:translateX(-100%);width:260px;}
  #sidebar.show{transform:translateX(0);}
  #mainContent{margin-left:0 !important;}
  .header-center{margin:0 12px;}
  .brand{font-size:17px;}
}
@media (max-width:600px){
  .header-center{display:none;}
  .create-btn span{display:none;}
  #mainContent{padding:12px;}
}

/* ============================================================
   VIDEO GRID / CARDS
============================================================ */
.section-heading{font-size:18px;font-weight:600;margin:4px 0 16px;}
.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px 12px;
}
@media (min-width:1600px){.video-grid{grid-template-columns:repeat(5,1fr);}}
@media (max-width:900px){.video-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}}
@media (max-width:520px){.video-grid{grid-template-columns:1fr;}}

.video-card{cursor:pointer;}
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--panel2);margin-bottom:8px;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.thumb-wrap .no-thumb{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--text-secondary);background:linear-gradient(135deg,#212121,#0f0f0f);
}
.duration-badge{
  position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.85);
  color:#fff;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;
}
.card-meta{display:flex;gap:10px;}
.card-meta .avatar-circle{width:36px;height:36px;font-size:13px;margin-top:2px;}
.card-info{flex:1;min-width:0;}
.card-title{
  font-size:14px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px;
}
.card-channel{font-size:13px;color:var(--text-secondary);}
.card-channel:hover{color:var(--text);}
.card-stats{font-size:13px;color:var(--text-secondary);}
.card-menu-btn{flex-shrink:0;align-self:flex-start;}
.card-menu-btn:hover{background:#3a3a3a;border-radius:50%;}

/* skeleton loading */
.skeleton{background:linear-gradient(90deg,#181818 25%,#2a2a2a 37%,#181818 63%);
  background-size:400% 100%;animation:skel-loading 1.4s ease infinite;}
@keyframes skel-loading{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.skel-card .thumb-wrap{background:none;}
.skel-line{height:12px;border-radius:6px;margin-bottom:6px;}

/* ============================================================
   EMPTY / ERROR STATES
============================================================ */
.state-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;text-align:center;color:var(--text-secondary);gap:12px;
}
.state-box .state-ico{font-size:52px;opacity:.6;}
.state-box h3{color:var(--text);font-size:18px;font-weight:600;}
.state-box p{font-size:14px;max-width:360px;}
.retry-btn{
  margin-top:8px;padding:9px 20px;border-radius:20px;background:var(--panel2);
  font-size:14px;font-weight:500;
}
.retry-btn:hover{background:#3a3a3a;}

/* ============================================================
   BUTTONS / FORM ELEMENTS
============================================================ */
.btn{
  padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;
  transition:filter .15s, background .15s;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:disabled{background:#5a2530;color:#999;cursor:not-allowed;}
.btn-secondary{background:var(--panel2);color:var(--text);}
.btn-secondary:hover{background:#3a3a3a;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--panel2);}
.btn-danger{background:transparent;border:1px solid var(--accent);color:var(--accent);}
.btn-danger:hover{background:rgba(255,48,79,0.1);}
.btn-full{width:100%;}
.btn[disabled]{opacity:.6;cursor:not-allowed;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;}
.field input,.field textarea,.field select{
  width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:80px;}
.field-error{color:var(--accent);font-size:12px;margin-top:4px;}
.field-hint{color:var(--text-secondary);font-size:12px;margin-top:4px;}

/* ============================================================
   MODALS
============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:var(--panel);border-radius:12px;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;padding:24px;
  animation:popIn .18s ease;
}
.modal-box.wide{max-width:640px;}
@keyframes popIn{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-head h2{font-size:18px;font-weight:600;}
.modal-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.modal-close:hover{background:#3a3a3a;}
.modal-tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.modal-tab{padding:10px 4px;font-size:14px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;margin-right:16px;}
.modal-tab.active{color:var(--text);border-color:var(--accent);}
.modal-footer-text{text-align:center;font-size:13px;color:var(--text-secondary);margin-top:16px;}
.modal-footer-text a{color:#3ea6ff;font-weight:500;}
.modal-footer-text a:hover{text-decoration:underline;}

/* upload dropzone */
.dropzone{
  border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;
  color:var(--text-secondary);font-size:13px;cursor:pointer;transition:border-color .15s;
}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);color:var(--text);}
.dropzone .dz-ico{font-size:30px;margin-bottom:8px;}
.file-preview{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-top:8px;font-size:13px;}
.file-preview img{width:60px;height:34px;object-fit:cover;border-radius:4px;}
.progress-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s;}

/* ============================================================
   TOASTS
============================================================ */
#toastContainer{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;
  width:100%;pointer-events:none;
}
.toast{
  background:#2a2a2a;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);animation:toastIn .2s ease;
  max-width:90vw;text-align:center;
}
.toast.error{background:#3a1418;border:1px solid var(--accent);}
.toast.success{background:#123a20;border:1px solid #2ecc71;}
@keyframes toastIn{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* ============================================================
   DROPDOWN MENUS
============================================================ */
.dropdown{position:relative;}
.dropdown-menu{
  position:absolute;top:calc(100% + 8px);right:0;background:var(--panel2);
  border-radius:8px;min-width:220px;box-shadow:0 4px 20px rgba(0,0,0,0.5);
  z-index:300;overflow:hidden;padding:6px 0;
}
.dropdown-item{
  display:flex;align-items:center;gap:14px;padding:10px 16px;font-size:14px;
  white-space:nowrap;
}
.dropdown-item:hover{background:#3a3a3a;}
.dropdown-sep{height:1px;background:var(--border);margin:6px 0;}
.dropdown-user-head{padding:12px 16px;display:flex;gap:12px;align-items:center;}
.dropdown-user-head .name{font-weight:600;font-size:14px;}
.dropdown-user-head .handle{font-size:12px;color:var(--text-secondary);}
.card-dropdown{position:absolute;}

/* ============================================================
   WATCH PAGE
============================================================ */
.watch-layout{display:flex;gap:24px;align-items:flex-start;max-width:1600px;margin:0 auto;}
.watch-main{flex:1;min-width:0;}
.watch-side{width:400px;flex-shrink:0;}
@media (max-width:1100px){.watch-layout{flex-direction:column;}.watch-side{width:100%;}}

.player-wrap{width:100%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:16px;position:relative;}
.player-wrap video{width:100%;display:block;max-height:80vh;background:#000;}
.watch-title{font-size:20px;font-weight:600;margin-bottom:8px;line-height:1.3;}
.watch-meta-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
.watch-stats{font-size:14px;color:var(--text-secondary);}
.watch-actions{display:flex;gap:8px;flex-wrap:wrap;}
.pill-btn{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;
  background:var(--panel2);font-size:14px;font-weight:500;
}
.pill-btn:hover{background:#3a3a3a;}
.pill-btn.liked{color:var(--accent);}
.pill-group{display:flex;border-radius:20px;overflow:hidden;background:var(--panel2);}
.pill-group .pill-btn{border-radius:0;}
.pill-group .pill-btn:first-child{padding-right:12px;}
.pill-group .pill-divider{width:1px;background:var(--border);}

.channel-row{
  display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;
}
.channel-row .avatar-circle{width:48px;height:48px;font-size:17px;}
.channel-row-info{flex:1;min-width:150px;}
.channel-row-info .cname{font-weight:600;font-size:15px;}
.channel-row-info .csubs{font-size:13px;color:var(--text-secondary);}
.subscribe-btn{padding:10px 20px;border-radius:20px;background:var(--text);color:#0f0f0f;font-weight:600;font-size:14px;}
.subscribe-btn:hover{filter:brightness(.9);}
.subscribe-btn.subscribed{background:var(--panel2);color:var(--text);}

.watch-desc{background:var(--panel2);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;}
.watch-desc .desc-toggle{color:var(--text-secondary);font-weight:600;margin-top:6px;display:inline-block;}

.comments-head{font-size:16px;font-weight:600;margin-bottom:16px;}
.comment-form{display:flex;gap:12px;margin-bottom:24px;}
.comment-form .avatar-circle{width:40px;height:40px;flex-shrink:0;}
.comment-input-wrap{flex:1;}
.comment-input-wrap input{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);
  padding:6px 0;font-size:14px;outline:none;
}
.comment-input-wrap input:focus{border-color:var(--text);}
.comment-form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
.comment-item{display:flex;gap:12px;margin-bottom:20px;}
.comment-item .avatar-circle{width:40px;height:40px;flex-shrink:0;}
.comment-body{flex:1;min-width:0;}
.comment-head{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.comment-author{font-size:13px;font-weight:600;}
.comment-date{font-size:12px;color:var(--text-secondary);}
.comment-text{font-size:14px;line-height:1.4;word-break:break-word;}
.comment-actions{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:12px;color:var(--text-secondary);}
.comment-like-btn{display:flex;align-items:center;gap:5px;}
.comment-like-btn.liked{color:var(--accent);}

.side-video-item{display:flex;gap:8px;margin-bottom:10px;cursor:pointer;}
.side-video-item .thumb-wrap{width:168px;flex-shrink:0;margin-bottom:0;}
.side-video-item .card-title{font-size:13px;-webkit-line-clamp:2;}
.side-video-item .card-channel,.side-video-item .card-stats{font-size:12px;}

/* ============================================================
   SHORTS
============================================================ */
.shorts-feed{
  height:calc(100vh - var(--header-h));
  overflow-y:scroll;scroll-snap-type:y mandatory;
  display:flex;flex-direction:column;align-items:center;
}
.short-item{
  height:calc(100vh - var(--header-h));width:100%;
  scroll-snap-align:start;display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
}
.short-frame{
  height:92%;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden;
  position:relative;max-width:100%;
}
.short-frame video{width:100%;height:100%;object-fit:cover;}
.short-side-actions{
  position:absolute;right:-56px;bottom:16px;display:flex;flex-direction:column;gap:20px;align-items:center;
}
@media (max-width:700px){.short-side-actions{right:8px;}}
.short-action-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:11px;}
.short-action-btn .circle{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.short-action-btn.liked{color:var(--accent);}
.short-action-btn.liked .circle{color:var(--accent);}
.short-info-overlay{
  position:absolute;left:12px;bottom:16px;right:80px;color:#fff;
}
.short-info-overlay .schannel{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.short-info-overlay .stitle{font-size:13px;opacity:.9;}

/* ============================================================
   CHANNEL PAGE
============================================================ */
.channel-banner{width:100%;height:180px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#212121,#0f0f0f);margin-bottom:20px;}
.channel-banner img{width:100%;height:100%;object-fit:cover;}
.channel-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
.channel-head .avatar-circle{width:88px;height:88px;font-size:32px;flex-shrink:0;}
.channel-head-info h1{font-size:24px;font-weight:700;}
.channel-head-info .chandle{font-size:14px;color:var(--text-secondary);margin:4px 0;}
.channel-head-info .cdesc{font-size:13px;color:var(--text-secondary);max-width:600px;margin-top:6px;}
.channel-tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.channel-tab{padding:14px 4px;font-size:14px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;}
.channel-tab.active{color:var(--text);border-color:var(--text);}

/* ============================================================
   SETTINGS
============================================================ */
.settings-wrap{max-width:640px;}
.settings-group{background:var(--panel);border-radius:12px;padding:8px 0;margin-bottom:20px;}

.radio-group{display:flex;gap:16px;}

.switch{position:relative;width:40px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:#3a3a3a;border-radius:22px;transition:.2s;cursor:pointer;}

<script>
/* ================================================================
   JHEILER — index.html
   Vanilla JS + Supabase (CDN). Hash router. Un solo archivo.
================================================================ */
"use strict";

/* ============================================================
   SUPABASE CLIENT
============================================================ */
const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* ============================================================
   GLOBAL STATE
============================================================ */
const STATE = {
  session: null,
  user: null,        // auth user
  profile: null,      // row from public.profiles
  sidebarMini: false,
  sidebarMobileOpen: false,
  theme: localStorage.getItem('jh_theme') || 'dark',
  autoplay: localStorage.getItem('jh_autoplay') !== 'false',
  notifPref: localStorage.getItem('jh_notif') !== 'false',
};

const PAGE_SIZE = 20;

/* ============================================================
   SMALL UTILITIES
============================================================ */
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function escapeHTML(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function initials(name){
  if(!name) return 'U';
  const parts = String(name).trim().split(/\s+/);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[1][0]).toUpperCase();
}
function timeAgo(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  const diff = (Date.now() - d.getTime())/1000;
  const units = [
    ['año',31536000],['mes',2592000],['semana',604800],
    ['día',86400],['hora',3600],['minuto',60]
  ];
  for(const [label,secs] of units){
    const val = Math.floor(diff/secs);
    if(val>=1) return `hace ${val} ${label}${val>1?(label==='mes'?'es':'s'):''}`;
  }
  return 'hace un momento';
}
function formatCount(n){
  n = Number(n)||0;
  if(n>=1000000) return (n/1000000).toFixed(1).replace('.0','')+'M';
  if(n>=1000) return (n/1000).toFixed(1).replace('.0','')+'K';
  return String(n);
}
function formatDuration(sec){
  sec = Math.floor(Number(sec)||0);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  const mm = h>0 ? String(m).padStart(2,'0') : String(m);
  const ss = String(s).padStart(2,'0');
  return h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function debounce(fn, ms){
  let t;
  return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), ms); };
}
function avatarHTML(profile, size){
  const cls = 'avatar-circle';
  if(profile && profile.avatar_url){
    return `<span class="${cls}"><img src="${escapeHTML(profile.avatar_url)}" alt=""></span>`;
  }
  const label = profile ? (profile.display_name||profile.username) : 'U';
  return `<span class="${cls}">${escapeHTML(initials(label))}</span>`;
}

/* ============================================================
   TOASTS
============================================================ */
function toast(msg, type){
  const c = qs('#toastContainer');
  const el = document.createElement('div');
  el.className = 'toast' + (type?(' '+type):'');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260); }, 3200);
}
function toastSuccess(msg){ toast(msg,'success'); }
function toastError(msg){ toast(msg,'error'); }

/* ============================================================
   MODAL HELPERS
============================================================ */
function openModal(innerHTML, opts){
  opts = opts||{};
  closeModal();
  const root = qs('#modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModalOverlay';
  overlay.innerHTML = `<div class="modal-box ${opts.wide?'wide':''}" id="activeModalBox">${innerHTML}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay && !opts.persistent) closeModal(); });
  root.appendChild(overlay);
  document.addEventListener('keydown', escCloseModalHandler);
  return overlay;
}
function escCloseModalHandler(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const ov = qs('#activeModalOverlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', escCloseModalHandler);
}

/* ============================================================
   DROPDOWN HELPERS (generic toggling + outside click close)
============================================================ */
function setupDropdown(triggerId, menuId){
  const trigger = qs('#'+triggerId);
  const menu = qs('#'+menuId);
  if(!trigger||!menu) return;
  trigger.addEventListener('click',(e)=>{
    e.stopPropagation();
    const willOpen = menu.classList.contains('hidden');
    closeAllDropdowns();
    if(willOpen) menu.classList.remove('hidden');
  });
}
function closeAllDropdowns(){
  qsa('.dropdown-menu').forEach(m=>m.classList.add('hidden'));
}
document.addEventListener('click', closeAllDropdowns);

/* ================================================================
   AUTH
================================================================ */
async function initAuth(){
  const { data:{ session } } = await supabase.auth.getSession();
  STATE.session = session;
  STATE.user = session ? session.user : null;
  if(STATE.user) await loadProfile();
  updateHeaderAuthUI();

  supabase.auth.onAuthStateChange(async (event, session)=>{
    STATE.session = session;
    STATE.user = session ? session.user : null;
    if(STATE.user){
      await loadProfile();
    } else {
      STATE.profile = null;
    }
    updateHeaderAuthUI();
    renderRoute(); // re-render current page with new auth context
  });
}

async function loadProfile(){
  if(!STATE.user) return;
  try{
    const { data, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', STATE.user.id)
      .maybeSingle();
    if(error) throw error;
    STATE.profile = data || null;
  }catch(err){
    console.error('loadProfile error', err);
  }
}

function updateHeaderAuthUI(){
  const loggedOut = qs('#authAreaLoggedOut');
  const loggedIn = qs('#authAreaLoggedIn');
  if(STATE.user){
    loggedOut.classList.add('hidden');
    loggedIn.classList.remove('hidden');
    const name = STATE.profile ? (STATE.profile.display_name || STATE.profile.username) : (STATE.user.email||'Usuario');
    const initialsHTML = avatarHTML(STATE.profile, 34);
    qs('#headerAvatar').outerHTML = initialsHTML.replace('<span','<span id="headerAvatar"');
    qs('#userMenuAvatar').outerHTML = initialsHTML.replace('<span','<span id="userMenuAvatar"');
    qs('#userMenuName').textContent = name;
    qs('#userMenuHandle').textContent = '@' + (STATE.profile ? STATE.profile.username : 'usuario');
    qs('#userMenuChannel').href = '#/channel/' + STATE.user.id;
  } else {
    loggedOut.classList.remove('hidden');
    loggedIn.classList.add('hidden');
  }
}

async function doSignOut(){
  await supabase.auth.signOut();
  toastSuccess('Sesión cerrada.');
  location.hash = '#/home';
}

/* ---------------- AUTH MODAL (login / signup) ---------------- */
function openAuthModal(mode){
  mode = mode || 'login';
  const html = authModalHTML(mode);
  openModal(html);
  bindAuthModalEvents(mode);
}
function authModalHTML(mode){
  return `
    <div class="modal-head">
      <h2>${mode==='login' ? 'Iniciar sesión' : 'Crear cuenta'}</h2>
      <button class="modal-close" id="authModalClose">✕</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab ${mode==='login'?'active':''}" data-tab="login">Iniciar sesión</button>
      <button class="modal-tab ${mode==='signup'?'active':''}" data-tab="signup">Registrarse</button>
    </div>
    <div id="authFormArea">${mode==='login' ? loginFormHTML() : signupFormHTML()}</div>
  `;
}
function loginFormHTML(){
  return `
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <div id="loginError" class="field-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-full" id="loginSubmitBtn">Iniciar sesión</button>
      <div class="modal-footer-text">
        <a href="#" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  `;
}
function signupFormHTML(){
  return `
    <form id="signupForm">
      <div class="field">
        <label>Nombre visible</label>
        <input type="text" id="signupDisplayName" required maxlength="60">
      </div>
      <div class="field">
        <label>Nombre de usuario (username)</label>
        <input type="text" id="signupUsername" required maxlength="30" pattern="[a-zA-Z0-9_\\.]+" title="Solo letras, números, punto y guion bajo">
        <div class="field-hint">Solo letras, números, punto y guion bajo. Sin espacios.</div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signupEmail" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
        <div class="field-hint">Mínimo 6 caracteres.</div>
      </div>
      <div id="signupError" class="field-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-full" id="signupSubmitBtn">Crear cuenta</button>
    </form>
  `;
}
function bindAuthModalEvents(){
  qs('#authModalClose').addEventListener('click', closeModal);
  qsa('.modal-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      qsa('.modal-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const tabName = tab.dataset.tab;
      qs('#authFormArea').innerHTML = tabName==='login' ? loginFormHTML() : signupFormHTML();
      bindActiveAuthForm(tabName);
    });
  });
  const initialTab = qs('.modal-tab.active').dataset.tab;
  bindActiveAuthForm(initialTab);
}
function bindActiveAuthForm(tabName){
  if(tabName==='login'){
    qs('#loginForm').addEventListener('submit', handleLoginSubmit);
    const forgot = qs('#forgotPasswordLink');
    if(forgot) forgot.addEventListener('click', handleForgotPassword);
  } else {
    qs('#signupForm').addEventListener('submit', handleSignupSubmit);
  }
}
async function handleLoginSubmit(e){
  e.preventDefault();
  const btn = qs('#loginSubmitBtn');
  const errBox = qs('#loginError');
  errBox.classList.add('hidden');
  const email = qs('#loginEmail').value.trim();
  const password = qs('#loginPassword').value;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    closeModal();
    toastSuccess('Sesión iniciada correctamente.');
  }catch(err){
    errBox.textContent = translateAuthError(err.message);
    errBox.classList.remove('hidden');
  }finally{
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
}
async function handleForgotPassword(e){
  e.preventDefault();
  const email = qs('#loginEmail').value.trim();
  if(!email){ toastError('Escribe tu email primero.'); return; }
  try{
    const { error } = await supabase.auth.resetPasswordForEmail(email);
    if(error) throw error;
    toastSuccess('Te enviamos un correo para restablecer tu contraseña.');
  }catch(err){
    toastError('No se pudo enviar el correo: ' + err.message);
  }
}
async function handleSignupSubmit(e){
  e.preventDefault();
  const btn = qs('#signupSubmitBtn');
  const errBox = qs('#signupError');
  errBox.classList.add('hidden');
  const displayName = qs('#signupDisplayName').value.trim();
  const username = qs('#signupUsername').value.trim().toLowerCase();
  const email = qs('#signupEmail').value.trim();
  const password = qs('#signupPassword').value;

  if(!/^[a-zA-Z0-9_.]+$/.test(username)){
    errBox.textContent = 'El nombre de usuario solo puede tener letras, números, punto y guion bajo.';
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    // check username availability first
    const { data:existing, error:checkErr } = await supabase
      .from('profiles').select('id').eq('username', username).maybeSingle();
    if(checkErr) throw checkErr;
    if(existing){
      throw new Error('Ese nombre de usuario ya está en uso.');
    }

    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;

    const newUser = data.user;
    if(newUser){
      const { error: profileErr } = await supabase.from('profiles').insert({
        id: newUser.id,
        username: username,
        display_name: displayName,
        avatar_url: null,
        banner_url: null,
        description: ''
      });
      if(profileErr){
        if(String(profileErr.message||'').toLowerCase().includes('duplicate')){
          throw new Error('Ese nombre de usuario ya está en uso.');
        }
        throw profileErr;
      }
    }

    closeModal();
    if(data.session){
      toastSuccess('Cuenta creada. ¡Bienvenido a JHEILER!');
    } else {
      toastSuccess('Cuenta creada. Revisa tu correo para confirmar tu cuenta.');
    }
  }catch(err){
    errBox.textContent = translateAuthError(err.message);
    errBox.classList.remove('hidden');
  }finally{
    btn.disabled = false; btn.textContent = 'Crear cuenta';
  }
}
function translateAuthError(msg){
  if(!msg) return 'Ocurrió un error. Intenta de nuevo.';
  const m = msg.toLowerCase();
  if(m.includes('invalid login credentials')) return 'Email o contraseña incorrectos.';
  if(m.includes('user already registered')) return 'Ya existe una cuenta con ese email.';
  if(m.includes('password should be at least')) return 'La contraseña es demasiado corta.';
  if(m.includes('duplicate')) return 'Ese nombre de usuario ya está en uso.';
  if(m.includes('rate limit')) return 'Demasiados intentos. Espera un momento.';
  return msg;
}

function requireAuth(actionLabel){
  if(!STATE.user){
    toastError('Debes iniciar sesión' + (actionLabel?(' para '+actionLabel):'') + '.');
    openAuthModal('login');
    return false;
  }
  return true;
}

/* ================================================================
   ROUTER (hash-based)
================================================================ */
const ROUTES = {}; // path-pattern -> handler

function defineRoute(pattern, handler){ ROUTES[pattern] = handler; }

function parseHash(){
  let hash = location.hash || '#/home';
  hash = hash.replace(/^#/, '');
  if(!hash.startsWith('/')) hash = '/'+hash;
  const [pathPart, queryPart] = hash.split('?');
  const segments = pathPart.split('/').filter(Boolean);
  const query = {};
  if(queryPart){
    queryPart.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      if(k) query[decodeURIComponent(k)] = decodeURIComponent(v||'');
    });
  }
  return { segments, query, raw: hash };
}

async function renderRoute(){
  const { segments, query } = parseHash();
  closeMobileSidebarIfOpen();
  markActiveSidebarItem(segments[0]||'home');
  window.scrollTo(0,0);

  const main = qs('#mainContent');
  main.innerHTML = pageLoadingHTML();

  try{
    if(segments.length===0 || segments[0]==='home'){
      await renderHomePage(main);
    } else if(segments[0]==='watch' && segments[1]){
      await renderWatchPage(main, segments[1]);
    } else if(segments[0]==='shorts'){
      await renderShortsPage(main, segments[1]||null);

    } else if(segments[0]==='history'){

    } else if(segments[0]==='watch-later'){

    } else if(segments[0]==='liked'){

    } else if(segments[0]==='your-videos'){
      await renderYourVideosPage(main);
    } else if(segments[0]==='subscriptions'){
      await renderSubscriptionsPage(main);
    } else if(segments[0]==='trending'){
      await renderCategoryPage(main,'Tendencias',null,true);
    } else if(segments[0]==='gaming'){

  }catch(err){

}

   VIDEO CARD RENDERING (shared by home/search/category/channel/etc.)
================================================================ */
function skeletonCardsHTML(count){
  let out = '';
  for(let i=0;i<count;i++){
    out += `
      <div class="video-card skel-card">
        <div class="thumb-wrap skeleton"></div>
        <div class="card-meta">
          <div style="width:36px;height:36px;border-radius:50%;" class="skeleton"></div>
          <div class="card-info">
            <div class="skel-line skeleton" style="width:90%;"></div>
            <div class="skel-line skeleton" style="width:60%;"></div>
            <div class="skel-line skeleton" style="width:40%;"></div>
          </div>
        </div>
      </div>`;
  }
  return out;
}

function videoCardHTML(video){
  const channel = video.profiles || {};
  const thumbInner = video.thumbnail_url
    ? `<img src="${escapeHTML(video.thumbnail_url)}" alt="" loading="lazy">`
    : `<div class="no-thumb">▶</div>`;
  const durBadge = video.duration ? `<span class="duration-badge">${formatDuration(video.duration)}</span>` : '';
  return `
    <div class="video-card" data-video-id="${escapeHTML(video.id)}">
      <a href="#/watch/${escapeHTML(video.id)}" class="thumb-link">
        <div class="thumb-wrap">${thumbInner}${durBadge}</div>
      </a>
      <div class="card-meta">
        <a href="#/channel/${escapeHTML(video.user_id)}">${avatarHTML(channel)}</a>
        <div class="card-info">
          <a href="#/watch/${escapeHTML(video.id)}"><div class="card-title">${escapeHTML(video.title)}</div></a>
          <a href="#/channel/${escapeHTML(video.user_id)}" class="card-channel">${escapeHTML(channel.display_name||channel.username||'Canal')}</a>
          <div class="card-stats">${formatCount(video.views||0)} vistas · ${timeAgo(video.created_at)}</div>
        </div>
        <div class="dropdown">
          <button class="icon-btn card-menu-btn" data-card-menu-btn="${escapeHTML(video.id)}">⋮</button>
        </div>
      </div>
    </div>`;
}

function bindCardMenus(container, videosById){
  qsa('[data-card-menu-btn]', container).forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.preventDefault(); e.stopPropagation();
      closeAllDropdowns();
      const id = btn.dataset.cardMenuBtn;
      const video = videosById[id];
      openCardQuickMenu(btn, video);
    });
  });
}
function openCardQuickMenu(anchorBtn, video){
  const rect = anchorBtn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';
  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom+4)+'px';
  menu.style.left = Math.min(rect.left, window.innerWidth-240)+'px';
  menu.style.zIndex = 400;
  menu.innerHTML = `
    <button class="dropdown-item" data-act="watch-later"><span>⏰</span> Guardar en Ver más tarde</button>
    <button class="dropdown-item" data-act="share"><span>🔗</span> Compartir</button>
  `;
  document.body.appendChild(menu);
  const closeThis = (ev)=>{ if(!menu.contains(ev.target)) { menu.remove(); document.removeEventListener('click',closeThis);} };
  setTimeout(()=>document.addEventListener('click', closeThis),0);
  menu.addEventListener('click', async (e)=>{
    const act = e.target.closest('[data-act]');
    if(!act) return;
    if(act.dataset.act==='watch-later'){
      await addToWatchLater(video.id);
    } else if(act.dataset.act==='share'){
      shareVideo(video.id);
    }
    menu.remove();
  });
}
async function shareVideo(videoId){
  const url = location.origin + location.pathname + '#/watch/' + videoId;
  if(navigator.share){
    try{ await navigator.share({ title:'JHEILER', url }); return; }catch(e){ /* cancelled */ return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    toastSuccess('Enlace copiado.');
  }catch(e){
    toastError('No se pudo copiar el enlace.');
  }
}
async function addToWatchLater(videoId){
  if(!requireAuth('guardar videos')) return;
  try{
    const { data: existing } = await supabase.from('watch_later')
      .select('id').eq('user_id', STATE.user.id).eq('video_id', videoId).maybeSingle();
    if(existing){ toastSuccess('Ya estaba en Ver más tarde.'); return; }
    const { error } = await supabase.from('watch_later').insert({ user_id: STATE.user.id, video_id: videoId });
    if(error) throw error;
    toastSuccess('Guardado en Ver más tarde.');
  }catch(err){
    toastError('No se pudo guardar: ' + err.message);
  }
}

    const { data, error } = await supabase
      .from('videos')
      .select('*, profiles!videos_user_id_fkey(*)')

async function incrementViewCount(videoId){
  try{
    await supabase.rpc('increment_video_views', { video_id_input: videoId });
  }catch(e){
    // fallback if RPC doesn't exist: best-effort manual increment (non-atomic)
    try{
      const { data } = await supabase.from('videos').select('views').eq('id', videoId).maybeSingle();
      const current = data ? (data.views||0) : 0;
      await supabase.from('videos').update({ views: current+1 }).eq('id', videoId);
    }catch(e2){ /* silent — view counting is non-critical */ }
  }
}

async function registerWatchHistory(videoId){
  if(!STATE.user) return;
  try{
    const { data: existing } = await supabase.from('watch_history')
      .select('id').eq('user_id', STATE.user.id).eq('video_id', videoId).maybeSingle();
    if(existing){
      await supabase.from('watch_history').update({ created_at: new Date().toISOString() }).eq('id', existing.id);
    } else {
      await supabase.from('watch_history').insert({ user_id: STATE.user.id, video_id: videoId });
    }
  }catch(e){ console.warn('watch_history error', e); }
}

function bindWatchPageEvents(video){
  const likeBtn = qs('#likeBtn');
  if(likeBtn) likeBtn.addEventListener('click', ()=>toggleLike(video.id, likeBtn));

  const shareBtn = qs('#shareBtnWatch');
  if(shareBtn) shareBtn.addEventListener('click', ()=>shareVideo(video.id));

  const wlBtn = qs('#watchLaterBtnWatch');
  if(wlBtn) wlBtn.addEventListener('click', ()=>addToWatchLater(video.id));

  const subBtn = qs('#subscribeBtn');
  if(subBtn) subBtn.addEventListener('click', ()=>toggleSubscribe(video.user_id, subBtn));

  const commentForm = qs('#commentForm');
  if(commentForm) commentForm.addEventListener('submit', (e)=>submitComment(e, video.id));
  const cancelBtn = qs('#commentCancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ qs('#commentInput').value=''; });

  const loginPrompt = qs('#commentLoginPrompt');
  if(loginPrompt) loginPrompt.addEventListener('click', (e)=>{ e.preventDefault(); openAuthModal('login'); });
}

async function toggleLike(videoId, btn){
  if(!requireAuth('dar like')) return;
  const wasLiked = btn.classList.contains('liked');
  const countEl = qs('#likeCount', btn.closest('.watch-actions')) || qs('#likeCount');
  let count = parseInt((countEl.textContent||'0').replace(/[^0-9]/g,'')) || 0;
  btn.disabled = true;
  try{
    if(wasLiked){
      const { error } = await supabase.from('video_likes').delete().eq('video_id', videoId).eq('user_id', STATE.user.id);
      if(error) throw error;
      btn.classList.remove('liked');
      count = Math.max(0,count-1);
    } else {
      const { data: existing } = await supabase.from('video_likes').select('id').eq('video_id',videoId).eq('user_id',STATE.user.id).maybeSingle();
      if(!existing){
        const { error } = await supabase.from('video_likes').insert({ video_id: videoId, user_id: STATE.user.id });
        if(error) throw error;
      }
      btn.classList.add('liked');
      count = count+1;
    }
    countEl.textContent = formatCount(count);
  }catch(err){
    toastError('No se pudo actualizar el like: ' + err.message);
  }finally{
    btn.disabled = false;
  }
}

async function toggleSubscribe(channelId, btn){
  if(!requireAuth('suscribirte')) return;
  if(STATE.user.id===channelId){ toastError('No puedes suscribirte a tu propio canal.'); return; }
  const wasSubbed = btn.classList.contains('subscribed');
  btn.disabled = true;
  try{
    if(wasSubbed){
      const { error } = await supabase.from('subscriptions').delete().eq('channel_id',channelId).eq('subscriber_id',STATE.user.id);
      if(error) throw error;
      btn.classList.remove('subscribed');
      btn.textContent = 'Suscribirse';
    } else {
      const { data: existing } = await supabase.from('subscriptions').select('id').eq('channel_id',channelId).eq('subscriber_id',STATE.user.id).maybeSingle();
      if(!existing){
        const { error } = await supabase.from('subscriptions').insert({ channel_id: channelId, subscriber_id: STATE.user.id });
        if(error) throw error;
      }
      btn.classList.add('subscribed');
      btn.textContent = 'Suscrito ✓';
    }
    const subsLabel = qs('#subsCountLabel');
    if(subsLabel){
      let n = parseInt((subsLabel.textContent||'0').replace(/[^0-9]/g,'')) || 0;
      n = wasSubbed ? Math.max(0,n-1) : n+1;
      subsLabel.textContent = formatCount(n) + ' suscriptores';
    }
    toastSuccess(wasSubbed ? 'Te has dado de baja.' : '¡Suscripción exitosa!');
  }catch(err){
    toastError('No se pudo actualizar la suscripción: ' + err.message);
  }finally{
    btn.disabled = false;
  }
}

async function submitComment(e, videoId){
  e.preventDefault();
  if(!requireAuth('comentar')) return;
  const input = qs('#commentInput');
  const text = input.value.trim();
  if(!text) return;
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    const { error } = await supabase.from('comments').insert({
      video_id: videoId,

function renderUploadForm(isShort){
  const area = qs('#createFormArea');
  area.innerHTML = `
    <form id="uploadForm">
      <div class="field">
        <label>Archivo de ${isShort?'Short (vertical recomendado)':'video'} <span class="required-star">*</span></label>
        <div class="dropzone" id="videoDropzone">
          <div class="dz-ico">🎬</div>
          <div>Haz clic para seleccionar o arrastra tu archivo aquí</div>
          <input type="file" id="videoFileInput" accept="video/*" class="hidden">
        </div>
        <div id="videoFilePreview"></div>
      </div>
      <div class="field">
        <label>Miniatura (thumbnail)</label>
        <div class="dropzone" id="thumbDropzone">
          <div class="dz-ico">🖼️</div>
          <div>Haz clic para seleccionar una imagen (opcional)</div>
          <input type="file" id="thumbFileInput" accept="image/*" class="hidden">
        </div>
        <div id="thumbFilePreview"></div>
      </div>
      <div class="field">
        <label>Título <span class="required-star">*</span></label>
        <input type="text" id="uploadTitle" maxlength="100" required placeholder="Dale un título a tu ${isShort?'Short':'video'}">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="uploadDescription" maxlength="5000" placeholder="Cuéntale a la audiencia sobre tu contenido"></textarea>
      </div>
      <div class="field">
        <label>Categoría</label>
        <select id="uploadCategory">
          ${CATEGORIES.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}
        </select>
      </div>
      <div id="uploadError" class="field-error hidden"></div>
      <div class="progress-track hidden" id="uploadProgressTrack"><div class="progress-fill" id="uploadProgressFill"></div></div>
      <div id="uploadStatusText" style="font-size:12px;color:var(--text-secondary);margin-top:6px;"></div>
      <button type="submit" class="btn btn-primary btn-full" id="uploadSubmitBtn" style="margin-top:16px;" disabled>
        Publicar ${isShort?'Short':'video'}
      </button>
    </form>
  `;

  let selectedVideoFile = null;
  let selectedThumbFile = null;
  let videoDuration = 0;

  const submitBtn = qs('#uploadSubmitBtn');
  function refreshSubmitState(){
    submitBtn.disabled = !(selectedVideoFile && qs('#uploadTitle').value.trim());
  }

  const videoDz = qs('#videoDropzone');
  const videoInput = qs('#videoFileInput');
  videoDz.addEventListener('click', ()=>videoInput.click());
  ['dragover','dragenter'].forEach(evt=>videoDz.addEventListener(evt,(e)=>{e.preventDefault();videoDz.classList.add('dragover');}));
  ['dragleave','drop'].forEach(evt=>videoDz.addEventListener(evt,(e)=>{e.preventDefault();videoDz.classList.remove('dragover');}));
  videoDz.addEventListener('drop',(e)=>{
    if(e.dataTransfer.files && e.dataTransfer.files[0]){ handleVideoFile(e.dataTransfer.files[0]); }
  });
  videoInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleVideoFile(e.target.files[0]); });

  function handleVideoFile(file){
    if(!file.type.startsWith('video/')){ toastError('Selecciona un archivo de video válido.'); return; }
    selectedVideoFile = file;
    const url = URL.createObjectURL(file);
    const tempVideo = document.createElement('video');
    tempVideo.preload = 'metadata';
    tempVideo.src = url;
    tempVideo.onloadedmetadata = ()=>{
      videoDuration = Math.floor(tempVideo.duration)||0;
    };
    qs('#videoFilePreview').innerHTML = `
      <div class="file-preview">
        <video src="${url}" style="width:60px;height:34px;object-fit:cover;border-radius:4px;" muted></video>
        <span>${escapeHTML(file.name)} (${(file.size/1024/1024).toFixed(1)} MB)</span>
      </div>`;
    refreshSubmitState();
  }

  const thumbDz = qs('#thumbDropzone');
  const thumbInput = qs('#thumbFileInput');
  thumbDz.addEventListener('click', ()=>thumbInput.click());
  ['dragover','dragenter'].forEach(evt=>thumbDz.addEventListener(evt,(e)=>{e.preventDefault();thumbDz.classList.add('dragover');}));
  ['dragleave','drop'].forEach(evt=>thumbDz.addEventListener(evt,(e)=>{e.preventDefault();thumbDz.classList.remove('dragover');}));
  thumbDz.addEventListener('drop',(e)=>{
    if(e.dataTransfer.files && e.dataTransfer.files[0]){ handleThumbFile(e.dataTransfer.files[0]); }
  });
  thumbInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleThumbFile(e.target.files[0]); });
  function handleThumbFile(file){
    if(!file.type.startsWith('image/')){ toastError('Selecciona una imagen válida.'); return; }
    selectedThumbFile = file;
    const url = URL.createObjectURL(file);
    qs('#thumbFilePreview').innerHTML = `
      <div class="file-preview">
        <img src="${url}" alt="">
        <span>${escapeHTML(file.name)}</span>
      </div>`;
  }

  qs('#uploadTitle').addEventListener('input', refreshSubmitState);

  qs('#uploadForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(!selectedVideoFile) return;
    const errBox = qs('#uploadError');
    errBox.classList.add('hidden');
    submitBtn.disabled = true;
    const progressTrack = qs('#uploadProgressTrack');
    const progressFill = qs('#uploadProgressFill');
    const statusText = qs('#uploadStatusText');
    progressTrack.classList.remove('hidden');

    try{
      const userId = STATE.user.id;
      const timestamp = Date.now();
      const safeVideoName = selectedVideoFile.name.replace(/[^a-zA-Z0-9_.\-]/g,'_');
      const videoPath = `${userId}/${timestamp}_${safeVideoName}`;

      statusText.textContent = 'Subiendo video...';
      progressFill.style.width = '20%';
      const { error: videoUploadErr } = await supabase.storage
        .from('videos')
        .upload(videoPath, selectedVideoFile, { cacheControl:'3600', upsert:false });
      if(videoUploadErr) throw new Error('Error subiendo el video: ' + videoUploadErr.message);
      progressFill.style.width = '55%';

      const { data: videoPublic } = supabase.storage.from('videos').getPublicUrl(videoPath);
      const videoUrl = videoPublic.publicUrl;

      let thumbnailUrl = null;
      if(selectedThumbFile){
        statusText.textContent = 'Subiendo miniatura...';
        const safeThumbName = selectedThumbFile.name.replace(/[^a-zA-Z0-9_.\-]/g,'_');
        const thumbPath = `${userId}/${timestamp}_${safeThumbName}`;
        const { error: thumbUploadErr } = await supabase.storage
          .from('thumbnails')
          .upload(thumbPath, selectedThumbFile, { cacheControl:'3600', upsert:false });
        if(thumbUploadErr) throw new Error('Error subiendo la miniatura: ' + thumbUploadErr.message);
        const { data: thumbPublic } = supabase.storage.from('thumbnails').getPublicUrl(thumbPath);
        thumbnailUrl = thumbPublic.publicUrl;
      }
      progressFill.style.width = '80%';

      statusText.textContent = 'Publicando...';
      const { data: inserted, error: insertErr } = await supabase.from('videos').insert({
        user_id: userId,
        title: qs('#uploadTitle').value.trim(),
        description: qs('#uploadDescription').value.trim(),
        video_url: videoUrl,
        thumbnail_url: thumbnailUrl,
        duration: videoDuration,
        category: qs('#uploadCategory').value,
        is_short: isShort,
        views: 0
      }).select().maybeSingle();
      if(insertErr) throw new Error('El archivo se subió pero no se pudo publicar: ' + insertErr.message);

      progressFill.style.width = '100%';
      statusText.textContent = '¡Listo!';
      toastSuccess('Video publicado correctamente.');
      closeModal();
      if(inserted && inserted.id){
        location.hash = '#/watch/' + inserted.id;
      } else {
        renderRoute();
      }
    }catch(err){
      errBox.textContent = err.message || 'No se pudo completar la subida.';
      errBox.classList.remove('hidden');
      statusText.textContent = '';
      progressTrack.classList.add('hidden');
    }finally{
      submitBtn.disabled = false;
    }
  });
}

async function renderShortsPage(main, focusId){

    const feed = qs('#shortsFeed');

      feed.innerHTML = `

      return;
    }
    let ordered = data;
    if(focusId){
      const idx = ordered.findIndex(v=>v.id===focusId);
      if(idx>0){ const [item] = ordered.splice(idx,1); ordered.unshift(item); }
    }
    const likeStates = {};
    if(STATE.user){
      const ids = ordered.map(v=>v.id);
      const { data: likedRows } = await supabase.from('video_likes').select('video_id').eq('user_id',STATE.user.id).in('video_id', ids);
      (likedRows||[]).forEach(r=>likeStates[r.video_id]=true);
    }
    feed.innerHTML = ordered.map(v=>shortItemHTML(v, likeStates[v.id])).join('');
    bindShortsEvents(feed, ordered);
    setupShortsAutoplay(feed);
  }catch(err){
    renderErrorPage(main, err);
  }
}

  const ch = v.profiles||{};
  return `

          </button>

    </div>`;
}
function bindShortsEvents(feed, videos){
  const byId = {}; videos.forEach(v=>byId[v.id]=v);

  qsa('[data-short-video]', feed).forEach(vid=>{
    vid.addEventListener('click', ()=>{ vid.paused ? vid.play() : vid.pause(); });
  });

  qsa('[data-short-like]', feed).forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!requireAuth('dar like')) return;
      const id = btn.dataset.shortLike;
      const liked = btn.classList.contains('liked');
      btn.disabled = true;
      try{
        if(liked){
          await supabase.from('video_likes').delete().eq('video_id',id).eq('user_id',STATE.user.id);
          btn.classList.remove('liked');
        } else {
          const { data: existing } = await supabase.from('video_likes').select('id').eq('video_id',id).eq('user_id',STATE.user.id).maybeSingle();
          if(!existing) await supabase.from('video_likes').insert({ video_id:id, user_id:STATE.user.id });
          btn.classList.add('liked');
        }
      }catch(err){
        toastError('No se pudo actualizar el like.');
      }finally{
        btn.disabled = false;
      }
    });
  });
  qsa('[data-short-share]', feed).forEach(btn=>{
    btn.addEventListener('click', ()=>shareVideo(btn.dataset.shortShare));
  });
  qsa('[data-short-comment]', feed).forEach(btn=>{
    btn.addEventListener('click', ()=>openShortCommentsModal(byId[btn.dataset.shortComment]));
  });
}
function setupShortsAutoplay(feed){
  const videos = qsa('[data-short-video]', feed);
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const vid = entry.target;
      if(entry.isIntersecting && entry.intersectionRatio>0.6){
        vid.play().catch(()=>{});
        const parentItem = vid.closest('.short-item');
        registerWatchHistory(parentItem.dataset.shortId);
        incrementViewCount(parentItem.dataset.shortId);
      } else {
        vid.pause();
      }
    });
  }, { threshold:[0,0.6,1] });
  videos.forEach(v=>observer.observe(v));
}

        <h3>${escapeHTML(emptyOpts.title)}</h3>
        <p>${escapeHTML(emptyOpts.desc)}</p>
        ${emptyOpts.ctaText ? `<button class="retry-btn" id="listEmptyCta">${escapeHTML(emptyOpts.ctaText)}</button>` : ''}
      </div>`;
    if(emptyOpts.ctaFn){
      const cta = qs('#listEmptyCta');
      if(cta) cta.addEventListener('click', emptyOpts.ctaFn);
    }
    return;
  }
  const map = {}; videos.forEach(v=>map[v.id]=v);
  grid.innerHTML = videos.map(videoCardHTML).join('');
  bindCardMenus(grid, map);
}

/* ================================================================
   CHANNEL PAGE
================================================================ */
async function renderChannelPage(main, channelId, tab){
  main.innerHTML = pageLoadingHTML();
  try{
    const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', channelId).maybeSingle();
    if(error) throw error;
    if(!profile){
      main.innerHTML = `
        <div class="state-box">
          <div class="state-ico">👤</div>
          <h3>Canal no encontrado</h3>
          <a class="retry-btn" href="#/home">Volver al inicio</a>
        </div>`;
      return;
    }
    const { count: subsCount } = await supabase.from('subscriptions').select('*',{count:'exact',head:true}).eq('channel_id',channelId);
    let isSubscribed = false;
    if(STATE.user && STATE.user.id!==channelId){
      const { data: subRow } = await supabase.from('subscriptions').select('id').eq('channel_id',channelId).eq('subscriber_id',STATE.user.id).maybeSingle();
      isSubscribed = !!subRow;
    }

    main.innerHTML = `
      <div class="channel-banner">
        ${profile.banner_url ? `<img src="${escapeHTML(profile.banner_url)}" alt="">` : ''}
      </div>
      <div class="channel-head">
        ${avatarHTML(profile)}
        <div class="channel-head-info">
          <h1>${escapeHTML(profile.display_name||profile.username)}</h1>
          <div class="chandle">@${escapeHTML(profile.username)} · ${formatCount(subsCount||0)} suscriptores</div>
          ${profile.description ? `<div class="cdesc">${escapeHTML(profile.description)}</div>` : ''}
        </div>
        ${STATE.user && STATE.user.id===channelId ? `
          <button class="btn btn-secondary" id="editProfileBtn">Editar perfil</button>
        ` : `
          <button class="subscribe-btn ${isSubscribed?'subscribed':''}" id="channelSubscribeBtn">${isSubscribed?'Suscrito ✓':'Suscribirse'}</button>
        `}
      </div>
      <div class="channel-tabs">
        <a class="channel-tab ${tab==='home'?'active':''}" href="#/channel/${escapeHTML(channelId)}/home">Inicio</a>
        <a class="channel-tab ${tab==='videos'?'active':''}" href="#/channel/${escapeHTML(channelId)}/videos">Videos</a>
        <a class="channel-tab ${tab==='shorts'?'active':''}" href="#/channel/${escapeHTML(channelId)}/shorts">Shorts</a>
      </div>
      <div class="video-grid" id="channelGrid">${skeletonCardsHTML(8)}</div>
    `;

    const subBtn = qs('#channelSubscribeBtn');
    if(subBtn) subBtn.addEventListener('click', ()=>toggleSubscribe(channelId, subBtn));
    const editBtn = qs('#editProfileBtn');
    if(editBtn) editBtn.addEventListener('click', openEditProfileModal);

    const isShortTab = tab==='shorts';
    let q = supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').eq('user_id', channelId);
    if(tab==='videos') q = q.eq('is_short', false);
    else if(tab==='shorts') q = q.eq('is_short', true);
    q = q.order('created_at',{ascending:false}).limit(30);
    const { data: videos, error: vErr } = await q;
    if(vErr) throw vErr;

    const grid = qs('#channelGrid');
    if(!videos || videos.length===0){
      grid.outerHTML = `
        <div class="state-box">
          <div class="state-ico">🎬</div>
          <h3>Este canal aún no tiene contenido${tab!=='home'?(' de este tipo'):''}</h3>
        </div>`;
      return;
    }
    const map = {}; videos.forEach(v=>map[v.id]=v);
    grid.innerHTML = videos.map(videoCardHTML).join('');
    bindCardMenus(grid, map);
  }catch(err){
    renderErrorPage(main, err);
  }
}

function openEditProfileModal(){
  const p = STATE.profile || {};
  const html = `
    <div class="modal-head">
      <h2>Editar perfil</h2>
      <button class="modal-close" id="editProfileClose">✕</button>
    </div>
    <form id="editProfileForm">
      <div class="field">
        <label>Nombre visible</label>
        <input type="text" id="editDisplayName" value="${escapeHTML(p.display_name||'')}" maxlength="60" required>
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="editDescription" maxlength="1000">${escapeHTML(p.description||'')}</textarea>
      </div>
      <div class="field">
        <label>Avatar (imagen)</label>
        <div class="dropzone" id="avatarDropzone">
          <div class="dz-ico">🙂</div><div>Seleccionar imagen de avatar (opcional)</div>
          <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>
        <div id="avatarFilePreview"></div>
      </div>
      <div class="field">
        <label>Banner (imagen)</label>
        <div class="dropzone" id="bannerDropzone">
          <div class="dz-ico">🖼️</div><div>Seleccionar imagen de banner (opcional)</div>
          <input type="file" id="bannerFileInput" accept="image/*" class="hidden">
        </div>
        <div id="bannerFilePreview"></div>
      </div>
      <div id="editProfileError" class="field-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-full" id="editProfileSubmitBtn">Guardar cambios</button>
    </form>
  `;
  openModal(html, { persistent:true });
  qs('#editProfileClose').addEventListener('click', closeModal);

  let avatarFile=null, bannerFile=null;
  const avatarDz = qs('#avatarDropzone'), avatarInput = qs('#avatarFileInput');
  avatarDz.addEventListener('click', ()=>avatarInput.click());
  avatarInput.addEventListener('change',(e)=>{
    if(e.target.files[0]){ avatarFile=e.target.files[0]; qs('#avatarFilePreview').innerHTML=`<div class="file-preview"><img src="${URL.createObjectURL(avatarFile)}">${escapeHTML(avatarFile.name)}</div>`; }
  });
  const bannerDz = qs('#bannerDropzone'), bannerInput = qs('#bannerFileInput');
  bannerDz.addEventListener('click', ()=>bannerInput.click());
  bannerInput.addEventListener('change',(e)=>{
    if(e.target.files[0]){ bannerFile=e.target.files[0]; qs('#bannerFilePreview').innerHTML=`<div class="file-preview"><img src="${URL.createObjectURL(bannerFile)}">${escapeHTML(bannerFile.name)}</div>`; }
  });

  qs('#editProfileForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = qs('#editProfileSubmitBtn');
    const errBox = qs('#editProfileError');
    errBox.classList.add('hidden');
    btn.disabled = true; btn.innerHTML='<span class="spinner"></span>';
    try{
      const updates = {
        display_name: qs('#editDisplayName').value.trim(),
        description: qs('#editDescription').value.trim()
      };
      if(avatarFile){
        const path = `${STATE.user.id}/${Date.now()}_avatar_${avatarFile.name.replace(/[^a-zA-Z0-9_.\-]/g,'_')}`;
        const { error: upErr } = await supabase.storage.from('thumbnails').upload(path, avatarFile, { upsert:false });
        if(upErr) throw upErr;
        const { data: pub } = supabase.storage.from('thumbnails').getPublicUrl(path);
        updates.avatar_url = pub.publicUrl;
      }
      if(bannerFile){
        const path = `${STATE.user.id}/${Date.now()}_banner_${bannerFile.name.replace(/[^a-zA-Z0-9_.\-]/g,'_')}`;
        const { error: upErr } = await supabase.storage.from('thumbnails').upload(path, bannerFile, { upsert:false });
        if(upErr) throw upErr;
        const { data: pub } = supabase.storage.from('thumbnails').getPublicUrl(path);
        updates.banner_url = pub.publicUrl;
      }
      const { error } = await supabase.from('profiles').update(updates).eq('id', STATE.user.id);
      if(error) throw error;
      await loadProfile();
      updateHeaderAuthUI();
      toastSuccess('Perfil actualizado.');
      closeModal();
      renderRoute();
    }catch(err){
      errBox.textContent = err.message || 'No se pudo actualizar el perfil.';
      errBox.classList.remove('hidden');
    }finally{
      btn.disabled=false; btn.textContent='Guardar cambios';
    }
  });
}

/* ================================================================
   SIDEBAR TOGGLE / MOBILE MENU
================================================================ */
function closeMobileSidebarIfOpen(){
  if(window.innerWidth<=900){
    qs('#sidebar').classList.remove('show');
    qs('#sidebarOverlay').classList.add('hidden');
    STATE.sidebarMobileOpen = false;
  }
}
function toggleSidebar(){
  if(window.innerWidth<=900){
    STATE.sidebarMobileOpen = !STATE.sidebarMobileOpen;
    qs('#sidebar').classList.toggle('show', STATE.sidebarMobileOpen);
    qs('#sidebarOverlay').classList.toggle('hidden', !STATE.sidebarMobileOpen);
  } else {
    STATE.sidebarMini = !STATE.sidebarMini;
    qs('#sidebar').classList.toggle('mini', STATE.sidebarMini);
    qs('#mainContent').classList.toggle('mini-margin', STATE.sidebarMini);
  }
}

/* ================================================================
   GLOBAL EVENT BINDING (runs once)
================================================================ */
function bindGlobalEvents(){
  qs('#btnToggleSidebar').addEventListener('click', toggleSidebar);
  qs('#sidebarOverlay').addEventListener('click', closeMobileSidebarIfOpen);

  qs('#searchForm').addEventListener('submit', (e)=>{ e.preventDefault(); doSearch(); });
  qs('#searchSubmitBtn').addEventListener('click', doSearch);
  qs('#micBtn').addEventListener('click', ()=>{
    if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
      try{
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'es-ES';
        rec.onresult = (ev)=>{ qs('#searchInput').value = ev.results[0][0].transcript; doSearch(); };
        rec.start();
        toastSuccess('Escuchando...');
      }catch(e){ toastError('Búsqueda por voz no disponible.'); }
    } else {
      toastError('Tu navegador no soporta búsqueda por voz.');
    }
  });

  qs('#btnCreate').addEventListener('click', openCreateModal);
  qs('#btnOpenLogin').addEventListener('click', ()=>openAuthModal('login'));
  qs('#btnLogout').addEventListener('click', doSignOut);
  qs('#helpLink').addEventListener('click', (e)=>{
    e.preventDefault();
    toast('JHEILER — plataforma de videos. Para soporte, contacta al administrador.');
  });

  setupDropdown('btnUserMenu','userMenu');
  setupDropdown('btnNotifications','notifMenu');
}

/* ================================================================
   BOOTSTRAP
================================================================ */
(async function bootstrap(){
  bindGlobalEvents();
  await initAuth();
  if(!location.hash) location.hash = '#/home';
  renderRoute();
})();
</script>
