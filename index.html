<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MiChat</title>
<style>
  :root{
    --verde:#075E54;
    --verde-claro:#25D366;
    --fondo:#ECE5DD;
    --burbuja-mia:#DCF8C6;
    --burbuja-otro:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  body{display:flex;flex-direction:column;background:var(--fondo);}

  /* ---------- PANTALLA DE BIENVENIDA ---------- */
  #vistaInicio{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:#fff;
    width:100%;
    max-width:400px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    overflow:hidden;
  }
  .header{
    background:var(--verde);
    color:#fff;
    padding:24px;
    text-align:center;
  }
  .header h1{margin:0;font-size:22px;}
  .header p{margin:6px 0 0;font-size:13px;opacity:.85;}
  .body{padding:24px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#333;
    margin:14px 0 6px;
  }
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:14px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--verde-claro);}
  .colores{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .color-op{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .color-op.selected{border-color:#333;}
  .btn{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:var(--verde-claro);color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;margin-top:20px;
  }
  .btn:active{transform:scale(.98);}
  .btn-secundario{background:#fff;color:var(--verde);border:2px solid var(--verde);}
  .divisor{text-align:center;color:#999;font-size:12px;margin:16px 0;}
  .codigo-generado{
    text-align:center;background:var(--fondo);padding:14px;border-radius:10px;
    font-size:24px;font-weight:700;letter-spacing:3px;color:var(--verde);
    margin-top:10px;display:none;
  }
  .error{color:#d32f2f;font-size:13px;margin-top:8px;display:none;}

  /* ---------- PANTALLA DE CHAT ---------- */
  #vistaChat{
    display:none;
    flex:1;
    flex-direction:column;
    height:100%;
  }
  header.chatHeader{
    background:var(--verde);color:#fff;padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:5;
  }
  header.chatHeader .info{display:flex;flex-direction:column;}
  header.chatHeader .info b{font-size:16px;}
  header.chatHeader .info span{font-size:12px;opacity:.85;}
  header.chatHeader button{
    background:rgba(255,255,255,.15);border:none;color:#fff;
    padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;
  }
  #mensajes{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .msg{
    max-width:75%;padding:8px 12px;border-radius:10px;font-size:14px;
    position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word;
  }
  .msg.mia{align-self:flex-end;background:var(--burbuja-mia);border-bottom-right-radius:2px;}
  .msg.otro{align-self:flex-start;background:var(--burbuja-otro);border-bottom-left-radius:2px;}
  .msg .autor{font-size:12px;font-weight:700;margin-bottom:2px;display:block;}
  .msg .hora{font-size:10px;color:#888;display:block;text-align:right;margin-top:4px;}
  .msg img.foto{max-width:220px;border-radius:8px;display:block;margin-top:4px;cursor:pointer;}
  .msg .sticker{font-size:56px;line-height:1;}

  footer{
    background:#f0f0f0;padding:10px;display:flex;align-items:center;gap:8px;
    border-top:1px solid #ddd;position:relative;
  }
  footer button.icono{background:none;border:none;font-size:22px;cursor:pointer;padding:6px;}
  footer input[type=text]{
    flex:1;padding:12px 14px;border-radius:20px;border:1px solid #ddd;outline:none;font-size:14px;
  }
  footer button.enviar{
    background:var(--verde-claro);border:none;color:#fff;
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
  }
  #panelStickers{
    position:absolute;bottom:64px;left:10px;right:10px;background:#fff;
    border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);padding:12px;
    display:none;grid-template-columns:repeat(6,1fr);gap:8px;max-height:220px;overflow-y:auto;
  }
  #panelStickers.abierto{display:grid;}
  #panelStickers span{font-size:30px;text-align:center;cursor:pointer;padding:4px;border-radius:8px;}
  #panelStickers span:hover{background:var(--fondo);}
  #inputFoto{display:none;}
  #modalImagen{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
    align-items:center;justify-content:center;z-index:50;
  }
  #modalImagen.abierto{display:flex;}
  #modalImagen img{max-width:90%;max-height:90%;border-radius:8px;}
  #modalImagen span{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;}
  #cargando{text-align:center;font-size:12px;color:#888;padding:6px;display:none;}
</style>
</head>
<body>

<!-- ============ VISTA 1: INICIO ============ -->
<div id="vistaInicio">
  <div class="card">
    <div class="header">
      <h1>💬 MiChat</h1>
      <p>Tu chat privado, con tu propio código</p>
    </div>
    <div class="body">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Juan" maxlength="20" />

      <label>Elige tu color</label>
      <div class="colores" id="colores"></div>

      <div class="divisor">— Unirse a una sala existente —</div>
      <label for="codigoUnirse">Código de sala</label>
      <input type="text" id="codigoUnirse" placeholder="Ej: AB12CD" maxlength="10" style="text-transform:uppercase" />
      <button class="btn" id="btnUnirse">Entrar al chat</button>

      <div class="divisor">— O crea una sala nueva —</div>
      <button class="btn btn-secundario" id="btnCrear">Crear sala con código único</button>
      <div class="codigo-generado" id="codigoGenerado"></div>

      <div class="error" id="error"></div>
    </div>
  </div>
</div>

<!-- ============ VISTA 2: CHAT ============ -->
<div id="vistaChat">
  <header class="chatHeader">
    <div class="info">
      <b>Sala privada</b>
      <span id="codigoSalaTexto">Código: ------</span>
    </div>
    <button id="btnSalir">Salir</button>
  </header>

  <div id="mensajes"></div>
  <div id="cargando">Enviando...</div>

  <footer>
    <button class="icono" id="btnStickers" title="Stickers">😊</button>
    <button class="icono" id="btnFoto" title="Enviar foto">📷</button>
    <input type="file" id="inputFoto" accept="image/*" />
    <input type="text" id="textoMensaje" placeholder="Escribe un mensaje" />
    <button class="enviar" id="btnEnviar">➤</button>
  </footer>

  <div id="panelStickers"></div>
</div>

<div id="modalImagen">
  <span id="cerrarModal">✕</span>
  <img id="imagenGrande" src="" />
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, set, onChildAdded, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ---------- Configuración de tu proyecto Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyCoRkv0UAsT5YCIJHhbFT_VB5KmEnIVZ98",
  authDomain: "mi-chat-2bb2f.firebaseapp.com",
  databaseURL: "https://mi-chat-2bb2f-default-rtdb.firebaseio.com",
  projectId: "mi-chat-2bb2f",
  storageBucket: "mi-chat-2bb2f.firebasestorage.app",
  messagingSenderId: "381580220666",
  appId: "1:381580220666:web:21eb576b4d013e06051143",
  measurementId: "G-GTYYPQC01C"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------- Elementos de ambas vistas ----------
const vistaInicio = document.getElementById('vistaInicio');
const vistaChat = document.getElementById('vistaChat');

// ---------- Identificador único de este dispositivo ----------
let uid = localStorage.getItem('michat_uid');
if(!uid){
  uid = 'u_' + Math.random().toString(36).substring(2, 10);
  localStorage.setItem('michat_uid', uid);
}

// ================= VISTA DE INICIO =================
const coloresDisponibles = ['#25D366','#128C7E','#34B7F1','#ED7752','#9C27B0','#FF5722','#607D8B'];
const contColores = document.getElementById('colores');
let colorSeleccionado = coloresDisponibles[0];

coloresDisponibles.forEach((c,i)=>{
  const div = document.createElement('div');
  div.className = 'color-op' + (i===0 ? ' selected' : '');
  div.style.background = c;
  div.onclick = ()=>{
    document.querySelectorAll('.color-op').forEach(x=>x.classList.remove('selected'));
    div.classList.add('selected');
    colorSeleccionado = c;
  };
  contColores.appendChild(div);
});

function generarCodigoUnico(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let codigo = '';
  for(let i=0;i<6;i++){
    codigo += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return codigo;
}

function mostrarError(msg){
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

let nombreUsuario = '';
let salaActual = '';

function entrarASala(codigo){
  const nombre = document.getElementById('nombre').value.trim();
  if(!nombre){
    mostrarError('Escribe tu nombre antes de continuar.');
    return;
  }
  nombreUsuario = nombre;
  salaActual = codigo;
  localStorage.setItem('michat_nombre', nombre);
  localStorage.setItem('michat_color', colorSeleccionado);
  localStorage.setItem('michat_sala', codigo);

  vistaInicio.style.display = 'none';
  vistaChat.style.display = 'flex';
  document.getElementById('codigoSalaTexto').textContent = 'Código: ' + codigo;
  iniciarChat();
}

document.getElementById('btnCrear').addEventListener('click', ()=>{
  const nombre = document.getElementById('nombre').value.trim();
  if(!nombre){
    mostrarError('Escribe tu nombre antes de crear la sala.');
    return;
  }
  const codigo = generarCodigoUnico();
  document.getElementById('codigoGenerado').textContent = codigo;
  document.getElementById('codigoGenerado').style.display = 'block';
  setTimeout(()=> entrarASala(codigo), 900);
});

document.getElementById('btnUnirse').addEventListener('click', ()=>{
  const codigo = document.getElementById('codigoUnirse').value.trim().toUpperCase();
  if(!codigo){
    mostrarError('Escribe el código de la sala a la que quieres unirte.');
    return;
  }
  entrarASala(codigo);
});

document.getElementById('btnSalir').addEventListener('click', ()=>{
  if(confirm('¿Salir de esta sala? Podrás volver a entrar con el mismo código.')){
    vistaChat.style.display = 'none';
    vistaInicio.style.display = 'flex';
    document.getElementById('mensajes').innerHTML = '';
    document.getElementById('error').style.display = 'none';
  }
});

// ================= VISTA DE CHAT =================
const contMensajes = document.getElementById('mensajes');

function formatearHora(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function pintarMensaje(m){
  const div = document.createElement('div');
  div.className = 'msg ' + (m.uid === uid ? 'mia' : 'otro');

  const autor = document.createElement('span');
  autor.className = 'autor';
  autor.style.color = m.color || '#075E54';
  autor.textContent = m.nombre || 'Anónimo';
  div.appendChild(autor);

  if(m.tipo === 'texto'){
    const p = document.createElement('span');
    p.textContent = m.contenido;
    div.appendChild(p);
  } else if(m.tipo === 'foto'){
    const img = document.createElement('img');
    img.className = 'foto';
    img.src = m.contenido;
    img.onclick = ()=>{
      document.getElementById('imagenGrande').src = m.contenido;
      document.getElementById('modalImagen').classList.add('abierto');
    };
    div.appendChild(img);
  } else if(m.tipo === 'sticker'){
    const sp = document.createElement('div');
    sp.className = 'sticker';
    sp.textContent = m.contenido;
    div.appendChild(sp);
  }

  const hora = document.createElement('span');
  hora.className = 'hora';
  hora.textContent = formatearHora(m.timestamp);
  div.appendChild(hora);

  contMensajes.appendChild(div);
  contMensajes.scrollTop = contMensajes.scrollHeight;
}

let mensajesRef = null;
let escuchaActiva = false;

function iniciarChat(){
  mensajesRef = ref(db, 'salas/' + salaActual + '/mensajes');
  const mensajesVisibles = query(mensajesRef, limitToLast(200));
  if(!escuchaActiva){
    onChildAdded(mensajesVisibles, (snap)=>{
      pintarMensaje(snap.val());
    });
    escuchaActiva = true;
  }
}

function enviarMensaje(tipo, contenido){
  const nuevoRef = push(mensajesRef);
  set(nuevoRef, {
    uid,
    nombre: nombreUsuario,
    color: colorSeleccionado,
    tipo,
    contenido,
    timestamp: Date.now()
  });
}

document.getElementById('btnEnviar').addEventListener('click', enviarTexto);
document.getElementById('textoMensaje').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') enviarTexto();
});

function enviarTexto(){
  const input = document.getElementById('textoMensaje');
  const texto = input.value.trim();
  if(!texto) return;
  enviarMensaje('texto', texto);
  input.value = '';
}

// ---------- Fotos ----------
document.getElementById('btnFoto').addEventListener('click', ()=>{
  document.getElementById('inputFoto').click();
});

// Sin Firebase Storage: la foto se comprime y se guarda como imagen
// embebida (base64) directamente dentro del mensaje en la Database.
// Por eso se reduce el tamaño/calidad antes de enviarla.
function comprimirImagen(archivo, maxAncho = 800, calidad = 0.6){
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let ancho = img.width;
        let alto = img.height;
        if(ancho > maxAncho){
          alto = Math.round(alto * (maxAncho / ancho));
          ancho = maxAncho;
        }
        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, ancho, alto);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

document.getElementById('inputFoto').addEventListener('change', async (e)=>{
  const archivo = e.target.files[0];
  if(!archivo) return;

  document.getElementById('cargando').style.display = 'block';
  try{
    const dataUrl = await comprimirImagen(archivo);
    // Aviso simple si, aun comprimida, queda muy pesada para la Database.
    if(dataUrl.length > 700000){
      alert('Esta foto es demasiado pesada incluso comprimida. Prueba con otra imagen más liviana.');
    }else{
      enviarMensaje('foto', dataUrl);
    }
  }catch(err){
    alert('No se pudo enviar la foto: ' + err.message);
  }finally{
    document.getElementById('cargando').style.display = 'none';
    e.target.value = '';
  }
});

// ---------- Stickers ----------
const listaStickers = [
  '😀','😂','😍','😎','😭','😡','🥳','😴',
  '👍','👎','👏','🙏','💪','✌️','🤝','👋',
  '❤️','💔','💯','🔥','⭐','✅','❌','⚡',
  '🎉','🎂','🍕','☕','🐶','🐱','🌹','⚽'
];
const panelStickers = document.getElementById('panelStickers');
listaStickers.forEach(emoji=>{
  const span = document.createElement('span');
  span.textContent = emoji;
  span.onclick = ()=>{
    enviarMensaje('sticker', emoji);
    panelStickers.classList.remove('abierto');
  };
  panelStickers.appendChild(span);
});
document.getElementById('btnStickers').addEventListener('click', ()=>{
  panelStickers.classList.toggle('abierto');
});

// ---------- Modal de imagen ----------
document.getElementById('cerrarModal').addEventListener('click', ()=>{
  document.getElementById('modalImagen').classList.remove('abierto');
});
</script>
</body>
</html>
