<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat P2P por Código</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a23;
    --panel2:#1e2230;
    --accent:#6c5ce7;
    --accent2:#00d2a0;
    --text:#eef0f5;
    --muted:#8b90a3;
    --bubble-me:#6c5ce7;
    --bubble-other:#242838;
    --danger:#ff5c72;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#0f1117,#161a24);
    color:var(--text);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- PANTALLA DE CONEXIÓN ---------- */
  #connectScreen{
    width:100%;
    max-width:420px;
    padding:32px 28px;
    background:var(--panel);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
  }
  #connectScreen h1{
    font-size:22px;
    margin-bottom:4px;
  }
  #connectScreen p.sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:24px;
  }
  .code-box{
    background:var(--panel2);
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
  }
  .code-box label{
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-bottom:8px;
    text-align:left;
  }
  .my-code{
    font-size:26px;
    font-weight:700;
    letter-spacing:3px;
    color:var(--accent2);
    background:#11141c;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    user-select:all;
    word-break:break-all;
  }
  .copy-hint{
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
  }
  input#peerCodeInput{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #2a2f42;
    background:#11141c;
    color:var(--text);
    font-size:15px;
    margin-bottom:12px;
    outline:none;
  }
  input#peerCodeInput:focus{border-color:var(--accent);}
  button{
    cursor:pointer;
    border:none;
    font-family:inherit;
  }
  #connectBtn{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,var(--accent),#8a7ff0);
    color:#fff;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
  }
  #connectBtn:disabled{opacity:.5;cursor:not-allowed;}
  #statusMsg{
    margin-top:16px;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
  }
  #statusMsg.error{color:var(--danger);}
  #statusMsg.ok{color:var(--accent2);}

  /* ---------- PANTALLA DE CHAT ---------- */
  #chatScreen{
    width:100%;
    max-width:480px;
    height:90vh;
    max-height:800px;
    background:var(--panel);
    border-radius:20px;
    display:none;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #chatHeader{
    padding:16px 18px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #2a2f42;
  }
  #chatHeader .info{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .peer-label{font-size:14px;font-weight:600;}
  .peer-status{font-size:11px;color:var(--accent2);}
  #disconnectBtn{
    background:transparent;
    color:var(--danger);
    font-size:12px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid rgba(255,92,114,.3);
  }
  #clearHistBtn{
    background:transparent;
    color:var(--muted);
    font-size:14px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #2a2f42;
    margin-left:6px;
  }
  #clearHistBtn:hover{color:var(--danger);border-color:rgba(255,92,114,.3);}
  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #messages::-webkit-scrollbar{width:6px;}
  #messages::-webkit-scrollbar-thumb{background:#2a2f42;border-radius:10px;}

  .msg-row{display:flex;max-width:80%;}
  .msg-row.me{align-self:flex-end;justify-content:flex-end;}
  .msg-row.other{align-self:flex-start;}
  .bubble{
    padding:10px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .msg-row.me .bubble{
    background:var(--bubble-me);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-row.other .bubble{
    background:var(--bubble-other);
    border-bottom-left-radius:4px;
  }
  .bubble img{
    max-width:220px;
    border-radius:10px;
    display:block;
    margin-top:4px;
    cursor:pointer;
  }
  .bubble audio{
    margin-top:4px;
    width:220px;
    height:36px;
  }
  .msg-time{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
    text-align:right;
  }
  .system-msg{
    align-self:center;
    font-size:11px;
    color:var(--muted);
    background:var(--panel2);
    padding:6px 12px;
    border-radius:20px;
  }

  #inputBar{
    padding:12px 14px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid #2a2f42;
  }
  #inputBar textarea{
    flex:1;
    resize:none;
    background:#11141c;
    border:1px solid #2a2f42;
    color:var(--text);
    border-radius:20px;
    padding:10px 16px;
    font-size:14px;
    max-height:100px;
    outline:none;
    font-family:inherit;
  }
  .icon-btn{
    width:40px;height:40px;
    border-radius:50%;
    background:#2a2f42;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .icon-btn:hover{background:#343a52;}
  #sendBtn{
    background:linear-gradient(135deg,var(--accent),#8a7ff0);
    color:#fff;
  }
  #recordBtn.recording{
    background:var(--danger);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,92,114,.6);}
    70%{box-shadow:0 0 0 10px rgba(255,92,114,0);}
    100%{box-shadow:0 0 0 0 rgba(255,92,114,0);}
  }
  #fileInput{display:none;}

  #imgModal{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    align-items:center;justify-content:center;
    z-index:999;
    cursor:zoom-out;
  }
  #imgModal img{max-width:92%;max-height:92%;border-radius:8px;}

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
    margin-right:6px;
    vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:520px){
    body{align-items:stretch;}
    #chatScreen, #connectScreen{
      max-width:100%;
      height:100vh;
      max-height:100vh;
      border-radius:0;
    }
  }
</style>
</head>
<body>

<!-- PANTALLA DE CONEXIÓN -->
<div id="connectScreen">
  <h1>💬 Chat P2P</h1>
  <p class="sub">Conéctate directamente con tu código, sin servidores intermedios</p>

  <div class="code-box">
    <label>Tu código (compártelo)</label>
    <div class="my-code" id="myCode" onclick="copyMyCode()">generando…</div>
    <div class="copy-hint">Toca para copiar</div>
  </div>

  <input type="text" id="peerCodeInput" placeholder="Pega aquí el código de tu amigo">
  <button id="connectBtn" onclick="connectToPeer()" disabled>Conectar</button>

  <div id="statusMsg">Iniciando conexión…</div>
</div>

<!-- PANTALLA DE CHAT -->
<div id="chatScreen">
  <div id="chatHeader">
    <div class="info">
      <div class="avatar" id="peerAvatar">?</div>
      <div>
        <div class="peer-label" id="peerLabel">Conectado</div>
        <div class="peer-status">● en línea</div>
      </div>
    </div>
    <button id="disconnectBtn" onclick="disconnectChat()" title="Salir del chat">Salir</button>
    <button id="clearHistBtn" onclick="clearCurrentHistory()" title="Borrar historial guardado">🗑</button>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <button class="icon-btn" id="attachBtn" title="Enviar foto">📷</button>
    <input type="file" id="fileInput" accept="image/*">
    <textarea id="textInput" rows="1" placeholder="Escribe un mensaje…"></textarea>
    <button class="icon-btn" id="recordBtn" title="Grabar audio">🎤</button>
    <button class="icon-btn" id="sendBtn" title="Enviar">➤</button>
  </div>
</div>

<div id="imgModal" onclick="this.style.display='none'">
  <img id="imgModalSrc" src="">
</div>

<script>
/* =========================================================
   CHAT P2P — usa PeerJS (WebRTC) con el servidor público gratuito
   de PeerJS solo para el "handshake" inicial (intercambio de
   códigos). Los mensajes, fotos y audios viajan directo entre
   los dos navegadores, sin pasar por ningún backend propio.
   ========================================================= */

let peer = null;
let conn = null;
let myId = null;

const connectScreen = document.getElementById('connectScreen');
const chatScreen = document.getElementById('chatScreen');
const statusMsg = document.getElementById('statusMsg');
const myCodeEl = document.getElementById('myCode');
const peerCodeInput = document.getElementById('peerCodeInput');
const connectBtn = document.getElementById('connectBtn');
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const recordBtn = document.getElementById('recordBtn');
const peerLabel = document.getElementById('peerLabel');
const peerAvatar = document.getElementById('peerAvatar');

function shortCode(){
  // genera un código corto y fácil de compartir (6 caracteres)
  return 'x' + Math.random().toString(36).substr(2,6);
}

function initPeer(){
  const id = shortCode();
  peer = new Peer(id, {
    debug: 1
  });

  peer.on('open', (id) => {
    myId = id;
    myCodeEl.textContent = id;
    connectBtn.disabled = false;
    statusMsg.textContent = 'Listo. Comparte tu código o pega uno para conectar.';
    statusMsg.className = 'ok';
  });

  peer.on('connection', (c) => {
    if (conn && conn.open) {
      c.close(); // ya hay una conexión activa
      return;
    }
    conn = c;
    setupConnection();
  });

  peer.on('error', (err) => {
    console.error(err);
    if (err.type === 'peer-unavailable') {
      statusMsg.textContent = 'Ese código no existe o no está disponible.';
      statusMsg.className = 'error';
      connectBtn.disabled = false;
      connectBtn.innerHTML = 'Conectar';
    } else if (err.type === 'unavailable-id') {
      // reintentar con otro id
      initPeer();
    } else {
      statusMsg.textContent = 'Error de conexión: ' + err.type;
      statusMsg.className = 'error';
    }
  });

  peer.on('disconnected', () => {
    statusMsg.textContent = 'Conexión al servidor perdida, reintentando…';
    statusMsg.className = 'error';
    peer.reconnect();
  });
}

function copyMyCode(){
  if (!myId) return;
  navigator.clipboard.writeText(myId).then(() => {
    statusMsg.textContent = '¡Código copiado!';
    statusMsg.className = 'ok';
  }).catch(() => {});
}

function connectToPeer(){
  const code = peerCodeInput.value.trim();
  if (!code) return;
  if (code === myId) {
    statusMsg.textContent = 'No puedes conectarte a tu propio código 🙂';
    statusMsg.className = 'error';
    return;
  }
  connectBtn.disabled = true;
  connectBtn.innerHTML = '<span class="spinner"></span>Conectando…';
  statusMsg.textContent = 'Buscando al otro usuario…';
  statusMsg.className = '';

  conn = peer.connect(code, { reliable: true });
  setupConnection();
}

function setupConnection(){
  conn.on('open', () => {
    goToChat();
  });
  conn.on('data', (data) => {
    handleIncoming(data);
  });
  conn.on('close', () => {
    addSystemMsg('El otro usuario se desconectó.');
  });
  conn.on('error', (err) => {
    console.error(err);
    statusMsg.textContent = 'Error al conectar. Verifica el código.';
    statusMsg.className = 'error';
    connectBtn.disabled = false;
    connectBtn.innerHTML = 'Conectar';
  });
}

function goToChat(){
  connectScreen.style.display = 'none';
  chatScreen.style.display = 'flex';
  peerLabel.textContent = 'Conectado con ' + conn.peer;
  peerAvatar.textContent = conn.peer.charAt(1).toUpperCase();
  loadHistory(conn.peer);
  addSystemMsg('Conexión establecida 🎉');
}

/* ---------- AUTOGUARDADO DE MENSAJES (localStorage) ---------- */

function historyKey(peerId){
  return 'chat_history_' + peerId;
}

function loadHistory(peerId){
  const raw = localStorage.getItem(historyKey(peerId));
  if (!raw) return;
  try{
    const msgs = JSON.parse(raw);
    msgs.forEach(m => addBubble(m.payload, m.isMe, m.type, false, m.time));
    if (msgs.length){
      addSystemMsg('Historial cargado (' + msgs.length + ' mensajes)');
    }
  } catch(e){
    console.error('No se pudo leer el historial', e);
  }
}

function saveMessage(peerId, msg){
  const raw = localStorage.getItem(historyKey(peerId));
  let msgs = [];
  if (raw){
    try{ msgs = JSON.parse(raw); } catch(e){ msgs = []; }
  }
  msgs.push(msg);
  // límite de seguridad para no saturar localStorage
  if (msgs.length > 500) msgs = msgs.slice(msgs.length - 500);
  try{
    localStorage.setItem(historyKey(peerId), JSON.stringify(msgs));
  } catch(e){
    console.warn('No se pudo guardar el mensaje (almacenamiento lleno)', e);
  }
}

function clearHistory(peerId){
  localStorage.removeItem(historyKey(peerId));
}

function disconnectChat(){
  if (conn) conn.close();
  location.reload();
}

function clearCurrentHistory(){
  if (!conn || !conn.peer) return;
  if (!confirm('¿Borrar el historial guardado de esta conversación en este dispositivo?')) return;
  clearHistory(conn.peer);
  messagesEl.innerHTML = '';
  addSystemMsg('Historial borrado 🗑');
}

/* ---------- ENVÍO Y RECEPCIÓN ---------- */

function addSystemMsg(text){
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollDown();
}

function addBubble(content, isMe, type, shouldSave = true, savedTime = null){
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'other');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (type === 'text'){
    const p = document.createElement('div');
    p.textContent = content;
    bubble.appendChild(p);
  } else if (type === 'image'){
    const img = document.createElement('img');
    img.src = content;
    img.onclick = () => openImgModal(content);
    bubble.appendChild(img);
  } else if (type === 'audio'){
    const audio = document.createElement('audio');
    audio.src = content;
    audio.controls = true;
    bubble.appendChild(audio);
  }

  const timeStr = savedTime || new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = timeStr;
  bubble.appendChild(time);

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();

  if (shouldSave && conn && conn.peer){
    saveMessage(conn.peer, { type, payload: content, isMe, time: timeStr });
  }
}

function scrollDown(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function handleIncoming(data){
  if (!data || !data.type) return;
  addBubble(data.payload, false, data.type);
}

function sendText(){
  const text = textInput.value.trim();
  if (!text || !conn || !conn.open) return;
  conn.send({ type: 'text', payload: text });
  addBubble(text, true, 'text');
  textInput.value = '';
  textInput.style.height = 'auto';
}

sendBtn.onclick = sendText;
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = textInput.scrollHeight + 'px';
});

/* ---------- FOTOS ---------- */
attachBtn.onclick = () => fileInput.click();
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file || !conn || !conn.open) return;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    conn.send({ type: 'image', payload: dataUrl });
    addBubble(dataUrl, true, 'image');
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

function openImgModal(src){
  document.getElementById('imgModalSrc').src = src;
  document.getElementById('imgModal').style.display = 'flex';
}

/* ---------- AUDIO ---------- */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

recordBtn.onclick = async () => {
  if (!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          if (conn && conn.open){
            conn.send({ type: 'audio', payload: dataUrl });
            addBubble(dataUrl, true, 'audio');
          }
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹';
    } catch(err){
      alert('No se pudo acceder al micrófono: ' + err.message);
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '🎤';
  }
};

/* ---------- INIT ---------- */
initPeer();
</script>
</body>
</html>
