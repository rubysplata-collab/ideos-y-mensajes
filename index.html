<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat 2.0 - Edición de ID</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: #151d26;
      --accent: #00e676; 
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background-color: var(--bg-dark);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .screen.active { display: flex; }

    /* --- REGISTRO INICIAL --- */
    .register-box {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* --- CABECERA --- */
    .header {
      background-color: #1f2c34;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header h2 { color: var(--accent); font-size: 1.4rem; font-weight: 700; }

    .connect-btn {
      background-color: var(--accent);
      color: black;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* --- LISTA DE CHATS --- */
    .chat-list { flex: 1; overflow-y: auto; background-color: #121b22; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background-color: #054735;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      border: 2px solid var(--accent);
    }

    .chat-info { flex: 1; }
    .chat-info h4 { margin-bottom: 4px; font-size: 1.05rem; }
    .chat-preview { color: var(--text-dim); font-size: 0.85rem; }

    /* --- CHAT ACTIVO --- */
    .messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0b141a;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }

    .typing-status {
      font-size: 0.8rem;
      color: var(--accent);
      padding: 5px 20px;
      background-color: #0b141a;
      display: none;
    }

    .input-bar {
      padding: 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-bar input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 18px;
      border-radius: 25px;
      color: white;
      outline: none;
    }

    /* --- MODALES --- */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .modal-content {
      background: var(--bg-card);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--accent);
    }

    .modal input, .register-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0b0e14;
      color: white;
      text-align: center;
      outline: none;
    }

    /* --- VIDEOLLAMADA --- */
    .call-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: black;
      z-index: 200;
      flex-direction: column;
    }

    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo {
      position: absolute;
      top: 20px; right: 20px;
      width: 120px; height: 180px;
      border-radius: 15px;
      border: 2px solid var(--accent);
      object-fit: cover;
      z-index: 210;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="screen" id="registerScreen">
    <div class="register-box">
      <h2 style="color: var(--accent);">Crea tu ID WaveChat</h2>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Elige tu nombre (ej. fer, jheiler, juan). Sin espacios ni caracteres raros.</p>
      <input type="text" id="usernameInput" placeholder="Escribe tu nombre aquí">
      <button class="connect-btn" style="width:100%; justify-content:center; padding:12px;" onclick="guardarNombreDeUsuario()">
        Confirmar ID Único
      </button>
    </div>
  </div>

  <div class="screen" id="chatsScreen">
    <header class="header">
      <h2>WaveChat</h2>
      <button class="connect-btn" onclick="abrirModalConexion()">
        <i class="fa-solid fa-plus"></i> Conectar
      </button>
    </header>
    <div class="chat-list" id="chatListContainer"></div>
    
    <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #121b22; border-top: 1px solid rgba(255,255,255,0.05);">
      <span style="font-size: 0.8rem; color: var(--text-dim);">
        Tu ID: <strong id="myIdFooter" style="color: var(--accent);">...</strong>
      </span>
      <button onclick="forzarCambioDeNombre()" style="background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem;">
        <i class="fa-solid fa-pen-to-square"></i> Editar
      </button>
    </div>
  </div>

  <div class="screen" id="activeChatScreen">
    <header class="header">
      <div style="display:flex; align-items:center; gap:10px;">
        <i class="fa-solid fa-arrow-left" onclick="irAListaChats()" style="cursor:pointer"></i>
        <div id="activeChatName" style="font-weight: bold;">Nombre</div>
      </div>
      <div style="display:flex; gap: 15px;">
        <i class="fa-solid fa-trash" onclick="confirmarBorrarHistorial()" style="color:var(--text-dim); cursor:pointer"></i>
        <i class="fa-solid fa-video" onclick="iniciarLlamada()" style="color:var(--accent); cursor:pointer"></i>
      </div>
    </header>
    
    <div class="messages-box" id="msgBox"></div>
    <div class="typing-status" id="typingLabel">Escribiendo...</div>

    <div class="input-bar">
      <input type="text" id="chatInput" placeholder="Mensaje..." oninput="detectarEscritura()">
      <i class="fa-solid fa-paper-plane" onclick="enviarMensaje()" style="color:var(--accent); cursor:pointer"></i>
    </div>
  </div>

  <div class="modal" id="connectModal">
    <div class="modal-content">
      <h3 style="color:var(--accent)">Nueva Conexión</h3>
      <p style="font-size: 0.85rem; margin-top:10px; color: var(--text-dim)">Ingresa el ID de tu amigo para agregarlo a tus chats:</p>
      <input type="text" id="peerIdInput" placeholder="Ejemplo: wave-fer">
      <button class="connect-btn" style="width:100%; justify-content:center" onclick="conectarConPeer()">
        Vincular Chat
      </button>
      <p onclick="cerrarModal()" style="margin-top:15px; font-size:0.8rem; cursor:pointer; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

  <div class="call-overlay" id="callOverlay">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div style="position:absolute; bottom:40px; width:100%; display:flex; justify-content:center;">
      <button onclick="colgarLlamada()" style="background:var(--danger); border:none; padding:15px; border-radius:50%; color:white;">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

</div>

<script>
  let peer;
  let conn = null;
  let activePeerId = null;
  let localStream = null;
  let typingTimeout;

  window.onload = () => {
    const savedId = localStorage.getItem('wave_my_id');
    if (savedId) {
      inicializarPeer(savedId);
    } else {
      mostrarPantalla('registerScreen');
    }
  };

  function mostrarPantalla(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function guardarNombreDeUsuario() {
    const input = document.getElementById('usernameInput');
    const rawName = input.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

    if (!rawName) return alert("Por favor, introduce un nombre válido.");

    const finalID = 'wave-' + rawName;
    localStorage.setItem('wave_my_id', finalID);
    inicializarPeer(finalID);
  }

  function forzarCambioDeNombre() {
    localStorage.removeItem('wave_my_id');
    mostrarPantalla('registerScreen');
    if (peer) {
      peer.destroy();
    }
  }

  function inicializarPeer(myId) {
    document.getElementById('myIdFooter').innerText = myId;
    mostrarPantalla('chatsScreen');
    renderizarListaChats();

    peer = new Peer(myId);
    
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert("Ese nombre ya está en uso. Por favor, elige otro.");
        localStorage.removeItem('wave_my_id');
        mostrarPantalla('registerScreen');
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      activePeerId = conn.peer;
      vincularEventos();
      registrarChatEnLista(activePeerId);
    });

    peer.on('call', async (call) => {
      if(confirm("¿Contestar llamada de " + call.peer.replace('wave-','').toUpperCase() + "?")) {
        localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('callOverlay').style.display = 'flex';
        document.getElementById('localVideo').srcObject = localStream;
        call.answer(localStream);
        call.on('stream', (remote) => document.getElementById('remoteVideo').srcObject = remote);
      }
    });
  }

  // --- NAVEGACIÓN ---
  function abrirModalConexion() { document.getElementById('connectModal').style.display = 'flex'; }
  function cerrarModal() { document.getElementById('connectModal').style.display = 'none'; }
  
  function irAListaChats() {
    mostrarPantalla('chatsScreen');
    activePeerId = null;
    renderizarListaChats();
  }

  function renderizarListaChats() {
    const list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    if(list.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:40px; color:gray">No tienes chats activos todavía. Usa "Conectar" para agregar uno.</p>';
      return;
    }

    list.forEach(id => {
      container.innerHTML += `
        <div class="chat-item" onclick="abrirChat('${id}')">
          <div class="avatar">${id.replace('wave-','').substring(0,2).toUpperCase()}</div>
          <div class="chat-info">
            <h4>${id.replace('wave-','').toUpperCase()}</h4>
            <p class="chat-preview">Historial guardado localmente</p>
          </div>
        </div>
      `;
    });
  }

  // --- MANEJO DE CHAT ---
  function abrirChat(id) {
    activePeerId = id;
    document.getElementById('activeChatName').innerText = id.replace('wave-','').toUpperCase();
    mostrarPantalla('activeChatScreen');
    
    if(!conn || conn.peer !== id) {
      conectarConPeer(id);
    }
    
    cargarHistorial(id);
  }

  function conectarConPeer(idManual) {
    let id = idManual || document.getElementById('peerIdInput').value.trim().toLowerCase();
    if(!id) return;
    
    if(!id.startsWith('wave-')) {
      id = 'wave-' + id;
    }

    conn = peer.connect(id);
    vincularEventos();
    registrarChatEnLista(id);
    cerrarModal();
    if(!idManual) abrirChat(id);
  }

  function vincularEventos() {
    conn.on('data', (data) => {
      if(data.type === 'typing') {
        const typingText = activePeerId.replace('wave-','').toUpperCase() + ' está escribiendo...';
        document.getElementById('typingLabel').innerText = typingText;
        document.getElementById('typingLabel').style.display = data.status ? 'block' : 'none';
      } else if(data.type === 'text') {
        recibirMensaje(data.content);
      }
    });
  }

  function registrarChatEnLista(id) {
    let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    if(!list.includes(id)) {
      list.push(id);
      localStorage.setItem('wave_chats', JSON.stringify(list));
    }
  }

  // --- ENVIAR Y RECIBIR MENSAJES ---
  function detectarEscritura() {
    if(conn && conn.open) {
      conn.send({ type: 'typing', status: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        conn.send({ type: 'typing', status: false });
      }, 1500);
    }
  }

  function enviarMensaje() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text || !conn) return;

    conn.send({ type: 'text', content: text });
    
    const box = document.getElementById('msgBox');
    box.innerHTML += `<div class="bubble sent">${text}</div>`;
    guardarEnHistorial(activePeerId, 'me', text);
    
    input.value = '';
    box.scrollTop = box.scrollHeight;
    
    conn.send({ type: 'typing', status: false });
  }

  function recibirMensaje(text) {
    const box = document.getElementById('msgBox');
    box.innerHTML += `<div class="bubble recv">${text}</div>`;
    guardarEnHistorial(activePeerId, 'friend', text);
    box.scrollTop = box.scrollHeight;
  }

  // --- HISTORIAL ---
  function guardarEnHistorial(id, sender, text) {
    const key = `hist_${id}`;
    let hist = JSON.parse(localStorage.getItem(key) || '[]');
    hist.push({ sender, text });
    localStorage.setItem(key, JSON.stringify(hist));
  }

  function cargarHistorial(id) {
    const key = `hist_${id}`;
    const hist = JSON.parse(localStorage.getItem(key) || '[]');
    const box = document.getElementById('msgBox');
    box.innerHTML = '';
    hist.forEach(m => {
      box.innerHTML += `<div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'}">${m.text}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  }

  function confirmarBorrarHistorial() {
    if(confirm("¿Borrar historial de este chat? Tu amigo seguirá teniendo su copia.")) {
      localStorage.removeItem(`hist_${activePeerId}`);
      cargarHistorial(activePeerId);
    }
  }

  // --- VIDEOLLAMADA ---
  async function iniciarLlamada() {
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('callOverlay').style.display = 'flex';
    document.getElementById('localVideo').srcObject = localStream;
    
    const call = peer.call(activePeerId, localStream);
    call.on('stream', (remote) => document.getElementById('remoteVideo').srcObject = remote);
  }

  function colgarLlamada() {
    location.reload(); 
  }
</script>

</body>
</html>
