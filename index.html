<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveTok & WaveChat - Integrated Edition</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-sidebar: #121b22;
      --accent: #00e676; 
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* --- DISEÑO ESTRUCTURAL: LAYOUT DE ESCRITORIO --- */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      padding: 20px 10px;
      gap: 25px;
      flex-shrink: 0;
    }

    .brand h2 {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
    }

    .side-menu { display: flex; flex-direction: column; gap: 8px; }
    
    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:hover, .menu-item.active {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent);
    }
    .menu-item i { font-size: 1.2rem; width: 25px; }

    .separator {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 1px;
      padding-left: 15px;
      margin-top: 10px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: black;
    }

    /* --- COMPONENTE: PANTALLAS --- */
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg-dark); }
    .screen.active { display: flex; }

    /* --- ENCABEZADOS Y BUSCADOR --- */
    .top-bar {
      background: var(--bg-sidebar);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .search-wrapper { position: relative; width: 300px; }
    .search-wrapper input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px 8px 35px;
      border-radius: 20px;
      color: white;
      outline: none;
    }
    .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
    
    .search-dropdown {
      display: none;
      position: absolute;
      top: 45px; left: 0; width: 100%;
      background: var(--bg-sidebar);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      z-index: 100;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .dropdown-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
    .dropdown-item:hover { background: rgba(255,255,255,0.05); color: var(--accent); }

    /* --- FEED DE WAVETOK (ESTILO TIKTOK) --- */
    .tok-feed-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }
    .tok-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .tok-post {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .tok-video { width: 100%; height: 100%; object-fit: contain; }
    
    /* Acciones Flotantes */
    .tok-actions {
      position: absolute;
      right: 30px;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }
    .circle-action {
      background: rgba(30, 44, 52, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      width: 50px; height: 50px;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .circle-action:hover { transform: scale(1.1); }
    .circle-action.liked { color: var(--danger); }
    .tok-actions span { font-size: 0.8rem; color: white; margin-top: -15px; text-shadow: 1px 1px 3px black; }

    .tok-meta {
      position: absolute;
      left: 30px;
      bottom: 40px;
      z-index: 10;
      max-width: 60%;
      text-shadow: 1px 1px 5px black;
    }

    /* Flechas de Navegación Lateral */
    .nav-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: white; width: 45px; height: 45px;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; cursor: pointer; z-index: 15;
    }
    .nav-arrow:hover { color: var(--accent); background: rgba(0,0,0,0.8); }
    .arrow-left { left: 20px; }
    .arrow-right { right: 20px; }

    /* --- SISTEMA DE CHATS --- */
    .chat-layout { display: flex; flex: 1; height: 100%; }
    .chats-master {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }
    .chats-detail { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
    
    .chat-item {
      display: flex; align-items: center; gap: 15px; padding: 15px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer;
    }
    .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.03); }
    
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: #054735;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      border: 2px solid var(--accent); background-size: cover; background-position: center;
    }

    .messages-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 65%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }

    .share-card {
      background: #1c2732; border: 1px solid var(--accent);
      border-radius: 12px; padding: 12px; cursor: pointer; margin-top: 5px;
    }

    .input-bar {
      padding: 15px 25px; background: var(--bg-sidebar);
      display: flex; align-items: center; gap: 15px;
    }
    .input-bar input {
      flex: 1; background: rgba(255,255,255,0.05); border: none;
      padding: 12px 20px; border-radius: 25px; color: white; outline: none;
    }
    .input-bar i { font-size: 1.3rem; color: var(--accent); cursor: pointer; }

    /* --- MI PERFIL --- */
    .profile-container { padding: 40px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; }
    .profile-header-box { display: flex; align-items: center; gap: 25px; }
    .profile-pic-wrapper { position: relative; width: 110px; height: 110px; }
    .p-avatar { width: 100%; height: 100%; border-radius: 50%; background: #054735; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid var(--accent); background-size: cover; background-position: center; }
    .profile-pic-wrapper label { position: absolute; bottom: 0; right: 0; background: var(--accent); color: black; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .my-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .grid-card { position: relative; aspect-ratio: 9/16; background: black; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .grid-card video { width: 100%; height: 100%; object-fit: cover; }
    .del-btn { position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; border: none; border-radius: 5px; width: 28px; height: 28px; cursor: pointer; z-index: 10; }

    /* --- FILTROS DE VIDEO --- */
    .f-normal { filter: none; }
    .f-bn { filter: grayscale(1); }
    .f-sepia { filter: sepia(1); }
    .f-invert { filter: invert(1); }
    .f-vintage { filter: sepia(0.5) hue-rotate(-30deg) saturate(1.2); }

    /* --- LLAMADAS OVERLAY --- */
    .call-view { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index: 200; flex-direction: column; }
    #remoteVideo { width:100%; height:100%; object-fit: contain; }
    #localVideo { position: absolute; top:30px; right:30px; width:140px; height:200px; border-radius:12px; border:2px solid var(--accent); object-fit: cover; z-index: 210; }
    .call-actions { position: absolute; bottom: 50px; width:100%; display:flex; justify-content:center; gap:20px; z-index:220; }
    .action-call-btn { border:none; width:60px; height:60px; border-radius:50%; color:white; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

    /* --- MODAL --- */
    .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:300; justify-content:center; align-items:center; }
    .modal-box { background: var(--bg-sidebar); border: 1px solid var(--accent); padding: 30px; border-radius: 20px; width: 360px; text-align: center; }
    .modal-box input { width:100%; padding:12px; margin:15px 0; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:#000; color:white; text-align:center; outline:none; }
    
    .btn-solid { background: var(--accent); color:black; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h2><i class="fa-solid fa-clapperboard"></i> WaveTok</h2>
    </div>
    <nav class="side-menu">
      <div class="menu-item active" id="menu-tok" onclick="navegarHacia('tok')">
        <i class="fa-solid fa-house"></i> <span>Para ti</span>
      </div>
      <div class="menu-item" id="menu-chat" onclick="navegarHacia('chat')">
        <i class="fa-solid fa-comment-dots"></i> <span>Chats privados</span>
      </div>
      <div class="menu-item" id="menu-profile" onclick="navegarHacia('profile')">
        <i class="fa-solid fa-user"></i> <span>Mi Perfil</span>
      </div>
    </nav>
    <div class="separator">Descubrir</div>
    <div class="side-menu">
      <div class="menu-item" onclick="abrirModalSubir()">
        <i class="fa-solid fa-circle-plus" style="color:var(--accent)"></i> <span>Subir video</span>
      </div>
    </div>
  </aside>

  <main class="main-content">

    <div class="screen active" id="screen-tok">
      <div class="top-bar">
        <h3 style="color: white;">Explorar</h3>
        <div class="search-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="vSearch" placeholder="Buscar descripción o creador..." oninput="filtrarVideosFeed()">
          <div class="search-dropdown" id="searchDropdown"></div>
        </div>
      </div>
      <div class="tok-feed-container">
        <button class="nav-arrow arrow-left" onclick="cambiarVideoFeed(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-arrow arrow-right" onclick="cambiarVideoFeed(1)"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="tok-wrapper" id="tokFeedIterator"></div>
      </div>
    </div>

    <div class="screen" id="screen-chat">
      <div class="chat-layout">
        <div class="chats-master">
          <div class="top-bar" style="padding: 15px;">
            <button class="btn-solid" style="width: 100%;" onclick="abrirModalVincular()"><i class="fa-solid fa-user-plus"></i> Conectar Amigo</button>
          </div>
          <div style="flex:1; overflow-y:auto;" id="listaAmigosContainer"></div>
        </div>
        <div class="chats-detail">
          <div class="top-bar" id="chatDetailHeader" style="display: none;">
            <h4 id="targetChatName" style="color: white;">Amigo Seleccionado</h4>
            <div style="display:flex; gap: 20px;">
              <i class="fa-solid fa-desktop" onclick="ejecutarLlamada(true)" style="color:var(--accent); cursor:pointer; font-size:1.2rem;" title="Compartir Pantalla"></i>
              <i class="fa-solid fa-video" onclick="ejecutarLlamada(false)" style="color:var(--accent); cursor:pointer; font-size:1.2rem;" title="Videollamada"></i>
            </div>
          </div>
          <div class="messages-container" id="chatBoxMensajes"></div>
          <div class="input-bar" id="chatInputBarArea" style="display: none;">
            <input type="text" id="txtMensaje" placeholder="Escribe un mensaje...">
            <i class="fa-solid fa-paper-plane" onclick="procesarEnvioTexto()"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-profile">
      <div class="top-bar">
        <h3 style="color: white;">Ajustes de Perfil</h3>
      </div>
      <div class="profile-container">
        <div class="profile-header-box">
          <div class="profile-pic-wrapper">
            <div class="p-avatar" id="avatarPerfilGrafico">U</div>
            <label for="fileAvatarInput"><i class="fa-solid fa-camera"></i></label>
            <input type="file" id="fileAvatarInput" accept="image/*" style="display:none" onchange="procesarCambioAvatar(this)">
          </div>
          <div>
            <h2 id="txtLabelPerfilID" style="color: var(--accent);">@CREADOR</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Miembro de WaveTok Studio</p>
          </div>
        </div>
        <div>
          <h3 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Mis Publicaciones</h3>
          <div class="my-grid" id="gridMisVideosPublicados"></div>
        </div>
      </div>
    </div>

    <div class="call-view" id="callOverlayContainer">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="call-actions">
        <button class="action-call-btn" style="background:var(--danger)" onclick="finalizarComunicacion()"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>

  </main>

  <div class="modal-bg" id="modalRegistroInicial" style="display: flex;">
    <div class="modal-box">
      <h2 style="color: var(--accent);">Crear ID WaveTok</h2>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">Elige tu nombre único de red</p>
      <input type="text" id="inputUsernameUnico" placeholder="Ej: marcos99">
      <button class="btn-solid" style="width: 100%;" onclick="registrarNodoCliente()">Establecer e Ingresar</button>
    </div>
  </div>

  <div class="modal-bg" id="modalVincularAmigo">
    <div class="modal-box">
      <h3>Vincular Peer Remoto</h3>
      <input type="text" id="inputPeerIdDestino" placeholder="ID de tu amigo">
      <button class="btn-solid" style="width: 100%;" onclick="conectarConPeerAmigo()">Establecer Vínculo</button>
      <p onclick="cerrarCapaModal('modalVincularAmigo')" style="margin-top:15px; font-size:0.85rem; cursor:pointer; color:var(--text-dim)">Cerrar</p>
    </div>
  </div>

  <div class="modal-bg" id="modalSubirVideo">
    <div class="modal-box" style="width: 420px;">
      <h3>Publicar en WaveTok</h3>
      <input type="file" id="inputVideoFileSource" accept="video/*" onchange="cargarPrevisualizacionVideo(this)">
      <div style="width:100%; height:180px; background:black; margin:10px 0; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
        <video id="videoRenderPreview" style="width:100%; height:100%; object-fit:contain;" loop muted autoplay></video>
      </div>
      <input type="text" id="inputVideoCaption" placeholder="¿De qué trata tu video?">
      <button class="btn-solid" style="width: 100%;" onclick="guardarVideoEditadoDB()">🚀 Subir al Feed</button>
      <p onclick="cerrarCapaModal('modalSubirVideo')" style="margin-top:15px; font-size:0.85rem; cursor:pointer; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

<script>
  let peerInstance = null, activeConnection = null, currentTargetPeerId = null, localMediaStream = null;
  let dbIndexedStorage = null;
  let cacheVideoBase64 = "";
  let masterVideoArray = [];
  let currentFeedIndex = 0;

  // BASE DE DATOS LOCAL (INDEXEDDB)
  function abrirManejadorDB(callback) {
    let peticion = indexedDB.open("WaveTokStorageMaster", 1);
    peticion.onupgradeneeded = function(e) {
      let db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
      }
    };
    peticion.onsuccess = function(e) {
      dbIndexedStorage = e.target.result;
      callback();
    };
    peticion.onerror = function() { callback(); };
  }

  window.onload = () => {
    const sesionID = localStorage.getItem('wt_session_peer_id');
    abrirManejadorDB(() => {
      cargarVideosDesdeDisco(() => {
        if (sesionID) {
          document.getElementById('modalRegistroInicial').style.display = 'none';
          levantarInstanciaPeer(sesionID);
          sincronizarAtributosPerfilEstatico();
        }
      });
    });
  };

  function cargarVideosDesdeDisco(callback) {
    if (!dbIndexedStorage) return callback ? callback() : null;
    let transaccion = dbIndexedStorage.transaction(["videos"], "readonly");
    let almacen = transaccion.objectStore("videos");
    let solicitud = almacen.getAll();
    solicitud.onsuccess = function() {
      if (solicitud.result && solicitud.result.length > 0) {
        masterVideoArray = solicitud.result.reverse(); 
      } else {
        masterVideoArray = [{ id: 101, author: "WAVETOK", caption: "¡Bienvenidos al feed unificado! 🎬🔥 Sube tus creaciones.", url: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-from-below-4804-large.mp4", filter: "f-normal", likes: 45, liked: false }];
      }
      if(callback) callback();
    };
  }

  function registrarNodoCliente() {
    const user = document.getElementById('inputUsernameUnico').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!user) return alert("Ingresa un identificador válido.");
    const idUnicoGenerado = 'wave-' + user;
    localStorage.setItem('wt_session_peer_id', idUnicoGenerado);
    document.getElementById('modalRegistroInicial').style.display = 'none';
    levantarInstanciaPeer(idUnicoGenerado);
    sincronizarAtributosPerfilEstatico();
  }

  function levantarInstanciaPeer(idMio) {
    peerInstance = new Peer(idMio);
    
    peerInstance.on('open', () => {
      renderizarFeedPrincipalVideos();
    });

    peerInstance.on('connection', (incomingConn) => {
      activeConnection = incomingConn;
      currentTargetPeerId = activeConnection.peer;
      almacenarAmigoEnLista(currentTargetPeerId);
      enlazarEscuchadoresDatos();
    });

    peerInstance.on('call', async (incomingCall) => {
      if(confirm("Llamada entrante detectada. ¿Deseas contestar?")) {
        localMediaStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        document.getElementById('localVideo').srcObject = localMediaStream;
        document.getElementById('callOverlayContainer').style.display = 'flex';
        incomingCall.answer(localMediaStream);
        incomingCall.on('stream', (remoto) => document.getElementById('remoteVideo').srcObject = remoto);
      }
    });
  }

  function conectarConPeerAmigo(idDirecto) {
    let target = idDirecto || document.getElementById('inputPeerIdDestino').value.trim().toLowerCase();
    if(!target) return;
    if(!target.startsWith('wave-')) target = 'wave-' + target;
    activeConnection = peerInstance.connect(target);
    almacenarAmigoEnLista(target);
    enlazarEscuchadoresDatos();
    cerrarCapaModal('modalVincularAmigo');
    if(!idDirecto) desplegarChatIndividual(target);
  }

  // --- ESCUCHADOR UNIFICADO: IMÁGENES BASE64, TEXTO Y COMPARTIDOS ---
  function enlazarEscuchadoresDatos() {
    if (!activeConnection) return;
    activeConnection.on('data', (data) => {
      const box = document.getElementById('chatBoxMensajes');
      const banderaChatAbierto = document.getElementById('screen-chat').classList.contains('active');
      
      if (data.type === 'text') {
        registrarMensajeHistorial(activeConnection.peer, 'friend', data.content);
        if (banderaChatAbierto && currentTargetPeerId === activeConnection.peer) {
          // CORRECCIÓN: Renderiza imágenes si detecta Base64 o texto plano
          if (data.content.startsWith('data:image/')) {
            box.innerHTML += `<div class="bubble recv"><img src="${data.content}" style="max-width: 100%; border-radius: 10px; display:block;"/></div>`;
          } else {
            box.innerHTML += `<div class="bubble recv">${data.content}</div>`;
          }
          box.scrollTop = box.scrollHeight;
        }
      } else if (data.type === 'share-video') {
        registrarMensajeHistorial(activeConnection.peer, 'friend', `SHARE_VD_IDX:${data.videoId}:${data.caption}`);
        if (banderaChatAbierto && currentTargetPeerId === activeConnection.peer) {
          box.innerHTML += `
            <div class="bubble recv">
              <div class="share-card" onclick="saltarAVideoDesdeLink(${data.videoId})">
                <span style="color:var(--accent); font-weight:bold; font-size:0.8rem;">🎬 Video Compartido</span>
                <p style="margin:5px 0 0 0; font-size:0.9rem;">${data.caption}</p>
              </div>
            </div>`;
          box.scrollTop = box.scrollHeight;
        }
      }
    });
  }

  function procesarEnvioTexto() {
    const input = document.getElementById('txtMensaje');
    const msg = input.value.trim();
    if(!msg || !activeConnection) return;
    
    activeConnection.send({ type: 'text', content: msg });
    registrarMensajeHistorial(currentTargetPeerId, 'me', msg);
    
    const box = document.getElementById('chatBoxMensajes');
    if (msg.startsWith('data:image/')) {
      box.innerHTML += `<div class="bubble sent"><img src="${msg}" style="max-width: 100%; border-radius: 10px; display:block;"/></div>`;
    } else {
      box.innerHTML += `<div class="bubble sent">${msg}</div>`;
    }
    input.value = '';
    box.scrollTop = box.scrollHeight;
  }

  function compartirVideoPorChat(idx) {
    let video = masterVideoArray[idx];
    if(!activeConnection) return alert("Abre primero una sala de chat activa con tu amigo.");
    activeConnection.send({ type: 'share-video', videoId: video.id, caption: video.caption });
    registrarMensajeHistorial(activeConnection.peer, 'me', `SHARE_VD_IDX:${video.id}:${video.caption}`);
    alert("¡Video compartido exitosamente al chat!");
  }

  function saltarAVideoDesdeLink(vId) {
    let indexFound = masterVideoArray.findIndex(v => v.id === vId);
    if(indexFound !== -1) {
      navegarHacia('tok');
      enfocarVideoEspecificoFeed(indexFound);
    } else {
      alert("El contenido solicitado no está disponible.");
    }
  }

  // GESTIÓN DE INTERFAZ Y NAVEGACIÓN
  function navegarHacia(pantalla) {
    document.querySelectorAll('.tok-video').forEach(v => v.pause());
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    document.getElementById(`menu-${pantalla}`).classList.add('active');
    document.getElementById(`screen-${pantballa || pantalla}`).classList.add('active');

    if(pantalla === 'tok') {
      reproducirVideoIndiceActual();
    } else if(pantalla === 'chat') {
      actualizarListaIzquierdaAmigos();
    } else if(pantalla === 'profile') {
      renderizarMosaicoVideosPerfil();
    }
  }

  function desplegarChatIndividual(id) {
    currentTargetPeerId = id;
    document.getElementById('targetChatName').innerText = id.replace('wave-','').toUpperCase();
    document.getElementById('chatDetailHeader').style.display = 'flex';
    document.getElementById('chatInputBarArea').style.display = 'flex';
    if(!activeConnection || activeConnection.peer !== id) conectarConPeerAmigo(id);
    dibujarMensajesHistorial(id);
  }

  function registrarMensajeHistorial(pId, sender, text) {
    let hist = JSON.parse(localStorage.getItem(`h_v2_${pId}`) || '[]');
    hist.push({ sender, text });
    localStorage.setItem(`h_v2_${pId}`, JSON.stringify(hist));
  }

  function dibujarMensajesHistorial(pId) {
    let hist = JSON.parse(localStorage.getItem(`h_v2_${pId}`) || '[]');
    const box = document.getElementById('chatBoxMensajes');
    box.innerHTML = '';
    hist.forEach(h => {
      if(h.text.startsWith('SHARE_VD_IDX:')) {
        let fragmentos = h.text.split(':');
        box.innerHTML += `
          <div class="bubble ${h.sender === 'me' ? 'sent' : 'recv'}">
            <div class="share-card" onclick="saltarAVideoDesdeLink(${fragmentos[1]})">
              <span style="color:var(--accent); font-weight:bold; font-size:0.8rem;">🎬 Video Compartido</span>
              <p style="margin:5px 0 0 0; font-size:0.9rem;">${fragmentos[2] || 'Ver vídeo'}</p>
            </div>
          </div>`;
      } else if (h.text.startsWith('data:image/')) {
        box.innerHTML += `<div class="bubble ${h.sender === 'me' ? 'sent' : 'recv'}"><img src="${h.text}" style="max-width: 100%; border-radius: 10px; display:block;"/></div>`;
      } else {
        box.innerHTML += `<div class="bubble ${h.sender === 'me' ? 'sent' : 'recv'}">${h.text}</div>`;
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  function actualizarListaIzquierdaAmigos() {
    let list = JSON.parse(localStorage.getItem('wt_amigos_list') || '[]');
    const container = document.getElementById('listaAmigosContainer');
    container.innerHTML = '';
    list.forEach(id => {
      container.innerHTML += `
        <div class="chat-item" onclick="desplegarChatIndividual('${id}')">
          <div class="avatar">${id.replace('wave-','').substring(0,2).toUpperCase()}</div>
          <div style="flex:1;">
            <h5 style="color:white; font-size:0.95rem;">${id.replace('wave-','').toUpperCase()}</h5>
            <p style="color:var(--text-dim); font-size:0.8rem;">En línea vía PeerJS</p>
          </div>
        </div>`;
    });
  }

  function almacenarAmigoEnLista(id) {
    let list = JSON.parse(localStorage.getItem('wt_amigos_list') || '[]');
    if(!list.includes(id)) { list.push(id); localStorage.setItem('wt_amigos_list', JSON.stringify(list)); }
  }

  // FEED DE VÍDEOS (WAVETOK)
  function renderizarFeedPrincipalVideos() {
    const container = document.getElementById('tokFeedIterator');
    container.innerHTML = '';
    masterVideoArray.forEach((vid, idx) => {
      container.innerHTML += `
        <div class="tok-post">
          <video class="tok-video" src="${vid.url}" loop onclick="this.paused?this.play():this.pause()"></video>
          <div class="tok-actions">
            <div class="circle-action ${vid.liked?'liked':''}" onclick="reaccionarLikeVideo(${idx}, this)"><i class="fa-solid fa-heart"></i></div>
            <span>${vid.likes}</span>
            <div class="circle-action" style="color:var(--accent);" onclick="compartirVideoPorChat(${idx})"><i class="fa-solid fa-share"></i></div>
          </div>
          <div class="tok-meta">
            <h3>@${vid.author}</h3>
            <p>${vid.caption}</p>
          </div>
        </div>`;
    });
    currentFeedIndex = 0;
    container.scrollLeft = 0;
    setTimeout(reproducirVideoIndiceActual, 300);
  }

  function cambiarVideoFeed(dir) {
    const wrapper = document.getElementById('tokFeedIterator');
    let target = currentFeedIndex + dir;
    if (target >= 0 && target < masterVideoArray.length) {
      document.querySelectorAll('.tok-video').forEach(v => v.pause());
      currentFeedIndex = target;
      wrapper.scrollLeft = currentFeedIndex * wrapper.clientWidth;
      setTimeout(reproducirVideoIndiceActual, 350);
    }
  }

  function enfocarVideoEspecificoFeed(idx) {
    currentFeedIndex = idx;
    const wrapper = document.getElementById('tokFeedIterator');
    setTimeout(() => {
      wrapper.scrollLeft = currentFeedIndex * wrapper.clientWidth;
      reproducirVideoIndiceActual();
    }, 200);
  }

  function reproducirVideoIndiceActual() {
    const vids = document.querySelectorAll('.tok-video');
    if(vids[currentFeedIndex]) vids[currentFeedIndex].play().catch(()=>{});
  }

  function filtrarVideosFeed() {
    const q = document.getElementById('vSearch').value.trim().toLowerCase();
    const drop = document.getElementById('searchDropdown');
    if(!q) { drop.style.display = 'none'; return; }
    
    let matches = masterVideoArray.filter(v => v.caption.toLowerCase().includes(q) || v.author.toLowerCase().includes(q));
    drop.innerHTML = '';
    if(matches.length === 0) {
      drop.innerHTML = '<div class="dropdown-item" style="color:gray;">No hay coincidencias</div>';
    } else {
      matches.forEach(v => {
        let origIdx = masterVideoArray.findIndex(m => m.id === v.id);
        drop.innerHTML += `<div class="dropdown-item" onclick="enfocarVideoEspecificoFeed(${origIdx}); document.getElementById('searchDropdown').style.display='none';"><strong>@${v.author}</strong> - ${v.caption}</div>`;
      });
    }
    drop.style.display = 'block';
  }

  // PERFIL Y CONFIGURACIONES
  function sincronizarAtributosPerfilEstatico() {
    const miID = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : 'USER';
    document.getElementById('txtLabelPerfilID').innerText = `@${miID}`;
    document.getElementById('avatarPerfilGrafico').innerText = miID.substring(0,1);
    
    const pic = localStorage.getItem('wt_custom_avatar_b64');
    if(pic) {
      document.getElementById('avatarPerfilGrafico').style.backgroundImage = `url(${pic})`;
      document.getElementById('avatarPerfilGrafico').innerText = '';
    }
  }

  function procesarCambioAvatar(input) {
    if(input.files && input.files[0]) {
      let r = new FileReader();
      r.onload = function(e) {
        localStorage.setItem('wt_custom_avatar_b64', e.target.result);
        sincronizarAtributosPerfilEstatico();
      };
      r.readAsDataURL(input.files[0]);
    }
  }

  function renderizarMosaicoVideosPerfil() {
    const grid = document.getElementById('gridMisVideosPublicados');
    grid.innerHTML = '';
    const miFirma = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : "ANÓNIMO";
    
    let filtrados = masterVideoArray.filter(v => v.author === miFirma);
    if(filtrados.length === 0) {
      grid.innerHTML = '<p style="color:gray; font-size:0.85rem; padding:15px;">No has cargado clips de video todavía.</p>';
      return;
    }

    filtrados.forEach(v => {
      let orig = masterVideoArray.findIndex(m => m.id === v.id);
      grid.innerHTML += `
        <div class="grid-card">
          <button class="del-btn" onclick="event.stopPropagation(); destruirVideoEspecifico(${v.id})"><i class="fa-solid fa-trash"></i></button>
          <video src="${v.url}" muted onclick="navegarHacia('tok'); enfocarVideoEspecificoFeed(${orig});"></video>
        </div>`;
    });
  }

  function destruirVideoEspecifico(id) {
    if(confirm("¿Eliminar publicación de manera permanente?")) {
      let tx = dbIndexedStorage.transaction(["videos"], "readwrite");
      tx.objectStore("videos").delete(id);
      tx.oncomplete = () => {
        cargarVideosDesdeDisco(() => {
          renderizarMosaicoVideosPerfil();
        });
      };
    }
  }

  function reaccionarLikeVideo(idx, node) {
    masterVideoArray[idx].liked = !masterVideoArray[idx].liked;
    masterVideoArray[idx].likes += masterVideoArray[idx].liked ? 1 : -1;
    node.classList.toggle('liked');
    node.nextElementSibling.innerText = masterVideoArray[idx].likes;
    if(dbIndexedStorage) {
      let tx = dbIndexedStorage.transaction(["videos"], "readwrite");
      tx.objectStore("videos").put(masterVideoArray[idx]);
    }
  }

  function cargarPrevisualizacionVideo(input) {
    if (!input.files[0]) return;
    const r = new FileReader();
    r.onload = (e) => {
      cacheVideoBase64 = e.target.result;
      document.getElementById('videoRenderPreview').src = cacheVideoBase64;
    };
    r.readAsDataURL(input.files[0]);
  }

  function guardarVideoEditadoDB() {
    const caption = document.getElementById('inputVideoCaption').value.trim() || "Clip de WaveTok";
    if(!cacheVideoBase64) return alert("Selecciona un archivo multimedia.");
    const miFirma = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : "ANÓNIMO";
    
    const pack = { author: miFirma, caption: caption, url: cacheVideoBase64, filter: "f-normal", likes: 0, liked: false };

    let tx = dbIndexedStorage.transaction(["videos"], "readwrite");
    tx.objectStore("videos").add(pack);
    tx.oncomplete = () => {
      document.getElementById('inputVideoCaption').value = '';
      cacheVideoBase64 = "";
      cerrarCapaModal('modalSubirVideo');
      cargarVideosDesdeDisco(() => {
        navegarHacia('tok');
        renderizarFeedPrincipalVideos();
      });
    };
  }

  // CONTROLADORES MULTIMEDIA (LLAMADAS)
  async function ejecutarLlamada(compartirPantalla) {
    try {
      localMediaStream = compartirPantalla 
        ? await navigator.mediaDevices.getDisplayMedia({video:true, audio:true}) 
        : await navigator.mediaDevices.getUserMedia({video:true, audio:true});
        
      document.getElementById('localVideo').srcObject = localMediaStream;
      document.getElementById('callOverlayContainer').style.display = 'flex';
      
      peerInstance.call(currentTargetPeerId, localMediaStream).on('stream', (remoto) => {
        document.getElementById('remoteVideo').srcObject = remoto;
      });
    } catch(e) { alert("Sistemas de captura multimedia no disponibles."); }
  }

  function finalizarComunicacion() {
    if(localMediaStream) localMediaStream.getTracks().forEach(track => track.stop());
    location.reload();
  }

  // UTILERÍAS MODAL
  function abrirModalVincular() { document.getElementById('modalVincularAmigo').style.display = 'flex'; }
  function abrirModalSubir() { document.getElementById('modalSubirVideo').style.display = 'flex'; }
  function cerrarCapaModal(id) { document.getElementById(id).style.display = 'none'; }
</script>

</body>
</html>
