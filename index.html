<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat 4.6 - Fixed Layout</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: #151d26;
      --accent: #00e676; 
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background-color: var(--bg-dark);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 950px) {
      body { background-color: #010101; }
      .app-container {
        max-width: 1250px;
        height: 100vh;
        flex-direction: row;
      }
      .main-content {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .pc-sidebar { display: flex !important; }
      .bottom-nav { display: none !important; }
    }

    .main-content {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pc-sidebar {
      display: none;
      width: 280px;
      background-color: var(--bg-dark);
      border-right: 1px solid rgba(255,255,255,0.08);
      flex-direction: column;
      padding: 20px 10px;
      gap: 25px;
      overflow-y: auto;
    }
    .sidebar-logo { font-size: 1.6rem; font-weight: 800; color: var(--accent); padding-left: 15px; margin-bottom: 10px; }
    .sidebar-menu { display: flex; flex-direction: column; gap: 8px; }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .sidebar-item i { font-size: 1.3rem; width: 25px; text-align: center; }
    .sidebar-item:hover, .sidebar-item.active {
      background-color: rgba(255,255,255,0.05);
      color: var(--accent);
    }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
    @media (max-width: 950px) { .screen { height: calc(100% - 60px); } }
    .screen.active { display: flex; }
    
    .bottom-nav {
      height: 60px;
      background-color: #1f2c34;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      z-index: 10;
    }
    .nav-item {
      color: var(--text-dim);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-item span { font-size: 0.65rem; }

    .register-box { padding: 30px; display: flex; flex-direction: column; gap: 20px; flex: 1; justify-content: center; align-items: center; text-align: center; }

    .header { background-color: #1f2c34; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 10px; z-index: 10; }
    @media (min-width: 950px) { .header { background-color: var(--bg-dark); } }
    .header h2 { color: var(--accent); font-size: 1.4rem; font-weight: 700; white-space: nowrap; }
    
    .search-container { position: relative; flex: 1; max-width: 300px; }
    .search-input { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px 8px 35px; border-radius: 20px; color: white; outline: none; font-size: 0.9rem; }
    .search-container i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.9rem; }
    
    .search-results { display: none; position: absolute; top: 45px; left: 0; width: 100%; background: #1f2c34; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 50; max-height: 200px; overflow-y: auto; }
    .result-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 0.85rem; display: flex; flex-direction: column; }
    .result-item:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
    .result-item span { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

    .chat-list { flex: 1; overflow-y: auto; background-color: #121b22; }
    @media (min-width: 950px) { .chat-list { background-color: var(--bg-dark); } }
    .chat-item { display: flex; align-items: center; gap: 15px; padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); cursor: pointer; }
    .avatar { width: 55px; height: 55px; border-radius: 50%; background-color: #054735; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; border: 2px solid var(--accent); text-transform: uppercase; }
    .chat-info { flex: 1; }
    .chat-info h4 { margin-bottom: 4px; font-size: 1.05rem; }
    .chat-preview { color: var(--text-dim); font-size: 0.85rem; }

    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #0b141a; margin-bottom: 65px; }
    
    .bubble { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; color: white; }
    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }
    .bubble.video-link { border: 1px dashed var(--accent); cursor: pointer; background-color: rgba(0, 230, 118, 0.07); display: block; }

    .input-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 65px; padding: 12px 15px; background-color: #1f2c34; display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.05); z-index: 15; }
    .input-bar input[type="text"] { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 25px; color: white; outline: none; }
    .input-bar i { font-size: 1.3rem; color: var(--accent); cursor: pointer; padding: 5px; }

    .tiktok-container { flex: 1; background: black; position: relative; overflow: hidden; display: flex; width: 100%; height: 100%; }
    .tiktok-feed { display: flex; flex-direction: column; width: 100%; height: 100%; overflow-y: hidden; transition: transform 0.4s ease-in-out; }
    .tiktok-post { min-height: 100%; width: 100%; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    .tiktok-video { width: 100%; height: 100%; object-fit: contain; }
    
    /* Flechas de navegación vertical restauradas */
    .nav-arrow-v { position: absolute; right: 15px; background: rgba(40, 40, 40, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; }
    .arrow-up { top: 40%; transform: translateY(-50%); }
    .arrow-down { top: 48%; transform: translateY(-50%); }

    .tiktok-actions { position: absolute; right: 15px; bottom: 60px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 5; }
    .action-btn { background: rgba(35,35,35,0.8); border: none; width: 48px; height: 48px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; }
    .tiktok-actions span { font-size: 0.8rem; color: white; margin-top: -15px; text-shadow: 1px 1px 3px black; }

    .tiktok-meta { position: absolute; left: 15px; bottom: 20px; z-index: 5; max-width: 75%; text-shadow: 1px 1px 3px black; }
    .tiktok-meta h4 { color: white; margin-bottom: 5px; font-size: 1.1rem; }
    .tiktok-meta p { color: #e5e5e5; font-size: 0.9rem; }

    .connect-btn { background-color: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
    .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--bg-card); padding: 25px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; }
    
    .share-list { display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; margin-top: 15px; }
    .share-friend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; }
  </style>
</head>
<body>

<div class="app-container">
  
  <aside class="pc-sidebar">
    <div class="sidebar-logo">WaveTok 🎬</div>
    <div class="sidebar-menu">
      <div class="sidebar-item active" id="pc-nav-tiktok" onclick="cambiarPestana('tiktok')">
        <i class="fa-solid fa-house"></i><span>Para ti</span>
      </div>
      <div class="sidebar-item" id="pc-nav-chats" onclick="cambiarPestana('chats')">
        <i class="fa-solid fa-message"></i><span>Chats privados</span>
      </div>
    </div>
  </aside>

  <div class="main-content">
    
    <div class="screen" id="registerScreen">
      <div class="register-box">
        <h2>ID WaveChat</h2>
        <input type="text" id="usernameInput" style="width:100%; padding:10px; background:#111; color:white; border:1px solid #333;" placeholder="Tu nombre único">
        <button class="connect-btn" onclick="guardarNombreDeUsuario()">Entrar</button>
      </div>
    </div>

    <div class="screen" id="chatsScreen">
      <header class="header">
        <h2>Chats</h2>
        <button class="connect-btn" onclick="abrirModalConexion()"><i class="fa-solid fa-plus"></i> Conectar amigo</button>
      </header>
      <div class="chat-list" id="chatListContainer"></div>
    </div>

    <div class="screen" id="activeChatScreen">
      <header class="header">
        <div style="display:flex; align-items:center; gap:10px;">
          <i class="fa-solid fa-arrow-left" onclick="cambiarPestana('chats')" style="cursor:pointer"></i>
          <div id="activeChatName" style="font-weight: bold;">Chat</div>
        </div>
      </header>
      <div class="messages-box" id="msgBox"></div>
      <div class="input-bar">
        <input type="text" id="chatInput" placeholder="Mensaje...">
        <i class="fa-solid fa-paper-plane" onclick="enviarMensaje()"></i>
      </div>
    </div>

    <div class="screen" id="tiktokScreen">
      <header class="header">
        <h2>WaveTok 🎬</h2>
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="search-input" id="videoSearchInput" placeholder="Buscar descripción..." oninput="buscarVideos()">
          <div class="search-results" id="searchResultsContainer"></div>
        </div>
      </header>
      <div class="tiktok-container">
        <button class="nav-arrow-v arrow-up" onclick="navegarVideo(-1)"><i class="fa-solid fa-chevron-up"></i></button>
        <button class="nav-arrow-v arrow-down" onclick="navegarVideo(1)"><i class="fa-solid fa-chevron-down"></i></button>
        <div class="tiktok-feed" id="tiktokFeedContainer"></div>
      </div>
    </div>

    <nav class="bottom-nav" id="mainNavbar" style="display:none;">
      <div class="nav-item" id="nav-chats" onclick="cambiarPestana('chats')">
        <i class="fa-solid fa-message"></i><span>Chats</span>
      </div>
      <div class="nav-item active" id="nav-tiktok" onclick="cambiarPestana('tiktok')">
        <i class="fa-solid fa-clapperboard"></i><span>WaveTok</span>
      </div>
    </nav>

  </div>

  <div class="modal" id="connectModal">
    <div class="modal-content">
      <h3>Vincular amigo</h3>
      <input type="text" id="peerIdInput" style="width:100%; padding:10px; margin:10px 0;" placeholder="ID de tu amigo">
      <button class="connect-btn" style="width:100%; justify-content:center" onclick="conectarConPeer()">Vincular</button>
      <p onclick="cerrarModal()" style="margin-top:15px; cursor:pointer; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

  <div class="modal" id="shareModal">
    <div class="modal-content">
      <h3>Compartir video con...</h3>
      <div class="share-list" id="shareFriendsListContainer"></div>
      <p onclick="cerrarModalCompartir()" style="margin-top:20px; cursor:pointer; color:var(--danger)">Cerrar</p>
    </div>
  </div>

</div>

<script>
  let peer, conn = null, activePeerId = null;
  
  let listaVideos = [
    { id: 101, author: "YEIBLOX", caption: "la kk que me creia a los 6-7 años", url: "https://www.w3schools.com/html/mov_bbb.mp4", likes: "10.3K" },
    { id: 102, author: "CR7_Fan", caption: "Entrenamiento duro jugando futbol con amigos ⚽", url: "https://www.w3schools.com/html/movie.mp4", likes: "5.8K" }
  ];
  let currentVideoIndex = 0;
  let videoIdParaCompartir = null;

  window.onload = () => {
    const savedId = localStorage.getItem('wave_my_id');
    if (savedId) { inicializarPeer(savedId); } else { mostrarPantalla('registerScreen'); }
  };

  function mostrarPantalla(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function cambiarPestana(tipo) {
    document.querySelectorAll('.nav-item, .sidebar-item').forEach(n => n.classList.remove('active'));
    if(document.getElementById(`nav-${tipo}`)) document.getElementById(`nav-${tipo}`).classList.add('active');
    if(document.getElementById(`pc-nav-${tipo}`)) document.getElementById(`pc-nav-${tipo}`).classList.add('active');

    if (tipo === 'chats') {
      mostrarPantalla('chatsScreen');
      renderizarListaChats();
    } else if (tipo === 'tiktok') {
      mostrarPantalla('tiktokScreen');
      renderizerFeedTikTok();
    }
  }

  function guardarNombreDeUsuario() {
    const input = document.getElementById('usernameInput').value.trim().toLowerCase();
    if (!input) return;
    const finalID = 'wave-' + input;
    localStorage.setItem('wave_my_id', finalID);
    inicializarPeer(finalID);
  }

  function inicializarPeer(myId) {
    document.getElementById('mainNavbar').style.display = 'flex';
    cambiarPestana('tiktok');
    peer = new Peer(myId);
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      activePeerId = conn.peer;
      vincularEventos();
      registrarChatEnLista(activePeerId);
    });
  }

  function abrirModalConexion() { document.getElementById('connectModal').style.display = 'flex'; }
  function cerrarModal() { document.getElementById('connectModal').style.display = 'none'; }

  function renderizarListaChats() {
    const list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    const container = document.getElementById('chatListContainer');
    container.innerHTML = list.length === 0 ? '<p style="text-align:center; padding:40px; color:gray">No hay chats activos.</p>' : '';
    list.forEach(id => {
      container.innerHTML += `
        <div class="chat-item" onclick="abrirChat('${id}')">
          <div class="avatar">${id.replace('wave-','').substring(0,2)}</div>
          <div class="chat-info">
            <h4>${id.replace('wave-','').toUpperCase()}</h4>
            <p class="chat-preview">Toca para abrir la conversación</p>
          </div>
        </div>`;
    });
  }

  function abrirChat(id) {
    activePeerId = id;
    document.getElementById('activeChatName').innerText = id.replace('wave-','').toUpperCase();
    mostrarPantalla('activeChatScreen');
    conectarConPeer(id);
    cargarHistorial(id);
  }

  function conectarConPeer(idManual) {
    let id = idManual || document.getElementById('peerIdInput').value.trim().toLowerCase();
    if(!id) return;
    if(!id.startsWith('wave-')) id = 'wave-' + id;
    if(!conn || conn.peer !== id) {
      conn = peer.connect(id);
      vincularEventos();
    }
    registrarChatEnLista(id);
    cerrarModal();
  }

  function vincularEventos() {
    if(!conn) return;
    conn.off('data'); 
    conn.on('data', (data) => {
      const box = document.getElementById('msgBox');
      if(data.type === 'video-link') {
        box.innerHTML += `<div class="bubble recv video-link" onclick="saltarAlVideo(${data.videoId})">${data.content}</div>`;
        guardarEnHistorial(conn.peer, 'friend', data.content, 'video-link', data.videoId);
      } else {
        box.innerHTML += `<div class="bubble recv">${data.content}</div>`;
        guardarEnHistorial(conn.peer, 'friend', data.content, 'text');
      }
      box.scrollTop = box.scrollHeight;
    });
  }

  function enviarMensaje(textoForzado = null, msgType = 'text', linkedVideoId = null) {
    const input = document.getElementById('chatInput');
    const mensaje = textoForzado || input.value.trim();
    if(!mensaje || !conn) return;
    
    conn.send({ type: msgType, content: mensaje, videoId: linkedVideoId });
    const box = document.getElementById('msgBox');
    
    if(msgType === 'video-link') {
      box.innerHTML += `<div class="bubble sent video-link" onclick="saltarAlVideo(${linkedVideoId})">${mensaje}</div>`;
    } else {
      box.innerHTML += `<div class="bubble sent">${mensaje}</div>`;
    }
    
    guardarEnHistorial(activePeerId, 'me', mensaje, msgType, linkedVideoId);
    if(!textoForzado) input.value = '';
    box.scrollTop = box.scrollHeight;
  }

  function guardarEnHistorial(id, sender, text, msgType = 'text', videoId = null) {
    const key = `hist_${id}`;
    let fillHist = JSON.parse(localStorage.getItem(key) || '[]');
    fillHist.push({ sender, text, msgType, videoId });
    localStorage.setItem(key, JSON.stringify(fillHist));
  }

  function cargarHistorial(id) {
    const hist = JSON.parse(localStorage.getItem(`hist_${id}`) || '[]');
    const box = document.getElementById('msgBox');
    box.innerHTML = '';
    hist.forEach(m => {
      if(m.msgType === 'video-link') {
        box.innerHTML += `<div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'} video-link" onclick="saltarAlVideo(${m.videoId})">${m.text}</div>`;
      } else {
        box.innerHTML += `<div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'}">${m.text}</div>`;
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  function registrarChatEnLista(id) {
    let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    if(!list.includes(id)) { list.push(id); localStorage.setItem('wave_chats', JSON.stringify(list)); }
  }

  function renderizerFeedTikTok() {
    const container = document.getElementById('tiktokFeedContainer');
    container.innerHTML = '';
    listaVideos.forEach((video, idx) => {
      container.innerHTML += `
        <div class="tiktok-post" id="post-video-${video.id}">
          <video class="tiktok-video" src="${video.url}" loop autoplay muted playsinline></video>
          <div class="tiktok-actions">
            <button class="action-btn"><i class="fa-solid fa-heart"></i></button>
            <span>${video.likes}</span>
            <button class="action-btn" onclick="abrirModalCompartir(${video.id})">
              <i class="fa-solid fa-share"></i>
            </button>
            <span>Compartir</span>
          </div>
          <div class="tiktok-meta">
            <h4>@${video.author}</h4>
            <p>${video.caption}</p>
          </div>
        </div>`;
    });
    actualizarDesplazamientoVertical();
  }

  function navegarVideo(dir) {
    let newIdx = currentVideoIndex + dir;
    if(newIdx >= 0 && newIdx < listaVideos.length) {
      currentVideoIndex = newIdx;
      actualizarDesplazamientoVertical();
    }
  }

  function actualizarDesplazamientoVertical() {
    const container = document.getElementById('tiktokFeedContainer');
    if(container) {
      container.style.transform = `translateY(-${currentVideoIndex * 100}%)`;
    }
  }

  function buscarVideos() {
    const query = document.getElementById('videoSearchInput').value.trim().toLowerCase();
    const container = document.getElementById('searchResultsContainer');
    
    if(!query) {
      container.style.display = 'none';
      return;
    }

    let coincidencias = listaVideos.filter(v => v.caption.toLowerCase().includes(query) || v.author.toLowerCase().includes(query));
    
    if(coincidencias.length === 0) {
      container.innerHTML = '<div class="result-item" style="color:gray; cursor:default;">Sin resultados</div>';
    } else {
      container.innerHTML = '';
      coincidencias.forEach(video => {
        container.innerHTML += `
          <div class="result-item" onclick="saltarAlVideo(${video.id}); ocultarBuscador();">
            <strong>@${video.author}</strong>
            <span>${video.caption}</span>
          </div>`;
      });
    }
    container.style.display = 'block';
  }

  function ocultarBuscador() {
    document.getElementById('searchResultsContainer').style.display = 'none';
    document.getElementById('videoSearchInput').value = '';
  }

  function saltarAlVideo(idVideo) {
    cambiarPestana('tiktok');
    let targetIndex = listaVideos.findIndex(v => v.id === idVideo);
    if(targetIndex !== -1) {
      currentVideoIndex = targetIndex;
      actualizarDesplazamientoVertical();
    }
  }

  function abrirModalCompartir(videoId) {
    videoIdParaCompartir = videoId;
    const list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    const container = document.getElementById('shareFriendsListContainer');
    
    if(list.length === 0) {
      container.innerHTML = '<p style="color:gray; font-size:0.9rem;">No tienes chats vinculados.</p>';
    } else {
      container.innerHTML = '';
      list.forEach(friendId => {
        container.innerHTML += `
          <div class="share-friend-item">
            <span>👤 ${friendId.replace('wave-','').toUpperCase()}</span>
            <button class="connect-btn" onclick="ejecutarCompartido('${friendId}')">Enviar</button>
          </div>`;
      });
    }
    document.getElementById('shareModal').style.display = 'flex';
  }

  function cerrarModalCompartir() { document.getElementById('shareModal').style.display = 'none'; }

  function ejecutarCompartido(destinoFriendId) {
    const videoObj = listaVideos.find(v => v.id === videoIdParaCompartir);
    if(!videoObj) return;

    activePeerId = destinoFriendId;
    if(!conn || conn.peer !== destinoFriendId) {
      conn = peer.connect(destinoFriendId);
      vincularEventos();
    }

    setTimeout(() => {
      enviarMensaje(`🎬 ¡Mira este WaveTok de @${videoObj.author}! "${videoObj.caption}"`, 'video-link', videoObj.id);
      cerrarModalCompartir();
      alert("¡Video compartido con éxito! 🚀");
    }, 400);
  }
</script>
</body>
</html>
