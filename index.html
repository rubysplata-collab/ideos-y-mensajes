<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Premium - Red Social Completa</title>
    <style>
        /* Estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        .phone-container { 
            width: 100%; 
            max-width: 410px; 
            height: 820px; 
            background: #000; 
            border: 10px solid #222; 
            border-radius: 40px; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); 
            display: flex; 
            flex-direction: column; 
        }

        /* Feed de Video */
        .video-feed { 
            position: relative;
            width: 100%; 
            height: calc(100% - 60px); 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .main-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .top-nav-tiktok {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 15;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        .top-nav-item { cursor: pointer; color: rgba(255,255,255,0.6); }
        .top-nav-item.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 4px; }

        /* Iconos Flotantes Derecha */
        .side-icons { 
            position: absolute; 
            right: 12px; 
            bottom: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            z-index: 10; 
        }
        
        .profile-wrapper { 
            position: relative; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
        }
        .profile-pic { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: 2px solid #fff; 
            object-fit: cover; 
        }
        .follow-btn-add { 
            position: absolute; 
            bottom: -5px; 
            left: 50%;
            transform: translateX(-50%);
            background: #fe2c55; 
            color: white; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            font-size: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 1.5px solid #000; 
        }

        .icon-btn { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
        }
        .icon-symbol { font-size: 28px; margin-bottom: 2px; }

        /* Info del Video */
        .video-info { 
            position: absolute; 
            left: 15px; 
            bottom: 30px; 
            z-index: 10; 
            max-width: 270px; 
        }
        .video-info h3 { font-size: 16px; margin-bottom: 4px; font-weight: bold; cursor: pointer; display: inline-block; }
        .follow-text-indicator { background: rgba(254, 44, 85, 0.9); font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: bold; vertical-align: middle; }
        .video-info p { font-size: 14px; line-height: 1.3; margin-bottom: 8px;}
        .video-filter-tag { background: #25f4ee; color: black; font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 3px; display: inline-block; margin-bottom: 5px; }

        /* BANDEJA DESLIZABLE MULTIUSOS (Comentarios, Chats, Notificaciones) */
        .inbox-panel {
            position: absolute;
            bottom: 60px; 
            left: 0;
            width: 100%;
            height: 480px;
            background: rgba(20, 20, 20, 0.98);
            border-top: 1px solid #292929;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            backdrop-filter: blur(10px);
        }
        .inbox-panel.open { transform: translateY(0); }

        .inbox-tabs {
            display: flex;
            background: #161616;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .inbox-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #8a8b91;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .inbox-tab.active {
            color: white;
            border-bottom-color: #fe2c55;
        }

        .tab-content { display: none; flex-grow: 1; flex-direction: column; padding: 15px; overflow-y: hidden; }
        .tab-content.active { display: flex; }

        .scrollable-list { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; font-size: 13px; }

        /* Mensajes de Chat y Notificaciones */
        .msg { margin-bottom: 15px; display: flex; align-items: flex-start; gap: 10px; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-user { color: #8a8b91; font-weight: bold; font-size: 11px; }
        .notification-item { padding: 10px; background: #1a1a1a; border-radius: 10px; margin-bottom: 8px; font-size: 12px; }

        /* Formulario de envío */
        .input-bar { display: flex; gap: 8px; align-items: center; }
        .input-bar input { flex-grow: 1; padding: 10px 15px; border-radius: 20px; border: none; background: #2b2b2b; color: white; font-size: 13px; }
        .btn-send { background: #fe2c55; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* MODAL DE PERSONALIZACIÓN DEL VIDEO (Antes de publicar) */
        .modal-custom {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
        }
        .modal-custom.open { display: flex; }
        .modal-custom h2 { margin-bottom: 20px; text-align: center; font-size: 20px; color: #fe2c55; }
        .modal-custom label { font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .modal-custom input, .modal-custom select { 
            padding: 12px; background: #222; border: 1px solid #333; color: white; border-radius: 10px; margin-bottom: 15px; 
        }
        .modal-custom-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-block { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #333; color: white; }
        .btn-publish { background: #fe2c55; color: white; }

        /* Perfil de Usuario */
        .profile-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 60px);
            background: #111;
            z-index: 60;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .profile-modal.open { display: flex; }
        .profile-header-big { text-align: center; margin-bottom: 20px; }
        .profile-pic-big { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #fe2c55; object-fit: cover; margin-bottom: 10px; }
        .followers-stats { display: flex; gap: 30px; margin: 15px 0; font-size: 14px; }
        .stat-item { text-align: center; }
        .stat-val { font-weight: bold; font-size: 18px; display: block; }
        .btn-follow-main { background: #fe2c55; color: white; border: none; padding: 8px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-follow-main.following { background: #333; }

        /* Barra Inferior */
        .tiktok-nav { 
            background: #000; height: 60px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #161616; position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #8a8b91; cursor: pointer; }
        .nav-item.active { color: white; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        
        .plus-btn-container { position: relative; width: 45px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .plus-btn-background { position: absolute; width: 100%; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #25f4ee 0%, #fe2c55 100%); z-index: 1; }
        .plus-btn-foreground { position: absolute; width: 37px; height: 100%; border-radius: 8px; background: #fff; z-index: 2; display: flex; align-items: center; justify-content: center; color: black; font-size: 18px; font-weight: bold; }

        .nav-arrow { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; z-index: 15; font-weight: bold; }
        .nav-arrow-up { top: 70px; }
        .nav-arrow-down { bottom: 80px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion, arrayRemove, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBB3UvcGKDXdiCo3cX4nKiDVdFR31d4ytA",
            authDomain: "mensajes-tiktokk.firebaseapp.com",
            projectId: "mensajes-tiktokk",
            storageBucket: "mensajes-tiktokk.firebasestorage.app",
            messagingSenderId: "1079940811085",
            appId: "1:1079940811085:web:6ab00b6476ef4d85908f04"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables Globales de Usuario
        let miUsuario = localStorage.getItem('nombreUsuario') || "@usuario_" + Math.floor(Math.random()*9000 + 1000);
        let miAvatar = localStorage.getItem('avatarBase64') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";
        localStorage.setItem('nombreUsuario', miUsuario);

        let videosGlobales = [];
        let indiceVideoActual = 0;
        let archivoVideoSeleccionado = null;

        // Registrar perfil en Firestore para followers
        async function registrarPerfilEnBD() {
            const userRef = doc(db, "usuarios_perfil", miUsuario);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    usuario: miUsuario,
                    avatar: miAvatar,
                    seguidores: [],
                    siguiendo: []
                });
            }
        }
        registrarPerfilEnBD();

        // --- SISTEMA DE VIDEOS ---
        const videosCol = collection(db, "videos");
        const qVideos = query(videosCol, orderBy("fecha", "desc"));

        onSnapshot(qVideos, (snapshot) => {
            videosGlobales = [];
            snapshot.forEach((doc) => {
                videosGlobales.push({ id: doc.id, ...doc.data() });
            });
            if (videosGlobales.length > 0) {
                mostrarVideoActual();
            }
        });

        async function mostrarVideoActual() {
            const videoData = videosGlobales[indiceVideoActual];
            const videoElement = document.getElementById('reproductorVideo');

            videoElement.pause();
            videoElement.src = videoData.videoUrl;
            videoElement.load();
            videoElement.play().catch(() => {});

            // Cargar filtros del video (Personalización)
            videoElement.style.filter = videoData.filtro || "none";

            document.getElementById('autorVideo').innerText = videoData.usuario;
            document.getElementById('descVideo').innerText = videoData.descripcion;
            document.getElementById('numComentarios').innerText = videoData.comentarios ? videoData.comentarios.length : 0;
            
            // Filtro tag
            const filterTag = document.getElementById('filterTag');
            if (videoData.filtroName && videoData.filtroName !== "Normal") {
                filterTag.innerText = `Filtro: ${videoData.filtroName}`;
                filterTag.style.display = "inline-block";
            } else {
                filterTag.style.display = "none";
            }

            // Likes Reales
            const listaLikes = videoData.likes || [];
            document.getElementById('numLikes').innerText = listaLikes.length;
            const corazon = document.getElementById('iconLike');
            if (listaLikes.includes(miUsuario)) {
                corazon.innerText = "❤️";
                corazon.style.color = "#fe2c55";
            } else {
                corazon.innerText = "🤍";
                corazon.style.color = "white";
            }

            // Validar Seguidor
            const creadorRef = doc(db, "usuarios_perfil", videoData.usuario);
            const creadorSnap = await getDoc(creadorRef);
            const badgeSeguir = document.getElementById('badgeSeguir');
            const seguirIndicador = document.getElementById('seguirIndicador');
            
            if (creadorSnap.exists() && creadorSnap.data().seguidores.includes(miUsuario)) {
                badgeSeguir.style.display = "none";
                seguirIndicador.style.display = "inline-block";
            } else {
                badgeSeguir.style.display = "flex";
                seguirIndicador.style.display = "none";
            }

            renderizarComentarios(videoData.comentarios || []);
            actualizarNotificaciones();
        }

        // --- ACCIONES DE VIDEOS ---
        window.darLike = async function() {
            const videoActual = videosGlobales[indiceVideoActual];
            if (!videoActual) return;

            const videoDocRef = doc(db, "videos", videoActual.id);
            const listaLikes = videoActual.likes || [];

            if (listaLikes.includes(miUsuario)) {
                await updateDoc(videoDocRef, {
                    likes: arrayRemove(miUsuario)
                });
            } else {
                await updateDoc(videoDocRef, {
                    likes: arrayUnion(miUsuario)
                });
                // Notificar en la base de datos (simulado en el mismo doc agregando un historial)
                await updateDoc(videoDocRef, {
                    notificaciones: arrayUnion({
                        tipo: "like",
                        de: miUsuario,
                        fecha: Date.now()
                    })
                });
            }
        }

        // --- SISTEMA DE COMENTARIOS ---
        function renderizarComentarios(comentarios) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = "";
            comentarios.forEach(c => {
                chatBox.innerHTML += `
                    <div class="msg">
                        <img src="${c.avatar}" class="msg-avatar">
                        <div class="msg-content">
                            <span class="msg-user">${c.autor}</span>
                            <span class="msg-text">${c.texto}</span>
                        </div>
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.enviarComentario = async function() {
            const input = document.getElementById('inputComentario');
            const texto = input.value.trim();
            if (!texto) return;

            const videoActual = videosGlobales[indiceVideoActual];
            const videoDocRef = doc(db, "videos", videoActual.id);

            await updateDoc(videoDocRef, {
                comentarios: arrayUnion({
                    autor: miUsuario,
                    avatar: miAvatar,
                    texto: texto,
                    fecha: Date.now()
                })
            });
            input.value = "";
        }

        // --- SEGUIDORES REALES ---
        window.seguirCreador = async function() {
            const videoActual = videosGlobales[indiceVideoActual];
            if (!videoActual || videoActual.usuario === miUsuario) return;

            const miRef = doc(db, "usuarios_perfil", miUsuario);
            const creadorRef = doc(db, "usuarios_perfil", videoActual.usuario);

            await updateDoc(creadorRef, {
                seguidores: arrayUnion(miUsuario)
            });
            await updateDoc(miRef, {
                siguiendo: arrayUnion(videoActual.usuario)
            });

            // Notificación del follow
            await updateDoc(creadorRef, {
                notificacionesSeguidores: arrayUnion({
                    tipo: "follow",
                    de: miUsuario,
                    fecha: Date.now()
                })
            });

            mostrarVideoActual();
        }

        // --- MENSAJERÍA PRIVADA ---
        const chatsCol = collection(db, "chats_privados");
        const qChats = query(chatsCol, orderBy("fecha", "asc"));

        onSnapshot(qChats, (snapshot) => {
            const listaChats = document.getElementById('listaChats');
            listaChats.innerHTML = "";
            snapshot.forEach((doc) => {
                const mensaje = doc.data();
                // Filtrar para mostrar solo mensajes donde yo sea emisor o receptor
                if (mensaje.de === miUsuario || mensaje.para === miUsuario || mensaje.para === "todos") {
                    listaChats.innerHTML += `
                        <div class="msg">
                            <div class="msg-content">
                                <span class="msg-user">${mensaje.de} ➡️ ${mensaje.para}</span>
                                <span class="msg-text">${mensaje.texto}</span>
                            </div>
                        </div>
                    `;
                }
            });
            listaChats.scrollTop = listaChats.scrollHeight;
        });

        window.enviarMensajePrivado = async function() {
            const inputPara = document.getElementById('chatDestinatario');
            const inputTexto = document.getElementById('chatMensaje');
            const para = inputPara.value.trim() || "todos";
            const texto = inputTexto.value.trim();

            if (!texto) return;

            await addDoc(chatsCol, {
                de: miUsuario,
                para: para,
                texto: texto,
                fecha: Date.now()
            });

            inputTexto.value = "";
        }

        // --- BANDEJA DE ACTIVIDAD (QUIÉN DIO LIKE Y SEGUIDORES) ---
        function actualizarNotificaciones() {
            const listaNotif = document.getElementById('listaNotif');
            listaNotif.innerHTML = "";

            const videoActual = videosGlobales[indiceVideoActual];
            if (!videoActual) return;

            // Mostrar Likes de este video
            if (videoActual.usuario === miUsuario && videoActual.likes) {
                videoActual.likes.forEach(userLike => {
                    listaNotif.innerHTML += `
                        <div class="notification-item">
                            ❤️ <b>${userLike}</b> le dio me gusta a tu video.
                        </div>
                    `;
                });
            }

            if (listaNotif.innerHTML === "") {
                listaNotif.innerHTML = "<div style='text-align:center; color:#aaa; margin-top:30px;'>No tienes notificaciones aún en este video.</div>";
            }
        }

        // --- SUBIDA DE VIDEO CON PERSONALIZACIÓN ---
        window.abrirPersonalizacion = function(input) {
            const file = input.files[0];
            if (!file) return;
            archivoVideoSeleccionado = file;
            document.getElementById('modalCustom').classList.add('open');
        }

        window.cerrarPersonalizacion = function() {
            document.getElementById('modalCustom').classList.remove('open');
        }

        window.publicarVideoPersonalizado = async function() {
            const descripcion = document.getElementById('inputDesc').value.trim() || "Mi video personalizado ✨";
            const filtro = document.getElementById('selectFiltro').value;
            const selectElement = document.getElementById('selectFiltro');
            const filtroName = selectElement.options[selectElement.selectedIndex].text;

            cerrarPersonalizacion();
            document.getElementById('descVideo').innerText = "Subiendo tu video personalizado a la nube...";

            const formData = new FormData();
            formData.append("file", archivoVideoSeleccionado);

            try {
                const response = await fetch("https://tmpfiles.org/api/v1/upload", {
                    method: "POST",
                    body: formData
                });
                const resData = await response.json();
                if (resData.status === "success") {
                    const urlDirecta = resData.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                    
                    await addDoc(videosCol, {
                        usuario: miUsuario,
                        creadorAvatar: miAvatar,
                        videoUrl: urlDirecta,
                        descripcion: descripcion,
                        filtro: filtro,
                        filtroName: filtroName,
                        fecha: Date.now(),
                        comentarios: [],
                        likes: []
                    });

                    alert("¡Video personalizado publicado para todos!");
                    indiceVideoActual = 0;
                }
            } catch (err) {
                alert("Error de subida.");
            }
        }

        // --- PERFIL CON SEGUIDORES REALES ---
        window.abrirMiPerfil = async function() {
            const modal = document.getElementById('profileModal');
            modal.classList.add('open');
            document.getElementById('pNombreUser').innerText = miUsuario;
            document.getElementById('pAvatarImg').src = miAvatar;

            const userRef = doc(db, "usuarios_perfil", miUsuario);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists()) {
                const data = userSnap.data();
                document.getElementById('statSeguidores').innerText = data.seguidores ? data.seguidores.length : 0;
                document.getElementById('statSiguiendo').innerText = data.siguiendo ? data.siguiendo.length : 0;
            }
        }

        window.cerrarPerfil = function() {
            document.getElementById('profileModal').classList.remove('open');
        }

        window.cambiarDatosPerfil = async function() {
            const nuevoUser = prompt("Nuevo nombre de usuario (ej. @tu_nombre):", miUsuario);
            if (nuevoUser && nuevoUser.trim() !== "") {
                const filtrado = nuevoUser.trim().startsWith('@') ? nuevoUser.trim() : '@' + nuevoUser.trim();
                
                // Actualizar local y base de datos
                const antiguoUser = miUsuario;
                miUsuario = filtrado;
                localStorage.setItem('nombreUsuario', miUsuario);
                
                await registrarPerfilEnBD();
                alert("Perfil actualizado correctamente.");
                location.reload();
            }
        }

        // Navegación
        window.siguienteVideo = function() {
            if (indiceVideoActual < videosGlobales.length - 1) {
                indiceVideoActual++;
                mostrarVideoActual();
            }
        }
        window.anteriorVideo = function() {
            if (indiceVideoActual > 0) {
                indiceVideoActual--;
                mostrarVideoActual();
            }
        }
    </script>
</head>
<body>

    <div class="phone-container">
        
        <div class="top-nav-tiktok">
            <span class="top-nav-item">Siguiendo</span>
            <span class="top-nav-item active">Para ti</span>
        </div>

        <button class="nav-arrow nav-arrow-up" onclick="anteriorVideo()">▲ Anterior</button>
        <button class="nav-arrow nav-arrow-down" onclick="siguienteVideo()">▼ Siguiente</button>

        <div class="video-feed" onclick="document.getElementById('reproductorVideo').paused ? document.getElementById('reproductorVideo').play() : document.getElementById('reproductorVideo').pause()">
            <video id="reproductorVideo" class="main-video" loop autoplay muted playsinline></video>

            <div class="video-info" onclick="event.stopPropagation()">
                <span class="video-filter-tag" id="filterTag" style="display:none;"></span><br>
                <h3 id="autorVideo">@usuario</h3>
                <span id="seguirIndicador" class="follow-text-indicator" style="display:none;">Siguiendo</span>
                <p id="descVideo">Cargando...</p>
                <div style="font-size: 13px;">🎵 Sonido Original de la comunidad</div>
            </div>

            <div class="side-icons" onclick="event.stopPropagation()">
                <div class="profile-wrapper" onclick="seguirCreador()">
                    <img id="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="profile-pic">
                    <div class="follow-btn-add" id="badgeSeguir">+</div>
                </div>

                <div class="icon-btn" onclick="darLike()">
                    <span class="icon-symbol" id="iconLike">🤍</span>
                    <span id="numLikes">0</span>
                </div>

                <div class="icon-btn" onclick="abrirInbox('comentarios')">
                    <span class="icon-symbol">💬</span>
                    <span id="numComentarios">0</span>
                </div>

                <div class="icon-btn" onclick="abrirInbox('chat')">
                    <span class="icon-symbol">✉️</span>
                    <span>Chat</span>
                </div>
            </div>
        </div>

        <div class="modal-custom" id="modalCustom">
            <h2>Personalizar Video</h2>
            
            <label>Descripción del Video:</label>
            <input type="text" id="inputDesc" placeholder="Escribe algo divertido para tu video...">

            <label>Filtro de Cámara:</label>
            <select id="selectFiltro">
                <option value="none">Normal</option>
                <option value="grayscale(100%)">Blanco y Negro Clásico</option>
                <option value="sepia(80%)">Vintage Sepia</option>
                <option value="hue-rotate(90deg)">Psicodélico Neón</option>
                <option value="brightness(150%)">Súper Brillo</option>
            </select>

            <div class="modal-custom-btns">
                <button class="btn-block btn-cancel" onclick="cerrarPersonalizacion()">Cancelar</button>
                <button class="btn-block btn-publish" onclick="publicarVideoPersonalizado()">Publicar 🚀</button>
            </div>
        </div>

        <div class="profile-modal" id="profileModal">
            <div style="width: 100%; display: flex; justify-content: flex-end;">
                <span style="font-size: 24px; cursor: pointer; color: #aaa;" onclick="cerrarPerfil()">✕</span>
            </div>
            <div class="profile-header-big">
                <img id="pAvatarImg" src="" class="profile-pic-big"><br>
                <h2 id="pNombreUser">@usuario</h2>
                <button class="btn-follow-main" onclick="cambiarDatosPerfil()">Editar Perfil ⚙️</button>
            </div>
            <div class="followers-stats">
                <div class="stat-item">
                    <span class="stat-val" id="statSiguiendo">0</span>
                    Siguiendo
                </div>
                <div class="stat-item">
                    <span class="stat-val" id="statSeguidores">0</span>
                    Seguidores
                </div>
            </div>
        </div>

        <div class="inbox-panel" id="inboxPanel">
            <div class="inbox-tabs">
                <div class="inbox-tab active" id="tabBtnComentarios" onclick="cambiarTab('comentarios')">Comentarios</div>
                <div class="inbox-tab" id="tabBtnChat" onclick="cambiarTab('chat')">Mensajes Privados</div>
                <div class="inbox-tab" id="tabBtnNotif" onclick="cambiarTab('notif')">Likes / Actividad</div>
            </div>

            <div class="tab-content active" id="contentComentarios">
                <div class="scrollable-list" id="chatBox"></div>
                <div class="input-bar">
                    <input type="text" id="inputComentario" placeholder="Escribe un comentario público...">
                    <button class="btn-send" onclick="enviarComentario()">➜</button>
                </div>
            </div>

            <div class="tab-content" id="contentChat">
                <div style="display: flex; gap: 5px; margin-bottom: 8px;">
                    <span style="font-size: 11px; color:#aaa; align-self: center;">Para:</span>
                    <input type="text" id="chatDestinatario" placeholder="@usuario o escriba 'todos'" style="background:#222; border:none; padding:4px 8px; color:white; border-radius:5px; font-size:11px;">
                </div>
                <div class="scrollable-list" id="listaChats"></div>
                <div class="input-bar">
                    <input type="text" id="chatMensaje" placeholder="Escribe un mensaje privado...">
                    <button class="btn-send" onclick="enviarMensajePrivado()">➜</button>
                </div>
            </div>

            <div class="tab-content" id="contentNotif">
                <div class="scrollable-list" id="listaNotif"></div>
            </div>
            
            <div style="text-align: center; padding: 10px; background: #161616;">
                <span style="font-size: 11px; color: #8a8b91; cursor: pointer;" onclick="toggleInbox()">Cerrar Bandeja</span>
            </div>
        </div>

        <input type="file" id="subirVideoLocal" accept="video/*" style="display:none;" onchange="abrirPersonalizacion(this)">

        <div class="tiktok-nav">
            <div class="nav-item active" onclick="cerrarPerfil()">
                <span class="nav-icon">🏠</span>
                <span>Inicio</span>
            </div>
            <div class="nav-item" onclick="abrirInbox('chat')">
                <span class="nav-icon">✉️</span>
                <span>Mensajes</span>
            </div>
            <div class="nav-item" onclick="document.getElementById('subirVideoLocal').click()">
                <div class="plus-btn-container">
                    <div class="plus-btn-background"></div>
                    <div class="plus-btn-foreground">+</div>
                </div>
            </div>
            <div class="nav-item" onclick="abrirInbox('notif')">
                <span class="nav-icon">📥</span>
                <span>Bandeja</span>
            </div>
            <div class="nav-item" onclick="abrirMiPerfil()">
                <span class="nav-icon">👤</span>
                <span>Perfil</span>
            </div>
        </div>

    </div>

    <script>
        function abrirInbox(tabDefecto) {
            document.getElementById('inboxPanel').classList.add('open');
            cambiarTab(tabDefecto);
        }

        function toggleInbox() {
            document.getElementById('inboxPanel').classList.remove('open');
        }

        function cambiarTab(tabName) {
            // Desactivar todas las pestañas y contenidos
            document.querySelectorAll('.inbox-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            if (tabName === 'comentarios') {
                document.getElementById('tabBtnComentarios').classList.add('active');
                document.getElementById('contentComentarios').classList.add('active');
            } else if (tabName === 'chat') {
                document.getElementById('tabBtnChat').classList.add('active');
                document.getElementById('contentChat').classList.add('active');
            } else if (tabName === 'notif') {
                document.getElementById('tabBtnNotif').classList.add('active');
                document.getElementById('contentNotif').classList.add('active');
            }
        }
    </script>
</body>
</html>
