<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat - Tu Espacio de Mensajería</title>
  <style>
    /* --- Paleta de Colores Exclusiva --- */
    :root {
      --bg-principal: #0b0e14;
      --bg-tarjeta: #151d26;
      --verde-neon: #00e676;
      --verde-oscuro: #054735;
      --texto-blanco: #f5f5f7;
      --texto-mutado: #8b9bb4;
      --burbuja-enviado: #056162;
      --burbuja-recibido: #1f2c34;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-blanco);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- Contenedor Principal (Simulación de Móvil) --- */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background-color: var(--bg-tarjeta);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    /* --- PANTALLAS PRINCIPALES --- */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* --- CABECERA ESTILO WAVECHAT --- */
    .app-header {
      padding: 15px 20px;
      background-color: #1f2c34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .app-header h2 {
      font-size: 1.3rem;
      color: var(--verde-neon);
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 15px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* --- SECCIÓN DE ESTADOS / HISTORIAS --- */
    .stories-container {
      padding: 15px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      background-color: #121b22;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .stories-container::-webkit-scrollbar {
      display: none; /* Ocultar scrollbar */
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: var(--texto-mutado);
      min-width: 60px;
      cursor: pointer;
    }

    .story-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--verde-neon);
      padding: 2px;
      background-color: var(--bg-tarjeta);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }

    .story-item.my-story .story-avatar {
      border: 2px dashed var(--texto-mutado);
    }

    /* --- LISTA DE CHATS --- */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      background-color: #121b22;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .chat-item:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-info {
      flex: 1;
    }

    .chat-info-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .chat-info-top h4 {
      font-size: 1rem;
      font-weight: 600;
    }

    .chat-time {
      font-size: 0.75rem;
      color: var(--texto-mutado);
    }

    .chat-preview {
      font-size: 0.85rem;
      color: var(--texto-mutado);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    /* --- CHAT ACTIVO --- */
    .chat-active-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0b141a;
      background-image: radial-gradient(rgba(0, 230, 118, 0.03) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .chat-active-header {
      padding: 12px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      position: relative;
    }

    .message-bubble.sent {
      background-color: var(--burbuja-enviado);
      align-self: flex-end;
      border-top-right-radius: 0px;
    }

    .message-bubble.received {
      background-color: var(--burbuja-recibido);
      align-self: flex-start;
      border-top-left-radius: 0px;
    }

    .message-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 5px;
      display: block;
    }

    /* Entrada de Mensaje */
    .chat-input-bar {
      padding: 10px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
      font-size: 0.9rem;
    }

    .chat-input:focus {
      border-color: var(--verde-neon);
    }

    .icon-btn {
      font-size: 1.3rem;
      color: var(--verde-neon);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* --- PANTALLA AJUSTES / PERFIL --- */
    .profile-screen {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: #121b22;
      height: 100%;
    }

    .profile-avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--verde-neon), var(--verde-oscuro));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      border: 3px solid rgba(255, 255, 255, 0.1);
    }

    .profile-field {
      width: 100%;
      background-color: #1f2c34;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .profile-field label {
      font-size: 0.75rem;
      color: var(--verde-neon);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-field input {
      background: none;
      border: none;
      color: white;
      font-size: 1rem;
      outline: none;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 5px;
    }

    .profile-field input:focus {
      border-bottom-color: var(--verde-neon);
    }

    /* --- BARRA DE NAVEGACIÓN --- */
    .app-nav {
      height: 70px;
      background-color: #1f2c34;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .nav-btn {
      color: var(--texto-mutado);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-btn.active {
      color: var(--verde-neon);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="screen active" id="chatsScreen">
      <header class="app-header">
        <h2>WaveChat</h2>
        <div class="header-actions">
          <span onclick="alert('Buscando...')">🔍</span>
          <span onclick="changeTab('profile')">⚙️</span>
        </div>
      </header>

      <div class="stories-container">
        <div class="story-item my-story">
          <div class="story-avatar">Mi</div>
          <span>Mi Estado</span>
        </div>
        <div class="story-item" onclick="alert('Viendo estado de Fer')">
          <div class="story-avatar" style="border-color: #e91e63;">F</div>
          <span>Fer ✨</span>
        </div>
        <div class="story-item" onclick="alert('Viendo estado de Lucas')">
          <div class="story-avatar" style="border-color: #00bcd4;">L</div>
          <span>Lucas</span>
        </div>
      </div>

      <div class="chat-list">
        <div class="chat-item" onclick="abrirChat('Fer ✨', 'F', '#e91e63', '¿Viste el nuevo video que subí?')">
          <div class="chat-avatar" style="background-color: #e91e63;">F</div>
          <div class="chat-info">
            <div class="chat-info-top">
              <h4>Fer ✨</h4>
              <span class="chat-time">12:30 PM</span>
            </div>
            <p class="chat-preview">¿Viste el nuevo video que subí?</p>
          </div>
        </div>

        <div class="chat-item" onclick="abrirChat('Lucas', 'L', '#00bcd4', 'Dale, nos vemos al rato 🚀')">
          <div class="chat-avatar" style="background-color: #00bcd4;">L</div>
          <div class="chat-info">
            <div class="chat-info-top">
              <h4>Lucas</h4>
              <span class="chat-time">Ayer</span>
            </div>
            <p class="chat-preview">Dale, nos vemos al rato 🚀</p>
          </div>
        </div>
      </div>
    </div>

    <div class="screen" id="activeChatScreen">
      <div class="chat-active-container">
        <header class="chat-active-header">
          <button class="back-btn" onclick="cerrarChat()">◀</button>
          <div class="chat-avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 1rem;">C</div>
          <div style="flex: 1;">
            <h4 id="activeContactName" style="font-size: 1rem;">Nombre</h4>
            <span style="font-size: 0.75rem; color: var(--verde-neon);">En línea</span>
          </div>
        </header>

        <div class="chat-messages-box" id="chatMessagesBox">
          <div class="message-bubble received" id="chatInitialMsg">¡Hola! ¿Cómo va el proyecto?</div>
        </div>

        <div class="chat-input-bar">
          <label class="icon-btn" title="Adjuntar foto">
            📷
            <input type="file" id="chatFileInput" accept="image/*" style="display: none;" onchange="enviarImagenChat()">
          </label>
          <input type="text" id="chatInputMessage" class="chat-input" placeholder="Escribe un mensaje...">
          <button class="icon-btn" onclick="enviarMensajeTexto()">➤</button>
        </div>
      </div>
    </div>

    <div class="screen" id="profileScreen">
      <header class="app-header">
        <h2>Ajustes de Perfil</h2>
      </header>
      <div class="profile-screen">
        <div class="profile-avatar-large" id="profileAvatarLarge">U</div>
        
        <div class="profile-field">
          <label>Tu Nombre</label>
          <input type="text" id="inputProfileName" value="Tu Usuario" oninput="actualizarPerfil()">
        </div>

        <div class="profile-field">
          <label>Info. Estado</label>
          <input type="text" id="inputProfileStatus" value="Disponible en WaveChat 🚀" oninput="actualizarPerfil()">
        </div>
      </div>
    </div>

    <nav class="app-nav" id="mainNavBar">
      <button class="nav-btn active" id="navChats" onclick="changeTab('chats')">💬<span>Chats</span></button>
      <button class="nav-btn" id="navProfile" onclick="changeTab('profile')">👤<span>Perfil</span></button>
    </nav>

  </div>

  <script>
    // --- NAVEGACIÓN ENTRE SECCIONES ---
    function changeTab(tab) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (tab === 'chats') {
        document.getElementById('chatsScreen').classList.add('active');
        document.getElementById('navChats').classList.add('active');
        document.getElementById('mainNavBar').style.display = 'flex';
      } else if (tab === 'profile') {
        document.getElementById('profileScreen').classList.add('active');
        document.getElementById('navProfile').classList.add('active');
        document.getElementById('mainNavBar').style.display = 'flex';
      }
    }

    // --- INTERACTIVIDAD DEL CHAT ---
    function abrirChat(nombre, inicial, color, primerMensaje) {
      // Ocultar la navegación principal dentro de un chat activo
      document.getElementById('mainNavBar').style.display = 'none';
      
      document.getElementById('chatsScreen').classList.remove('active');
      document.getElementById('activeChatScreen').classList.add('active');

      const avatar = document.getElementById('activeAvatar');
      avatar.innerText = inicial;
      avatar.style.backgroundColor = color;
      
      document.getElementById('activeContactName').innerText = nombre;
      
      // Limpiar y cargar mensaje inicial simulado
      const chatBox = document.getElementById('chatMessagesBox');
      chatBox.innerHTML = `<div class="message-bubble received">${primerMensaje}</div>`;
    }

    function cerrarChat() {
      document.getElementById('activeChatScreen').classList.remove('active');
      changeTab('chats');
    }

    function enviarMensajeTexto() {
      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatMessagesBox');
      
      // Agregar mensaje enviado
      chatBox.innerHTML += `<div class="message-bubble sent">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      // Respuesta automática de prueba para dinamismo
      setTimeout(() => {
        chatBox.innerHTML += `<div class="message-bubble received">¡Listo! Recibido correctamente. 👍</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);
    }

    function enviarImagenChat() {
      const fileInput = document.getElementById('chatFileInput');
      if (fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      const imageUrl = URL.createObjectURL(file);
      const chatBox = document.getElementById('chatMessagesBox');

      // Agregar burbuja con la imagen cargada de forma local
      chatBox.innerHTML += `
        <div class="message-bubble sent">
          <img src="${imageUrl}" class="message-img" alt="Imagen enviada">
        </div>
      `;

      fileInput.value = ""; // Limpiar input file
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Escuchar la tecla Enter en la barra de texto
    document.getElementById('chatInputMessage').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        enviarMensajeTexto();
      }
    });

    // --- LÓGICA DE PERFIL ---
    function actualizarPerfil() {
      const name = document.getElementById('inputProfileName').value;
      const avatarLarge = document.getElementById('profileAvatarLarge');
      
      if (name.trim() !== "") {
        avatarLarge.innerText = name.charAt(0).toUpperCase();
      }
    }
  </script>
</body>
</html>
