<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHEILER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff304f%22/><polygon points=%2238,28 78,50 38,72%22 fill=%22white%22/></svg>">

<link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22JHEILER%22,%22short_name%22:%22JHEILER%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f0f0f%22,%22theme_color%22:%22%23ff304f%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff304f'/><polygon points='38,28 78,50 38,72' fill='white'/></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22}]}"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Segoe UI",Roboto,sans-serif;
  background:#0f0f0f;
  color:#ffffff;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#0f0f0f;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;}

:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#212121;
  --accent:#ff304f;
  --border:#303030;
  --header-h:56px;
  --sidebar-w:240px;
}

#appHeader{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:200;border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:16px;}
.brand{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;}
.brand .play-ico{color:var(--accent);font-size:22px;}

.header-center{flex:1;display:flex;justify-content:center;max-width:600px;margin:0 16px;}
.search-form{
  display:flex;width:100%;align-items:center;
  border:1px solid var(--border);border-radius:20px 0 0 20px;
  background:var(--bg);height:40px;overflow:hidden;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:0 16px;font-size:15px;color:#fff;
}
.search-btn{
  width:60px;height:40px;background:var(--panel2);
  border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;
  display:flex;align-items:center;justify-content:center;
}

.header-right{display:flex;align-items:center;gap:10px;}
.create-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;background:var(--accent);
  font-size:14px;font-weight:600;color:#fff;
}
.install-btn{
  display:none;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--border);font-size:14px;font-weight:600;color:#fff;
}

#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg);padding-top:12px;border-right:1px solid var(--border);
}
.sb-section{padding:8px 0;border-bottom:1px solid var(--border);}
.sb-title{padding:8px 24px;font-size:12px;font-weight:600;color:#aaa;text-transform:uppercase;}
.sb-item{
  display:flex;align-items:center;gap:20px;
  padding:12px 24px;font-size:14px;color:#fff;cursor:pointer;
}
.sb-item:hover{background:#272727;}

#appBody{padding-top:var(--header-h);display:flex;min-height:100vh;}
#mainContent{flex:1;margin-left:var(--sidebar-w);padding:24px;min-width:0;}

.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px 16px;
}
.video-card{cursor:pointer;}
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--panel2);margin-bottom:10px;
}
.thumb-wrap img, .thumb-wrap video{width:100%;height:100%;object-fit:cover;}
.thumb-wrap .no-thumb{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#aaa;background:linear-gradient(135deg,#252525,#121212);
}
.card-meta{display:flex;gap:12px;}
.avatar-circle{
  width:36px;height:36px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.card-title{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;}
.card-channel{font-size:13px;color:#aaa;}

.player-container{max-width:900px;margin:0 auto;}
.video-player{width:100%;max-height:70vh;background:#000;border-radius:12px;margin-bottom:16px;}
.video-info-title{font-size:20px;font-weight:700;margin-bottom:12px;}

.action-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;gap:12px;
}
.channel-info{display:flex;align-items:center;gap:12px;}
.sub-btn{
  background:#fff;color:#000;padding:8px 16px;border-radius:20px;
  font-weight:600;font-size:14px;
}
.sub-btn.subscribed{background:var(--panel2);color:#fff;border:1px solid var(--border);}

.interaction-btns{display:flex;gap:10px;}
.like-btn{
  background:var(--panel2);padding:8px 16px;border-radius:20px;
  display:flex;align-items:center;gap:6px;font-size:14px;
}
.like-btn.liked{color:var(--accent);}

.video-info-desc{background:var(--panel2);padding:12px;border-radius:8px;font-size:14px;color:#ddd;margin-bottom:24px;}

.comments-section{margin-top:20px;}
.comments-section h3{margin-bottom:16px;font-size:18px;}
.comment-form{display:flex;gap:10px;margin-bottom:20px;}
.comment-form input{
  flex:1;background:var(--panel2);border:1px solid var(--border);
  border-radius:20px;padding:10px 16px;outline:none;
}
.comment-form button{
  background:var(--accent);color:#fff;padding:8px 18px;
  border-radius:20px;font-weight:600;
}
.comment-list{display:flex;flex-direction:column;gap:12px;}
.comment-item{background:var(--panel);padding:10px 14px;border-radius:10px;font-size:14px;}

.state-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;text-align:center;color:#aaa;gap:16px;
}
.state-box .icon{font-size:64px;}
.state-box h3{color:#fff;font-size:22px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-card{
  background:var(--panel);border-radius:16px;padding:24px;width:100%;max-width:500px;
  display:flex;flex-direction:column;gap:14px;border:1px solid var(--border);
}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:13px;color:#aaa;}
.modal-card input[type="text"], .modal-card textarea{
  width:100%;padding:12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;outline:none;font-size:14px;
}
.modal-card input[type="file"]{
  background:var(--panel2);padding:10px;border-radius:8px;border:1px dashed var(--border);
  font-size:13px;color:#ccc;cursor:pointer;
}
.modal-card textarea{height:70px;resize:none;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
.btn-sec{padding:10px 18px;background:var(--panel2);border-radius:8px;}
.btn-pri{padding:10px 18px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;}
.btn-pri:disabled{opacity:0.5;cursor:not-allowed;}

#toastContainer{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:1100;display:flex;flex-direction:column;gap:8px;
}
.toast{background:#2a2a2a;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;}
.toast.error{background:#a31c1c;}
.toast.success{background:#1e7e34;}
</style>
</head>
<body>

<header id="appHeader">
  <div class="header-left">
    <a href="#/home" class="brand"><span class="play-ico">▶</span> JHEILER</a>
  </div>

  <div class="header-center">
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Buscar">
    </form>
    <button class="search-btn" id="searchBtn">🔍</button>
  </div>

  <div class="header-right">
    <button class="install-btn" id="btnInstallApp">📥 Instalar App</button>
    <button class="create-btn" id="btnCreate">➕ <span>Crear</span></button>
  </div>
</header>

<nav id="sidebar">
  <div class="sb-section">
    <a class="sb-item" href="#/home"><span>🏠</span><span>Inicio</span></a>
    <a class="sb-item" href="#/shorts"><span>⚡</span><span>Shorts</span></a>
    <a class="sb-item" href="#/subscriptions"><span>📺</span><span>Suscripciones</span></a>
  </div>
  <div class="sb-section">
    <div class="sb-title">Biblioteca</div>
    <a class="sb-item" href="#/history"><span>🕒</span><span>Historial</span></a>
    <a class="sb-item" href="#/your-videos"><span>🎬</span><span>Tus videos</span></a>
  </div>
</nav>

<div id="appBody">
  <div id="mainContent"></div>
</div>

<div id="toastContainer"></div>

<script>
const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let localLikes = JSON.parse(localStorage.getItem('jheiler_likes') || '{}');
let isSubscribed = localStorage.getItem('jheiler_sub') === 'true';
let localComments = JSON.parse(localStorage.getItem('jheiler_comments') || '{}');
let deferredPrompt;

// PWA Instalación
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btnInstall = document.getElementById('btnInstallApp');
  if (btnInstall) btnInstall.style.display = 'flex';
});

document.getElementById('btnInstallApp')?.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      showToast('¡Gracias por instalar la App!', 'success');
    }
    deferredPrompt = null;
    document.getElementById('btnInstallApp').style.display = 'none';
  }
});

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function cleanFileName(fileName) {
  return fileName
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9.-]/g, "_");
}

async function renderPage() {
  const main = document.getElementById('mainContent');
  if (!main) return;

  const hash = window.location.hash || '#/home';

  if (['#/shorts', '#/subscriptions', '#/history', '#/your-videos'].includes(hash)) {
    const titles = {
      '#/shorts': '⚡ Shorts',
      '#/subscriptions': '📺 Suscripciones',
      '#/history': '🕒 Historial',
      '#/your-videos': '🎬 Tus videos'
    };
    main.innerHTML = `
      <div class="state-box">
        <div class="icon">🚧</div>
        <h3>Sección de ${titles[hash]}</h3>
        <p>Esta pestaña estará disponible próximamente.</p>
      </div>`;
    return;
  }

  if (hash.startsWith('#/watch')) {
    const urlParams = new URLSearchParams(hash.split('?')[1]);
    const videoId = urlParams.get('v');

    if (!videoId) {
      main.innerHTML = `<div class="state-box"><h3>Video no encontrado</h3></div>`;
      return;
    }

    const { data: v, error } = await sb.from('videos').select('*').eq('id', videoId).single();

    if (error || !v) {
      main.innerHTML = `<div class="state-box"><h3>Error al cargar el video</h3></div>`;
      return;
    }

    const likesCount = localLikes[videoId] ? 1 : 0;
    const comments = localComments[videoId] || [];

    main.innerHTML = `
      <div class="player-container">
        <video class="video-player" controls autoplay src="${v.video_url}"></video>
        <div class="video-info-title">${v.title}</div>
        
        <div class="action-bar">
          <div class="channel-info">
            <div class="avatar-circle">J</div>
            <div>
              <strong style="display:block;">JHEILER</strong>
            </div>
            <button class="sub-btn ${isSubscribed ? 'subscribed' : ''}" id="btnSub">
              ${isSubscribed ? 'Suscrito' : 'Suscribirse'}
            </button>
          </div>

          <div class="interaction-btns">
            <button class="like-btn ${localLikes[videoId] ? 'liked' : ''}" id="btnLike">
              👍 <span id="likeCount">${likesCount}</span>
            </button>
          </div>
        </div>

        <div class="video-info-desc">${v.description || 'Sin descripción.'}</div>

        <div class="comments-section">
          <h3>Comentarios (${comments.length})</h3>
          <div class="comment-form">
            <input type="text" id="commentInput" placeholder="Añade un comentario...">
            <button id="btnComment">Comentar</button>
          </div>
          <div class="comment-list" id="commentList">
            ${comments.map(c => `<div class="comment-item">${c}</div>`).join('')}
          </div>
        </div>
      </div>
    `;

    document.getElementById('btnSub')?.addEventListener('click', () => {
      isSubscribed = !isSubscribed;
      localStorage.setItem('jheiler_sub', isSubscribed);
      renderPage();
      showToast(isSubscribed ? '¡Te has suscrito!' : 'Suscripción cancelada');
    });

    document.getElementById('btnLike')?.addEventListener('click', () => {
      localLikes[videoId] = !localLikes[videoId];
      localStorage.setItem('jheiler_likes', JSON.stringify(localLikes));
      renderPage();
    });

    document.getElementById('btnComment')?.addEventListener('click', () => {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (text) {
        if (!localComments[videoId]) localComments[videoId] = [];
        localComments[videoId].push(text);
        localStorage.setItem('jheiler_comments', JSON.stringify(localComments));
        input.value = '';
        renderPage();
      }
    });

    return;
  }

  try {
    const searchQuery = new URLSearchParams(hash.split('?')[1]).get('q') || '';
    
    let query = sb.from('videos').select('*').order('created_at', { ascending: false });
    
    if (searchQuery) {
      query = query.ilike('title', `%${searchQuery}%`);
    }

    const { data: videos, error } = await query;

    if (error) {
      main.innerHTML = `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <h3>Error al conectar con la base de datos</h3>
          <p>${error.message}</p>
        </div>`;
      return;
    }

    if (!videos || videos.length === 0) {
      main.innerHTML = `
        <div class="state-box">
          <div class="icon">🎬</div>
          <h3>${searchQuery ? 'No se encontraron resultados' : 'No hay videos aún'}</h3>
          <p>${searchQuery ? `No hay videos que coincidan con "${searchQuery}"` : 'Haz clic en el botón <b>➕ Crear</b> arriba para publicar tu primer video.'}</p>
        </div>`;
      return;
    }

    main.innerHTML = `
      <div class="video-grid">
        ${videos.map(v => `
          <div class="video-card" onclick="window.location.hash='#/watch?v=${v.id}'">
            <div class="thumb-wrap">
              ${v.thumbnail_url 
                ? `<img src="${v.thumbnail_url}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="no-thumb" style="display:none;">▶</div>` 
                : '<div class="no-thumb">▶</div>'}
            </div>
            <div class="card-meta">
              <div class="avatar-circle">J</div>
              <div>
                <div class="card-title">${v.title}</div>
                <div class="card-channel">JHEILER</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch (err) {
    console.error(err);
  }
}

function executeSearch() {
  const term = document.getElementById('searchInput').value.trim();
  if (term) {
    window.location.hash = `#/search?q=${encodeURIComponent(term)}`;
  } else {
    window.location.hash = '#/home';
  }
}

document.getElementById('searchForm')?.addEventListener('submit', (e) => {
  e.preventDefault();
  executeSearch();
});
document.getElementById('searchBtn')?.addEventListener('click', executeSearch);

document.getElementById('btnCreate')?.addEventListener('click', () => {
  const existingModal = document.getElementById('uploadModal');
  if (existingModal) existingModal.remove();

  const modalHTML = `
    <div id="uploadModal" class="modal-backdrop">
      <div class="modal-card">
        <h2>Subir nuevo video</h2>
        
        <div class="form-group">
          <label>Título del video *</label>
          <input type="text" id="upTitle" placeholder="Ej: Mi video de Roblox">
        </div>

        <div class="form-group">
          <label>Archivo de Video (MP4, WEBM, MOV) *</label>
          <input type="file" id="upVideoFile" accept="video/*">
        </div>

        <div class="form-group">
          <label>Miniatura / Imagen (Opcional)</label>
          <input type="file" id="upThumbFile" accept="image/*">
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea id="upDesc" placeholder="Escribe algo sobre tu video..."></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn-sec" id="btnCancel">Cancelar</button>
          <button class="btn-pri" id="btnSaveVideo">Publicar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHTML);

  document.getElementById('btnCancel')?.addEventListener('click', () => {
    document.getElementById('uploadModal').remove();
  });

  document.getElementById('btnSaveVideo')?.addEventListener('click', async () => {
    const title = document.getElementById('upTitle').value.trim();
    const videoFileInput = document.getElementById('upVideoFile');
    const thumbFileInput = document.getElementById('upThumbFile');
    const description = document.getElementById('upDesc').value.trim();

    const videoFile = videoFileInput.files[0];
    const thumbFile = thumbFileInput.files[0];

    if (!title || !videoFile) {
      showToast('Por favor escribe un título y selecciona un archivo de video.', 'error');
      return;
    }

    const btnSave = document.getElementById('btnSaveVideo');
    btnSave.disabled = true;
    btnSave.textContent = 'Subiendo...';

    try {
      showToast('Subiendo archivo de video...', 'info');
      const videoFileName = `${Date.now()}_${cleanFileName(videoFile.name)}`;
      
      const { error: vErr } = await sb.storage
        .from('videos')
        .upload(videoFileName, videoFile);

      if (vErr) throw new Error('Error en Storage (videos): ' + vErr.message);

      const videoUrlData = sb.storage.from('videos').getPublicUrl(videoFileName);
      const video_url = videoUrlData.data.publicUrl;

      let thumbnail_url = null;
      if (thumbFile) {
        showToast('Subiendo miniatura...', 'info');
        const thumbFileName = `${Date.now()}_${cleanFileName(thumbFile.name)}`;
        const { error: tErr } = await sb.storage
          .from('thumbnails')
          .upload(thumbFileName, thumbFile);

        if (!tErr) {
          const thumbUrlData = sb.storage.from('thumbnails').getPublicUrl(thumbFileName);
          thumbnail_url = thumbUrlData.data.publicUrl;
        }
      }

      const { error: dbErr } = await sb.from('videos').insert([
        { title, video_url, thumbnail_url, description }
      ]);

      if (dbErr) throw new Error('Error en la Tabla videos: ' + dbErr.message);

      showToast('¡Video publicado con éxito!', 'success');
      document.getElementById('uploadModal').remove();
      window.location.hash = '#/home';
      renderPage();

    } catch (err) {
      console.error(err);
      showToast(err.message, 'error');
      btnSave.disabled = false;
      btnSave.textContent = 'Publicar';
    }
  });
});

window.addEventListener('hashchange', renderPage);
document.addEventListener('DOMContentLoaded', renderPage);
</script>
</body>
</html>
