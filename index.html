<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat - Mensajería con Video Real</title>
  <style>
    :root {
      --bg-principal: #0b0e14;
      --bg-tarjeta: #151d26;
      --verde-neon: #00e676;
      --rojo-neon: #ff1744;
      --verde-oscuro: #054735;
      --texto-blanco: #f5f5f7;
      --texto-mutado: #8b9bb4;
      --burbuja-enviado: #056162;
      --burbuja-recibido: #1f2c34;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-blanco);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background-color: var(--bg-tarjeta);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .app-header {
      padding: 15px 20px;
      background-color: #1f2c34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-header h2 {
      font-size: 1.3rem;
      color: var(--verde-neon);
      font-weight: 700;
    }

    /* Lista de Chats */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      background-color: #121b22;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .chat-info {
      flex: 1;
    }

    .chat-info-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .chat-preview {
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    /* Chat Activo */
    .chat-active-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0b141a;
    }

    .chat-active-header {
      padding: 12px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .message-bubble.sent {
      background-color: var(--burbuja-enviado);
      align-self: flex-end;
      border-top-right-radius: 0px;
    }

    .message-bubble.received {
      background-color: var(--burbuja-recibido);
      align-self: flex-start;
      border-top-left-radius: 0px;
    }

    .chat-input-bar {
      padding: 10px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
    }

    .icon-btn {
      font-size: 1.3rem;
      color: var(--verde-neon);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* --- PANTALLA LLAMADA ACTIVA (WebRTC Real Video) --- */
    .call-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }

    /* Contenedor de Video de Cámara Real */
    .video-call-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .local-video-element {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo natural para selfie */
    }

    .call-overlay-info {
      position: relative;
      z-index: 10;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-top: 40px;
    }

    .call-overlay-info h3 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .call-timer {
      font-size: 1.1rem;
      color: var(--verde-neon);
      font-weight: bold;
    }

    .call-controls {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 25px;
      margin-bottom: 20px;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .control-btn.decline {
      background-color: var(--rojo-neon);
    }

    .control-btn.active-control {
      background-color: var(--verde-neon);
      color: black;
    }

    /* Navigation Bar */
    .app-nav {
      height: 70px;
      background-color: #1f2c34;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-btn {
      color: var(--texto-mutado);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--verde-neon);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="call-screen" id="callScreen">
      <div class="video-call-container">
        <video id="localVideoFeed" class="local-video-element" autoplay playsinline muted></video>
      </div>

      <div class="call-overlay-info">
        <h3 id="callContactName">Contacto</h3>
        <div class="call-timer" id="callTimer">Marcando...</div>
      </div>

      <div class="call-controls">
        <button class="control-btn" id="muteBtn" onclick="toggleMute()">🎙️</button>
        <button class="control-btn decline" onclick="colgarLlamada()">📞</button>
        <button class="control-btn" id="videoToggleBtn" onclick="toggleVideoCamera()">📷</button>
      </div>
    </div>

    <div class="screen active" id="chatsScreen">
      <header class="app-header">
        <h2>WaveChat</h2>
      </header>

      <div class="chat-list">
        <div class="chat-item" onclick="abrirChat('Fer ✨', 'F', '#e91e63')">
          <div class="chat-avatar" style="background-color: #e91e63;">F</div>
          <div class="chat-info">
            <div class="chat-info-top">
              <h4>Fer ✨</h4>
              <span style="font-size: 0.75rem; color: var(--texto-mutado);">12:30 PM</span>
            </div>
            <p class="chat-preview">¡Haz clic para chatear o llamarme!</p>
          </div>
        </div>
      </div>
    </div>

    <div class="screen" id="activeChatScreen">
      <div class="chat-active-container">
        <header class="chat-active-header">
          <button class="back-btn" onclick="cerrarChat()">◀</button>
          <div class="chat-avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 1rem;">C</div>
          <div style="flex: 1;">
            <h4 id="activeContactName" style="font-size: 1rem;">Nombre</h4>
            <span style="font-size: 0.75rem; color: var(--verde-neon);">En línea</span>
          </div>
          <button class="icon-btn" onclick="iniciarLlamadaVideoReal()">📞</button>
        </header>

        <div class="chat-messages-box" id="chatMessagesBox">
          <div class="message-bubble received">¡Hola! Presiona el icono de arriba para iniciar una videollamada real con tu cámara.</div>
        </div>

        <div class="chat-input-bar">
          <input type="text" id="chatInputMessage" class="chat-input" placeholder="Escribe un mensaje...">
          <button class="icon-btn" onclick="enviarMensajeTexto()">➤</button>
        </div>
      </div>
    </div>

    <nav class="app-nav" id="mainNavBar">
      <button class="nav-btn active" onclick="changeTab('chats')">💬<span>Chats</span></button>
    </nav>

  </div>

  <script>
    let streamLocal = null;
    let callInterval;
    let seconds = 0;
    let audioMuted = false;
    let videoMuted = false;
    let contactoActual = { nombre: '', inicial: '', color: '' };

    function changeTab(tab) {
      if (tab === 'chats') {
        document.getElementById('chatsScreen').classList.add('active');
        document.getElementById('activeChatScreen').classList.remove('active');
        document.getElementById('mainNavBar').style.display = 'flex';
      }
    }

    function abrirChat(nombre, inicial, color) {
      contactoActual = { nombre, inicial, color };
      document.getElementById('mainNavBar').style.display = 'none';
      document.getElementById('chatsScreen').classList.remove('active');
      document.getElementById('activeChatScreen').classList.add('active');

      const avatar = document.getElementById('activeAvatar');
      avatar.innerText = inicial;
      avatar.style.backgroundColor = color;
      document.getElementById('activeContactName').innerText = nombre;
    }

    function cerrarChat() {
      cerrarChat();
      changeTab('chats');
    }

    function cerrarChat() {
      document.getElementById('activeChatScreen').classList.remove('active');
      document.getElementById('mainNavBar').style.display = 'flex';
      document.getElementById('chatsScreen').classList.add('active');
    }

    function enviarMensajeTexto() {
      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatMessagesBox');
      chatBox.innerHTML += `<div class="message-bubble sent">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- ACCESO A HARDWARE REAL (CÁMARA Y MICROFONO) ---
    async function iniciarLlamadaVideoReal() {
      document.getElementById('callContactName').innerText = contactoActual.nombre;
      document.getElementById('callScreen').style.display = 'flex';
      document.getElementById('callTimer').innerText = "Accediendo a cámara...";

      try {
        // Solicitar permisos nativos de Audio y Video al navegador
        streamLocal = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, // Utiliza la cámara frontal/selfie
          audio: true
        });

        // Conectar el flujo de video al elemento <video> en el HTML
        const videoElement = document.getElementById('localVideoFeed');
        videoElement.srcObject = streamLocal;

        // Iniciar cronómetro de llamada una vez obtenida la cámara
        iniciarTemporizador();

      } catch (error) {
        console.error("Error al acceder a los dispositivos de medios:", error);
        document.getElementById('callTimer').innerText = "Error: Sin permisos de cámara";
        alert("No se pudo acceder a la cámara. Asegúrate de dar permisos de video y audio en tu navegador.");
      }
    }

    function iniciarTemporizador() {
      seconds = 0;
      document.getElementById('callTimer').innerText = "00:00";
      
      callInterval = setInterval(() => {
        seconds++;
        let mins = Math.floor(seconds / 60);
        let secs = seconds % 60;
        document.getElementById('callTimer').innerText = 
          (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
      }, 1000);
    }

    function colgarLlamada() {
      clearInterval(callInterval);
      
      // Apagar la cámara física y el micrófono para ahorrar batería y respetar privacidad
      if (streamLocal) {
        streamLocal.getTracks().forEach(track => track.stop());
        streamLocal = null;
      }

      document.getElementById('localVideoFeed').srcObject = null;
      document.getElementById('callScreen').style.display = 'none';
    }

    function toggleMute() {
      if (streamLocal) {
        audioMuted = !audioMuted;
        // Apaga o enciende el track de audio real
        streamLocal.getAudioTracks().forEach(track => track.enabled = !audioMuted);
        document.getElementById('muteBtn').classList.toggle('active-control', audioMuted);
      }
    }

    function toggleVideoCamera() {
      if (streamLocal) {
        videoMuted = !videoMuted;
        // Apaga o enciende el track de video real de la cámara
        streamLocal.getVideoTracks().forEach(track => track.enabled = !videoMuted);
        document.getElementById('videoToggleBtn').classList.toggle('active-control', videoMuted);
      }
    }
  </script>
</body>
</html>
