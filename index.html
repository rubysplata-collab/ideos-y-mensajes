<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveTok & WaveChat - Premium Multimedia</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-sidebar: #121b22;
      --accent: #ffeb3b; /* Amarillo */
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* MENÚ LATERAL */
    .sidebar { width: 240px; background-color: var(--bg-sidebar); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; padding: 20px 10px; gap: 25px; flex-shrink: 0; }
    .brand h2 { color: var(--accent); font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; padding-left: 10px; }
    .side-menu { display: flex; flex-direction: column; gap: 8px; }
    .menu-item { display: flex; align-items: center; gap: 15px; padding: 12px 15px; color: var(--text-main); text-decoration: none; font-weight: 600; border-radius: 10px; cursor: pointer; }
    .menu-item:hover, .menu-item.active { background: rgba(255, 235, 59, 0.1); color: var(--accent); }

    /* LAYOUT PRINCIPAL DE TRES COLUMNAS */
    .main-layout { flex: 1; display: flex; height: 100%; overflow: hidden; }

    /* COLUMNA 1: LISTA DE CHATS AMIGOS */
    .chats-master { width: 280px; background: var(--bg-sidebar); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; flex-shrink: 0; }
    .top-bar-chats { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
    .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.03); }
    .avatar { width: 35px; height: 35px; border-radius: 50%; background: #233138; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); }

    /* COLUMNA 2: EL CHAT ACTIVO (CENTRO) */
    .chats-detail { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; border-right: 1px solid rgba(255, 255, 255, 0.05); }
    .chat-header { background: var(--bg-sidebar); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .messages-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    
    /* BURBUJAS DE MENSAJES */
    .bubble { max-width: 65%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; color: white; display: flex; flex-direction: column; gap: 4px; }
    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }
    .sticker-msg-render { width: 120px; height: 120px; object-fit: contain; display: block; }
    .chat-img-render { max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: cover; }
    .chat-audio-render { max-width: 100%; height: 36px; }

    /* ÁREA DE INPUT Y STICKERS POPOVER */
    .input-bar-container { position: relative; background: var(--bg-sidebar); width: 100%; display: flex; flex-direction: column; }
    .input-bar { padding: 15px 20px; display: flex; align-items: center; gap: 15px; }
    .input-bar input { flex: 1; background: rgba(255,255,255,0.05); border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
    .input-bar i { font-size: 1.3rem; color: var(--accent); cursor: pointer; }
    .mic-recording { color: var(--danger) !important; animation: pulseMic 1s infinite alternate; }

    .sticker-popover { display: none; position: absolute; bottom: 75px; right: 60px; width: 280px; height: 220px; background: #1f2c34; border: 2px solid var(--accent); border-radius: 12px; z-index: 200; padding: 10px; flex-direction: column; }
    .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow-y: auto; flex: 1; margin-top: 5px; }
    .sticker-option { width: 100%; aspect-ratio: 1; object-fit: contain; cursor: pointer; border-radius: 6px; }
    .sticker-option:hover { transform: scale(1.1); background: rgba(255,255,255,0.05); }

    /* COLUMNA 3: TRANSMISIONES / PANTALLAS (DERECHA) */
    .right-stream-panel { width: 340px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 15px; gap: 15px; flex-shrink: 0; }
    .video-box-call { width: 100%; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; }
    .video-box-call video { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
    .video-label { position: absolute; bottom: 5px; left: 8px; background: rgba(0,0,0,0.6); padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; }

    .btn-solid { background: var(--accent); color: black; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-danger { background: var(--danger); color: white; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }

    @keyframes pulseMic { from { opacity: 0.5; } to { opacity: 1; } }
    .footer-id { background: #070a0e; text-align: center; padding: 6px; font-size: 0.8rem; color: var(--text-dim); }
    .footer-id b { color: var(--accent); }
    .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:3000; justify-content:center; align-items:center; }
    .modal-box { background: var(--bg-sidebar); border: 1px solid var(--accent); padding: 25px; border-radius: 15px; width: 90%; max-width: 340px; text-align: center; }
    .modal-box input { width:100%; padding:10px; margin:12px 0; border-radius:6px; border:1px solid rgba(255,255,255,0.1); background:#000; color:white; outline:none; text-align:center; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand"><h2><i class="fa-solid fa-clapperboard"></i> WaveTok</h2></div>
    <nav class="side-menu">
      <div class="menu-item" onclick="mostrarSeccion('feed')"><i class="fa-solid fa-house"></i> <span>Para ti</span></div>
      <div class="menu-item active" onclick="mostrarSeccion('chats')"><i class="fa-solid fa-comment-dots"></i> <span>Chats privados</span></div>
      <div class="menu-item" onclick="mostrarSeccion('perfil')"><i class="fa-solid fa-user"></i> <span>Mi Perfil</span></div>
    </nav>
    <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
      <button class="btn-solid" onclick="abrirModal('modalSubirVideo')"><i class="fa-solid fa-circle-plus"></i> Subir video</button>
      <div class="footer-id" id="lblCodeFooter">ID: Desconectado</div>
    </div>
  </aside>

  <div class="main-layout">
    
    <div class="chats-master">
      <div class="top-bar-chats">
        <button class="btn-solid" onclick="abrirModal('connectModal')"><i class="fa-solid fa-user-plus"></i> Conectar Amigo</button>
      </div>
      <div style="flex:1; overflow-y:auto;" id="chatListContainer"></div>
    </div>

    <div class="chats-detail">
      <div class="chat-header" id="chatDetailHeader" style="visibility: hidden;">
        <h4 id="targetChatName" style="color: white;">Selecciona un amigo</h4>
        <div style="display: flex; gap: 15px; color: var(--accent); font-size: 1.2rem; cursor: pointer;">
          <i class="fa-solid fa-phone" onclick="iniciarLlamadaWebRTC(false)"></i>
          <i class="fa-solid fa-video" onclick="iniciarLlamadaWebRTC(true)"></i>
        </div>
      </div>
      
      <div class="messages-container" id="msgBox"></div>
      
      <div class="input-bar-container">
        <div class="sticker-popover" id="popoverStickersBox">
          <div style="display:flex; justify-content:between; align-items:center; font-size:0.8rem; color:var(--accent); font-weight:bold; margin-bottom:5px;">
            <span>Stickers Animados</span>
            <i class="fa-solid fa-xmark" style="cursor:pointer; color:white; margin-left:auto;" onclick="alternarStickers()"></i>
          </div>
          <div class="sticker-grid" id="containerGridStickers"></div>
        </div>

        <div class="input-bar" id="chatInputBarArea" style="display: none;">
          <label for="chatInputFileImage" style="cursor:pointer;"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="chatInputFileImage" accept="image/*" style="display: none;" onchange="enviarImagenChat(this)">
          
          <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarMensajeTexto()">
          
          <i class="fa-regular fa-face-smile" onclick="alternarStickers()"></i>
          <i class="fa-solid fa-microphone" id="btnIconoMicrofonoAudio" onclick="toggleGrabacionAudio()"></i>
          <i class="fa-solid fa-paper-plane" onclick="enviarMensajeTexto()"></i>
        </div>
      </div>
    </div>

    <div class="right-stream-panel">
      <h5 style="color:var(--accent); border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">Transmisión / Sala</h5>
      
      <div class="video-box-call">
        <video id="localStreamVideo" autoplay muted playsinline></video>
        <div class="video-label">Tú (Mi Cámara/Pantalla)</div>
      </div>

      <div class="video-box-call">
        <video id="remoteStreamVideo" autoplay playsinline></video>
        <div class="video-label" id="lblRemoteLabel">Amigo (Remoto)</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px; margin-top:auto;">
        <button class="btn-solid" style="background:#0288d1; color:white;" onclick="toggleCompartirPantalla()"><i class="fa-solid fa-desktop"></i> Compartir Pantalla</button>
        <button class="btn-danger" onclick="colgarLlamadaWebRTC()">Desconectarse / Colgar</button>
      </div>
    </div>

  </div>

  <div class="modal-bg" id="modalRegistroInicial" style="display: flex;"><div class="modal-box"><h2>Crear tu ID WaveTok</h2><input type="text" id="inputUsernameUnico" placeholder="Tu nombre único de usuario"><button class="btn-solid" onclick="registrarUsuarioLocal()">Ingresar</button></div></div>
  <div class="modal-bg" id="connectModal"><div class="modal-box"><h3>Vincular Amigo</h3><input type="text" id="inputPeerIdDestino" placeholder="ID exacto de tu amigo"><button class="btn-solid" onclick="vincularAmigoLista()">Vincular</button><p onclick="cerrarModal('connectModal')" style="margin-top:12px; font-size:0.8rem; cursor:pointer; color:var(--text-dim)">Cerrar</p></div></div>
  <div class="modal-bg" id="modalSubirVideo"><div class="modal-box"><h3>Publicar Video</h3><input type="text" id="inputVideoUrlDirecta" placeholder="URL del video .mp4"><input type="text" id="inputVideoCaption" placeholder="Descripción..."><button class="btn-solid" onclick="subirVideoFirebase()">Subir</button><p onclick="cerrarModal('modalSubirVideo')" style="margin-top:12px; font-size:0.8rem; cursor:pointer; color:var(--text-dim)">Cancelar</p></div></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBB3UvcGKDXdiCo3cX4nKiDVdFR31d4ytA",
      authDomain: "mensajes-tiktokk.firebaseapp.com",
      projectId: "mensajes-tiktokk",
      storageBucket: "mensajes-tiktokk.firebasestorage.app",
      messagingSenderId: "1079940811085",
      appId: "1:1079940811085:web:6ab00b6476ef4d85908f04"
    };

    const app = initializeApp(firebaseConfig);
    window.fsdb = getFirestore(app);
    window.addDoc = addDoc; window.collection = collection; window.query = query; window.orderBy = orderBy; window.onSnapshot = onSnapshot; window.serverTimestamp = serverTimestamp;
    
    window.inicializarApp();
  </script>

  <script>
    let peerInstance = null, mySessionId = "", currentTargetPeerId = null;
    let miStreamLocal = null, llamadaActualWebRTC = null, screenTrack = null, estaCompartiendoPantalla = false;
    let unsubscribirMensajes = null, grabadorMedia = null, fragmentosAudio = [], grabandoAudio = false;

    const bibliotecaStickers = [
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f606/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f923/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f60e/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f440/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp"
    ];

    window.inicializarApp = () => {
      mySessionId = localStorage.getItem('wt_session_peer_id') || "";
      cargarStickersGid();
      if (mySessionId) {
        document.getElementById('modalRegistroInicial').style.display = 'none';
        document.getElementById('lblCodeFooter').innerHTML = `Tu código: <b>${mySessionId}</b>`;
        conectarPeerJS(mySessionId);
      }
    };

    function registrarUsuarioLocal() {
      let user = document.getElementById('inputUsernameUnico').value.trim();
      if(!user) return alert("Ingresa un ID");
      localStorage.setItem('wt_session_peer_id', user);
      location.reload();
    }

    function conectarPeerJS(idMio) {
      peerInstance = new Peer(idMio, { config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });
      peerInstance.on('open', () => { renderizarListaContactos(); });
      peerInstance.on('call', (call) => {
        if(confirm(`¿Contestar llamada/transmisión de ${call.peer}?`)) {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
            miStreamLocal = stream;
            document.getElementById('localStreamVideo').srcObject = stream;
            call.answer(stream);
            llamadaActualWebRTC = call;
            call.on('stream', (rStream) => { document.getElementById('remoteStreamVideo').srcObject = rStream; });
          });
        }
      });
    }

    function cargarStickersGid() {
      const g = document.getElementById('containerGridStickers');
      g.innerHTML = '';
      bibliotecaStickers.forEach(url => {
        g.innerHTML += `<img src="${url}" class="sticker-option" onclick="enviarSticker('${url}')">`;
      });
    }

    function alternarStickers() {
      const p = document.getElementById('popoverStickersBox');
      p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    }

    async function enviarSticker(url) {
      if(!currentTargetPeerId) return;
      let salaId = [mySessionId, currentTargetPeerId].sort().join("_CH_");
      await window.addDoc(window.collection(window.fsdb, "salas", salaId, "mensajes"), {
        sender: mySessionId, text: url, type: "sticker", timestamp: window.serverTimestamp()
      });
      alternarStickers();
    }

    function abrirChatConAmigo(id) {
      currentTargetPeerId = id;
      document.getElementById('targetChatName').innerText = `Chat: ${id.toUpperCase()}`;
      document.getElementById('chatDetailHeader').style.visibility = 'visible';
      document.getElementById('chatInputBarArea').style.display = 'flex';
      document.getElementById('lblRemoteLabel').innerText = id.toUpperCase();
      
      document.querySelectorAll('.chat-item').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');

      conectarSalaMensajes(id);
    }

    function conectarSalaMensajes(targetId) {
      if(unsubscribirMensajes) unsubscribirMensajes();
      let salaId = [mySessionId, targetId].sort().join("_CH_");
      const q = window.query(window.collection(window.fsdb, "salas", salaId, "mensajes"), window.orderBy("timestamp", "asc"));
      const box = document.getElementById('msgBox');

      unsubscribirMensajes = window.onSnapshot(q, (snapshot) => {
        box.innerHTML = '';
        snapshot.forEach((doc) => {
          let d = doc.data();
          let mio = d.sender === mySessionId;
          if(d.type === "sticker") {
            box.innerHTML += `<div class="bubble ${mio?'sent':'recv'}"><b>@${d.sender}:</b><img src="${d.text}" class="sticker-msg-render"/></div>`;
          } else if(d.type === "image") {
            box.innerHTML += `<div class="bubble ${mio?'sent':'recv'}"><b>@${d.sender}:</b><img src="${d.text}" class="chat-img-render"/></div>`;
          } else if(d.type === "audio") {
            box.innerHTML += `<div class="bubble ${mio?'sent':'recv'}"><b>@${d.sender}:</b><audio src="${d.text}" controls class="chat-audio-render"></audio></div>`;
          } else {
            box.innerHTML += `<div class="bubble ${mio?'sent':'recv'}"><b>@${d.sender}:</b><br>${d.text}</div>`;
          }
        });
        box.scrollTop = box.scrollHeight;
      });
    }

    async function enviarMensajeTexto() {
      const input = document.getElementById('chatInput');
      if(!input.value.trim() || !currentTargetPeerId) return;
      let salaId = [mySessionId, currentTargetPeerId].sort().join("_CH_");
      await window.addDoc(window.collection(window.fsdb, "salas", salaId, "mensajes"), {
        sender: mySessionId, text: input.value.trim(), type: "text", timestamp: window.serverTimestamp()
      });
      input.value = '';
    }

    function enviarImagenChat(input) {
      if(!input.files[0] || !currentTargetPeerId) return;
      let reader = new FileReader();
      reader.onload = async (e) => {
        let salaId = [mySessionId, currentTargetPeerId].sort().join("_CH_");
        await window.addDoc(window.collection(window.fsdb, "salas", salaId, "mensajes"), {
          sender: mySessionId, text: e.target.result, type: "image", timestamp: window.serverTimestamp()
        });
      };
      reader.readAsDataURL(input.files[0]);
    }

    function toggleGrabacionAudio() {
      const btn = document.getElementById('btnIconoMicrofonoAudio');
      if(!grabandoAudio) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          grabadorMedia = new MediaRecorder(stream);
          fragmentosAudio = [];
          grabadorMedia.ondataavailable = e => fragmentosAudio.push(e.data);
          grabadorMedia.onstop = () => {
            let blob = new Blob(fragmentosAudio, { type: 'audio/mp3' });
            let r = new FileReader();
            r.onload = async (e) => {
              let salaId = [mySessionId, currentTargetPeerId].sort().join("_CH_");
              await window.addDoc(window.collection(window.fsdb, "salas", salaId, "mensajes"), {
                sender: mySessionId, text: e.target.result, type: "audio", timestamp: window.serverTimestamp()
              });
            };
            r.readAsDataURL(blob);
          };
          grabadorMedia.start();
          grabandoAudio = true;
          btn.classList.add('mic-recording');
        });
      } else {
        if(grabadorMedia) grabadorMedia.stop();
        grabandoAudio = false;
        btn.classList.remove('mic-recording');
      }
    }

    function iniciarLlamadaWebRTC(conVideo) {
      if(!currentTargetPeerId) return;
      navigator.mediaDevices.getUserMedia({ video: conVideo, audio: true }).then(stream => {
        miStreamLocal = stream;
        document.getElementById('localStreamVideo').srcObject = stream;
        let call = peerInstance.call(currentTargetPeerId, stream);
        llamadaActualWebRTC = call;
        call.on('stream', rStream => { document.getElementById('remoteStreamVideo').srcObject = rStream; });
      });
    }

    function toggleCompartirPantalla() {
      if(!estaCompartiendoPantalla) {
        navigator.mediaDevices.getDisplayMedia({ video: true }).then(stream => {
          screenTrack = stream.getVideoTracks()[0];
          let sender = llamadaActualWebRTC.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if(sender) sender.replaceTrack(screenTrack);
          document.getElementById('localStreamVideo').srcObject = stream;
          estaCompartiendoPantalla = true;
        });
      }
    }

    function colgarLlamadaWebRTC() {
      if(miStreamLocal) miStreamLocal.getTracks().forEach(t => t.stop());
      document.getElementById('localStreamVideo').srcObject = null;
      document.getElementById('remoteStreamVideo').srcObject = null;
    }

    function vincularAmigoLista() {
      let id = document.getElementById('inputPeerIdDestino').value.trim();
      if(!id) return;
      let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
      if(!list.includes(id)) { list.push(id); localStorage.setItem('wave_chats', JSON.stringify(list)); }
      renderizarListaContactos();
      cerrarModal('connectModal');
    }

    function renderizarListaContactos() {
      let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
      const container = document.getElementById('chatListContainer');
      container.innerHTML = '';
      list.forEach(id => {
        container.innerHTML += `<div class="chat-item" onclick="abrirChatConAmigo('${id}')"><div class="avatar">${id.substring(0,2).toUpperCase()}</div><h5 style="color:white;margin-left:10px;">${id.toUpperCase()}</h5></div>`;
      });
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
    function mostrarSeccion(sec) { console.log("Cambiando a " + sec); }
  </script>
</body>
</html>
