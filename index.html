<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Blue Chat ⚽</title>
<style>
  :root{
    --verde:#0A1128;
    --verde-claro:#1E5FFF;
    --fondo:#0D1B3E;
    --burbuja-mia:#1E5FFF;
    --burbuja-otro:#1A2A52;
    --acento:#FF3B30;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;}
  body{
    display:flex;flex-direction:column;background:var(--fondo);
    height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* ---------- PANTALLA DE BIENVENIDA ---------- */
  #vistaInicio{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow-y:auto;
  }
  .card{
    background:#101c3d;
    width:100%;
    max-width:400px;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(30,95,255,.35);
    overflow:hidden;
    border:1px solid #1E5FFF44;
  }
  .header{
    background:linear-gradient(135deg,#0A1128 0%,#1E5FFF 100%);
    color:#fff;
    padding:24px;
    text-align:center;
    border-bottom:3px solid var(--acento);
  }
  .header h1{margin:0;font-size:26px;letter-spacing:2px;font-weight:900;text-shadow:0 0 12px #1E5FFF;}
  .header p{margin:6px 0 0;font-size:12px;opacity:.85;letter-spacing:1px;text-transform:uppercase;}
  .body{padding:24px;background:#101c3d;}
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#8FA8FF;
    margin:14px 0 6px;
    letter-spacing:.5px;
  }
  input[type=text]{
    width:100%;
    padding:12px 14px;
    border:1px solid #2A3B6B;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#0D1B3E;
    color:#fff;
  }
  input[type=text]::placeholder{color:#5C6B99;}
  input[type=text]:focus{border-color:var(--verde-claro);box-shadow:0 0 0 2px #1E5FFF33;}
  .colores{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .color-op{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .color-op.selected{border-color:#333;}
  .btn{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--verde-claro),#0A3FCC);color:#fff;font-size:15px;font-weight:800;
    cursor:pointer;margin-top:20px;letter-spacing:1px;text-transform:uppercase;
    box-shadow:0 4px 14px rgba(30,95,255,.5);
  }
  .btn:active{transform:scale(.98);}
  .btn-secundario{background:transparent;color:var(--acento);border:2px solid var(--acento);box-shadow:none;}
  .divisor{text-align:center;color:#5C6B99;font-size:11px;margin:16px 0;letter-spacing:1px;text-transform:uppercase;}
  .codigo-generado{
    text-align:center;background:#0D1B3E;padding:14px;border-radius:10px;
    font-size:24px;font-weight:900;letter-spacing:3px;color:var(--verde-claro);
    margin-top:10px;display:none;border:1px dashed var(--verde-claro);
  }
  .error{color:var(--acento);font-size:13px;margin-top:8px;display:none;}

  /* ---------- PANTALLA DE CHAT ---------- */
  #vistaChat{
    display:none;
    flex:1;
    flex-direction:column;
    height:100%;
    min-height:0;
  }
  header.chatHeader{
    background:linear-gradient(135deg,#0A1128,#1E5FFF);color:#fff;padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(30,95,255,.4);z-index:5;
    flex-shrink:0;
    border-bottom:2px solid var(--acento);
  }
  header.chatHeader .info{display:flex;flex-direction:column;}
  header.chatHeader .info b{font-size:16px;letter-spacing:1px;}
  header.chatHeader .info span{font-size:12px;opacity:.85;}
  header.chatHeader button{
    background:var(--acento);border:none;color:#fff;
    padding:8px 12px;border-radius:8px;font-size:11px;cursor:pointer;
    font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  }
  #mensajes{
    flex:1;overflow-y:auto;padding:16px;
    display:flex;flex-direction:column;gap:8px;
    min-height:0;
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(circle at 15% 20%, #1E5FFF14 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, #FF3B3012 0%, transparent 40%),
      var(--fondo);
  }
  .msg{
    max-width:75%;padding:8px 12px;border-radius:10px;font-size:14px;
    position:relative;box-shadow:0 2px 6px rgba(0,0,0,.3);word-wrap:break-word;
  }
  .msg.mia{align-self:flex-end;background:var(--burbuja-mia);color:#fff;border-bottom-right-radius:2px;}
  .msg.otro{align-self:flex-start;background:var(--burbuja-otro);color:#fff;border-bottom-left-radius:2px;border-left:2px solid var(--acento);}
  .msg .autor{font-size:12px;font-weight:800;margin-bottom:2px;display:block;letter-spacing:.5px;}
  .msg .hora{font-size:10px;color:#B8C4E8;display:block;text-align:right;margin-top:4px;}
  .msg img.foto{max-width:220px;border-radius:8px;display:block;margin-top:4px;cursor:pointer;}
  .msg .sticker{width:110px;height:110px;object-fit:contain;display:block;}

  footer{
    background:#101c3d;padding:10px;display:flex;align-items:center;gap:8px;
    border-top:2px solid #1E5FFF44;position:relative;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  footer button.icono{background:none;border:none;font-size:22px;cursor:pointer;padding:6px;}
  footer input[type=text]{
    flex:1;padding:12px 14px;border-radius:20px;border:1px solid #2A3B6B;outline:none;font-size:16px;
    background:#0D1B3E;color:#fff;
  }
  footer input[type=text]::placeholder{color:#5C6B99;}
  footer button.enviar{
    background:linear-gradient(135deg,var(--verde-claro),#0A3FCC);border:none;color:#fff;
    width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;
    box-shadow:0 3px 10px rgba(30,95,255,.5);
  }
  #panelStickers{
    position:absolute;bottom:64px;left:10px;right:10px;background:#101c3d;
    border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.5);padding:12px;
    display:none;grid-template-columns:repeat(4,1fr);gap:8px;max-height:280px;overflow-y:auto;
    border:1px solid #1E5FFF44;
  }
  #panelStickers.abierto{display:grid;}
  #panelStickers .stickerOpcion{
    text-align:center;cursor:pointer;padding:6px;border-radius:10px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  #panelStickers .stickerOpcion:hover{background:#1E5FFF22;}
  #panelStickers .stickerOpcion img{width:100%;max-width:70px;border-radius:8px;}
  #panelStickers .stickerOpcion span{font-size:9px;color:#8FA8FF;text-transform:uppercase;letter-spacing:.5px;}
  #inputFoto{display:none;}
  #modalImagen{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);
    align-items:center;justify-content:center;z-index:50;
  }
  #modalImagen.abierto{display:flex;}
  #modalImagen img{max-width:90%;max-height:90%;border-radius:8px;}
  #modalImagen span{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;}
  #cargando{text-align:center;font-size:12px;color:#8FA8FF;padding:6px;display:none;}

  /* ---------- AJUSTES PARA PANTALLAS DE TELÉFONO ---------- */
  @media (max-width: 480px){
    #vistaInicio{padding:0;align-items:stretch;justify-content:flex-start;}
    #vistaInicio .card{
      max-width:100%;
      border-radius:0;
      min-height:100dvh;
      box-shadow:none;
    }
    .header{padding:32px 20px 20px;}
    .body{padding:20px;}

    .msg{max-width:85%;font-size:15px;}
    #mensajes{padding:12px;gap:6px;}

    footer{padding:8px;gap:6px;}
    footer button.icono{font-size:24px;padding:4px 6px;}
    footer button.enviar{width:40px;height:40px;flex-shrink:0;}
    footer input[type=text]{padding:11px 12px;}

    #panelStickers{
      grid-template-columns:repeat(4,1fr);
      left:6px;right:6px;bottom:60px;
      max-height:45dvh;
    }
    #panelStickers .stickerOpcion img{max-width:56px;}

    header.chatHeader{padding:10px 12px;}
    header.chatHeader .info b{font-size:15px;}
    header.chatHeader .info span{font-size:11px;}
    header.chatHeader button{padding:7px 10px;font-size:11px;}

    .msg img.foto{max-width:65vw;}
  }

  @media (max-width: 360px){
    .colores{gap:8px;}
    .color-op{width:28px;height:28px;}
    #panelStickers{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<!-- ============ VISTA 1: INICIO ============ -->
<div id="vistaInicio">
  <div class="card">
    <div class="header">
      <h1>⚽ BLUE CHAT</h1>
      <p>Solo el Ego #1 sobrevive</p>
    </div>
    <div class="body">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Isagi" maxlength="20" />

      <label>Elige tu color</label>
      <div class="colores" id="colores"></div>

      <div class="divisor">— Unirse a una sala existente —</div>
      <label for="codigoUnirse">Código de sala</label>
      <input type="text" id="codigoUnirse" placeholder="Ej: AB12CD" maxlength="10" style="text-transform:uppercase" />
      <button class="btn" id="btnUnirse">Entrar a la cancha</button>

      <div class="divisor">— O crea una sala nueva —</div>
      <button class="btn btn-secundario" id="btnCrear">Crear mi equipo (código único)</button>
      <div class="codigo-generado" id="codigoGenerado"></div>

      <div class="error" id="error"></div>
    </div>
  </div>
</div>

<!-- ============ VISTA 2: CHAT ============ -->
<div id="vistaChat">
  <header class="chatHeader">
    <div class="info">
      <b>⚽ BLUE LOCK</b>
      <span id="codigoSalaTexto">Código: ------</span>
      <span id="estadoP2P" style="font-size:11px;opacity:.8;">📷 Conectando para fotos...</span>
    </div>
    <button id="btnSalir">Salir</button>
  </header>

  <div id="mensajes"></div>
  <div id="cargando">Enviando...</div>

  <footer>
    <button class="icono" id="btnStickers" title="Stickers">😊</button>
    <button class="icono" id="btnFoto" title="Enviar foto">📷</button>
    <input type="file" id="inputFoto" accept="image/*" />
    <input type="text" id="textoMensaje" placeholder="Escribe un mensaje" />
    <button class="enviar" id="btnEnviar">➤</button>
  </footer>

  <div id="panelStickers"></div>
</div>

<div id="modalImagen">
  <span id="cerrarModal">✕</span>
  <img id="imagenGrande" src="" />
</div>

function generarCodigoUnico(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let codigo = '';
  for(let i=0;i<6;i++){
    codigo += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return codigo;
}

function mostrarError(msg){
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

let nombreUsuario = '';
let salaActual = '';

function entrarASala(codigo){
  const nombre = document.getElementById('nombre').value.trim();
  if(!nombre){
    mostrarError('Escribe tu nombre antes de continuar.');
    return;
  }
  nombreUsuario = nombre;
  salaActual = codigo;
  localStorage.setItem('michat_nombre', nombre);
  localStorage.setItem('michat_color', colorSeleccionado);
  localStorage.setItem('michat_sala', codigo);

  vistaInicio.style.display = 'none';
  vistaChat.style.display = 'flex';
  document.getElementById('codigoSalaTexto').textContent = 'Código: ' + codigo;
  iniciarChat();
}

const contMensajes = document.getElementById('mensajes');

function formatearHora(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function pintarMensaje(m){
  const div = document.createElement('div');
  div.className = 'msg ' + (m.uid === uid ? 'mia' : 'otro');

  const autor = document.createElement('span');
  autor.className = 'autor';
  autor.style.color = m.color || '#075E54';
  autor.textContent = m.nombre || 'Anónimo';
  div.appendChild(autor);

  if(m.tipo === 'texto'){
    const p = document.createElement('span');
    p.textContent = m.contenido;
    div.appendChild(p);
  } else if(m.tipo === 'foto'){
    const img = document.createElement('img');
    img.className = 'foto';
    img.src = m.contenido;
    img.onclick = ()=>{
      document.getElementById('imagenGrande').src = m.contenido;
      document.getElementById('modalImagen').classList.add('abierto');
    };
    div.appendChild(img);
  } else if(m.tipo === 'sticker'){
    const sp = document.createElement('img');
    sp.className = 'sticker';
    // m.contenido guarda la CLAVE del sticker (ej: "feliz"), no la imagen entera,
    // así los mensajes pesan poco. La imagen sale del diccionario STICKERS_ANIME.
    sp.src = STICKERS_ANIME[m.contenido] || '';
    sp.alt = m.contenido;
    div.appendChild(sp);
  }

  const hora = document.createElement('span');
  hora.className = 'hora';
  hora.textContent = formatearHora(m.timestamp);
  div.appendChild(hora);

  contMensajes.appendChild(div);
  contMensajes.scrollTop = contMensajes.scrollHeight;
}

let mensajesRef = null;
let escuchaActiva = false;

function iniciarChat(){
  mensajesRef = ref(db, 'salas/' + salaActual + '/mensajes');
  const mensajesVisibles = query(mensajesRef, limitToLast(200));
  if(!escuchaActiva){
    onChildAdded(mensajesVisibles, (snap)=>{
      pintarMensaje(snap.val());
    });
    escuchaActiva = true;
  }
  if(!peer){
    iniciarPeer();
  }
}

function enviarMensaje(tipo, contenido){
  const nuevoRef = push(mensajesRef);
  set(nuevoRef, {
    uid,
    nombre: nombreUsuario,
    color: colorSeleccionado,
    tipo,
    contenido,
    timestamp: Date.now()
  });
}

document.getElementById('btnEnviar').addEventListener('click', enviarTexto);
document.getElementById('textoMensaje').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') enviarTexto();
});

function enviarTexto(){
  const input = document.getElementById('textoMensaje');
  const texto = input.value.trim();
  if(!texto) return;
  enviarMensaje('texto', texto);
  input.value = '';
}

// ---------- Fotos por PeerJS (P2P, directo entre navegadores) ----------
// El texto y los stickers siguen yendo por Firebase (siempre disponibles,
// con historial). Las fotos viajan de navegador a navegador vía WebRTC:
// solo funcionan si la otra persona está conectada en ese momento, pero
// no consumen almacenamiento ni tienen que pasar por Firebase.

let peer = null;
let conexiones = {}; // peerId -> DataConnection
const estadoP2P = document.getElementById('estadoP2P');

function idPeerDesdeUid(u){
  // PeerJS necesita un id "limpio": usamos sala+uid para que sea único
  // pero determinístico (así los demás en la sala pueden reconectarse).
  return ('sala-' + salaActual + '-' + u).replace(/[^a-zA-Z0-9-]/g, '');
}

function iniciarPeer(){
  const miIdPeer = idPeerDesdeUid(uid);
  peer = new Peer(miIdPeer, {
    // Servidor público gratuito de PeerJS. A veces es inestable;
    // si falla, el chat de texto sigue funcionando igual.
    debug: 0
  });

  peer.on('open', ()=>{
    estadoP2P.textContent = '📷 Listo para enviar fotos';
    anunciarPresencia();
  });

  peer.on('connection', (conn)=>{
    registrarConexion(conn);
  });

  peer.on('error', (err)=>{
    console.warn('PeerJS:', err.type);
    if(err.type === 'peer-unavailable'){
      // La otra persona no está conectada ahora mismo; no pasa nada grave.
      return;
    }
    estadoP2P.textContent = '📷 Fotos no disponibles ahora';
  });

  peer.on('disconnected', ()=>{
    estadoP2P.textContent = '📷 Reconectando...';
    peer.reconnect();
  });
}

function registrarConexion(conn){
  conexiones[conn.peer] = conn;
  conn.on('open', ()=>{
    estadoP2P.textContent = '📷 Conectado para fotos';
  });
  conn.on('data', (data)=>{
    if(data && data.tipo === 'foto'){
      pintarMensaje({
        uid: data.uid,
        nombre: data.nombre,
        color: data.color,
        tipo: 'foto',
        contenido: data.contenido,
        timestamp: data.timestamp
      });
    }
  });
  conn.on('close', ()=>{
    delete conexiones[conn.peer];
  });
}

// Anunciamos nuestra presencia en la sala vía Database (solo un "ping"
// liviano con el id de peer), para que otros participantes sepan a quién
// conectarse por PeerJS. No guarda fotos, solo coordina la conexión.
function anunciarPresencia(){
  const presenciaRef = ref(db, 'salas/' + salaActual + '/presencia/' + uid);
  set(presenciaRef, { idPeer: idPeerDesdeUid(uid), ultimaVez: Date.now() });

  const presenciaTodos = ref(db, 'salas/' + salaActual + '/presencia');
  onChildAdded(presenciaTodos, (snap)=>{
    const datos = snap.val();
    const otroUid = snap.key;
    if(otroUid === uid || !datos || !datos.idPeer) return;
    if(conexiones[datos.idPeer]) return; // ya conectados

    const conn = peer.connect(datos.idPeer);
    registrarConexion(conn);
  });
}

function comprimirImagen(archivo, maxAncho = 1000, calidad = 0.75){
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        let ancho = img.width;
        let alto = img.height;
        if(ancho > maxAncho){
          alto = Math.round(alto * (maxAncho / ancho));
          ancho = maxAncho;
        }
        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, ancho, alto);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(archivo);
  });
}

document.getElementById('inputFoto').addEventListener('change', async (e)=>{
  const archivo = e.target.files[0];
  if(!archivo) return;

  const idsConectados = Object.keys(conexiones);
  if(idsConectados.length === 0){
    alert('No hay nadie más conectado ahora mismo para recibir la foto. Pídele que abra el chat e inténtalo de nuevo.');
    e.target.value = '';
    return;
  }

  document.getElementById('cargando').style.display = 'block';
  try{
    const dataUrl = await comprimirImagen(archivo);
    const paquete = {
      tipo: 'foto',
      uid,
      nombre: nombreUsuario,
      color: colorSeleccionado,
      contenido: dataUrl,
      timestamp: Date.now()
    };
    idsConectados.forEach(id=> conexiones[id].send(paquete));
    // Se pinta también en mi propia pantalla (yo no me la "envío" por Firebase)
    pintarMensaje(paquete);
  }catch(err){
    alert('No se pudo enviar la foto: ' + err.message);
  }finally{
    document.getElementById('cargando').style.display = 'none';
    e.target.value = '';
  }
});

// ---------- Stickers: expresiones del personaje del usuario ----------
const nombresStickers = {
  neutral:"Neutral", sonriente:"Sonriente", enojado:"Enojado", gritando:"Gritando",
  sorprendido:"Sorprendido", triste:"Triste", feliz:"Feliz", vergonzoso:"Vergonzoso",
  serio:"Serio", pensando:"Pensando", cansado:"Cansado", determinado:"Determinado"
};
const panelStickers = document.getElementById('panelStickers');
Object.keys(STICKERS_ANIME).forEach(clave=>{
  const opcion = document.createElement('div');
  opcion.className = 'stickerOpcion';

  const img = document.createElement('img');
  img.src = STICKERS_ANIME[clave];
  img.alt = clave;
  opcion.appendChild(img);

  const etiqueta = document.createElement('span');
  etiqueta.textContent = nombresStickers[clave] || clave;
  opcion.appendChild(etiqueta);

  opcion.onclick = ()=>{
    enviarMensaje('sticker', clave); // se manda solo la clave, no la imagen completa
    panelStickers.classList.remove('abierto');
  };
  panelStickers.appendChild(opcion);
});
document.getElementById('btnStickers').addEventListener('click', ()=>{
  panelStickers.classList.toggle('abierto');
});

document.getElementById('cerrarModal').addEventListener('click', ()=>{
  document.getElementById('modalImagen').classList.remove('abierto');
});
