<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>JHEILER - Tu plataforma de videos</title>
    
    <!-- ===== FONT AWESOME LOCAL ===== -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    
    <!-- ===== GOOGLE FONTS (para personalización) ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Inter:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&family=Roboto:wght@400;700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22JHEILER%22,%22short_name%22:%22JHEILER%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f0f0f%22,%22theme_color%22:%22%23ff304f%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3670/3670147.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22,%22purpose%22:%22any%22}]}"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ===== VARIABLES PERSONALIZABLES ===== */
        :root {
            /* Colores principales */
            --bg: #0f0f0f;
            --panel: #181818;
            --panel2: #212121;
            --accent: #ff304f;
            --accent2: #ff6b8a;
            --border: #303030;
            --text-secondary: #aaa;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 12px;
            
            /* Tipografía */
            --font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-weight-title: 800;
            --font-weight-body: 400;
            --font-size-base: 14px;
            
            /* Fondos */
            --bg-image: none;
            --bg-overlay: rgba(0,0,0,0.85);
            
            /* Efectos */
            --glass-effect: rgba(255,255,255,0.05);
            --hover-scale: 1.02;
        }

        /* ===== TEMAS ===== */
        .theme-dark {
            --bg: #0f0f0f;
            --panel: #181818;
            --panel2: #212121;
            --accent: #ff304f;
            --border: #303030;
        }
        
        .theme-light {
            --bg: #f5f5f5;
            --panel: #ffffff;
            --panel2: #e8e8e8;
            --accent: #ff304f;
            --border: #ddd;
            --text-secondary: #666;
        }
        
        .theme-neon {
            --bg: #0a0a1a;
            --panel: #111128;
            --panel2: #1a1a3a;
            --accent: #00ff88;
            --accent2: #00ffcc;
            --border: #333366;
            --text-secondary: #8888cc;
        }
        
        .theme-cyber {
            --bg: #000000;
            --panel: #0a0a0a;
            --panel2: #1a1a1a;
            --accent: #ff00ff;
            --accent2: #ff44ff;
            --border: #333333;
            --text-secondary: #999999;
        }

        /* ===== FONDOS ===== */
        .bg-gradient {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 50%, #0f0f0f 100%);
        }
        
        .bg-gradient-neon {
            background: linear-gradient(135deg, #0a0a1a 0%, #001a1a 50%, #0a0a1a 100%);
        }
        
        .bg-pattern {
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,48,79,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255,48,79,0.05) 0%, transparent 50%);
        }
        
        .bg-pattern-dots {
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .bg-image-1 {
            background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .bg-image-2 {
            background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .bg-image-3 {
            background-image: url('https://images.unsplash.com/photo-1470071459604-7b8ec44ffd18?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay);
            z-index: 0;
            pointer-events: none;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: var(--font-size-base);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.3;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            z-index: 200;
            backdrop-filter: blur(12px);
            background: rgba(15,15,15,0.92);
        }

        .brand {
            font-size: 22px;
            font-weight: var(--font-weight-title);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .brand i {
            font-size: 26px;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: var(--panel2);
        }

        .create-btn {
            padding: 10px 20px;
            background: var(--accent);
            border-radius: 24px;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-btn i {
            font-size: 16px;
        }

        .create-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 24px rgba(255,48,79,0.35);
        }

        /* ===== SIDEBAR ===== */
        aside {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            padding-top: 12px;
            overflow-y: auto;
            z-index: 100;
        }

        .sb-section {
            padding: 6px 0 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .sb-title {
            padding: 6px 24px 8px 24px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 8px;
            transition: all 0.15s ease;
            cursor: pointer;
            position: relative;
        }

        .sb-item:hover {
            background: var(--panel2);
        }

        .sb-item i {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .sb-item:hover i {
            color: #fff;
        }

        .sb-item.active {
            background: var(--panel2);
        }

        .sb-item.active i {
            color: var(--accent);
        }

        .sb-item .badge {
            position: absolute;
            right: 24px;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            margin-left: 220px;
            padding: 80px 24px 40px 24px;
            min-height: 100vh;
            transition: opacity 0.3s ease;
            position: relative;
            z-index: 1;
        }

        /* ===== CATEGORÍAS ===== */
        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 20px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 8px 20px;
            background: var(--panel2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .category-chip:hover {
            background: var(--border);
        }

        .category-chip.active {
            background: var(--accent);
            color: #fff;
        }

        /* ===== VIDEO GRID ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px 20px;
        }

        .video-card {
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--panel2);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumb img {
            transform: scale(var(--hover-scale));
        }

        .thumb .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .thumb .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay i {
            font-size: 20px;
            color: #fff;
            margin-left: 4px;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .video-details {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 15px;
            font-weight: var(--font-weight-title);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-hashtags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .card-hashtags span {
            font-size: 11px;
            color: var(--accent);
            background: rgba(255,48,79,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-hashtags span:hover {
            background: rgba(255,48,79,0.2);
        }

        .channel-name {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .card-meta i {
            font-size: 11px;
        }

        /* ===== SECCIÓN DE CONTENIDO ===== */
        .section-title {
            font-size: 20px;
            font-weight: var(--font-weight-title);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: var(--accent);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            color: var(--border);
        }

        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #fff;
        }

        /* ===== REPRODUCTOR ===== */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .player-overlay.active {
            display: flex;
        }

        .player-container {
            width: 90%;
            max-width: 900px;
            position: relative;
        }

        .player-container video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            max-height: 80vh;
        }

        .player-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 8px;
            transition: transform 0.2s;
        }

        .player-close:hover {
            transform: scale(1.1);
        }

        .player-info {
            width: 90%;
            max-width: 900px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-title {
            font-size: 18px;
            font-weight: var(--font-weight-title);
        }

        .player-channel {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .player-hashtags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-hashtags span {
            color: var(--accent);
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== MODAL PERSONALIZACIÓN ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background: var(--panel);
            padding: 28px 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            font-size: 22px;
            font-weight: var(--font-weight-title);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content h3 i {
            color: var(--accent);
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: #fff;
            font-size: 14px;
            transition: border 0.2s ease;
            width: 100%;
        }

        .modal-content input:focus,
        .modal-content textarea:focus,
        .modal-content select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .modal-content select option {
            background: var(--panel);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 0 24px rgba(255,48,79,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--panel2);
            color: #aaa;
        }

        .btn-secondary:hover {
            background: var(--border);
            color: #fff;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            padding: 10px;
            background: var(--panel2);
            border-radius: 10px;
            border: 1px dashed var(--border);
            cursor: pointer;
            width: 100%;
        }

        .file-input-wrapper input[type="file"]::file-selector-button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
        }

        .file-input-wrapper small {
            color: #666;
            display: block;
            margin-top: 4px;
        }

        /* ===== OPCIONES DE PERSONALIZACIÓN ===== */
        .customization-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .customization-option {
            padding: 12px;
            background: var(--panel2);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .customization-option:hover {
            border-color: var(--accent);
        }

        .customization-option.active {
            border-color: var(--accent);
            background: rgba(255,48,79,0.1);
        }

        .customization-option .preview {
            width: 100%;
            height: 40px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-picker input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 2px;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
        }

        .font-option {
            padding: 8px 12px;
            background: var(--panel2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .font-option:hover,
        .font-option.active {
            border-color: var(--accent);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 2000;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            font-size: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            aside {
                display: none;
            }
            main {
                margin-left: 0;
                padding: 76px 16px 24px 16px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
            .brand {
                font-size: 18px;
            }
            .brand i {
                font-size: 20px;
            }
            .create-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .create-btn span {
                display: none;
            }
            .modal-content {
                padding: 20px;
            }
            .categories {
                gap: 8px;
            }
            .category-chip {
                font-size: 12px;
                padding: 6px 14px;
            }
            .player-container video {
                max-height: 60vh;
            }
            .player-close {
                top: -40px;
                font-size: 24px;
            }
            .player-title {
                font-size: 15px;
            }
            .customization-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card-title {
                font-size: 13px;
            }
            .channel-avatar {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            .channel-name {
                font-size: 11px;
            }
            .card-meta {
                font-size: 10px;
            }
            .thumb .duration {
                font-size: 9px;
                padding: 1px 6px;
            }
        }
    </style>

            playerVideo.load();

            playerHashtags.innerHTML = (video.hashtags || []).map(tag =>

            });

        function showToast(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `<i class="${iconMap[type] || iconMap.info}"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ===== FORMATO DE FECHA =====
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function formatViews(views) {
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'K';
            return views;
        }

            try {
                const { data, error } = await sb

                    .select('*')

                if (data && data.length > 0) {

                    return data;

                return sampleVideos;

            let filtered = [...videos];

                filtered = filtered.slice(0, 3);
            } else if (section === 'tus-videos') {
                // Tus videos (solo los del canal JHEILER)
                filtered = filtered.filter(v => v.channel === 'JHEILER');
            } else if (section === 'historial') {
                // Historial (últimos 5 vistos)
                filtered = filtered.slice(0, 5);
            } else if (section === 'ver-despues') {
                // Ver después (aleatorio)
                filtered = filtered.slice().sort(() => Math.random() - 0.5).slice(0, 4);
            }
            
            // Filtrar por categoría
            if (category && category !== 'todos') {
                filtered = filtered.filter(v => v.category === category);
            }
            
            return filtered;
        }

                    <div class="file-input-wrapper">
                        <input type="file" id="upThumb" accept="image/*">
                        <small><i class="fas fa-info-circle"></i> Miniatura (opcional)</small>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-primary" id="btnUpload">
                            <i class="fas fa-cloud-upload-alt"></i> Publicar
                        </button>
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnUpload').onclick = async () => {
                const title = document.getElementById('upTitle').value.trim();
                const desc = document.getElementById('upDesc').value.trim();
                const hashtags = document.getElementById('upHashtags').value.trim().split(' ').filter(t => t.startsWith('#'));
                const category = document.getElementById('upCategory').value;
                const videoFile = document.getElementById('upVideo').files[0];
                const thumbFile = document.getElementById('upThumb').files[0];

                if (!title) return showToast('Escribe un título', 'warning');
                if (!videoFile) return showToast('Selecciona un video', 'warning');
                if (videoFile.size > 100 * 1024 * 1024) {
                    return showToast('El video no debe superar 100MB', 'error');
                }

                const btn = document.getElementById('btnUpload');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';
                btn.disabled = true;

                try {
                    const vName = `${Date.now()}_${videoFile.name}`;
                    const { error: vErr } = await sb.storage.from('videos').upload(vName, videoFile);
                    if (vErr) throw vErr;

                    const { data: vData } = sb.storage.from('videos').getPublicUrl(vName);
                    let thumbUrl = '';

                    if (thumbFile) {
                        const tName = `${Date.now()}_${thumbFile.name}`;
                        const { error: tErr } = await sb.storage.from('thumbnails').upload(tName, thumbFile);
                        if (!tErr) {
                            const { data: tData } = sb.storage.from('thumbnails').getPublicUrl(tName);
                            thumbUrl = tData.publicUrl;
                        }
                    }

                    const newVideo = {
                        title,
                        description: desc || null,
                        category: category || 'general',
                        video_url: vData.publicUrl,
                        thumbnail_url: thumbUrl || 'https://images.unsplash.com/photo-1611162616475-46b635cb6868?w=400&h=225&fit=crop',
                        views: 0,
                        duration: '00:00',
                        channel: 'JHEILER',
                        hashtags: hashtags.length > 0 ? hashtags : ['#Nuevo'],
                        created_at: new Date().toISOString()
                    };

                    const { error: insertErr } = await sb.from('videos').insert(newVideo);
                    if (insertErr) throw insertErr;

                    allVideos.unshift(newVideo);
                    modal.remove();
                    showToast('¡Video publicado con éxito! 🎉', 'success');
                    loadVideos();
                } catch (err) {
                    console.error('Error al subir:', err);
                    showToast('Error al publicar: ' + err.message, 'error');
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Publicar';
                    btn.disabled = false;
                }
            };
        };

        // ===== SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        // ===== INICIALIZAR =====
        loadVideos();
    </script>
</body>
</html>
