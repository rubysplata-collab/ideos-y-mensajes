<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat - P2P Real (Chats, Fotos y Videollamadas)</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-principal: #0b0e14;
      --bg-tarjeta: #151d26;
      --verde-neon: #00e676;
      --rojo-neon: #ff1744;
      --verde-oscuro: #054735;
      --texto-blanco: #f5f5f7;
      --texto-mutado: #8b9bb4;
      --burbuja-enviado: #056162;
      --burbuja-recibido: #1f2c34;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-blanco);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 820px;
      background-color: var(--bg-tarjeta);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .app-header {
      padding: 15px 20px;
      background-color: #1f2c34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-header h2 {
      font-size: 1.3rem;
      color: var(--verde-neon);
      font-weight: 700;
    }

    /* Configuración de Conexión */
    .connection-box {
      background-color: #121b22;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .my-id-display {
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    .my-id-display strong {
      color: var(--verde-neon);
      background-color: rgba(0, 230, 118, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .connect-input-group {
      display: flex;
      gap: 8px;
    }

    .connect-input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      font-size: 0.85rem;
    }

    .connect-btn {
      padding: 8px 16px;
      background-color: var(--verde-neon);
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Lista de chats activos */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      background-color: #121b22;
    }

    .no-connections {
      padding: 40px 20px;
      text-align: center;
      color: var(--texto-mutado);
      font-size: 0.9rem;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
    }

    .chat-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .chat-info {
      flex: 1;
    }

    .chat-preview {
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    /* Interfaz de Chat Activo */
    .chat-active-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0b141a;
    }

    .chat-active-header {
      padding: 12px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-bubble.sent {
      background-color: var(--burbuja-enviado);
      align-self: flex-end;
      border-top-right-radius: 0px;
    }

    .message-bubble.received {
      background-color: var(--burbuja-recibido);
      align-self: flex-start;
      border-top-left-radius: 0px;
    }

    .message-media {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 5px;
      display: block;
    }

    .chat-input-bar {
      padding: 10px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
    }

    .icon-btn {
      font-size: 1.3rem;
      color: var(--verde-neon);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* --- PANTALLA VIDEOLLAMADA REAL --- */
    .call-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }

    .video-call-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Video del otro en pantalla completa */
    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tu propio video en miniatura flotante */
    .local-video {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 110px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--verde-neon);
      z-index: 10;
      transform: scaleX(-1);
    }

    .call-overlay-info {
      position: relative;
      z-index: 10;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-top: 180px;
    }

    .call-controls {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 25px;
      margin-bottom: 20px;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .control-btn.decline {
      background-color: var(--rojo-neon);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="call-screen" id="callScreen">
      <div class="video-call-grid">
        <video id="localVideo" class="local-video" autoplay playsinline muted></video>
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
      </div>

      <div class="call-overlay-info">
        <h3 id="callContactName">Conectando...</h3>
        <div id="callTimer" style="color: var(--verde-neon); font-weight: bold;">Llamada en progreso</div>
      </div>

      <div class="call-controls">
        <button class="control-btn decline" onclick="colgarLlamadaReal()">📞</button>
      </div>
    </div>

    <div class="screen active" id="chatsScreen">
      <header class="app-header">
        <h2>WaveChat P2P</h2>
      </header>

      <div class="connection-box">
        <div class="my-id-display">Tu ID para compartir: <strong id="myPeerId">Generando...</strong></div>
        <div class="connect-input-group">
          <input type="text" id="destPeerId" class="connect-input" placeholder="Ingresa el ID de tu amigo">
          <button class="connect-btn" onclick="conectarConAmigo()">Conectar</button>
        </div>
      </div>

      <div class="chat-list" id="activeChatsList">
        <div class="no-connections" id="noConnectionsText">
          No tienes chats activos.<br>Comparte tu ID o ingresa el de un amigo para empezar.
        </div>
      </div>
    </div>

    <div class="screen" id="activeChatScreen">
      <div class="chat-active-container">
        <header class="chat-active-header">
          <button class="back-btn" onclick="volverAChats()">◀</button>
          <div class="chat-avatar" id="activeAvatar" style="width: 38px; height: 38px; font-size: 1rem; background-color: var(--verde-oscuro);">U</div>
          <div style="flex: 1;">
            <h4 id="activeContactName" style="font-size: 1rem;">Amigo</h4>
            <span style="font-size: 0.75rem; color: var(--verde-neon);">P2P Conectado</span>
          </div>
          <button class="icon-btn" onclick="iniciarLlamadaReal()">📹</button>
        </header>

        <div class="chat-messages-box" id="chatMessagesBox"></div>

        <div class="chat-input-bar">
          <label class="icon-btn" title="Enviar Foto/Video">
            📁
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="enviarArchivoP2P()">
          </label>
          <input type="text" id="chatInputMessage" class="chat-input" placeholder="Escribe un mensaje...">
          <button class="icon-btn" onclick="enviarMensajeTextoReal()">➤</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let peer;
    let dataConnection = null;
    let mediaCall = null;
    let localStream = null;
    let amigoIdActual = "";

    // --- INICIALIZAR PEERJS (Conexión Real) ---
    // Generamos un ID amigable basado en 'wave-'
    const randomId = 'wave-' + Math.floor(1000 + Math.random() * 9000);
    
    peer = new Peer(randomId);

    peer.on('open', (id) => {
      document.getElementById('myPeerId').innerText = id;
    });

    // Escuchar conexiones de datos entrantes (mensajes, fotos, videos)
    peer.on('connection', (conn) => {
      dataConnection = conn;
      amigoIdActual = conn.peer;
      configurarEventosConexion();
      agregarChatALaLista(conn.peer);
    });

    // Escuchar llamadas de video entrantes
    peer.on('call', async (call) => {
      if (confirm(`¿Contestar videollamada de ${call.peer}?`)) {
        mediaCall = call;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById('localVideo').srcObject = localStream;
          
          call.answer(localStream);
          document.getElementById('callScreen').style.display = 'flex';
          document.getElementById('callContactName').innerText = call.peer;

          call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
          });
        } catch (err) {
          alert("Error al acceder a la cámara/micrófono para contestar.");
        }
      } else {
        call.close();
      }
    });

    // --- ENLAZAR DE FORMA ACTIVA CON UN AMIGO ---
    function conectarConAmigo() {
      const destId = document.getElementById('destPeerId').value.trim();
      if (!destId) return alert("Por favor ingresa un ID válido.");
      if (destId === peer.id) return alert("No puedes conectarte a ti mismo.");

      dataConnection = peer.connect(destId);
      amigoIdActual = destId;
      configurarEventosConexion();
      agregarChatALaLista(destId);
    }

    function configurarEventosConexion() {
      dataConnection.on('open', () => {
        // Abrimos automáticamente la pantalla de chat una vez enlazados
        abrirChatPantalla(amigoIdActual);
      });

      dataConnection.on('data', (data) => {
        const chatBox = document.getElementById('chatMessagesBox');
        
        if (data.type === 'text') {
          chatBox.innerHTML += `<div class="message-bubble received">${data.content}</div>`;
        } else if (data.type === 'file') {
          // Crear un enlace blob real para mostrar la foto o reproducir el video recibido
          const blob = new Blob([data.fileData], { type: data.fileType });
          const url = URL.createObjectURL(blob);
          
          if (data.fileType.startsWith('image/')) {
            chatBox.innerHTML += `
              <div class="message-bubble received">
                <img src="${url}" class="message-media" alt="Imagen P2P">
              </div>`;
          } else if (data.fileType.startsWith('video/')) {
            chatBox.innerHTML += `
              <div class="message-bubble received">
                <video src="${url}" class="message-media" controls></video>
              </div>`;
          }
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    // --- BANDEJA DE ENTRADA ---
    function agregarChatALaLista(peerId) {
      document.getElementById('noConnectionsText').style.display = 'none';
      const list = document.getElementById('activeChatsList');
      
      // Evitar duplicados en la lista de chats
      if (document.getElementById(`chat-item-${peerId}`)) return;

      list.innerHTML = `
        <div class="chat-item" id="chat-item-${peerId}" onclick="abrirChatPantalla('${peerId}')">
          <div class="chat-avatar">👤</div>
          <div class="chat-info">
            <h4>${peerId}</h4>
            <p class="chat-preview">¡Conexión establecida! Toca para hablar.</p>
          </div>
        </div>
      ` + list.innerHTML;
    }

    function abrirChatPantalla(peerId) {
      document.getElementById('chatsScreen').classList.remove('active');
      document.getElementById('activeChatScreen').classList.add('active');
      document.getElementById('activeContactName').innerText = peerId;
      document.getElementById('chatMessagesBox').innerHTML = `<div style="text-align:center; color:var(--texto-mutado); font-size:0.8rem;">Cifrado de extremo a extremo activo</div>`;
    }

    function volverAChats() {
      document.getElementById('activeChatScreen').classList.remove('active');
      document.getElementById('chatsScreen').classList.add('active');
    }

    // --- ENVIAR MENSAJES DE TEXTO REALES ---
    function enviarMensajeTextoReal() {
      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text || !dataConnection) return;

      // Enviar datos vía PeerJS DataChannel
      dataConnection.send({
        type: 'text',
        content: text
      });

      const chatBox = document.getElementById('chatMessagesBox');
      chatBox.innerHTML += `<div class="message-bubble sent">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- ENVIAR FOTOS Y VIDEOS REALES ---
    function enviarArchivoP2P() {
      const fileInput = document.getElementById('mediaInput');
      if (fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const fileData = event.target.result;
        
        // Enviar el archivo binario completo directamente por la conexión WebRTC
        dataConnection.send({
          type: 'file',
          fileData: fileData,
          fileName: file.name,
          fileType: file.type
        });

        // Mostrarlo localmente en nuestra pantalla
        const url = URL.createObjectURL(file);
        const chatBox = document.getElementById('chatMessagesBox');
        
        if (file.type.startsWith('image/')) {
          chatBox.innerHTML += `
            <div class="message-bubble sent">
              <img src="${url}" class="message-media" alt="Enviado">
            </div>`;
        } else if (file.type.startsWith('video/')) {
          chatBox.innerHTML += `
            <div class="message-bubble sent">
              <video src="${url}" class="message-media" controls></video>
            </div>`;
        }
        
        fileInput.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
      };

      reader.readAsArrayBuffer(file);
    }

    // Escuchar la tecla Enter
    document.getElementById('chatInputMessage').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') enviarMensajeTextoReal();
    });

    // --- LLAMADAS DE VIDEO REALES (WebRTC) ---
    async function iniciarLlamadaReal() {
      if (!amigoIdActual) return;

      document.getElementById('callScreen').style.display = 'flex';
      document.getElementById('callContactName').innerText = amigoIdActual;

      try {
        // Capturar medios locales
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        // Llamar al peer destino mandándole tu stream
        mediaCall = peer.call(amigoIdActual, localStream);

        // Recibir el video del amigo
        mediaCall.on('stream', (remoteStream) => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });

      } catch (err) {
        console.error(err);
        alert("No se pudo acceder a tu cámara o micrófono.");
        colgarLlamadaReal();
      }
    }

    function colgarLlamadaReal() {
      if (mediaCall) {
        mediaCall.close();
        mediaCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('callScreen').style.display = 'none';
    }
  </script>
</body>
</html>
