<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveTok Prefix</title>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root { --bg-dark: #0b0e14; --bg-sidebar: #121b22; --accent: #ffeb3b; --text-main: #f5f5f7; --text-dim: #8b9bb4; --danger: #ff1744; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 20px 10px; gap: 20px; flex-shrink: 0; }
    .brand h2 { color: var(--accent); font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 8px; padding-left: 10px; }
    .side-menu { display: flex; flex-direction: column; gap: 6px; }
    .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 15px; color: var(--text-main); text-decoration: none; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .menu-item:hover, .menu-item.active { background: rgba(255,235,59,0.1); color: var(--accent); }
    
    .main-layout { flex: 1; display: flex; height: 100%; overflow: hidden; position: relative; }
    .screen { display: none; width: 100%; height: 100%; }
    .screen.active { display: flex; }
    
    .feed-container-box { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; background: #000; position: relative; }
    .tok-feed-view { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #000; }
    .tok-wrapper { width: 100%; height: 100%; display: flex; align-items: center; }
    .tok-post { min-width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
    .tok-video { width: 100%; height: 100%; object-fit: contain; cursor: pointer; background: #000; }
    
    .tok-actions { position: absolute; right: 12px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 99; }
    .circle-action { background: rgba(30,44,52,0.85); border: 1px solid rgba(255,255,255,0.1); width: 44px; height: 44px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }
    .tok-actions span { font-size: 0.75rem; text-shadow: 1px 1px 2px black; }
    .tok-meta { position: absolute; left: 14px; bottom: 25px; z-index: 10; max-width: 75%; text-shadow: 1px 1px 4px black; }
    
    .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); color: white; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; z-index: 15; display: flex; align-items: center; justify-content: center; }
    .arrow-left { left: 10px; } .arrow-right { right: 10px; }
    .top-bar-feed { background: var(--bg-sidebar); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    
    .chats-master { width: 260px; background: var(--bg-sidebar); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer; }
    .chats-detail { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; }
    .chat-header { background: var(--bg-sidebar); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 70%; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; color: white; word-break: break-word; }
    .sent { background: #002d62; align-self: flex-end; }
    .recv { background: #1f2c34; align-self: flex-start; }
    
    .input-bar { padding: 12px 20px; background: var(--bg-sidebar); display: flex; align-items: center; gap: 12px; }
    .input-bar input { flex: 1; background: rgba(255,255,255,0.05); border: none; padding: 10px 15px; border-radius: 20px; color: white; outline: none; }
    
    .right-stream-panel { width: 280px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 15px; gap: 15px; }
    .video-box-call { width: 100%; background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 4/3; }
    .video-box-call video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-solid { background: var(--accent); color: black; border: none; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-danger { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; }
    
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; }
    .modal-box { background: var(--bg-sidebar); border: 1px solid var(--accent); padding: 25px; border-radius: 15px; width: 90%; max-width: 360px; text-align: center; }
    .modal-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: #000; color: white; text-align: center; outline: none; }
    
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 55px; flex-direction: row; justify-content: space-around; padding: 0; position: fixed; bottom: 0; z-index: 500; border-top: 1px solid rgba(255,255,255,0.08); }
      .brand, .btn-solid:not(.chat-header .btn-solid), .right-stream-panel { display: none; }
      .side-menu { flex-direction: row; width: 100%; justify-content: space-around; }
      .main-layout { height: calc(100% - 55px); }
      #screen-chats { flex-direction: column; } .chats-master, .chats-detail { width: 100%; }
      #screen-chats.chat-abierto .chats-master { display: none; }
      #screen-chats:not(.chat-abierto) .chats-detail { display: none; }
      .btn-volver-chats { display: inline-block !important; margin-right: 8px; color: var(--accent); }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand"><h2><i class="fa-solid fa-clapperboard"></i> WaveTok</h2></div>
    <nav class="side-menu">
      <div class="menu-item active" id="btn-plataforma" onclick="activarPantalla('plataforma')"><i class="fa-solid fa-layer-group"></i> <span>Feed</span></div>
      <div class="menu-item" id="btn-chats" onclick="activarPantalla('chats')"><i class="fa-solid fa-comment-dots"></i> <span>Chats</span></div>
      <div class="menu-item" id="btn-perfil" onclick="activarPantalla('perfil')"><i class="fa-solid fa-user"></i> <span>Perfil</span></div>
      <div class="menu-item" onclick="abrirModal('modalSubirVideo')"><i class="fa-solid fa-circle-plus" style="color:var(--accent)"></i> <span>Subir</span></div>
    </nav>
    <div id="labelFooterMyCode" style="font-size:0.75rem; text-align:center; color:var(--text-dim); margin-top:auto;"></div>
  </aside>

  <div class="main-layout">
    <div class="screen active" id="screen-plataforma">
      <div class="feed-container-box">
        <div class="top-bar-feed">
          <h3>Para ti</h3>
          <input type="text" id="inputBuscar" placeholder="Buscar..." oninput="filtrarFeed()" style="background:rgba(255,255,255,0.05); border:none; padding:6px 12px; border-radius:15px; color:white; width:140px;">
        </div>
        <div class="tok-feed-view">
          <button class="nav-arrow arrow-left" onclick="navegarFeed(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="nav-arrow arrow-right" onclick="navegarFeed(1)"><i class="fa-solid fa-chevron-right"></i></button>
          <div class="tok-wrapper" id="tokFeedIterator"></div>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-chats">
      <div class="chats-master">
        <div style="padding:10px;"><button class="btn-solid" onclick="abrirModal('connectModal')"><i class="fa-solid fa-user-plus"></i> Conectar con XD-Amigo</button></div>
        <div style="flex:1; overflow-y:auto;" id="chatListContainer"></div>
      </div>
      <div class="chats-detail">
        <div class="chat-header" id="chatDetailHeader" style="visibility:hidden;">
          <div style="display:flex; align-items:center;">
            <i class="fa-solid fa-arrow-left btn-volver-chats" style="display:none; cursor:pointer;" onclick="document.getElementById('screen-chats').classList.remove('chat-abierto')"></i>
            <h4 id="targetChatName" style="color:white;">Amigo</h4>
          </div>
          <div style="display:flex; gap:15px; color:var(--accent); cursor:pointer;"><i class="fa-solid fa-phone" onclick="llamarPeer(false)"></i><i class="fa-solid fa-video" onclick="llamarPeer(true)"></i></div>
        </div>
        <div class="messages-container" id="msgBox"></div>
        <div class="input-bar" id="chatInputBarArea" style="display:none;">
          <input type="text" id="chatInput" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') enviarTexto()">
          <i class="fa-solid fa-paper-plane" style="color:var(--accent); cursor:pointer;" onclick="enviarTexto()"></i>
        </div>
      </div>
      <div class="right-stream-panel">
        <div class="video-box-call"><video id="localVideo" autoplay muted playsinline></video></div>
        <div class="video-box-call"><video id="remoteVideo" autoplay playsinline></video></div>
        <button class="btn-danger" onclick="location.reload()"><i class="fa-solid fa-phone-slash"></i> Colgar</button>
      </div>
    </div>

    <div class="screen" id="screen-perfil">
      <div style="max-width:300px; margin:60px auto; text-align:center; display:flex; flex-direction:column; gap:15px;">
        <h2 id="txtPerfilID" style="color:var(--accent);">@Usuario</h2>
        <button class="btn-danger" onclick="cerrarSesionCustom()">Cerrar Sesión</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="modalRegistroInicial" style="display:flex;">
    <div class="modal-box">
      <h2 style="color:var(--accent); margin-bottom:10px;">WaveTok</h2>
      <p style="font-size:0.85rem; color:var(--text-dim); margin-bottom:15px;">Ingresa tu nombre personalizado (Se antepondrá "XD-")</p>
      <input type="text" id="authCustomUsername" placeholder="Ej: jheiler">
      <button class="btn-solid" onclick="autenticarCustomName()">Entrar a la plataforma</button>
    </div>
  </div>

  <div class="modal-bg" id="connectModal">
    <div class="modal-box">
      <h3>Buscar por Nombre</h3>
      <input type="text" id="peerIdDestino" placeholder="Ej: XD-jheiler">
      <button class="btn-solid" onclick="agregarAmigo()">Iniciar Chat</button>
      <p onclick="cerrarModal('connectModal')" style="cursor:pointer; margin-top:10px; font-size:0.8rem; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

  <div class="modal-bg" id="modalSubirVideo">
    <div class="modal-box">
      <h3>Publicar</h3>
      <input type="file" id="inputLocalVideo" accept="video/mp4,video/webm" style="color:white; background:none; border:1px dashed var(--accent);">
      <input type="text" id="inputUrlVideo" placeholder="O pega URL .mp4">
      <input type="text" id="inputCaption" placeholder="Descripción...">
      <button class="btn-solid" onclick="subirVideo()">Publicar Video</button>
      <p onclick="cerrarModal('modalSubirVideo')" style="cursor:pointer; margin-top:10px; font-size:0.8rem; color:var(--text-dim)">Volver</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const fConfig = { apiKey: "AIzaSyBB3UvcGKDXdiCo3cX4nKiDVdFR31d4ytA", authDomain: "mensajes-tiktokk.firebaseapp.com", projectId: "mensajes-tiktokk", storageBucket: "mensajes-tiktokk.firebasestorage.app", messagingSenderId: "1079940811085", appId: "1:1079940811085:web:6ab00b6476" };
    const app = initializeApp(fConfig), db = getFirestore(app);
    let uAct = null, peer = null, callAct = null, streamLoc = null, amigos = [], amigoSel = null, vids = [], idxFeed = 0;

    window.autenticarCustomName = () => {
      let name = document.getElementById("authCustomUsername").value.trim();
      if(!name) return alert("Por favor ingresa un nombre.");
      
      // Forzar que empiece por XD- obligatoriamente
      if (!name.toUpperCase().startsWith("XD-")) {
        name = "XD-" + name;
      }
      
      localStorage.setItem("wavetok_user_logged", name);
      location.reload();
    };

    window.cerrarSesionCustom = () => {
      localStorage.removeItem("wavetok_user_logged");
      location.reload();
    };

    const sesionGuardada = localStorage.getItem("wavetok_user_logged");
    if(sesionGuardada) {
      uAct = sesionGuardada;
      document.getElementById("modalRegistroInicial").style.display = "none";
      document.getElementById("txtPerfilID").innerText = "@" + uAct;
      document.getElementById("labelFooterMyCode").innerHTML = `Tu Nombre: <b>${uAct}</b>`;
      
      const cleanPeerId = uAct.replace(/[^a-zA-Z0-9_-]/g, "");
      peer = new Peer(cleanPeerId);
      
      peer.on('call', (c) => { 
        navigator.mediaDevices.getUserMedia({video:true, audio:true}).then(s => { 
          streamLoc = s; 
          document.getElementById("localVideo").srcObject = s; 
          c.answer(s); 
          fCall(c); 
        }); 
      });

      onSnapshot(query(collection(db, "videos"), orderBy("timestamp", "desc")), (s) => { 
        vids = []; s.forEach(d => vids.push({id:d.id, ...d.data()})); 
        filtrarFeed(); 
      });
      
      amigos = JSON.parse(localStorage.getItem("v_amigos_"+uAct) || "[]"); 
      renderAmigos();
    }

    function fCall(c) { 
      callAct = c; 
      activarPantalla('chats'); 
      document.getElementById("screen-chats").classList.add("chat-abierto"); 
      c.on('stream', s => document.getElementById("remoteVideo").srcObject = s); 
    }

    window.llamarPeer = (v) => { 
      const cleanTargetId = amigoSel.replace(/[^a-zA-Z0-9_-]/g, "");
      navigator.mediaDevices.getUserMedia({video:v, audio:true}).then(s => { 
        streamLoc = s; 
        document.getElementById("localVideo").srcObject = s; 
        fCall(peer.call(cleanTargetId, s)); 
      }); 
    };

    window.activarPantalla = (t) => {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".menu-item").forEach(m => m.classList.remove("active"));
      document.getElementById(`screen-${t}`).classList.add("active");
      document.getElementById(`btn-${t}`)?.classList.add("active");
      if(t==='plataforma') playFeed(); else stopFeed();
    };

    window.abrirModal = (id) => document.getElementById(id).style.display = "flex";
    window.cerrarModal = (id) => document.getElementById(id).style.display = "none";

    window.subirVideo = () => {
      const f = document.getElementById("inputLocalVideo").files[0], u = document.getElementById("inputUrlVideo").value.trim(), c = document.getElementById("inputCaption").value;
      const save = (url) => addDoc(collection(db, "videos"), { autor: uAct, url, caption: c || "Video", likes: 0, timestamp: serverTimestamp() }).then(() => location.reload());
      if(f) { const r = new FileReader(); r.onload = (e) => save(e.target.result); r.readAsDataURL(f); } else if(u) save(u);
    };

    let fVids = [];
    window.filtrarFeed = () => {
      const t = document.getElementById("inputBuscar").value.toLowerCase();
      fVids = t ? vids.filter(v => v.caption.toLowerCase().includes(t)) : [...vids];
      const i = document.getElementById("tokFeedIterator"); i.innerHTML = "";
      fVids.forEach((v, idx) => {
        const p = document.createElement("div"); p.className = "tok-post"; p.id = `vref-${idx}`;
        p.innerHTML = `<div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
          <video class="tok-video" src="${v.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
          <div class="tok-actions"><button class="circle-action" onclick="event.stopPropagation(); updateDoc(doc(db,'videos','${v.id}'),{likes:increment(1)})"><i class="fa-solid fa-heart"></i></button><span>${v.likes}</span></div>
          <div class="tok-meta"><h3>@${v.autor}</h3><p>${v.caption}</p></div></div>`;
        i.appendChild(p);
      });
      playFeed();
    };

    window.navegarFeed = (d) => { if(idxFeed+d >= 0 && idxFeed+d < fVids.length) { idxFeed += d; document.getElementById(`vref-${idxFeed}`).scrollIntoView({behavior:"smooth"}); playFeed(); } };
    function playFeed() { stopFeed(); document.getElementById(`vref-${idxFeed}`)?.querySelector("video")?.play().catch(()=>{}); }
    function stopFeed() { document.querySelectorAll(".tok-video").forEach(v => v.pause()); }

    window.agregarAmigo = () => { 
      let id = document.getElementById("peerIdDestino").value.trim(); 
      if(id) {
        if (!id.toUpperCase().startsWith("XD-")) {
          id = "XD-" + id;
        }
        if(!amigos.includes(id)) { 
          amigos.push(id); 
          localStorage.setItem("v_amigos_"+uAct, JSON.stringify(amigos)); 
          renderAmigos(); 
        } 
        cerrarModal('connectModal'); 
        abrirChat(id);
      }
    };

    function renderAmigos() {
      const c = document.getElementById("chatListContainer"); c.innerHTML = "";
      amigos.forEach(a => { const d = document.createElement("div"); d.className = "chat-item"; d.onclick = () => abrirChat(a); d.innerHTML = `<h5>${a}</h5>`; c.appendChild(d); });
    }

    let snapMsg = null;
    function abrirChat(a) {
      amigoSel = a; document.getElementById("screen-chats").classList.add("chat-abierto");
      document.getElementById("chatDetailHeader").style.visibility = "visible"; document.getElementById("chatInputBarArea").style.display = "flex";
      document.getElementById("targetChatName").innerText = a; if(snapMsg) snapMsg();
      
      const sId = [uAct.replace(/[^a-zA-Z0-9_-]/g,""), a.replace(/[^a-zA-Z0-9_-]/g,"")].sort().join("___");
      snapMsg = onSnapshot(query(collection(db, "chats_privados", sId, "mensajes"), orderBy("timestamp", "asc")), (s) => {
        const b = document.getElementById("msgBox"); b.innerHTML = "";
        s.forEach(d => { 
          const m = d.data(); 
          const div = document.createElement("div"); 
          div.className = `bubble ${m.remitente===uAct?'sent':'recv'}`; 
          div.innerText = m.contenido; 
          b.appendChild(div); 
        });
        b.scrollTop = b.scrollHeight;
      });
    }

    window.enviarTexto = () => {
      const i = document.getElementById("chatInput"); if(!i.value.trim()) return;
      const sId = [uAct.replace(/[^a-zA-Z0-9_-]/g,""), amigoSel.replace(/[^a-zA-Z0-9_-]/g,"")].sort().join("___");
      addDoc(collection(db, "chats_privados", sId, "mensajes"), { remitente: uAct, contenido: i.value.trim(), timestamp: serverTimestamp() });
      i.value = "";
    };
  </script>
</body>
</html>
