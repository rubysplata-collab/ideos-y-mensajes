<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>JHEILER - Tu plataforma de videos</title>
    
    <!-- ===== FONT AWESOME (Iconos profesionales) ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22JHEILER%22,%22short_name%22:%22JHEILER%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%230f0f0f%22,%22theme_color%22:%22%23ff304f%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3670/3670147.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22,%22purpose%22:%22any%22}]}"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ===== RESET Y VARIABLES ===== */
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --panel2: #212121;
            --accent: #ff304f;
            --border: #303030;
            --text-secondary: #aaa;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            z-index: 200;
            backdrop-filter: blur(12px);
            background: rgba(15,15,15,0.92);
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .brand i {
            font-size: 26px;
            color: var(--accent);
        }

        .create-btn {
            padding: 10px 20px;
            background: var(--accent);
            border-radius: 24px;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-btn i {
            font-size: 16px;
        }

        .create-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 24px rgba(255,48,79,0.35);
        }

        /* ===== SIDEBAR ===== */
        aside {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            padding-top: 12px;
            overflow-y: auto;
            z-index: 100;
        }

        .sb-section {
            padding: 6px 0 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .sb-title {
            padding: 6px 24px 8px 24px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 8px;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .sb-item:hover {
            background: var(--panel2);
        }

        .sb-item i {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: var(--text-secondary);
        }

        .sb-item:hover i {
            color: #fff;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            margin-left: 220px;
            padding: 80px 24px 40px 24px;
            min-height: 100vh;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 28px 20px;
        }

        .video-card {
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--panel2);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumb img {
            transform: scale(1.02);
        }

        .play-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .play-overlay i {
            font-size: 14px;
            color: var(--accent);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .card-meta i {
            margin-right: 4px;
            font-size: 12px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            color: var(--border);
        }

        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #fff;
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: var(--panel);
            padding: 28px 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .modal-content h3 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content h3 i {
            color: var(--accent);
        }

        .modal-content input,
        .modal-content textarea {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: #fff;
            font-size: 14px;
            transition: border 0.2s ease;
            width: 100%;
        }

        .modal-content input:focus,
        .modal-content textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 0 24px rgba(255,48,79,0.3);
        }

        .btn-secondary {
            background: var(--panel2);
            color: #aaa;
        }

        .btn-secondary:hover {
            background: var(--border);
            color: #fff;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            padding: 10px;
            background: var(--panel2);
            border-radius: 10px;
            border: 1px dashed var(--border);
            cursor: pointer;
            width: 100%;
        }

        .file-input-wrapper input[type="file"]::file-selector-button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
        }

        .file-input-wrapper i {
            margin-right: 6px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 2000;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            font-size: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            aside {
                display: none;
            }
            main {
                margin-left: 0;
                padding: 76px 16px 24px 16px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
            .brand {
                font-size: 18px;
            }
            .brand i {
                font-size: 20px;
            }
            .create-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="brand">
            <i class="fas fa-play"></i> JHEILER
        </div>
        <button class="create-btn" id="btnOpenModal">
            <i class="fas fa-plus"></i> Crear
        </button>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside>
        <div class="sb-section">
            <a class="sb-item" href="#">
                <i class="fas fa-home"></i> Inicio
            </a>
            <a class="sb-item" href="#">
                <i class="fas fa-bolt"></i> Shorts
            </a>
            <a class="sb-item" href="#">
                <i class="fas fa-tv"></i> Suscripciones
            </a>
        </div>
        <div class="sb-section">
            <div class="sb-title">Biblioteca</div>
            <a class="sb-item" href="#">
                <i class="fas fa-clock"></i> Historial
            </a>
            <a class="sb-item" href="#">
                <i class="fas fa-video"></i> Tus videos
            </a>
            <a class="sb-item" href="#">
                <i class="fas fa-heart"></i> Favoritos
            </a>
            <a class="sb-item" href="#">
                <i class="fas fa-clock"></i> Ver después
            </a>
        </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="video-grid" id="videoGrid"></div>
    </main>

    <script>
        // ===== CONFIG =====
        const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const grid = document.getElementById('videoGrid');

        // ===== TOAST NOTIFICATION =====
        function showToast(message, type = 'info', duration = 2500) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `<i class="${iconMap[type] || iconMap.info}"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ===== CARGAR VIDEOS =====
        async function loadVideos() {
            try {
                const { data, error } = await sb
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-video"></i>
                            <h3>No hay videos aún</h3>
                            <p style="color:#666;margin-top:8px;">¡Sé el primero en subir contenido!</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = data.map(v => `
                    <div class="video-card" onclick="playVideo('${v.video_url}')">
                        <div class="thumb">
                            <img src="${v.thumbnail_url || ''}" 
                                 alt="${v.title || 'Video'}"
                                 loading="lazy"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22%3E%3Crect fill=%22%23212121%22 width=%22320%22 height=%22180%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2232%22%3E🎬%3C/text%3E%3C/svg%3E'">
                            <div class="play-overlay">
                                <i class="fas fa-play"></i> Reproducir
                            </div>
                        </div>
                        <div class="card-title">${v.title || 'Sin título'}</div>
                        <div class="card-meta">
                            <i class="far fa-calendar-alt"></i> ${new Date(v.created_at).toLocaleDateString('es-ES')}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error cargando videos:', err);
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error al cargar</h3>
                        <p style="color:#666;">Intenta de nuevo más tarde</p>
                    </div>
                `;
            }
        }

        // ===== REPRODUCIR VIDEO =====
        window.playVideo = function(url) {
            if (!url) return showToast('Video no disponible', 'error');
            window.open(url, '_blank');
        };

        // ===== ABRIR MODAL =====
        document.getElementById('btnOpenModal').onclick = () => {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>
                        <i class="fas fa-upload"></i> Subir video
                    </h3>
                    <input type="text" id="upTitle" placeholder="Título del video" maxlength="100">
                    <textarea id="upDesc" placeholder="Descripción (opcional)" maxlength="500"></textarea>
                    <div class="file-input-wrapper">
                        <input type="file" id="upVideo" accept="video/*" required>
                        <small style="color:#666;display:block;margin-top:4px;">
                            <i class="fas fa-info-circle"></i> Máx. 100MB
                        </small>
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="upThumb" accept="image/*">
                        <small style="color:#666;display:block;margin-top:4px;">
                            <i class="fas fa-info-circle"></i> Miniatura (opcional)
                        </small>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-primary" id="btnUpload">
                            <i class="fas fa-cloud-upload-alt"></i> Publicar
                        </button>
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnUpload').onclick = async () => {
                const title = document.getElementById('upTitle').value.trim();
                const desc = document.getElementById('upDesc').value.trim();
                const videoFile = document.getElementById('upVideo').files[0];
                const thumbFile = document.getElementById('upThumb').files[0];

                if (!title) return showToast('Escribe un título', 'warning');
                if (!videoFile) return showToast('Selecciona un video', 'warning');
                if (videoFile.size > 100 * 1024 * 1024) {
                    return showToast('El video no debe superar 100MB', 'error');
                }

                const btn = document.getElementById('btnUpload');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';
                btn.disabled = true;

                try {
                    // Subir video
                    const vName = `${Date.now()}_${videoFile.name}`;
                    const { error: vErr } = await sb.storage.from('videos').upload(vName, videoFile);
                    if (vErr) throw vErr;

                    const { data: vData } = sb.storage.from('videos').getPublicUrl(vName);
                    let thumbUrl = '';

                    // Subir thumbnail (opcional)
                    if (thumbFile) {
                        const tName = `${Date.now()}_${thumbFile.name}`;
                        const { error: tErr } = await sb.storage.from('thumbnails').upload(tName, thumbFile);
                        if (!tErr) {
                            const { data: tData } = sb.storage.from('thumbnails').getPublicUrl(tName);
                            thumbUrl = tData.publicUrl;
                        }
                    }

                    // Guardar en base de datos
                    const { error: insertErr } = await sb.from('videos').insert({
                        title,
                        description: desc || null,
                        video_url: vData.publicUrl,
                        thumbnail_url: thumbUrl
                    });

                    if (insertErr) throw insertErr;

                    modal.remove();
                    showToast('¡Video publicado con éxito! 🎉', 'success');
                    loadVideos();
                } catch (err) {
                    console.error('Error al subir:', err);
                    showToast('Error al publicar: ' + err.message, 'error');
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Publicar';
                    btn.disabled = false;
                }
            };
        };

        // ===== SERVICE WORKER =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        // ===== INICIALIZAR =====
        loadVideos();
    </script>
</body>
</html>
