<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat - Mensajería P2P Real</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg-principal: #0b0e14;
      --bg-tarjeta: #151d26;
      --verde-neon: #00e676;
      --rojo-neon: #ff1744;
      --texto-blanco: #f5f5f7;
      --texto-mutado: #8b9bb4;
      --burbuja-enviado: #002d62; /* Color de tus mensajes en la captura */
      --burbuja-recibido: #1f2c34; /* Color de los mensajes de Fer */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-principal);
      color: var(--texto-blanco);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 820px;
      background-color: var(--bg-tarjeta);
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    /* --- PANTALLA PRINCIPAL: CONEXIÓN --- */
    .app-header {
      padding: 18px 20px;
      background-color: #1f2c34;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-header h2 {
      font-size: 1.3rem;
      color: var(--verde-neon);
      font-weight: 700;
    }

    .setup-box {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      background-color: #121b22;
      justify-content: center;
    }

    .id-card {
      background-color: rgba(255,255,255,0.03);
      border: 1px dashed rgba(0, 230, 118, 0.3);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

    .id-card p {
      color: var(--texto-mutado);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .id-card strong {
      font-size: 1.4rem;
      color: var(--verde-neon);
      letter-spacing: 1px;
    }

    .connect-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .connect-input {
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(0,0,0,0.2);
      color: white;
      outline: none;
      font-size: 0.95rem;
      text-align: center;
    }

    .connect-btn {
      padding: 14px;
      background-color: var(--verde-neon);
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .connect-btn:hover {
      background-color: #00b359;
    }

    /* --- PANTALLA DE CHAT ESTILO TIKTOK --- */
    .chat-active-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #0b141a;
    }

    .chat-active-header {
      padding: 12px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #e91e63;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .chat-messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-bubble.sent {
      background-color: var(--burbuja-enviado);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message-bubble.received {
      background-color: var(--burbuja-recibido);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message-media {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
      display: block;
    }

    .chat-input-bar {
      padding: 10px 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      outline: none;
    }

    .icon-btn {
      font-size: 1.3rem;
      color: var(--verde-neon);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* --- PANTALLA DE VIDEOLLAMADA --- */
    .call-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      z-index: 200;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }

    .video-call-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .local-video {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 110px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--verde-neon);
      z-index: 10;
      transform: scaleX(-1);
    }

    .call-controls {
      position: relative;
      z-index: 10;
      display: flex;
      gap: 25px;
      margin-bottom: 20px;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .control-btn.decline {
      background-color: var(--rojo-neon);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div class="call-screen" id="callScreen">
      <div class="video-call-grid">
        <video id="localVideo" class="local-video" autoplay playsinline muted></video>
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
      </div>
      <div style="position: relative; z-index: 10; text-align: center; margin-top: 180px;">
        <h3 id="callContactName" style="text-shadow: 0 2px 10px #000;">Conectando...</h3>
      </div>
      <div class="call-controls">
        <button class="control-btn decline" onclick="colgarLlamada()">📞</button>
      </div>
    </div>

    <div class="screen active" id="setupScreen">
      <header class="app-header">
        <h2>WaveChat Real</h2>
      </header>

      <div class="setup-box">
        <div class="id-card">
          <p>Tu código único para que te agreguen:</p>
          <strong id="myPeerId">Generando código...</strong>
        </div>

        <div class="connect-form">
          <p style="font-size: 0.85rem; color: var(--texto-mutado); text-align: center;">O pon aquí el código de tu amigo:</p>
          <input type="text" id="destPeerId" class="connect-input" placeholder="Pegar código wave-XXXX">
          <button class="connect-btn" onclick="conectarConAmigo()">Empezar a Chatear</button>
        </div>
      </div>
    </div>

    <div class="screen" id="activeChatScreen">
      <div class="chat-active-container">
        <header class="chat-active-header">
          <button class="back-btn" onclick="regresarAlInicio()">◀</button>
          <div class="chat-avatar" id="activeAvatar">U</div>
          <div style="flex: 1;">
            <h4 id="activeContactName" style="font-size: 1rem;">Amigo</h4>
            <span style="font-size: 0.75rem; color: var(--verde-neon);">En línea (P2P Seguro)</span>
          </div>
          <button class="icon-btn" onclick="iniciarLlamada()">📹</button>
        </header>

        <div class="chat-messages-box" id="chatMessagesBox">
          <div style="text-align:center; color:var(--texto-mutado); font-size:0.8rem;">
            Conectados directamente de extremo a extremo.
          </div>
        </div>

        <div class="chat-input-bar">
          <label class="icon-btn" title="Mandar Foto o Video">
            📷
            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="enviarArchivo()">
          </label>
          <input type="text" id="chatInputMessage" class="chat-input" placeholder="Enviar un mensaje...">
          <button class="icon-btn" onclick="enviarMensajeTexto()">➤</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let peer;
    let dataConnection = null;
    let mediaCall = null;
    let localStream = null;
    let amigoId = "";

    // Generar un código único aleatorio amigable
    const randomCode = 'wave-' + Math.floor(1000 + Math.random() * 9000);
    peer = new Peer(randomCode);

    peer.on('open', (id) => {
      document.getElementById('myPeerId').innerText = id;
    });

    // Escuchar cuando alguien se conecta a nosotros usando nuestro código
    peer.on('connection', (conn) => {
      dataConnection = conn;
      amigoId = conn.peer;
      configurarEventosChat();
      abrirPantallaDeChat(amigoId);
    });

    // Escuchar videollamadas entrantes
    peer.on('call', async (call) => {
      if (confirm(`¿Contestar videollamada de ${call.peer}?`)) {
        mediaCall = call;
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById('localVideo').srcObject = localStream;
          
          call.answer(localStream);
          document.getElementById('callScreen').style.display = 'flex';
          document.getElementById('callContactName').innerText = call.peer;

          call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
          });
        } catch (err) {
          alert("No se pudo iniciar la cámara/micrófono para contestar.");
        }
      } else {
        call.close();
      }
    });

    // Conectarnos de forma activa usando el código de un amigo
    function conectarConAmigo() {
      const destId = document.getElementById('destPeerId').value.trim();
      if (!destId) return alert("Ingresa un código válido.");
      if (destId === peer.id) return alert("No puedes conectarte a ti mismo.");

      dataConnection = peer.connect(destId);
      amigoId = destId;
      
      dataConnection.on('open', () => {
        configurarEventosChat();
        abrirPantallaDeChat(destId);
      });
    }

    function configurarEventosChat() {
      dataConnection.on('data', (data) => {
        const chatBox = document.getElementById('chatMessagesBox');
        
        if (data.type === 'text') {
          chatBox.innerHTML += `<div class="message-bubble received">${data.content}</div>`;
        } else if (data.type === 'file') {
          const blob = new Blob([data.fileData], { type: data.fileType });
          const url = URL.createObjectURL(blob);
          
          if (data.fileType.startsWith('image/')) {
            chatBox.innerHTML += `
              <div class="message-bubble received">
                <img src="${url}" class="message-media" alt="Foto recibida">
              </div>`;
          } else if (data.fileType.startsWith('video/')) {
            chatBox.innerHTML += `
              <div class="message-bubble received">
                <video src="${url}" class="message-media" controls></video>
              </div>`;
          }
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function abrirPantallaDeChat(peerId) {
      document.getElementById('setupScreen').classList.remove('active');
      document.getElementById('activeChatScreen').classList.add('active');
      document.getElementById('activeContactName').innerText = peerId;
      document.getElementById('activeAvatar').innerText = peerId.substring(5, 7).toUpperCase();
    }

    function regresarAlInicio() {
      document.getElementById('activeChatScreen').classList.remove('active');
      document.getElementById('setupScreen').classList.add('active');
    }

    // --- ENVIAR MENSAJES REALES ---
    function enviarMensajeTexto() {
      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text || !dataConnection) return;

      // Enviar el mensaje al amigo
      dataConnection.send({
        type: 'text',
        content: text
      });

      // Pintarlo en nuestra pantalla (Estilo enviado: azul)
      const chatBox = document.getElementById('chatMessagesBox');
      chatBox.innerHTML += `<div class="message-bubble sent">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- ENVIAR FOTOS/VIDEOS REALES ---
    function enviarArchivo() {
      const fileInput = document.getElementById('mediaInput');
      if (fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const fileData = event.target.result;
        
        // Enviamos el archivo completo a través de la conexión directa
        dataConnection.send({
          type: 'file',
          fileData: fileData,
          fileName: file.name,
          fileType: file.type
        });

        // Mostrarlo en nuestra pantalla localmente
        const url = URL.createObjectURL(file);
        const chatBox = document.getElementById('chatMessagesBox');
        
        if (file.type.startsWith('image/')) {
          chatBox.innerHTML += `
            <div class="message-bubble sent">
              <img src="${url}" class="message-media" alt="Foto">
            </div>`;
        } else if (file.type.startsWith('video/')) {
          chatBox.innerHTML += `
            <div class="message-bubble sent">
              <video src="${url}" class="message-media" controls></video>
            </div>`;
        }
        
        fileInput.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
      };

      reader.readAsArrayBuffer(file);
    }

    document.getElementById('chatInputMessage').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') enviarMensajeTexto();
    });

    // --- VIDEOLLAMADAS REALES ---
    async function iniciarLlamada() {
      if (!amigoId) return;

      document.getElementById('callScreen').style.display = 'flex';
      document.getElementById('callContactName').innerText = amigoId;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        mediaCall = peer.call(amigoId, localStream);

        mediaCall.on('stream', (remoteStream) => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });

      } catch (err) {
        alert("Error al abrir cámara o micrófono.");
        colgarLlamada();
      }
    }

    function colgarLlamada() {
      if (mediaCall) {
        mediaCall.close();
        mediaCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('callScreen').style.display = 'none';
    }
  </script>
</body>
</html>
