<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnyDesk · IDs Cortos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #12122a;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2a3a5e;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #2a3a5e;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 20px;
            font-weight: 700;
        }

        .logo i {
            font-size: 28px;
            color: #4a9eff;
        }

        .logo span {
            color: #4a9eff;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #1a2a4a;
            border-radius: 30px;
            font-size: 13px;
            color: #8ab4e6;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            display: inline-block;
            transition: 0.3s;
        }

        .status-dot.connected {
            background: #44ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Tarjeta de ID */
        .id-card {
            background: #0a1a3a;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1a2a4a;
            margin-bottom: 14px;
        }

        .id-card label {
            color: #8ab4e6;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .id-card label i {
            margin-right: 8px;
            color: #4a9eff;
        }

        .id-input-group {
            display: flex;
            gap: 10px;
        }

        .id-input-group input {
            flex: 1;
            padding: 14px 16px;
            background: #0a0a1a;
            border: 2px solid #2a4a7a;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1px;
            outline: none;
            transition: 0.3s;
        }

        .id-input-group input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.2);
        }

        .id-input-group input::placeholder {
            color: #4a6a8a;
            font-weight: 400;
            font-size: 14px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            touch-action: manipulation;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: #4a9eff;
            color: white;
        }

        .btn-primary:hover {
            background: #6ab4ff;
        }

        .btn-success {
            background: #44d47c;
            color: white;
        }

        .btn-success:hover {
            background: #66e89a;
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        .btn-danger:hover {
            background: #ff6666;
        }

        .btn-secondary {
            background: #1a2a4a;
            color: #a0b4d6;
        }

        .btn-secondary:hover {
            background: #2a4a7a;
            color: white;
        }

        .btn-sm {
            padding: 10px 16px;
            font-size: 13px;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-group .btn {
            flex: 1;
            justify-content: center;
        }

        /* Video */
        .video-wrapper {
            background: #0a0a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #1a2a4a;
            margin: 14px 0;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video {
            width: 100%;
            display: none;
            background: #0a0a1a;
        }

        .placeholder {
            color: #4a6a8a;
            text-align: center;
            padding: 40px 20px;
        }

        .placeholder i {
            font-size: 48px;
            color: #2a4a7a;
            margin-bottom: 12px;
            display: block;
        }

        .placeholder h3 {
            color: #8ab4e6;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .placeholder p {
            font-size: 13px;
        }

        /* Controles rápidos */
        .quick-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .quick-controls .btn {
            justify-content: center;
            padding: 12px 8px;
            font-size: 13px;
            background: #1a2a4a;
            color: #a0b4d6;
            border: 1px solid #2a4a7a;
            border-radius: 10px;
        }

        .quick-controls .btn:active {
            background: #2a4a7a;
        }

        .quick-controls .btn i {
            font-size: 18px;
            display: block;
            margin-bottom: 4px;
        }

        .quick-controls .btn-primary {
            background: #4a9eff;
            color: white;
            border-color: #4a9eff;
        }

        .quick-controls .btn-danger {
            background: #ff4444;
            color: white;
            border-color: #ff4444;
        }

        /* Chat */
        .chat-box {
            background: #0a1a3a;
            border-radius: 12px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            border: 1px solid #1a2a4a;
            margin: 10px 0;
        }

        .chat-message {
            color: #a0b4d6;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid #0d1b3e;
        }

        .chat-message:last-child {
            border-bottom: none;
        }

        .chat-message .sender {
            color: #4a9eff;
            font-weight: 600;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 12px 16px;
            background: #0a1a3a;
            border: 1px solid #2a4a7a;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .chat-input-group input:focus {
            border-color: #4a9eff;
        }

        .chat-input-group .btn {
            padding: 12px 18px;
        }

        /* Info */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #0a1a3a;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            color: #6a8aaa;
        }

        .info-bar .id-value {
            color: #4a9eff;
            font-weight: 600;
            cursor: pointer;
            word-break: break-all;
        }

        .info-bar .id-value:active {
            opacity: 0.7;
        }

        .info-bar .badge {
            background: #1a2a5a;
            padding: 4px 14px;
            border-radius: 20px;
            color: #8ab4e6;
            font-size: 12px;
        }

        .tip {
            background: #1a2a4a;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            color: #8ab4e6;
            border-left: 4px solid #4a9eff;
            margin-top: 12px;
        }

        .tip code {
            background: #0a1a3a;
            padding: 2px 8px;
            border-radius: 4px;
            color: #4a9eff;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 14px; }
            .id-input-group { flex-direction: column; }
            .btn-group .btn { flex: 1 1 100%; }
            .quick-controls { grid-template-columns: repeat(3, 1fr); }
            .header { flex-direction: column; align-items: stretch; }
            .status-badge { justify-content: center; }
        }

        @media (max-width: 400px) {
            .quick-controls { grid-template-columns: repeat(2, 1fr); }
            .logo { font-size: 17px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-desktop"></i>
            <span>Any<span>Desk</span></span>
            <span style="font-size:12px;color:#4a6a8a;font-weight:400;">IDs cortos</span>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Desconectado</span>
        </div>
    </div>

    <!-- ===== TU ID ===== -->
    <div class="id-card">
        <label><i class="fas fa-id-card"></i> TU ID (elige uno corto)</label>
        <div class="id-input-group">
            <input type="text" id="myIdInput" placeholder="ej: casa, ofi, pc01" value="casa-123">
            <button class="btn btn-primary" onclick="startWithId()">
                <i class="fas fa-play"></i> Iniciar
            </button>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary btn-sm" onclick="generateRandomId()">
                <i class="fas fa-random"></i> Aleatorio
            </button>
            <button class="btn btn-secondary btn-sm" onclick="copyMyId()">
                <i class="fas fa-copy"></i> Copiar ID
            </button>
        </div>
    </div>

    <!-- ===== CONECTAR A OTRO ===== -->
    <div class="id-card">
        <label><i class="fas fa-plug"></i> CONECTAR A ID REMOTO</label>
        <div class="id-input-group">
            <input type="text" id="remoteIdInput" placeholder="ID de la otra persona" value="">
            <button class="btn btn-success" onclick="connectToRemote()">
                <i class="fas fa-arrow-right"></i> Conectar
            </button>
        </div>
        <div class="btn-group">
            <button class="btn btn-danger btn-sm" onclick="disconnectEverything()">
                <i class="fas fa-power-off"></i> Desconectar
            </button>
        </div>
    </div>

    <!-- ===== VIDEO ===== -->
    <div class="video-wrapper" id="videoWrapper">
        <div class="placeholder" id="placeholder">
            <i class="fas fa-wifi"></i>
            <h3>Esperando conexión...</h3>
            <p>Comparte tu ID para recibir una conexión</p>
        </div>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <!-- ===== CONTROLES RÁPIDOS ===== -->
    <div class="quick-controls">
        <button class="btn" onclick="sendKey('ctrl')">
            <i class="fas fa-keyboard"></i> Ctrl
        </button>
        <button class="btn" onclick="sendKey('alt')">
            <i class="fas fa-keyboard"></i> Alt
        </button>
        <button class="btn" onclick="sendKey('shift')">
            <i class="fas fa-keyboard"></i> Shift
        </button>
        <button class="btn" onclick="sendKey('esc')">
            <i class="fas fa-times"></i> Esc
        </button>
        <button class="btn btn-primary" onclick="toggleFullscreen()">
            <i class="fas fa-expand"></i> Full
        </button>
        <button class="btn btn-danger" onclick="disconnectEverything()">
            <i class="fas fa-power-off"></i> Salir
        </button>
    </div>

    <!-- ===== CHAT ===== -->
    <div class="chat-box" id="chatBox">
        <div class="chat-message"><span class="sender">Sistema:</span> Conéctate para chatear</div>
    </div>
    <div class="chat-input-group">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn btn-primary" onclick="sendChat()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- ===== INFO ===== -->
    <div class="info-bar">
        <span><i class="fas fa-id-card"></i> Mi ID: <span class="id-value" id="displayMyId" onclick="copyMyId()">---</span></span>
        <span class="badge" id="connectionBadge">🔒 Desconectado</span>
    </div>

    <!-- ===== TIP ===== -->
    <div class="tip">
        💡 <strong>IDs cortos:</strong> Usa palabras fáciles como <code>casa</code>, <code>ofi</code>, <code>pc01</code>.
        Quien da su ID, <strong>comparte su pantalla</strong>. Quien conecta, <strong>ve la pantalla</strong> del otro.
    </div>
</div>

<script>
    // ============================================================
    //  CONFIGURACIÓN
    // ============================================================
    let peer = null;
    let conn = null;
    let call = null;
    let isConnected = false;
    let myPeerId = null;

    // ============================================================
    //  INICIAR CON ID PERSONALIZADO
    // ============================================================
    function startWithId() {
        const id = document.getElementById('myIdInput').value.trim();
        if (!id) {
            alert('Elige un ID corto (ej: casa, oficina, pc01)');
            return;
        }

        // Cerrar conexión anterior
        if (peer) {
            peer.destroy();
            peer = null;
        }

        // Crear nuevo peer con ID personalizado
        peer = new Peer(id, {
            host: '0.peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (peerId) => {
            myPeerId = peerId;
            document.getElementById('displayMyId').textContent = peerId;
            updateStatus(true, `Conectado: ${peerId}`);
            document.getElementById('connectionBadge').textContent = '🟢 En línea';
            addChatMessage('Sistema', `✅ ID "${peerId}" activo. Compártelo para que te vean.`);
        });

        peer.on('error', (err) => {
            console.error('Error:', err);
            if (err.type === 'unavailable-id') {
                alert(`❌ El ID "${id}" ya está en uso. Elige otro.`);
                updateStatus(false, 'ID en uso');
            } else {
                alert('Error de conexión: ' + err.message);
                updateStatus(false, 'Error');
            }
        });

        // Escuchar conexiones entrantes (data)
        peer.on('connection', (incomingConn) => {
            if (conn) {
                incomingConn.close();
                return;
            }
            conn = incomingConn;
            setupDataConnection(conn);
        });

        // Escuchar llamadas entrantes (video)
        peer.on('call', (incomingCall) => {
            if (call) {
                incomingCall.answer();
                incomingCall.close();
                return;
            }

            // Compartir pantalla al recibir llamada
            navigator.mediaDevices.getDisplayMedia({
                video: {
                    cursor: 'always',
                    frameRate: 30
                },
                audio: true
            }).then((stream) => {
                incomingCall.answer(stream);
                setupCall(incomingCall);
                addChatMessage('Sistema', '📺 Compartiendo pantalla...');
            }).catch((err) => {
                console.error('Error al compartir:', err);
                addChatMessage('Sistema', '❌ Error al compartir pantalla');
                incomingCall.answer(); // Responder sin video
                incomingCall.close();
            });
        });
    }

    // ============================================================
    //  CONECTAR A ID REMOTO
    // ============================================================
    function connectToRemote() {
        const remoteId = document.getElementById('remoteIdInput').value.trim();
        if (!remoteId) {
            alert('Escribe el ID remoto (ej: casa, oficina)');
            return;
        }

        if (!peer) {
            alert('Primero inicia sesión con tu ID');
            return;
        }

        if (isConnected) {
            disconnectEverything();
            setTimeout(() => connectToRemote(), 300);
            return;
        }

        addChatMessage('Sistema', `🔗 Conectando a "${remoteId}"...`);

        // Conectar data channel
        conn = peer.connect(remoteId);
        conn.on('open', () => {
            setupDataConnection(conn);
        });

        conn.on('error', (err) => {
            console.error('Error de conexión:', err);
            addChatMessage('Sistema', `❌ Error al conectar con "${remoteId}"`);
            updateStatus(false, 'Error de conexión');
        });

        // Llamada de video
        navigator.mediaDevices.getDisplayMedia({
            video: {
                cursor: 'always',
                frameRate: 30
            },
            audio: true
        }).then((stream) => {
            call = peer.call(remoteId, stream);
            setupCall(call);
            addChatMessage('Sistema', '📺 Compartiendo pantalla...');
        }).catch((err) => {
            console.error('Error al compartir:', err);
            addChatMessage('Sistema', '❌ Error al compartir pantalla');
        });
    }

    // ============================================================
    //  SETUP CONEXIONES
    // ============================================================
    function setupDataConnection(connection) {
        conn = connection;
        isConnected = true;
        updateStatus(true, `Conectado a ${conn.peer}`);
        document.getElementById('connectionBadge').textContent = `🔗 Conectado a ${conn.peer}`;
        addChatMessage('Sistema', `✅ Conectado a "${conn.peer}"`);

        conn.on('data', (data) => {
            if (data.type === 'chat') {
                addChatMessage('Remoto', data.data);
            } else if (data.type === 'key') {
                addChatMessage('Sistema', `⌨️ Tecla remota: ${data.data}`);
            }
        });

        conn.on('close', () => {
            addChatMessage('Sistema', '⛔ El otro usuario se desconectó');
            disconnectEverything();
        });
    }

    function setupCall(incomingCall) {
        call = incomingCall;

        incomingCall.on('stream', (stream) => {
            const video = document.getElementById('remoteVideo');
            video.srcObject = stream;
            video.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            addChatMessage('Sistema', '📺 Video recibido');
        });

        incomingCall.on('close', () => {
            addChatMessage('Sistema', '⛔ Transmisión de video terminada');
            const video = document.getElementById('remoteVideo');
            video.style.display = 'none';
            video.srcObject = null;
            document.getElementById('placeholder').style.display = 'block';
        });

        incomingCall.on('error', (err) => {
            console.error('Call error:', err);
            disconnectEverything();
        });
    }

    // ============================================================
    //  ENVIAR DATOS
    // ============================================================
    function sendData(type, data) {
        if (!conn || !isConnected) {
            addChatMessage('Sistema', '⚠️ No estás conectado');
            return false;
        }
        try {
            conn.send({ type: type, data: data });
            return true;
        } catch (e) {
            console.error('Error al enviar:', e);
            return false;
        }
    }

    function sendKey(key) {
        if (!isConnected) {
            addChatMessage('Sistema', '⚠️ Conéctate primero');
            return;
        }
        sendData('key', key);
        addChatMessage('Tú', `⌨️ Tecla: ${key}`);
    }

    function sendChat() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        if (!isConnected) {
            addChatMessage('Sistema', '⚠️ Conéctate primero');
            input.value = '';
            return;
        }
        sendData('chat', msg);
        addChatMessage('Tú', msg);
        input.value = '';
    }

    // ============================================================
    //  UTILIDADES
    // ============================================================
    function updateStatus(connected, text) {
        const dot = document.getElementById('statusDot');
        const label = document.getElementById('statusText');
        if (connected) {
            dot.className = 'status-dot connected';
        } else {
            dot.className = 'status-dot';
        }
        label.textContent = text;
    }

    function disconnectEverything() {
        if (call) {
            call.close();
            call = null;
        }
        if (conn) {
            conn.close();
            conn = null;
        }
        isConnected = false;
        const video = document.getElementById('remoteVideo');
        video.style.display = 'none';
        video.srcObject = null;
        document.getElementById('placeholder').style.display = 'block';
        updateStatus(false, 'Desconectado');
        document.getElementById('connectionBadge').textContent = '🔒 Desconectado';
        addChatMessage('Sistema', '⛔ Desconectado');
    }

    function generateRandomId() {
        const palabras = ['casa', 'ofi', 'pc', 'lab', 'home', 'work', 'server', 'laptop', 'escritorio', 'movil'];
        const num = Math.floor(Math.random() * 1000);
        const id = palabras[Math.floor(Math.random() * palabras.length)] + '-' + num;
        document.getElementById('myIdInput').value = id;
        addChatMessage('Sistema', `🎲 ID sugerido: ${id}`);
    }

    function copyMyId() {
        const id = document.getElementById('displayMyId').textContent;
        if (id && id !== '---') {
            navigator.clipboard.writeText(id).then(() => {
                addChatMessage('Sistema', `📋 ID "${id}" copiado al portapapeles`);
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = id;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                addChatMessage('Sistema', `📋 ID "${id}" copiado`);
            });
        }
    }

    function toggleFullscreen() {
        const container = document.querySelector('.container');
        if (!document.fullscreenElement) {
            container.requestFullscreen().catch(err => {
                console.log('Error al entrar en fullscreen:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }

    function addChatMessage(sender, message) {
        const chatBox = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `<span class="sender">${sender}:</span> ${message}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ============================================================
    //  AUTO INICIO AL CARGAR
    // ============================================================
    window.onload = function() {
        // Generar ID aleatorio por defecto
        const palabras = ['casa', 'ofi', 'pc', 'lab', 'home'];
        const num = Math.floor(Math.random() * 1000);
        document.getElementById('myIdInput').value = palabras[Math.floor(Math.random() * palabras.length)] + '-' + num;
        
        // Iniciar automáticamente
        setTimeout(startWithId, 500);
    };

    // Prevenir cierre accidental
    window.addEventListener('beforeunload', () => {
        if (isConnected) {
            disconnectEverything();
        }
    });
</script>

</body>
</html>
