<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat por Código</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0f1117;
    --panel:#171a23;
    --panel2:#1e2230;
    --accent:#6c5ce7;
    --accent2:#00d2a0;
    --text:#eef0f5;
    --muted:#8b90a3;
    --bubble-me:#6c5ce7;
    --bubble-other:#242838;
    --danger:#ff5c72;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,#0f1117,#161a24);
    color:var(--text);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- PANTALLA DE CONEXIÓN ---------- */
  #connectScreen{
    width:100%;
    max-width:420px;
    padding:32px 28px;
    background:var(--panel);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
  }
  #connectScreen h1{
    font-size:22px;
    margin-bottom:4px;
  }
  #connectScreen p.sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:24px;
  }
  .code-box{
    background:var(--panel2);
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
  }
  .code-box label{
    font-size:12px;
    color:var(--muted);
    display:block;
    margin-bottom:8px;
    text-align:left;
  }
  input#roomCodeInput{
    width:100%;
    padding:16px;
    border-radius:10px;
    border:1px solid #2a2f42;
    background:#11141c;
    color:var(--accent2);
    font-size:22px;
    font-weight:700;
    letter-spacing:2px;
    text-align:center;
    outline:none;
    text-transform:lowercase;
  }
  input#roomCodeInput:focus{border-color:var(--accent);}
  .copy-hint{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
  }
  .copy-hint a{color:var(--muted);}
  input#nameInput{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #2a2f42;
    background:#11141c;
    color:var(--text);
    font-size:15px;
    margin-bottom:12px;
    outline:none;
  }
  input#nameInput:focus{border-color:var(--accent);}
  button{
    cursor:pointer;
    border:none;
    font-family:inherit;
  }
  #connectBtn{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,var(--accent),#8a7ff0);
    color:#fff;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
  }
  #connectBtn:disabled{opacity:.5;cursor:not-allowed;}
  #statusMsg{
    margin-top:16px;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
  }
  #statusMsg.error{color:var(--danger);}
  #statusMsg.ok{color:var(--accent2);}

  /* ---------- PANTALLA DE CHAT ---------- */
  #chatScreen{
    width:100%;
    max-width:480px;
    height:90vh;
    max-height:800px;
    background:var(--panel);
    border-radius:20px;
    display:none;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #chatHeader{
    padding:16px 18px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #2a2f42;
  }
  #chatHeader .info{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .peer-label{font-size:14px;font-weight:600;}
  .peer-status{font-size:11px;color:var(--accent2);}
  #disconnectBtn{
    background:transparent;
    color:var(--danger);
    font-size:12px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid rgba(255,92,114,.3);
  }
  #clearHistBtn{
    background:transparent;
    color:var(--muted);
    font-size:14px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #2a2f42;
    margin-left:6px;
  }
  #clearHistBtn:hover{color:var(--danger);border-color:rgba(255,92,114,.3);}
  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #messages::-webkit-scrollbar{width:6px;}
  #messages::-webkit-scrollbar-thumb{background:#2a2f42;border-radius:10px;}

  .msg-row{display:flex;max-width:80%;}
  .msg-row.me{align-self:flex-end;justify-content:flex-end;}
  .msg-row.other{align-self:flex-start;}
  .bubble{
    padding:10px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .msg-row.me .bubble{
    background:var(--bubble-me);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg-row.other .bubble{
    background:var(--bubble-other);
    border-bottom-left-radius:4px;
  }
  .sender-name{
    font-size:11px;
    color:var(--accent2);
    margin-bottom:3px;
    font-weight:600;
  }
  .bubble img{
    max-width:220px;
    border-radius:10px;
    display:block;
    margin-top:4px;
    cursor:pointer;
  }
  .bubble audio{
    margin-top:4px;
    width:220px;
    height:36px;
  }
  .msg-time{
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
    text-align:right;
  }
  .system-msg{
    align-self:center;
    font-size:11px;
    color:var(--muted);
    background:var(--panel2);
    padding:6px 12px;
    border-radius:20px;
  }

  #inputBar{
    padding:12px 14px;
    background:var(--panel2);
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid #2a2f42;
  }
  #inputBar textarea{
    flex:1;
    resize:none;
    background:#11141c;
    border:1px solid #2a2f42;
    color:var(--text);
    border-radius:20px;
    padding:10px 16px;
    font-size:14px;
    max-height:100px;
    outline:none;
    font-family:inherit;
  }
  .icon-btn{
    width:40px;height:40px;
    border-radius:50%;
    background:#2a2f42;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .icon-btn:hover{background:#343a52;}
  #sendBtn{
    background:linear-gradient(135deg,var(--accent),#8a7ff0);
    color:#fff;
  }
  #recordBtn.recording{
    background:var(--danger);
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,92,114,.6);}
    70%{box-shadow:0 0 0 10px rgba(255,92,114,0);}
    100%{box-shadow:0 0 0 0 rgba(255,92,114,0);}
  }
  #fileInput{display:none;}

  #imgModal{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    align-items:center;justify-content:center;
    z-index:999;
    cursor:zoom-out;
  }
  #imgModal img{max-width:92%;max-height:92%;border-radius:8px;}

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
    margin-right:6px;
    vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:520px){
    body{align-items:stretch;}
    #chatScreen, #connectScreen{
      max-width:100%;
      height:100vh;
      max-height:100vh;
      border-radius:0;
    }
  }
</style>
</head>
<body>

<!-- PANTALLA DE CONEXIÓN -->
<div id="connectScreen">
  <h1>💬 Chat por Código</h1>
  <p class="sub">Escribe un código de sala — quien tenga el mismo código entra al mismo chat</p>

  <input type="text" id="nameInput" placeholder="Tu nombre (como te van a ver)">

  <div class="code-box">
    <label>Código de la sala</label>
    <input type="text" id="roomCodeInput" placeholder="ej: rubi-y-ana" maxlength="30">
    <div class="copy-hint">Comparte este mismo código con tu amiga · <a href="#" onclick="randomRoomCode();return false;">generar uno aleatorio</a></div>
  </div>

  <button id="connectBtn" onclick="joinRoom()">Entrar al chat</button>

  <div id="statusMsg"></div>
</div>

<!-- PANTALLA DE CHAT -->
<div id="chatScreen">
  <div id="chatHeader">
    <div class="info">
      <div class="avatar" id="peerAvatar">?</div>
      <div>
        <div class="peer-label" id="peerLabel">Sala</div>
        <div class="peer-status">● conectado</div>
      </div>
    </div>
    <div>
      <button id="disconnectBtn" onclick="disconnectChat()" title="Salir del chat">Salir</button>
      <button id="clearHistBtn" onclick="clearCurrentHistory()" title="Borrar historial guardado">🗑</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <button class="icon-btn" id="attachBtn" title="Enviar foto">📷</button>
    <input type="file" id="fileInput" accept="image/*">
    <textarea id="textInput" rows="1" placeholder="Escribe un mensaje…"></textarea>
    <button class="icon-btn" id="recordBtn" title="Grabar audio">🎤</button>
    <button class="icon-btn" id="sendBtn" title="Enviar">➤</button>
  </div>
</div>

<div id="imgModal" onclick="this.style.display='none'">
  <img id="imgModalSrc" src="">
</div>

<script>
/* =========================================================
   CHAT POR CÓDIGO DE SALA — usa Firebase Realtime Database.
   Ambas personas entran con el MISMO código de sala y quedan
   en el mismo chat. Los mensajes se guardan automáticamente
   en la nube (autoguardado real, no solo en el navegador).
   ========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyCoRkv0UAsT5YCIJHhbFT_VB5KmEnIVZ98",
  authDomain: "mi-chat-2bb2f.firebaseapp.com",
  databaseURL: "https://mi-chat-2bb2f-default-rtdb.firebaseio.com",
  projectId: "mi-chat-2bb2f",
  storageBucket: "mi-chat-2bb2f.firebasestorage.app",
  messagingSenderId: "381580220666",
  appId: "1:381580220666:web:c7bacd0c29c702de051143"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentRoom = null;
let myName = null;
let myClientId = null;
let messagesRef = null;

const connectScreen = document.getElementById('connectScreen');
const chatScreen = document.getElementById('chatScreen');
const statusMsg = document.getElementById('statusMsg');
const roomCodeInput = document.getElementById('roomCodeInput');
const nameInput = document.getElementById('nameInput');
const connectBtn = document.getElementById('connectBtn');
const messagesEl = document.getElementById('messages');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const recordBtn = document.getElementById('recordBtn');
const peerLabel = document.getElementById('peerLabel');
const peerAvatar = document.getElementById('peerAvatar');

/* id único de este navegador/dispositivo, para distinguir "mis" mensajes
   de los del otro aunque los dos usen el mismo nombre */
function getClientId(){
  let id = localStorage.getItem('chat_client_id');
  if (!id){
    id = 'c' + Math.random().toString(36).substr(2,10);
    localStorage.setItem('chat_client_id', id);
  }
  return id;
}

function randomRoomCode(){
  const palabras = ['sol','luna','rio','flor','cielo','estrella','mar','viento','luz','nube'];
  const a = palabras[Math.floor(Math.random()*palabras.length)];
  const b = Math.floor(1000 + Math.random()*9000);
  roomCodeInput.value = a + '-' + b;
}

/* precargar el último código y nombre usados */
window.addEventListener('DOMContentLoaded', () => {
  myClientId = getClientId();
  const savedRoom = localStorage.getItem('chat_last_room');
  const savedName = localStorage.getItem('chat_last_name');
  if (savedRoom) roomCodeInput.value = savedRoom;
  if (savedName) nameInput.value = savedName;
});

function sanitizeRoomCode(code){
  return code.trim().toLowerCase().replace(/[^a-z0-9\-_]/g, '-').substr(0,40);
}

function joinRoom(){
  const rawName = nameInput.value.trim();
  const rawCode = roomCodeInput.value.trim();

  if (!rawName){
    statusMsg.textContent = 'Escribe tu nombre.';
    statusMsg.className = 'error';
    return;
  }
  if (!rawCode){
    statusMsg.textContent = 'Escribe o genera un código de sala.';
    statusMsg.className = 'error';
    return;
  }

  const code = sanitizeRoomCode(rawCode);
  myName = rawName;
  currentRoom = code;

  localStorage.setItem('chat_last_room', rawCode);
  localStorage.setItem('chat_last_name', rawName);

  connectBtn.disabled = true;
  connectBtn.innerHTML = '<span class="spinner"></span>Conectando…';
  statusMsg.textContent = 'Conectando a la sala…';
  statusMsg.className = '';

  messagesRef = db.ref('rooms/' + code + '/messages');

  // probar conexión real a Firebase
  const connectedRef = db.ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val() === true){
      goToChat();
    }
  });

  // aviso si tarda demasiado (problema de red / config)
  setTimeout(() => {
    if (chatScreen.style.display !== 'flex'){
      statusMsg.textContent = 'No se pudo conectar a la base de datos. Revisa tu internet.';
      statusMsg.className = 'error';
      connectBtn.disabled = false;
      connectBtn.innerHTML = 'Entrar al chat';
    }
  }, 10000);
}

function goToChat(){
  connectScreen.style.display = 'none';
  chatScreen.style.display = 'flex';
  peerLabel.textContent = 'Sala: ' + currentRoom;
  peerAvatar.textContent = myName.charAt(0).toUpperCase();
  messagesEl.innerHTML = '';

  // escuchar mensajes en tiempo real (esto también carga el historial ya guardado)
  messagesRef.limitToLast(300).on('child_added', (snap) => {
    const m = snap.val();
    if (!m) return;
    renderMessage(m);
  });
}

function disconnectChat(){
  if (messagesRef) messagesRef.off();
  location.reload();
}

function clearCurrentHistory(){
  if (!currentRoom) return;
  if (!confirm('¿Borrar el historial de esta sala para TODOS los que la usan? Esta acción no se puede deshacer.')) return;
  db.ref('rooms/' + currentRoom + '/messages').remove().then(() => {
    messagesEl.innerHTML = '';
    addSystemMsg('Historial borrado 🗑');
  });
}

/* ---------- RENDER DE MENSAJES ---------- */

function addSystemMsg(text){
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollDown();
}

function renderMessage(m){
  const isMe = m.senderId === myClientId;
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'other');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (!isMe){
    const nameEl = document.createElement('div');
    nameEl.className = 'sender-name';
    nameEl.textContent = m.senderName || 'Anónimo';
    bubble.appendChild(nameEl);
  }

  if (m.type === 'text'){
    const p = document.createElement('div');
    p.textContent = m.payload;
    bubble.appendChild(p);
  } else if (m.type === 'image'){
    const img = document.createElement('img');
    img.src = m.payload;
    img.onclick = () => openImgModal(m.payload);
    bubble.appendChild(img);
  } else if (m.type === 'audio'){
    const audio = document.createElement('audio');
    audio.src = m.payload;
    audio.controls = true;
    bubble.appendChild(audio);
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  const d = m.timestamp ? new Date(m.timestamp) : new Date();
  time.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  bubble.appendChild(time);

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();
}

function scrollDown(){
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function sendMessage(type, payload){
  if (!messagesRef) return;
  messagesRef.push({
    type: type,
    payload: payload,
    senderId: myClientId,
    senderName: myName,
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });
}

/* ---------- TEXTO ---------- */
function sendText(){
  const text = textInput.value.trim();
  if (!text) return;
  sendMessage('text', text);
  textInput.value = '';
  textInput.style.height = 'auto';
}

sendBtn.onclick = sendText;
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendText();
  }
});
textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = textInput.scrollHeight + 'px';
});

/* ---------- FOTOS ---------- */
attachBtn.onclick = () => fileInput.click();
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  compressImage(file, (dataUrl) => {
    sendMessage('image', dataUrl);
  });
  fileInput.value = '';
});

function compressImage(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      let w = img.width, h = img.height;
      if (w > maxW){
        h = Math.round(h * (maxW / w));
        w = maxW;
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openImgModal(src){
  document.getElementById('imgModalSrc').src = src;
  document.getElementById('imgModal').style.display = 'flex';
}

/* ---------- AUDIO ---------- */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

recordBtn.onclick = async () => {
  if (!isRecording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          sendMessage('audio', reader.result);
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.classList.add('recording');
      recordBtn.textContent = '⏹';
    } catch(err){
      alert('No se pudo acceder al micrófono: ' + err.message);
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.classList.remove('recording');
    recordBtn.textContent = '🎤';
  }
};
</script>
</body>
</html>
