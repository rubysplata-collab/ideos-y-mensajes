<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebOS 11</title>
<style>
:root {
  --accent: #0078d4;
  --accent-light: #4cc2ff;
  --accent-dark: #005a9e;

  --radius: 8px;
  --radius-lg: 12px;

  --text-primary: rgba(255,255,255,0.95);
  --text-secondary: rgba(255,255,255,0.65);

  --mica-taskbar: rgba(32, 32, 34, 0.72);
  --mica-window: rgba(32, 32, 34, 0.88);
  --mica-window-header: rgba(255,255,255,0.04);
  --acrylic-menu: rgba(40, 40, 44, 0.82);

  --border-soft: rgba(255,255,255,0.09);
  --shadow-window: 0 18px 45px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.3);

  color-scheme: dark;
}

body.theme-light {
  --text-primary: rgba(20,20,22,0.95);
  --text-secondary: rgba(20,20,22,0.6);
  --mica-taskbar: rgba(243, 243, 245, 0.75);
  --mica-window: rgba(250, 250, 252, 0.9);
  --mica-window-header: rgba(0,0,0,0.03);
  --acrylic-menu: rgba(250, 250, 252, 0.85);
  --border-soft: rgba(0,0,0,0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI Variable", "Segoe UI", "Cantarell", system-ui, -apple-system, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.hidden { display: none !important; }

/* ============ ESCRITORIO / FONDO ============ */
#desktop {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

#wallpaper {
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, #06121f 0%, #0b2036 45%, #142a4a 100%);
  overflow: hidden;
  z-index: 0;
}

.bloom {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.55;
  animation: drift 26s ease-in-out infinite;
}
.bloom-1 { width: 55vw; height: 55vw; background: #1f8ef1; top: -15%; left: -10%; animation-delay: 0s;}
.bloom-2 { width: 45vw; height: 45vw; background: #7c5cff; bottom: -15%; right: -5%; animation-delay: -8s;}
.bloom-3 { width: 38vw; height: 38vw; background: #16d4c8; bottom: 10%; left: 20%; animation-delay: -16s;}

@keyframes drift {
  0%, 100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(4%, -3%) scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  .bloom { animation: none; }
}

/* ============ ICONOS DEL ESCRITORIO ============ */
#desktop-icons {
  position: absolute;
  top: 12px;
  left: 12px;
  display: grid;
  grid-template-rows: repeat(auto-fill, 92px);
  grid-auto-flow: column;
  gap: 4px;
  z-index: 1;
  height: calc(100vh - 60px);
}

.desktop-icon {
  width: 84px;
  height: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 4px;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
}
.desktop-icon:hover, .desktop-icon.selected {
  background: rgba(255,255,255,0.12);
  outline: 1px solid rgba(255,255,255,0.15);
}
.desktop-icon .icon-glyph {
  font-size: 32px;
  line-height: 1;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
}
.desktop-icon .icon-label {
  font-size: 12px;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  line-height: 1.2;
}

/* ============ VENTANAS ============ */
#windows-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.window {
  position: absolute;
  min-width: 320px;
  min-height: 220px;
  background: var(--mica-window);
  backdrop-filter: blur(40px) saturate(1.5);
  -webkit-backdrop-filter: blur(40px) saturate(1.5);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-window);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: box-shadow .15s ease;
}

.window.maximized {
  border-radius: 0;
  border: none;
}

.window.inactive .window-titlebar { opacity: 0.6; }
.window.inactive { box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

.window-titlebar {
  height: 40px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: 12px;
  background: var(--mica-window-header);
  cursor: default;
  border-bottom: 1px solid transparent;
}

.window-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-primary);
  pointer-events: none;
}
.window-icon { font-size: 15px; }

.window-controls { display: flex; height: 100%; }
.win-btn {
  width: 46px;
  height: 100%;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
}
.win-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
.win-close:hover { background: #e81123; color: #fff; }

.window-body {
  flex: 1;
  overflow: auto;
  background: transparent;
  color: var(--text-primary);
  font-size: 13px;
}

/* Resize handles */
.resize-handle { position: absolute; z-index: 5; }
.rh-n, .rh-s { left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
.rh-n { top: -3px; } .rh-s { bottom: -3px; }
.rh-e, .rh-w { top: 8px; bottom: 8px; width: 6px; cursor: ew-resize; }
.rh-e { right: -3px; } .rh-w { left: -3px; }
.rh-ne, .rh-nw, .rh-se, .rh-sw { width: 12px; height: 12px; }
.rh-ne { top: -4px; right: -4px; cursor: nesw-resize; }
.rh-nw { top: -4px; left: -4px; cursor: nwse-resize; }
.rh-se { bottom: -4px; right: -4px; cursor: nwse-resize; }
.rh-sw { bottom: -4px; left: -4px; cursor: nesw-resize; }
.window.maximized .resize-handle { display: none; }

/* ============ BARRA DE TAREAS ============ */
#taskbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 48px;
  background: var(--mica-taskbar);
  backdrop-filter: blur(30px) saturate(1.6);
  -webkit-backdrop-filter: blur(30px) saturate(1.6);
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  z-index: 100;
  padding: 0 8px;
  gap: 2px;
}

.task-icon {
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex: none;
}
.task-icon:hover { background: rgba(255,255,255,0.1); }
.win-logo { font-size: 18px; color: var(--accent-light); }

#pinned-taskbar-apps, #open-taskbar-apps {
  display: flex;
  gap: 2px;
  margin-left: 4px;
}

.taskbar-app-btn {
  position: relative;
  width: 40px; height: 40px;
  border: none;
  background: transparent;
  border-radius: 4px;
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.taskbar-app-btn:hover { background: rgba(255,255,255,0.1); }
.taskbar-app-btn.running::after {
  content: "";
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px; height: 3px;
  border-radius: 2px;
  background: var(--accent-light);
}
.taskbar-app-btn.active { background: rgba(255,255,255,0.14); }

#tray {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2px;
}
.tray-btn {
  border: none; background: transparent;
  color: var(--text-primary);
  width: 32px; height: 40px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}
.tray-btn:hover { background: rgba(255,255,255,0.1); }

.tray-clock {
  border: none; background: transparent;
  color: var(--text-primary);
  display: flex; flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding: 2px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  line-height: 1.35;
}
.tray-clock:hover { background: rgba(255,255,255,0.1); }

#show-desktop-btn {
  width: 6px; height: 40px;
  border-left: 1px solid var(--border-soft);
  margin-left: 4px;
  cursor: pointer;
}
#show-desktop-btn:hover { background: rgba(255,255,255,0.12); }

/* ============ MENÚ INICIO ============ */
#start-menu {
  position: absolute;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  width: 620px;
  max-height: 640px;
  background: var(--acrylic-menu);
  backdrop-filter: blur(40px) saturate(1.6);
  -webkit-backdrop-filter: blur(40px) saturate(1.6);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-window);
  z-index: 200;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
}

.start-search input {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
  background: rgba(255,255,255,0.06);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
}
.start-search input:focus { border-color: var(--accent-light); }

.start-section-title {
  font-size: 12px;
  color: var(--text-secondary);
  margin: 16px 2px 8px;
}

.app-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}
.app-grid.list { grid-template-columns: repeat(2, 1fr); }

.start-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 4px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  text-align: center;
  color: var(--text-primary);
}
.start-app:hover { background: rgba(255,255,255,0.1); }
.start-app .icon-glyph { font-size: 24px; }

.start-footer {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.start-user { font-size: 13px; color: var(--text-primary); display:flex; align-items:center; gap:8px;}
#power-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 15px;
}
#power-btn:hover { background: var(--accent); }

/* ============ MENÚ CONTEXTUAL ============ */
.context-menu {
  position: absolute;
  list-style: none;
  margin: 0;
  padding: 6px;
  min-width: 200px;
  background: var(--acrylic-menu);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-window);
  z-index: 500;
  font-size: 13px;
}
.context-menu li {
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-primary);
}
.context-menu li:hover { background: rgba(255,255,255,0.1); }
.context-menu li.sep { height: 1px; margin: 4px 0; padding: 0; background: var(--border-soft); }

/* ============ FLYOUTS (reloj / centro de acciones) ============ */
.flyout {
  position: absolute;
  bottom: 56px;
  right: 8px;
  width: 300px;
  background: var(--acrylic-menu);
  backdrop-filter: blur(40px) saturate(1.6);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-window);
  z-index: 200;
  padding: 16px;
  font-size: 13px;
}
#flyout-time { font-size: 26px; font-weight: 600; }
#flyout-date { color: var(--text-secondary); margin-bottom: 10px; }
#flyout-calendar { color: var(--text-secondary); font-size: 12px; }

.qs-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.qs-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 10px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 10px;
  cursor: pointer;
}
.qs-btn:hover { background: rgba(255,255,255,0.12); }
.qs-btn.on { background: var(--accent); }
.qs-slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.qs-slider-row input[type=range] { flex: 1; accent-color: var(--accent-light); }

/* ============ SCROLLBARS ============ */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ Utilidades de apps ============ */
.app-fill { display:flex; flex-direction:column; height:100%; }

</style>
</head>
<body>


  <!-- ============ ESCRITORIO ============ -->

      <div class="resize-handle rh-se"></div>
      <div class="resize-handle rh-sw"></div>
    </div>
  </template>







<script>
/* ============================================================
   WindowManager: crea, mueve, redimensiona y controla ventanas
   ============================================================ */
const WindowManager = (() => {
  const layer = () => document.getElementById('windows-layer');
  const template = document.getElementById('window-template');

  let zCounter = 10;
  const windows = new Map(); // id -> { el, appId, title }
  let idCounter = 0;

  function focus(id) {
    document.querySelectorAll('.window').forEach(w => w.classList.add('inactive'));
    document.querySelectorAll('.taskbar-app-btn').forEach(b => b.classList.remove('active'));
    const entry = windows.get(id);
    if (!entry) return;
    zCounter += 1;
    entry.el.style.zIndex = zCounter;
    entry.el.classList.remove('inactive');
    const btn = document.querySelector(`.taskbar-app-btn[data-winid="${id}"]`);
    if (btn) btn.classList.add('active');
  }

  function open({ appId, title, icon, width = 640, height = 440, render }) {
    idCounter += 1;
    const id = `win-${idCounter}`;
    const node = template.content.firstElementChild.cloneNode(true);
    node.dataset.id = id;
    node.dataset.app = appId;

    const offset = (windows.size % 8) * 24;
    node.style.left = `${90 + offset}px`;
    node.style.top = `${60 + offset}px`;
    node.style.width = `${width}px`;
    node.style.height = `${height}px`;

    node.querySelector('.window-title-text').textContent = title;
    node.querySelector('.window-icon').textContent = icon || '🗔';
    const body = node.querySelector('.window-body');
    layer().appendChild(node);

    windows.set(id, { el: node, appId, title });
    render(body, { close: () => close(id), setTitle: t => node.querySelector('.window-title-text').textContent = t });

    addTaskbarButton(id, title, icon);
    makeDraggable(node);
    makeResizable(node);
    wireControls(node, id);

    node.addEventListener('mousedown', () => focus(id));
    focus(id);
    return id;
  }

  function close(id) {
    const entry = windows.get(id);
    if (!entry) return;
    entry.el.remove();
    windows.delete(id);
    const btn = document.querySelector(`.taskbar-app-btn[data-winid="${id}"]`);
    if (btn) btn.remove();
  }

  function toggleMinimize(id) {
    const entry = windows.get(id);
    if (!entry) return;
    const isHidden = entry.el.style.display === 'none';
    entry.el.style.display = isHidden ? 'flex' : 'none';
    if (isHidden) focus(id);
  }

  function toggleMaximize(id) {
    const entry = windows.get(id);
    if (!entry) return;
    const el = entry.el;
    if (el.classList.contains('maximized')) {
      el.classList.remove('maximized');
      Object.assign(el.style, el.dataset.prevRect ? JSON.parse(el.dataset.prevRect) : {});
    } else {
      el.dataset.prevRect = JSON.stringify({
        left: el.style.left, top: el.style.top,
        width: el.style.width, height: el.style.height
      });
      el.classList.add('maximized');
      el.style.left = '0px';
      el.style.top = '0px';
      el.style.width = '100vw';
      el.style.height = 'calc(100vh - 48px)';
    }
  }

  function wireControls(node, id) {
    node.querySelector('.win-min').addEventListener('click', e => { e.stopPropagation(); toggleMinimize(id); });
    node.querySelector('.win-max').addEventListener('click', e => { e.stopPropagation(); toggleMaximize(id); });
    node.querySelector('.win-close').addEventListener('click', e => { e.stopPropagation(); close(id); });
    node.querySelector('.window-titlebar').addEventListener('dblclick', () => toggleMaximize(id));
  }

  function addTaskbarButton(id, title, icon) {
    const bar = document.getElementById('open-taskbar-apps');
    const btn = document.createElement('button');
    btn.className = 'taskbar-app-btn running';
    btn.dataset.winid = id;
    btn.title = title;
    btn.textContent = icon || '🗔';
    btn.addEventListener('click', () => toggleMinimize(id));
    bar.appendChild(btn);
  }

  function makeDraggable(node) {
    const bar = node.querySelector('.window-titlebar');
    let dragging = false, startX, startY, origX, origY;

    bar.addEventListener('mousedown', e => {
      if (e.target.closest('.win-btn')) return;
      if (node.classList.contains('maximized')) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      origX = node.offsetLeft; origY = node.offsetTop;
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      node.style.left = `${origX + (e.clientX - startX)}px`;
      node.style.top = `${Math.max(0, origY + (e.clientY - startY))}px`;
    });
    window.addEventListener('mouseup', () => { dragging = false; document.body.style.userSelect = ''; });
  }

  function makeResizable(node) {
    node.querySelectorAll('.resize-handle').forEach(handle => {
      let resizing = false, startX, startY, startW, startH, startL, startT, dir;
      handle.addEventListener('mousedown', e => {
        e.stopPropagation();
        resizing = true;
        dir = [...handle.classList].find(c => c.startsWith('rh-')).replace('rh-', '');
        startX = e.clientX; startY = e.clientY;
        startW = node.offsetWidth; startH = node.offsetHeight;
        startL = node.offsetLeft; startT = node.offsetTop;
      });
      window.addEventListener('mousemove', e => {
        if (!resizing) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (dir.includes('e')) node.style.width = Math.max(320, startW + dx) + 'px';
        if (dir.includes('s')) node.style.height = Math.max(220, startH + dy) + 'px';
        if (dir.includes('w')) {
          const newW = Math.max(320, startW - dx);
          node.style.width = newW + 'px';
          node.style.left = (startL + (startW - newW)) + 'px';
        }
        if (dir.includes('n')) {
          const newH = Math.max(220, startH - dy);
          node.style.height = newH + 'px';
          node.style.top = (startT + (startH - newH)) + 'px';
        }
      });
      window.addEventListener('mouseup', () => resizing = false);
    });
  }

  function minimizeAll() {
    windows.forEach((entry, id) => entry.el.style.display = 'none');
  }

  return { open, close, focus, toggleMinimize, toggleMaximize, minimizeAll };
})();

          <button data-k=".">.</button>
          <button data-k="=" class="eq">=</button>
        </div>
      </div>
    `;

    let expr = '';
    const exprEl = body.querySelector('#calc-expr');
    const resEl = body.querySelector('#calc-result');

    const safeEval = (s) => {
      if (!/^[0-9+\-*/.%() ]+$/.test(s)) return 'Error';
      try {
        // eslint-disable-next-line no-new-func
        const val = Function(`"use strict"; return (${s})`)();
        if (typeof val !== 'number' || !isFinite(val)) return 'Error';
        return +val.toFixed(10);
      } catch { return 'Error'; }
    };

    body.querySelectorAll('.calc-grid button').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (k === 'C') { expr = ''; }
        else if (k === '=') {
          const result = safeEval(expr);
          exprEl.textContent = expr + ' =';
          expr = String(result);
          resEl.textContent = result;
          return;
        }
        else if (k === '±') { expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; }
        else if (k === '%') { expr += '/100'; }
        else { expr += k; }
        exprEl.textContent = expr;
        resEl.textContent = expr === '' ? '0' : expr;
      });
    });
  }
};

/* ============================================================
   Desktop: registro de apps, iconos, taskbar, menú inicio, reloj
   ============================================================ */
(() => {
  const APPS = [AppExplorer, AppNotepad, AppCalculator, AppBrowser, AppSettings];
  const PINNED = ['explorer', 'browser', 'notepad', 'calculator', 'settings'];
  const DESKTOP_ICONS = ['explorer', 'notepad', 'calculator', 'browser'];

  function getApp(id) { return APPS.find(a => a.id === id); }

  function launchApp(id) {
    const app = getApp(id);
    if (!app) return;
    WindowManager.open({
      appId: app.id,
      title: app.title,
      icon: app.icon,
      width: app.width,
      height: app.height,
      render: app.render
    });
    closeStartMenu();
  }

  /* ---------- Iconos de escritorio ---------- */
  function buildDesktopIcons() {
    const wrap = document.getElementById('desktop-icons');
    DESKTOP_ICONS.forEach(id => {
      const app = getApp(id);
      const el = document.createElement('div');
      el.className = 'desktop-icon';
      el.innerHTML = `<div class="icon-glyph">${app.icon}</div><div class="icon-label">${app.title}</div>`;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
      });
      el.addEventListener('dblclick', () => launchApp(id));
      wrap.appendChild(el);
    });
  }

  /* ---------- Taskbar anclada ---------- */
  function buildPinnedTaskbar() {
    const wrap = document.getElementById('pinned-taskbar-apps');
    PINNED.forEach(id => {
      const app = getApp(id);
      const btn = document.createElement('button');
      btn.className = 'taskbar-app-btn';
      btn.title = app.title;
      btn.textContent = app.icon;
      btn.addEventListener('click', () => launchApp(id));
      wrap.appendChild(btn);
    });
  }

  /* ---------- Menú inicio ---------- */
  function buildStartMenu() {
    const pinnedWrap = document.getElementById('pinned-apps');
    const allWrap = document.getElementById('all-apps');
    APPS.forEach(app => {
      pinnedWrap.appendChild(makeStartTile(app));
      allWrap.appendChild(makeStartTile(app));
    });
  }
  function makeStartTile(app) {
    const el = document.createElement('div');
    el.className = 'start-app';
    el.dataset.name = app.title.toLowerCase();
    el.innerHTML = `<div class="icon-glyph">${app.icon}</div><div>${app.title}</div>`;
    el.addEventListener('click', () => launchApp(app.id));
    return el;
  }

  function openStartMenu() {
    document.getElementById('start-menu').classList.remove('hidden');
    document.getElementById('start-search-input').focus();
  }
  function closeStartMenu() {
    document.getElementById('start-menu').classList.add('hidden');
  }
  function toggleStartMenu() {
    document.getElementById('start-menu').classList.contains('hidden') ? openStartMenu() : closeStartMenu();
  }

  /* ---------- Reloj y flyout ---------- */
  function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    const date = now.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
    document.getElementById('tray-time').textContent = time;
    document.getElementById('tray-date').textContent = date;
    document.getElementById('flyout-time').textContent = now.toLocaleTimeString('es-CO');
    document.getElementById('flyout-date').textContent = now.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  /* ---------- Menús contextuales / flyouts genéricos ---------- */
  function closeAllOverlays() {
    closeStartMenu();
    document.getElementById('desktop-context-menu').classList.add('hidden');
    document.getElementById('clock-flyout').classList.add('hidden');
    document.getElementById('quick-settings').classList.add('hidden');
  }

  function wireEvents() {
    document.getElementById('start-btn').addEventListener('click', e => { e.stopPropagation(); toggleStartMenu(); });

    document.getElementById('start-search-input').addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#all-apps .start-app').forEach(el => {
        el.style.display = el.dataset.name.includes(q) ? '' : 'none';
      });
    });

    document.getElementById('power-btn').addEventListener('click', () => {
      document.body.style.transition = 'opacity .6s';
      document.body.style.opacity = '0';
      setTimeout(() => { document.body.style.opacity = '1'; closeStartMenu(); }, 700);
    });

    // Menú contextual del escritorio
    document.getElementById('desktop').addEventListener('contextmenu', e => {
      if (e.target.closest('.window') || e.target.closest('#taskbar') || e.target.closest('#start-menu')) return;
      e.preventDefault();
      closeAllOverlays();
      const menu = document.getElementById('desktop-context-menu');
      menu.style.left = e.pageX + 'px';
      menu.style.top = e.pageY + 'px';
      menu.classList.remove('hidden');
    });
    document.getElementById('desktop-context-menu').addEventListener('click', e => {
      const action = e.target.dataset.action;
      if (action === 'personalize') launchApp('settings');
      closeAllOverlays();
    });

    // Clic en escritorio cierra overlays
    document.getElementById('desktop').addEventListener('click', e => {
      if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) closeStartMenu();
      if (!e.target.closest('.desktop-icon')) document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
      document.getElementById('desktop-context-menu').classList.add('hidden');
      if (!e.target.closest('#clock-tray') && !e.target.closest('#clock-flyout')) document.getElementById('clock-flyout').classList.add('hidden');
      if (!e.target.closest('#volume-tray') && !e.target.closest('#wifi-tray') && !e.target.closest('#quick-settings')) document.getElementById('quick-settings').classList.add('hidden');
    });

    // Reloj
    document.getElementById('clock-tray').addEventListener('click', e => {
      e.stopPropagation();
      document.getElementById('quick-settings').classList.add('hidden');
      document.getElementById('clock-flyout').classList.toggle('hidden');
    });

    // Centro de acciones rápidas
    ['wifi-tray', 'volume-tray'].forEach(id => {
      document.getElementById(id).addEventListener('click', e => {
        e.stopPropagation();
        document.getElementById('clock-flyout').classList.add('hidden');
        document.getElementById('quick-settings').classList.toggle('hidden');
      });
    });
    document.querySelectorAll('.qs-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.toggle === 'theme') {
          document.body.classList.toggle('theme-light');
          localStorage.setItem('webos-theme', document.body.classList.contains('theme-light') ? 'light' : 'dark');
        } else {
          btn.classList.toggle('on');
        }
      });
    });

    // Mostrar escritorio
    document.getElementById('show-desktop-btn').addEventListener('click', () => WindowManager.minimizeAll());

    // Buscar (abre el menú inicio con foco en búsqueda)
    document.getElementById('search-btn').addEventListener('click', openStartMenu);

    // Escape cierra overlays
    window.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllOverlays(); });
  }

  function applySavedPreferences() {
    const theme = localStorage.getItem('webos-theme');
    if (theme === 'light') document.body.classList.add('theme-light');
    const accent = localStorage.getItem('webos-accent');
    if (accent) document.documentElement.style.setProperty('--accent', accent);
  }

  function init() {
    applySavedPreferences();
    buildDesktopIcons();
    buildPinnedTaskbar();
    buildStartMenu();
    wireEvents();
    updateClock();
    setInterval(updateClock, 15000);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
