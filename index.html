<!DOCTYPE html>
<html lang="es">
<head>

    <title>JHEILER - Tu plataforma de videos</title>

    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --panel2: #212121;
            --accent: #ff304f;
            --accent2: #ff6b8a;
            --border: #303030;
            --text-secondary: #aaa;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 12px;
            --font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-weight-title: 800;
            --font-weight-body: 400;
            --font-size-base: 14px;
            --bg-image: none;
            --bg-overlay: rgba(0,0,0,0.85);
            --glass-effect: rgba(255,255,255,0.05);
            --hover-scale: 1.02;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            font-size: var(--font-size-base);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -1;
            opacity: 0.2;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            z-index: 200;
            backdrop-filter: blur(12px);
            background: rgba(15,15,15,0.92);
        }

        .brand {
            font-size: 22px;
            font-weight: var(--font-weight-title);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .brand i {
            font-size: 26px;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: var(--panel2);
        }

        .create-btn {
            padding: 10px 20px;
            background: var(--accent);
            border-radius: 24px;
            border: none;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .create-btn i {
            font-size: 16px;
        }

        .create-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 24px rgba(255,48,79,0.35);
        }

        /* ===== SIDEBAR ===== */
        aside {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 220px;
            background: var(--bg);
            border-right: 1px solid var(--border);
            padding-top: 12px;
            overflow-y: auto;
            z-index: 100;
        }

        .sb-section {
            padding: 6px 0 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .sb-title {
            padding: 6px 24px 8px 24px;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .sb-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 8px;
            transition: all 0.15s ease;
            cursor: pointer;
            position: relative;
        }

        .sb-item:hover {
            background: var(--panel2);
        }

        .sb-item i {
            font-size: 20px;
            width: 24px;
            text-align: center;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .sb-item:hover i {
            color: #fff;
        }

        .sb-item.active {
            background: var(--panel2);
        }

        .sb-item.active i {
            color: var(--accent);
        }

        .sb-item .badge {
            position: absolute;
            right: 24px;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* ===== MAIN ===== */
        main {
            margin-left: 220px;
            padding: 80px 24px 40px 24px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* ===== CATEGORÍAS ===== */
        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 20px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 8px 20px;
            background: var(--panel2);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .category-chip:hover {
            background: var(--border);
        }

        .category-chip.active {
            background: var(--accent);
            color: #fff;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 20px;
            font-weight: var(--font-weight-title);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: var(--accent);
        }

        /* ===== VIDEO GRID ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px 20px;
        }

        .video-card {
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--panel2);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-card:hover .thumb img {
            transform: scale(var(--hover-scale));
        }

        .thumb .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .thumb .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay i {
            font-size: 20px;
            color: #fff;
            margin-left: 4px;
        }

        .video-info {
            display: flex;
            gap: 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .video-details {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 15px;
            font-weight: var(--font-weight-title);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-hashtags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .card-hashtags span {
            font-size: 11px;
            color: var(--accent);
            background: rgba(255,48,79,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card-hashtags span:hover {
            background: rgba(255,48,79,0.2);
        }

        .channel-name {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .card-meta i {
            font-size: 11px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            display: block;
            margin-bottom: 16px;
            color: var(--border);
        }

        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #fff;
        }

        /* ===== REPRODUCTOR ===== */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .player-overlay.active {
            display: flex;
        }

        .player-container {
            width: 90%;
            max-width: 900px;
            position: relative;
        }

        .player-container video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            max-height: 80vh;
        }

        .player-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 8px;
            transition: transform 0.2s;
        }

        .player-close:hover {
            transform: scale(1.1);
        }

        .player-info {
            width: 90%;
            max-width: 900px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-title {
            font-size: 18px;
            font-weight: var(--font-weight-title);
        }

        .player-channel {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .player-hashtags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-hashtags span {
            color: var(--accent);
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
            animation: fadeIn 0.25s ease;
        }

        .modal-content {
            background: var(--panel);
            padding: 28px 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            font-size: 22px;
            font-weight: var(--font-weight-title);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-content h3 i {
            color: var(--accent);
        }

        .modal-content input,
        .modal-content textarea,
        .modal-content select {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel2);
            color: #fff;
            font-size: 14px;
            transition: border 0.2s ease;
            width: 100%;
        }

        .modal-content input:focus,
        .modal-content textarea:focus,
        .modal-content select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .modal-content select option {
            background: var(--panel);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 0 24px rgba(255,48,79,0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--panel2);
            color: #aaa;
        }

        .btn-secondary:hover {
            background: var(--border);
            color: #fff;
        }

        .file-input-wrapper {
            position: relative;
        }

        .file-input-wrapper input[type="file"] {
            padding: 10px;
            background: var(--panel2);
            border-radius: 10px;
            border: 1px dashed var(--border);
            cursor: pointer;
            width: 100%;
        }

        .file-input-wrapper input[type="file"]::file-selector-button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 12px;
        }

        .file-input-wrapper small {
            color: #666;
            display: block;
            margin-top: 4px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 2000;
            font-weight: 500;
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast i {
            font-size: 20px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            aside {
                display: none;
            }
            main {
                margin-left: 0;
                padding: 76px 16px 24px 16px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }
            .brand {
                font-size: 18px;
            }
            .brand i {
                font-size: 20px;
            }
            .create-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .create-btn span {
                display: none;
            }
            .modal-content {
                padding: 20px;
            }
            .categories {
                gap: 8px;
            }
            .category-chip {
                font-size: 12px;
                padding: 6px 14px;
            }
            .player-container video {
                max-height: 60vh;
            }
            .player-close {
                top: -40px;
                font-size: 24px;
            }
            .player-title {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card-title {
                font-size: 13px;
            }
            .channel-avatar {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            .channel-name {
                font-size: 11px;
            }
            .card-meta {
                font-size: 10px;
            }
            .thumb .duration {
                font-size: 9px;
                padding: 1px 6px;
            }
        }
    </style>
</head>

        // ============================================
        // FUNCIONES PRINCIPALES
        // ============================================

        // ===== FORMATO DE DURACIÓN (segundos → MM:SS) =====
        function formatDuration(seconds) {
            if (!seconds || seconds === 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        // ===== OBTENER MINIATURA POR DEFECTO =====
        function getDefaultThumbnail(category) {
            const defaults = {
                'roblox': 'https://images.unsplash.com/photo-1614680376573-df3480f0c6ff?w=400&h=225&fit=crop',
                'ia': 'https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400&h=225&fit=crop',
                'minecraft': 'https://images.unsplash.com/photo-1558618666-fcd25c85f30a?w=400&h=225&fit=crop',
                'programacion': 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=400&h=225&fit=crop',
                'musica': 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=225&fit=crop',
                'deportes': 'https://images.unsplash.com/photo-1518099074172-2e47d6cfdc28?w=400&h=225&fit=crop',
                'videojuegos': 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&h=225&fit=crop',
                'general': 'https://images.unsplash.com/photo-1611162616475-46b635cb6868?w=400&h=225&fit=crop'
            };
            return defaults[category] || defaults['general'];
        }

        // ===== REPRODUCIR VIDEO =====
        function playVideo(video) {
            if (!video || !video.video_url) {
                showToast('Video no disponible', 'error');
                return;
            }
            
            playerVideo.src = video.video_url;
            playerVideo.load();
            playerTitle.textContent = video.title || 'Sin título';
            playerChannel.textContent = video.channel || 'JHEILER';
            playerHashtags.innerHTML = (video.hashtags || []).map(tag => 
                `<span>${tag}</span>`
            ).join('');
            
            playerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            playerVideo.play().catch(() => {
                showToast('Toca play para reproducir', 'info');
            });
        }

        // ===== CERRAR REPRODUCTOR =====
        function closePlayer() {
            playerVideo.pause();
            playerVideo.src = '';
            playerOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        playerClose.addEventListener('click', closePlayer);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && playerOverlay.classList.contains('active')) {
                closePlayer();
            }
        });
        playerOverlay.addEventListener('click', (e) => {
            if (e.target === playerOverlay) {
                closePlayer();
            }
        });

        // ===== TOAST =====
        function showToast(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };
            
            toast.innerHTML = `<i class="${iconMap[type] || iconMap.info}"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ===== FORMATOS =====
        function formatDate(dateStr) {
            if (!dateStr) return 'Fecha desconocida';
            const date = new Date(dateStr);
            return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
        }

        function formatViews(views) {
            if (!views || views === 0) return '0';
            if (views >= 1000000) return (views / 1000000).toFixed(1) + 'M';
            if (views >= 1000) return (views / 1000).toFixed(1) + 'K';
            return views;
        }

        // ===== OBTENER VIDEOS =====
        async function getVideos() {
            try {
                const { data, error } = await sb
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data && data.length > 0) {
                    allVideos = data;
                    return data;
                }
                
                allVideos = sampleVideos;
                return sampleVideos;
            } catch (err) {
                console.log('Usando datos de ejemplo');
                allVideos = sampleVideos;
                return sampleVideos;
            }
        }

        // ===== FILTRAR VIDEOS =====
        function filterVideos(videos, section, category) {
            let filtered = [...videos];
            
            switch(section) {
                case 'inicio':
                    break;
                case 'shorts':
                    filtered = filtered.filter(v => v.is_short === true);
                    if (filtered.length === 0) filtered = videos.slice(0, 3);
                    break;
                case 'suscripciones':
                    filtered = filtered.slice(0, 4);
                    break;
                case 'historial':
                    filtered = filtered.slice(0, 5);
                    break;
                case 'tus-videos':
                    filtered = filtered.filter(v => v.channel === 'JHEILER');
                    break;
                case 'favoritos':
                    filtered = filtered.slice(0, 3);
                    break;
                case 'ver-despues':
                    filtered = filtered.slice().sort(() => Math.random() - 0.5).slice(0, 4);
                    break;
                default:
                    break;
            }
            
            if (category && category !== 'todos') {
                filtered = filtered.filter(v => v.category === category);
            }
            
            return filtered;
        }

        // ============================================
        // ⭐ RENDER VIDEOS (CON VISTAS REALES) ⭐
        // ============================================
        function renderVideos(videos) {
            if (!videos || videos.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-video"></i>
                        <h3>No hay videos aquí</h3>
                        <p style="color:#666;margin-top:8px;">¡Sube tu primer video!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = videos.map(v => {
                // ✅ VISTAS REALES (0 si no hay)
                const views = v.views || 0;
                const duration = formatDuration(v.duration || 0);
                const hashtags = v.hashtags || ['#Video'];
                const channel = v.channel || 'JHEILER';
                const initial = channel.charAt(0).toUpperCase();

                // ✅ CORREGIDO: startsWith (con S mayúscula)
                let thumbUrl = v.thumbnail_url && v.thumbnail_url.startsWith('http') ? v.thumbnail_url : getDefaultThumbnail(v.category || 'general');

                return `
                    <div class="video-card" onclick='playVideo(${JSON.stringify(v)})'>
                        <div class="thumb">
                            <img src="${thumbUrl}" 
                                 alt="${v.title || 'Video'}"
                                 loading="lazy"
                                 onerror="this.src='${getDefaultThumbnail(v.category || 'general')}'">
                            <span class="duration">${duration}</span>
                            <div class="play-overlay">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>
                        <div class="video-info">
                            <div class="channel-avatar">${initial}</div>
                            <div class="video-details">
                                <div class="card-title">${v.title || 'Sin título'}</div>
                                <div class="card-hashtags">
                                    ${hashtags.slice(0, 3).map(tag => `<span>${tag}</span>`).join('')}
                                </div>
                                <div class="channel-name">${channel}</div>
                                <div class="card-meta">
                                    <i class="fas fa-eye"></i> ${formatViews(views)} vistas
                                    <span style="margin:0 4px;">•</span>
                                    <i class="far fa-calendar-alt"></i> ${formatDate(v.created_at)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== CARGAR VIDEOS =====
        async function loadVideos() {
            const videos = await getVideos();
            const filtered = filterVideos(videos, currentSection, currentCategory);
            renderVideos(filtered);
            
            const sectionNames = {
                'inicio': 'Inicio',
                'shorts': 'Shorts',
                'suscripciones': 'Suscripciones',
                'historial': 'Historial',
                'tus-videos': 'Tus videos',
                'favoritos': 'Favoritos',
                'ver-despues': 'Ver después'
            };
            const iconMap = {
                'inicio': 'fa-home',
                'shorts': 'fa-bolt',
                'suscripciones': 'fa-tv',
                'historial': 'fa-clock',
                'tus-videos': 'fa-video',
                'favoritos': 'fa-heart',
                'ver-despues': 'fa-clock'
            };
            sectionTitle.innerHTML = `<i class="fas ${iconMap[currentSection] || 'fa-home'}"></i> ${sectionNames[currentSection] || 'Inicio'}`;
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        // ===== SIDEBAR =====
        document.querySelectorAll('.sb-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                currentSection = this.dataset.section;
                loadVideos();
                showToast(`📂 ${this.textContent.trim()}`, 'info');
            });
        });

        // ===== CATEGORÍAS =====
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                loadVideos();
            });
        });

        // ===== BÚSQUEDA =====
        document.getElementById('btnSearch').addEventListener('click', function() {
            const searchTerm = prompt('🔍 ¿Qué estás buscando?');
            if (searchTerm && searchTerm.trim()) {
                const term = searchTerm.trim().toLowerCase();
                const videos = allVideos.filter(v => 
                    v.title?.toLowerCase().includes(term) || 
                    v.description?.toLowerCase().includes(term) ||
                    (v.hashtags || []).some(tag => tag.toLowerCase().includes(term))
                );
                renderVideos(videos);
                showToast(`🔍 Resultados para: "${searchTerm.trim()}"`, 'info');
            }
        });

        // ============================================
        // SUBIR VIDEO
        // ============================================
        document.getElementById('btnOpenModal').onclick = () => {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>
                        <i class="fas fa-upload"></i> Subir video
                    </h3>
                    <input type="text" id="upTitle" placeholder="Título del video" maxlength="100">
                    <textarea id="upDesc" placeholder="Descripción (opcional)" maxlength="500"></textarea>
                    <input type="text" id="upHashtags" placeholder="Hashtags (ej: #Roblox #Gaming)" maxlength="200">
                    <select id="upCategory">
                        <option value="general">General</option>
                        <option value="roblox">Roblox</option>
                        <option value="ia">IA</option>
                        <option value="minecraft">Minecraft</option>
                        <option value="programacion">Programación</option>
                        <option value="musica">Música</option>
                        <option value="deportes">Deportes</option>
                        <option value="videojuegos">Videojuegos</option>
                    </select>
                    <div style="display:flex;gap:12px;align-items:center;">
                        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                            <input type="checkbox" id="upIsShort"> 
                            <span>Es Short</span>
                        </label>
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="upVideo" accept="video/*" required>
                        <small><i class="fas fa-info-circle"></i> Selecciona tu video (Máx. 100MB)</small>
                    </div>
                    <div class="file-input-wrapper">
                        <input type="file" id="upThumb" accept="image/*">
                        <small><i class="fas fa-info-circle"></i> Miniatura personalizada (opcional)</small>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-primary" id="btnUpload">
                            <i class="fas fa-cloud-upload-alt"></i> Publicar
                        </button>
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('btnUpload').onclick = async () => {
                const title = document.getElementById('upTitle').value.trim();
                const desc = document.getElementById('upDesc').value.trim();
                const hashtags = document.getElementById('upHashtags').value.trim().split(' ').filter(t => t.startsWith('#'));
                const category = document.getElementById('upCategory').value;
                const isShort = document.getElementById('upIsShort').checked;
                const videoFile = document.getElementById('upVideo').files[0];
                const thumbFile = document.getElementById('upThumb').files[0];

                if (!title) return showToast('Escribe un título', 'warning');
                if (!videoFile) return showToast('Selecciona un video', 'warning');
                if (videoFile.size > 100 * 1024 * 1024) {
                    return showToast('El video no debe superar 100MB', 'error');
                }

                const btn = document.getElementById('btnUpload');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subiendo...';
                btn.disabled = true;

                try {
                    const vName = `${Date.now()}_${videoFile.name}`;
                    const { error: vErr } = await sb.storage.from('videos').upload(vName, videoFile);
                    if (vErr) throw vErr;

                    const { data: vData } = sb.storage.from('videos').getPublicUrl(vName);
                    let thumbUrl = '';

                    if (thumbFile) {
                        const tName = `${Date.now()}_${thumbFile.name}`;
                        const { error: tErr } = await sb.storage.from('thumbnails').upload(tName, thumbFile);
                        if (!tErr) {
                            const { data: tData } = sb.storage.from('thumbnails').getPublicUrl(tName);
                            thumbUrl = tData.publicUrl;
                        }
                    }

                    const newVideo = {
                        title: title,
                        description: desc || null,
                        category: category || 'general',
                        video_url: vData.publicUrl,
                        thumbnail_url: thumbUrl || '',
                        views: 0,
                        duration: 0,
                        channel: 'JHEILER',
                        hashtags: hashtags.length > 0 ? hashtags : ['#Nuevo'],
                        is_short: isShort,
                        created_at: new Date().toISOString()
                    };

                    const { error: insertErr } = await sb.from('videos').insert(newVideo);
                    if (insertErr) throw insertErr;

                    allVideos.unshift(newVideo);
                    modal.remove();
                    showToast('¡Video publicado con éxito! 🎉', 'success');
                    loadVideos();
                } catch (err) {
                    console.error('Error al subir:', err);
                    showToast('Error al publicar: ' + err.message, 'error');
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Publicar';
                    btn.disabled = false;
                }
            };
        };

        // ============================================
        // PERSONALIZACIÓN
        // ============================================
        document.getElementById('btnCustomize').addEventListener('click', function() {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>
                        <i class="fas fa-palette"></i> Personalizar JHEILER
                    </h3>
                    
                    <div>
                        <label style="font-weight:600;display:block;margin-bottom:6px;">🎨 Tema</label>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn-secondary" onclick="applyTheme('dark')">Oscuro</button>
                            <button class="btn-secondary" onclick="applyTheme('light')">Claro</button>
                            <button class="btn-secondary" onclick="applyTheme('neon')">Neon</button>
                            <button class="btn-secondary" onclick="applyTheme('cyber')">Cyber</button>
                        </div>
                    </div>
                    
                    <div>
                        <label style="font-weight:600;display:block;margin-bottom:6px;">🔤 Fuente</label>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn-secondary" onclick="applyFont('Inter')">Inter</button>
                            <button class="btn-secondary" onclick="applyFont('Poppins')">Poppins</button>
                            <button class="btn-secondary" onclick="applyFont('Roboto')">Roboto</button>
                            <button class="btn-secondary" onclick="applyFont('Montserrat')">Montserrat</button>
                            <button class="btn-secondary" onclick="applyFont('Orbitron')">Orbitron</button>
                        </div>
                    </div>
                    
                    <div>
                        <label style="font-weight:600;display:block;margin-bottom:6px;">🎯 Color de acento</label>
                        <input type="color" id="accentColor" value="#ff304f" style="padding:4px;width:100%;height:50px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;">
                    </div>
                    
                    <div class="modal-actions">
                        <button class="btn-primary" onclick="applyAccentColor();this.closest('.modal').remove();">
                            <i class="fas fa-check"></i> Aplicar
                        </button>
                        <button class="btn-secondary" onclick="this.closest('.modal').remove()">
                            <i class="fas fa-times"></i> Cerrar
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        });

        window.applyTheme = function(theme) {
            const themes = {
                dark: { bg: '#0f0f0f', panel: '#181818', panel2: '#212121', border: '#303030' },
                light: { bg: '#f5f5f5', panel: '#ffffff', panel2: '#e8e8e8', border: '#ddd', text: '#666' },
                neon: { bg: '#0a0a1a', panel: '#111128', panel2: '#1a1a3a', border: '#333366', accent: '#00ff88' },
                cyber: { bg: '#000000', panel: '#0a0a0a', panel2: '#1a1a1a', border: '#333333', accent: '#ff00ff' }
            };
            
            const t = themes[theme];
            if (!t) return;
            
            document.documentElement.style.setProperty('--bg', t.bg);
            document.documentElement.style.setProperty('--panel', t.panel);
            document.documentElement.style.setProperty('--panel2', t.panel2);
            document.documentElement.style.setProperty('--border', t.border);
            if (t.text) document.documentElement.style.setProperty('--text-secondary', t.text);
            if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
            
            showToast(`Tema ${theme} aplicado`, 'success');
        };

        window.applyFont = function(font) {
            document.documentElement.style.setProperty('--font-family', `'${font}', -apple-system, 'Segoe UI', Roboto, sans-serif`);
            showToast(`Fuente ${font} aplicada`, 'success');
        };

        window.applyAccentColor = function() {
            const color = document.getElementById('accentColor')?.value;
            if (color) {
                document.documentElement.style.setProperty('--accent', color);
                showToast('Color de acento aplicado', 'success');
            }
        };

        // ============================================
        // SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        // ============================================
        // INICIALIZAR
        // ============================================
        loadVideos();
    </script>
