<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHEILER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff304f%22/><polygon points=%2238,28 78,50 38,72%22 fill=%22white%22/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Segoe UI",Roboto,sans-serif;
  background:#0f0f0f;
  color:#ffffff;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;color:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#0f0f0f;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;}

:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#212121;
  --accent:#ff304f;
  --border:#303030;
  --header-h:56px;
  --sidebar-w:240px;
}

#appHeader{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:200;border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:16px;}
.brand{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;}
.brand .play-ico{color:var(--accent);font-size:22px;}

.header-center{flex:1;display:flex;justify-content:center;max-width:600px;margin:0 16px;}
.search-form{
  display:flex;width:100%;align-items:center;
  border:1px solid var(--border);border-radius:20px 0 0 20px;
  background:var(--bg);height:40px;overflow:hidden;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:0 16px;font-size:15px;color:#fff;
}
.search-btn{
  width:60px;height:40px;background:var(--panel2);
  border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;
  display:flex;align-items:center;justify-content:center;
}

.create-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;background:var(--accent);
  font-size:14px;font-weight:600;color:#fff;
}

#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg);padding-top:12px;border-right:1px solid var(--border);
}
.sb-section{padding:8px 0;border-bottom:1px solid var(--border);}
.sb-title{padding:8px 24px;font-size:12px;font-weight:600;color:#aaa;text-transform:uppercase;}
.sb-item{
  display:flex;align-items:center;gap:20px;
  padding:12px 24px;font-size:14px;color:#fff;
}
.sb-item:hover{background:#272727;}

#appBody{padding-top:var(--header-h);display:flex;min-height:100vh;}
#mainContent{flex:1;margin-left:var(--sidebar-w);padding:24px;min-width:0;}

.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 16px;
}
.video-card{cursor:pointer;}
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--panel2);margin-bottom:10px;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.thumb-wrap .no-thumb{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:36px;color:#aaa;background:linear-gradient(135deg,#252525,#121212);
}
.card-meta{display:flex;gap:12px;}
.avatar-circle{
  width:36px;height:36px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.card-title{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;}
.card-channel{font-size:13px;color:#aaa;}

.state-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;text-align:center;color:#aaa;gap:16px;
}
.state-box .icon{font-size:64px;}
.state-box h3{color:#fff;font-size:22px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-card{
  background:var(--panel);border-radius:16px;padding:24px;width:100%;max-width:480px;
  display:flex;flex-direction:column;gap:14px;border:1px solid var(--border);
}
.modal-card input, .modal-card textarea{
  width:100%;padding:12px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;outline:none;font-size:14px;
}
.modal-card textarea{height:80px;resize:none;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
.btn-sec{padding:10px 18px;background:var(--panel2);border-radius:8px;}
.btn-pri{padding:10px 18px;background:var(--accent);color:#fff;border-radius:8px;}

#toastContainer{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:1100;display:flex;flex-direction:column;gap:8px;
}
.toast{background:#2a2a2a;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;}
.toast.error{background:#a31c1c;}
.toast.success{background:#1e7e34;}
</style>
</head>
<body>

<header id="appHeader">
  <div class="header-left">
    <a href="#/home" class="brand"><span class="play-ico">▶</span> JHEILER</a>
  </div>

  <div class="header-center">
    <form class="search-form" onsubmit="event.preventDefault();">
      <input type="text" id="searchInput" placeholder="Buscar">
    </form>
    <button class="search-btn">🔍</button>
  </div>

  <div class="header-right">
    <button class="create-btn" id="btnCreate">➕ <span>Crear</span></button>
  </div>
</header>

<nav id="sidebar">
  <div class="sb-section">
    <a class="sb-item" href="#/home"><span>🏠</span><span>Inicio</span></a>
    <a class="sb-item" href="#/shorts"><span>⚡</span><span>Shorts</span></a>
    <a class="sb-item" href="#/subscriptions"><span>📺</span><span>Suscripciones</span></a>
  </div>
  <div class="sb-section">
    <div class="sb-title">Biblioteca</div>
    <a class="sb-item" href="#/history"><span>🕒</span><span>Historial</span></a>
    <a class="sb-item" href="#/your-videos"><span>🎬</span><span>Tus videos</span></a>
  </div>
</nav>

<div id="appBody">
  <div id="mainContent"></div>
</div>

<div id="toastContainer"></div>

<script>
// Usamos 'sb' para no chocar con la variable global 'supabase'
const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function renderPage() {
  const main = document.getElementById('mainContent');
  if (!main) return;

  try {
    const { data: videos, error } = await sb.from('videos').select('*').order('created_at', { ascending: false });

    if (error || !videos || videos.length === 0) {
      main.innerHTML = `
        <div class="state-box">
          <div class="icon">🎬</div>
          <h3>Busca algo para comenzar</h3>
          <p>No hay videos publicados aún. Haz clic en <b>➕ Crear</b> para subir uno.</p>
        </div>`;
      return;
    }

    main.innerHTML = `
      <div class="video-grid">
        ${videos.map(v => `
          <div class="video-card" onclick="window.location.hash='#/watch?v=${v.id}'">
            <div class="thumb-wrap">
              ${v.thumbnail_url ? `<img src="${v.thumbnail_url}">` : '<div class="no-thumb">▶</div>'}
            </div>
            <div class="card-meta">
              <div class="avatar-circle">J</div>
              <div>
                <div class="card-title">${v.title}</div>
                <div class="card-channel">JHEILER</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch (err) {
    console.error(err);
    main.innerHTML = `
      <div class="state-box">
        <div class="icon">🎬</div>
        <h3>Busca algo para comenzar</h3>
        <p>Haz clic en el botón <b>➕ Crear</b> arriba para añadir tu primer video.</p>
      </div>`;
  }
}

document.getElementById('btnCreate')?.addEventListener('click', () => {
  const existingModal = document.getElementById('uploadModal');
  if (existingModal) existingModal.remove();

  const modalHTML = `
    <div id="uploadModal" class="modal-backdrop">
      <div class="modal-card">
        <h2>Subir nuevo video</h2>
        <input type="text" id="upTitle" placeholder="Título del video (Obligatorio)">
        <input type="text" id="upUrl" placeholder="URL del video MP4 (Obligatorio)">
        <input type="text" id="upThumb" placeholder="URL de la miniatura (Opcional)">
        <textarea id="upDesc" placeholder="Descripción"></textarea>
        <div class="modal-actions">
          <button class="btn-sec" onclick="document.getElementById('uploadModal').remove()">Cancelar</button>
          <button class="btn-pri" id="btnSaveVideo">Publicar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHTML);

  document.getElementById('btnSaveVideo')?.addEventListener('click', async () => {
    const title = document.getElementById('upTitle').value.trim();
    const video_url = document.getElementById('upUrl').value.trim();
    const thumbnail_url = document.getElementById('upThumb').value.trim();
    const description = document.getElementById('upDesc').value.trim();

    if (!title || !video_url) {
      showToast('Por favor completa el título y la URL del video', 'error');
      return;
    }

    const { error } = await sb.from('videos').insert([{ title, video_url, thumbnail_url, description }]);

    if (error) {
      showToast('Error al guardar: ' + error.message, 'error');
    } else {
      showToast('¡Video publicado correctamente!', 'success');
      document.getElementById('uploadModal').remove();
      renderPage();
    }
  });
});

window.addEventListener('hashchange', renderPage);
document.addEventListener('DOMContentLoaded', renderPage);
</script>
</body>
</html>
