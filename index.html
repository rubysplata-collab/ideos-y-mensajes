<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JHEILER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0f0f0f;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:#0f0f0f;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#ff304f;}

:root{--bg:#0f0f0f;--panel:#181818;--panel2:#212121;--text:#fff;--text-secondary:#aaa;--accent:#ff304f;--border:#303030;--header-h:56px;}

.hidden{display:none !important;}

/* HEADER */
#appHeader{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:200;border-bottom:1px solid var(--border);
}
.header-left{display:flex;align-items:center;gap:12px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:background .15s;
}
.icon-btn:hover{background:#3a3a3a;}
.brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px;}
.brand .play-ico{color:var(--accent);}
.brand .hl{color:var(--accent);}

.header-center{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;max-width:720px;margin:0 16px;}
.search-form{
  display:flex;flex:1;align-items:center;
  border:1px solid var(--border);border-radius:20px;
  background:var(--bg);height:40px;overflow:hidden;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:0 16px;font-size:15px;color:var(--text);
}
.search-btn{
  width:64px;height:40px;background:var(--panel2);
  border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;
  font-size:18px;flex-shrink:0;
}
.search-btn:hover{background:#3a3a3a;}

.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.create-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;background:var(--panel2);
  font-size:14px;font-weight:500;
}
.create-btn:hover{background:#3a3a3a;}
.avatar-circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;overflow:hidden;flex-shrink:0;
}
.auth-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border:1px solid var(--border);border-radius:20px;
  color:#3ea6ff;font-size:14px;font-weight:500;
}
.auth-btn:hover{background:rgba(62,166,255,0.1);}

/* SIDEBAR */
#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:240px;
  background:var(--bg);overflow-y:auto;z-index:150;padding-bottom:24px;
  transition:transform .2s;
}
.sb-section{padding:12px 0;border-bottom:1px solid var(--border);}
.sb-title{padding:6px 24px;font-size:13px;font-weight:600;color:var(--text-secondary);}
.sb-item{
  display:flex;align-items:center;gap:20px;
  padding:10px 24px;font-size:14px;border-radius:0 20px 20px 0;
}
.sb-item .sb-ico{font-size:20px;width:24px;text-align:center;}
.sb-item:hover{background:#3a3a3a;}
.sb-item.active{background:var(--panel2);font-weight:600;}
.sb-item.active .sb-ico{color:var(--accent);}
#sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:140;display:none;}

@media(max-width:900px){
  #sidebar{transform:translateX(-100%);width:260px;}
  #sidebar.show{transform:translateX(0);}
  #sidebarOverlay.show{display:block;}
  .header-center{display:none;}
}

/* MAIN */
#appBody{padding-top:var(--header-h);display:flex;min-height:100vh;}
#mainContent{flex:1;margin-left:240px;padding:24px;min-width:0;}
@media(max-width:900px){#mainContent{margin-left:0;}}

/* VIDEO GRID */
.section-heading{font-size:18px;font-weight:600;margin:0 0 16px;}
.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}
.video-card{cursor:pointer;}
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--panel2);margin-bottom:8px;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.duration-badge{
  position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.85);
  color:#fff;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;
}
.card-meta{display:flex;gap:10px;}
.card-info{flex:1;min-width:0;}
.card-title{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-channel{font-size:13px;color:var(--text-secondary);}
.card-stats{font-size:13px;color:var(--text-secondary);}
.state-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;text-align:center;color:var(--text-secondary);gap:12px;
}
.state-box .state-ico{font-size:48px;opacity:.6;}
.state-box h3{color:var(--text);font-size:18px;font-weight:600;}
.retry-btn{
  padding:9px 20px;border-radius:20px;background:var(--panel2);
  font-size:14px;font-weight:500;
}
.retry-btn:hover{background:#3a3a3a;}
.btn{
  padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-secondary{background:var(--panel2);color:var(--text);}
.btn-secondary:hover{background:#3a3a3a;}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-box{
  background:var(--panel);border-radius:12px;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;padding:24px;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{font-size:18px;font-weight:600;}
.modal-close{font-size:24px;padding:4px 10px;}
.modal-close:hover{background:#3a3a3a;border-radius:50%;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;}
.field input,.field textarea{
  width:100%;padding:10px 12px;background:var(--bg);
  border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;color:#fff;
}
.field input:focus,.field textarea:focus{border-color:var(--accent);}
.field-error{color:var(--accent);font-size:13px;margin-top:6px;}

/* TOAST */
#toastContainer{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;
  width:100%;pointer-events:none;
}
.toast{
  background:#2a2a2a;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);max-width:90vw;text-align:center;
}
.toast.error{background:#3a1418;border:1px solid var(--accent);}
.toast.success{background:#123a20;border:1px solid #2ecc71;}
</style>
</head>
<body>

<!-- HEADER -->
<header id="appHeader">
  <div class="header-left">
    <button class="icon-btn" id="btnToggleSidebar">☰</button>
    <a href="#/home" class="brand"><span class="play-ico">▶</span> JHEILER</a>
  </div>
  <div class="header-center">
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Buscar" autocomplete="off">
    </form>
    <button class="search-btn" id="searchSubmitBtn">🔍</button>
  </div>
  <div class="header-right">
    <button class="create-btn" id="btnCreate"><span>➕</span><span>Crear</span></button>
    <button class="icon-btn" id="btnNotifications">🔔</button>
    <div id="authArea">
      <button class="auth-btn" id="btnOpenLogin"><span>👤</span> Iniciar sesión</button>
    </div>
  </div>
</header>

<!-- SIDEBAR -->
<div id="sidebarOverlay"></div>
<nav id="sidebar">
  <div class="sb-section">
    <a class="sb-item active" data-route="home" href="#/home"><span class="sb-ico">🏠</span> Inicio</a>
    <a class="sb-item" data-route="shorts" href="#/shorts"><span class="sb-ico">⚡</span> Shorts</a>
    <a class="sb-item" data-route="subscriptions" href="#/subscriptions"><span class="sb-ico">📺</span> Suscripciones</a>
  </div>
  <div class="sb-section">
    <div class="sb-title">Biblioteca</div>
    <a class="sb-item" data-route="history" href="#/history"><span class="sb-ico">🕒</span> Historial</a>
    <a class="sb-item" data-route="your-videos" href="#/your-videos"><span class="sb-ico">🎬</span> Tus videos</a>
    <a class="sb-item" data-route="watch-later" href="#/watch-later"><span class="sb-ico">⏰</span> Ver más tarde</a>
    <a class="sb-item" data-route="liked" href="#/liked"><span class="sb-ico">👍</span> Me gusta</a>
  </div>
  <div class="sb-section">
    <div class="sb-title">Explorar</div>
    <a class="sb-item" data-route="trending" href="#/trending"><span class="sb-ico">🔥</span> Tendencias</a>
    <a class="sb-item" data-route="gaming" href="#/gaming"><span class="sb-ico">🎮</span> Gaming</a>
    <a class="sb-item" data-route="music" href="#/music"><span class="sb-ico">🎵</span> Música</a>
  </div>
  <div class="sb-section">
    <a class="sb-item" data-route="settings" href="#/settings"><span class="sb-ico">⚙️</span> Configuración</a>
  </div>
</nav>

<!-- MAIN -->
<div id="appBody"><div id="mainContent"></div></div>

<!-- TOAST -->
<div id="toastContainer"></div>

<!-- MODAL ROOT -->
<div id="modalRoot"></div>

<script>
"use strict";

// ============================================================
// SUPABASE CLIENT
// ============================================================
const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

// ============================================================
// STATE
// ============================================================
const STATE = {
  session: null,
  user: null,
  profile: null,
  sidebarOpen: false,
};

// ============================================================
// UTILS
// ============================================================
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function escapeHTML(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatCount(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1).replace('.0','')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace('.0','')+'K'; return String(n); }
function timeAgo(d){ if(!d) return ''; const diff=(Date.now()-new Date(d).getTime())/1000; const units=[['año',31536000],['mes',2592000],['día',86400],['hora',3600],['minuto',60]]; for(const [l,s] of units){ const v=Math.floor(diff/s); if(v>=1) return `hace ${v} ${l}${v>1?'s':''}`; } return 'hace un momento'; }

function toast(msg, type){ const c=qs('#toastContainer'); const el=document.createElement('div'); el.className='toast'+(type?(' '+type):''); el.textContent=msg; c.appendChild(el); setTimeout(()=>{el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),260);},3000); }
function toastSuccess(msg){ toast(msg,'success'); }
function toastError(msg){ toast(msg,'error'); }

function closeModal(){ const ov=qs('#activeModalOverlay'); if(ov) ov.remove(); }

// ============================================================
// AUTH
// ============================================================
async function initAuth(){
  const { data:{ session } } = await supabase.auth.getSession();
  STATE.session = session;
  STATE.user = session ? session.user : null;
  if(STATE.user) await loadProfile();
  updateUI();
}

async function loadProfile(){
  if(!STATE.user) return;
  const { data } = await supabase.from('profiles').select('*').eq('id', STATE.user.id).maybeSingle();
  STATE.profile = data;
}

function updateUI(){
  const area = qs('#authArea');
  if(STATE.user){
    const name = STATE.profile ? (STATE.profile.display_name || STATE.profile.username) : 'Usuario';
    area.innerHTML = `<button class="icon-btn" id="btnUserMenu"><span class="avatar-circle">${(name[0]||'U').toUpperCase()}</span></button>`;
    const menu = qs('#btnUserMenu');
    if(menu) menu.addEventListener('click', ()=>{
      if(confirm(`Cerrar sesión de ${name}?`)) doSignOut();
    });
  } else {
    area.innerHTML = `<button class="auth-btn" id="btnOpenLogin"><span>👤</span> Iniciar sesión</button>`;
    qs('#btnOpenLogin').addEventListener('click', ()=>openAuthModal('login'));
  }
}

async function doSignOut(){
  await supabase.auth.signOut();
  STATE.user = null;
  STATE.profile = null;
  updateUI();
  toastSuccess('Sesión cerrada.');
  renderRoute();
}

// ============================================================
// AUTH MODAL
// ============================================================
function openAuthModal(mode){
  const html = `
    <div class="modal-head">
      <h2>${mode==='login'?'Iniciar sesión':'Crear cuenta'}</h2>
      <button class="modal-close" id="authModalClose">✕</button>
    </div>
    <form id="authForm">
      ${mode==='signup' ? `
        <div class="field"><label>Nombre</label><input type="text" id="signupName" required></div>
        <div class="field"><label>Usuario</label><input type="text" id="signupUsername" required></div>
      ` : ''}
      <div class="field"><label>Email</label><input type="email" id="authEmail" required></div>
      <div class="field"><label>Contraseña</label><input type="password" id="authPassword" required minlength="6"></div>
      <div id="authError" class="field-error hidden"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">${mode==='login'?'Iniciar sesión':'Crear cuenta'}</button>
      <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);text-align:center;">
        ${mode==='login' ? '¿No tienes cuenta? <a href="#" id="switchToSignup" style="color:#3ea6ff;">Regístrate</a>' :
        '¿Ya tienes cuenta? <a href="#" id="switchToLogin" style="color:#3ea6ff;">Inicia sesión</a>'}
      </div>
    </form>
  `;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModalOverlay';
  overlay.innerHTML = `<div class="modal-box">${html}</div>`;
  qs('#modalRoot').appendChild(overlay);
  qs('#authModalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  qs('#authForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = qs('#authEmail').value.trim();
    const password = qs('#authPassword').value;
    const errBox = qs('#authError');
    errBox.classList.add('hidden');
    try{
      if(mode==='login'){
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if(error) throw error;
        toastSuccess('Sesión iniciada');
        closeModal();
        await initAuth();
        renderRoute();
      } else {
        const displayName = qs('#signupName').value.trim();
        const username = qs('#signupUsername').value.trim().toLowerCase();
        if(!/^[a-z0-9_.]+$/.test(username)){ throw new Error('Usuario solo letras, números, . y _'); }
        const { data, error } = await supabase.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user){
          await supabase.from('profiles').insert({ id: data.user.id, username, display_name: displayName });
        }
        toastSuccess('Cuenta creada. Revisa tu correo.');
        closeModal();
        await initAuth();
        renderRoute();
      }
    }catch(err){
      errBox.textContent = err.message || 'Error';
      errBox.classList.remove('hidden');
    }
  });

  const switchLink = qs('#switchToSignup') || qs('#switchToLogin');
  if(switchLink) switchLink.addEventListener('click', (e)=>{ e.preventDefault(); closeModal(); openAuthModal(mode==='login'?'signup':'login'); });
}

// ============================================================
// ROUTER
// ============================================================
function renderRoute(){
  const hash = location.hash.replace('#','') || '/home';
  const path = hash.split('?')[0];
  const main = qs('#mainContent');
  main.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary);">Cargando...</div>';

  // Marcar sidebar
  const route = path.replace('/','') || 'home';
  qsa('.sb-item[data-route]').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === route);
  });

  // Render según ruta
  if(route === 'home' || route === '') renderHome(main);
  else if(route === 'shorts') renderShorts(main);
  else if(route === 'subscriptions') renderSubscriptions(main);
  else if(route === 'history') renderHistory(main);
  else if(route === 'your-videos') renderYourVideos(main);
  else if(route === 'watch-later') renderWatchLater(main);
  else if(route === 'liked') renderLiked(main);
  else if(route === 'trending') renderTrending(main);
  else if(route === 'gaming') renderCategory(main, 'Gaming');
  else if(route === 'music') renderCategory(main, 'Música');
  else if(route === 'settings') renderSettings(main);
  else if(path.startsWith('/watch/')) {
    const id = path.split('/')[2];
    if(id) renderWatch(main, id);
    else renderNotFound(main);
  } else if(path.startsWith('/channel/')) {
    const id = path.split('/')[2];
    if(id) renderChannel(main, id);
    else renderNotFound(main);
  } else {
    renderNotFound(main);
  }
}

// ============================================================
// PAGES
// ============================================================
function videoCardHTML(v){
  const ch = v.profiles || {};
  const thumb = v.thumbnail_url ? `<img src="${escapeHTML(v.thumbnail_url)}" loading="lazy">` : '<div class="no-thumb" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:32px;color:#666;">▶</div>';
  const dur = v.duration ? `<span class="duration-badge">${formatDuration(v.duration)}</span>` : '';
  return `
    <a href="#/watch/${escapeHTML(v.id)}" class="video-card">
      <div class="thumb-wrap">${thumb}${dur}</div>
      <div class="card-meta">
        <div class="card-info">
          <div class="card-title">${escapeHTML(v.title)}</div>
          <div class="card-channel">${escapeHTML(ch.display_name||ch.username||'Canal')}</div>
          <div class="card-stats">${formatCount(v.views||0)} vistas · ${timeAgo(v.created_at)}</div>
        </div>
      </div>
    </a>`;
}
function formatDuration(sec){ sec=Math.floor(Number(sec)||0); const m=Math.floor(sec/60); const s=sec%60; return `${m}:${String(s).padStart(2,'0')}`; }

// -- HOME --
async function renderHome(main){
  try{
    const { data, error } = await supabase
      .from('videos')
      .select('*, profiles!videos_user_id_fkey(*)')
      .eq('is_short', false)
      .order('created_at', { ascending: false })
      .limit(20);
    if(error) throw error;
    if(!data || data.length===0){
      main.innerHTML = `<div class="state-box"><div class="state-ico">🎬</div><h3>Sin videos aún</h3><p>Sé el primero en publicar.</p><button class="retry-btn" id="homeUploadCta">Subir video</button></div>`;
      qs('#homeUploadCta')?.addEventListener('click', ()=>openCreateModal());
      return;
    }
    main.innerHTML = `<h2 class="section-heading">Inicio</h2><div class="video-grid">${data.map(videoCardHTML).join('')}</div>`;
  } catch(e) {
    main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3><p>${escapeHTML(e.message)}</p><button class="retry-btn" onclick="renderRoute()">Reintentar</button></div>`;
  }
}

// -- SHORTS --
async function renderShorts(main){
  try{
    const { data } = await supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').eq('is_short', true).order('created_at',{ascending:false}).limit(20);
    if(!data || data.length===0){
      main.innerHTML = `<div class="state-box"><div class="state-ico">⚡</div><h3>No hay Shorts</h3><button class="retry-btn" id="shortsUploadCta">Crear Short</button></div>`;
      qs('#shortsUploadCta')?.addEventListener('click', ()=>openCreateModal());
      return;
    }
    main.innerHTML = `<h2 class="section-heading">Shorts</h2><div class="video-grid">${data.map(videoCardHTML).join('')}</div>`;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3><p>${escapeHTML(e.message)}</p></div>`; }
}

// -- CATEGORIES --
async function renderCategory(main, cat){
  try{
    const { data } = await supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').eq('category', cat).eq('is_short', false).order('views',{ascending:false}).limit(20);
    if(!data || data.length===0){
      main.innerHTML = `<div class="state-box"><div class="state-ico">📭</div><h3>No hay videos en ${escapeHTML(cat)}</h3></div>`;
      return;
    }
    main.innerHTML = `<h2 class="section-heading">${escapeHTML(cat)}</h2><div class="video-grid">${data.map(videoCardHTML).join('')}</div>`;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3><p>${escapeHTML(e.message)}</p></div>`; }
}
async function renderTrending(main){ renderCategory(main, 'Tendencias'); }

// -- SUBS --
async function renderSubscriptions(main){
  if(!STATE.user){ main.innerHTML = `<div class="state-box"><div class="state-ico">🔒</div><h3>Inicia sesión</h3><button class="retry-btn" onclick="openAuthModal('login')">Iniciar sesión</button></div>`; return; }
  try{
    const { data: subs } = await supabase.from('subscriptions').select('channel_id').eq('subscriber_id', STATE.user.id);
    if(!subs || subs.length===0){ main.innerHTML = `<div class="state-box"><div class="state-ico">📺</div><h3>No sigues a nadie</h3></div>`; return; }
    const ids = subs.map(s=>s.channel_id);
    const { data } = await supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').in('user_id', ids).order('created_at',{ascending:false}).limit(30);
    if(!data || data.length===0){ main.innerHTML = `<div class="state-box"><div class="state-ico">📺</div><h3>Tus canales no han publicado</h3></div>`; return; }
    main.innerHTML = `<h2 class="section-heading">Suscripciones</h2><div class="video-grid">${data.map(videoCardHTML).join('')}</div>`;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3></div>`; }
}

// -- HISTORY --
async function renderHistory(main){

  try{
    const { data } = await supabase.from('watch_history').select('videos(*, profiles!videos_user_id_fkey(*))').eq('user_id', STATE.user.id).order('watched_at',{ascending:false}).limit(30);

    main.innerHTML = `<h2 class="section-heading">Historial</h2><div class="video-grid">${videos.map(videoCardHTML).join('')}</div>`;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div></div>`; }
}

// -- WATCH --
async function renderWatch(main, id){
  try{
    const { data: video, error } = await supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').eq('id', id).maybeSingle();
    if(error || !video){ main.innerHTML = `<div class="state-box"><div class="state-ico">🎬</div><h3>Video no encontrado</h3></div>`; return; }
    const ch = video.profiles || {};
    main.innerHTML = `
      <div style="max-width:900px;margin:0 auto;">
        <div style="background:#000;border-radius:12px;overflow:hidden;margin-bottom:16px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;">
          <video controls style="width:100%;height:100%;object-fit:contain;" poster="${escapeHTML(video.thumbnail_url||'')}">
            <source src="${escapeHTML(video.video_url)}">
          </video>
        </div>
        <h1 style="font-size:22px;font-weight:600;margin-bottom:8px;">${escapeHTML(video.title)}</h1>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px;">
          <span style="color:var(--text-secondary);font-size:14px;">${formatCount(video.views||0)} vistas · ${timeAgo(video.created_at)}</span>
          <div style="display:flex;gap:12px;">
            <button class="btn btn-secondary" onclick="shareVideo('${video.id}')">🔗 Compartir</button>
            <button class="btn btn-secondary" onclick="addWatchLater('${video.id}')">⏰ Guardar</button>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:16px;">
          <a href="#/channel/${escapeHTML(video.user_id)}" style="font-weight:600;">${escapeHTML(ch.display_name||ch.username||'Canal')}</a>
          <span style="color:var(--text-secondary);font-size:13px;">${formatCount(ch.subscribers_count||0)} suscriptores</span>
        </div>
        <div style="background:var(--panel2);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">${escapeHTML(video.description||'Sin descripción')}</div>
      </div>
    `;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3></div>`; }
}

// -- CHANNEL --
async function renderChannel(main, id){
  try{
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', id).maybeSingle();
    if(!profile){ main.innerHTML = `<div class="state-box"><div class="state-ico">👤</div><h3>Canal no encontrado</h3></div>`; return; }
    const { data: videos } = await supabase.from('videos').select('*, profiles!videos_user_id_fkey(*)').eq('user_id', id).order('created_at',{ascending:false}).limit(20);
    main.innerHTML = `
      <div style="display:flex;gap:20px;align-items:center;margin-bottom:20px;">
        <div class="avatar-circle" style="width:64px;height:64px;font-size:24px;">${(profile.display_name||profile.username||'U')[0].toUpperCase()}</div>
        <div>
          <h1 style="font-size:24px;">${escapeHTML(profile.display_name||profile.username)}</h1>
          <div style="color:var(--text-secondary);font-size:14px;">@${escapeHTML(profile.username)} · ${formatCount(profile.subscribers_count||0)} suscriptores</div>
          ${profile.description ? `<div style="margin-top:4px;color:var(--text-secondary);font-size:13px;">${escapeHTML(profile.description)}</div>` : ''}
        </div>
      </div>
      <h2 class="section-heading">Videos</h2>
      ${videos && videos.length ? `<div class="video-grid">${videos.map(videoCardHTML).join('')}</div>` : '<div class="state-box"><div class="state-ico">🎬</div><h3>Este canal no tiene videos</h3></div>'}
    `;
  } catch(e) { main.innerHTML = `<div class="state-box"><div class="state-ico">⚠️</div><h3>Error</h3></div>`; }
}

// ============================================================
// EXTRA FUNCTIONS
// ============================================================
window.shareVideo = async function(id){
  const url = location.origin + location.pathname + '#/watch/' + id;
  if(navigator.share) try{ await navigator.share({ url }); return; } catch(e){}
  try{ await navigator.clipboard.writeText(url); toastSuccess('Enlace copiado'); } catch(e){ toastError('Error'); }
};

window.addWatchLater = async function(id){
  if(!STATE.user){ toastError('Inicia sesión'); return; }
  try{
    const { data: existing } = await supabase.from('watch_later').select('id').eq('user_id', STATE.user.id).eq('video_id', id).maybeSingle();
    if(existing){ toastSuccess('Ya guardado'); return; }
    await supabase.from('watch_later').insert({ user_id: STATE.user.id, video_id: id });
    toastSuccess('Guardado');
  } catch(e){ toastError('Error'); }
};

window.openCreateModal = function(){
  if(!STATE.user){ toastError('Inicia sesión'); return; }
  const html = `
    <div class="modal-head"><h2>Subir video</h2><button class="modal-close" id="createClose">✕</button></div>
    <form id="uploadForm">
      <div class="field"><label>Título</label><input type="text" id="uploadTitle" required></div>
      <div class="field"><label>Descripción</label><textarea id="uploadDesc"></textarea></div>
      <div class="field"><label>URL del video</label><input type="url" id="uploadUrl" placeholder="https://..." required></div>
      <div id="uploadError" class="field-error hidden"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Publicar</button>
    </form>
  `;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModalOverlay';
  overlay.innerHTML = `<div class="modal-box">${html}</div>`;
  qs('#modalRoot').appendChild(overlay);
  qs('#createClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  qs('#uploadForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const title = qs('#uploadTitle').value.trim();
    const desc = qs('#uploadDesc').value.trim();
    const url = qs('#uploadUrl').value.trim();
    if(!title || !url){ toastError('Completa todos los campos'); return; }
    try{
      const { error } = await supabase.from('videos').insert({
        user_id: STATE.user.id,
        title, description: desc, video_url: url,
        thumbnail_url: null, is_short: false, views: 0, likes_count: 0
      });
      if(error) throw error;
      toastSuccess('Video publicado');
      closeModal();
      renderRoute();
    } catch(err){ qs('#uploadError').textContent=err.message; qs('#uploadError').classList.remove('hidden'); }
  });
};

// ============================================================
// INIT
// ============================================================
function init(){
  // Sidebar toggle
  qs('#btnToggleSidebar').addEventListener('click', ()=>{
    const sb = qs('#sidebar');
    const ov = qs('#sidebarOverlay');
    if(window.innerWidth <= 900){
      sb.classList.toggle('show');
      ov.classList.toggle('show');
    }
  });
  qs('#sidebarOverlay').addEventListener('click', ()=>{
    qs('#sidebar').classList.remove('show');
    qs('#sidebarOverlay').classList.remove('show');
  });

  // Search
  qs('#searchForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const q = qs('#searchInput').value.trim();
    if(q) location.hash = '#/search?q=' + encodeURIComponent(q);
  });
  qs('#searchSubmitBtn').addEventListener('click', ()=>{
    const q = qs('#searchInput').value.trim();
    if(q) location.hash = '#/search?q=' + encodeURIComponent(q);
  });

  // Create
  qs('#btnCreate').addEventListener('click', ()=>openCreateModal());
  qs('#btnNotifications').addEventListener('click', ()=>toast('No hay notificaciones'));

  // Auth
  qs('#btnOpenLogin')?.addEventListener('click', ()=>openAuthModal('login'));

  // Hash change
  window.addEventListener('hashchange', renderRoute);

  initAuth().then(renderRoute);
}

document.addEventListener('DOMContentLoaded', init);
</script>
