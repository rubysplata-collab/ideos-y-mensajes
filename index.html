<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escritorio Remoto - AnyDesk Clone</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background: #16213e;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid #2a3a5e;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #2a3a5e;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .logo i {
            font-size: 32px;
            color: #4a9eff;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #4a9eff;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #a0b4d6;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #1a2a4a;
            border-radius: 30px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            display: inline-block;
        }

        .status-dot.connected {
            background: #44ff88;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .peer-id-box {
            background: #0d1b3e;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            color: #4a9eff;
            border: 1px solid #2a4a7a;
            cursor: pointer;
            transition: 0.3s;
        }

        .peer-id-box:hover {
            background: #1a2a5a;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Remote Screen */
        .remote-screen {
            background: #0d1b3e;
            border-radius: 16px;
            padding: 16px;
            border: 2px solid #2a3a5e;
            min-height: 500px;
            position: relative;
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a0b4d6;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a2a4a;
            margin-bottom: 16px;
        }

        .screen-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .screen-controls {
            display: flex;
            gap: 10px;
        }

        .screen-controls button {
            background: #1a2a4a;
            border: none;
            color: #a0b4d6;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .screen-controls button:hover {
            background: #2a4a7a;
            color: white;
        }

        .screen-controls button.danger:hover {
            background: #ff4444;
        }

        .screen-display {
            background: #0a0a1a;
            border-radius: 12px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            min-height: 400px;
            object-fit: contain;
            background: #0a0a1a;
            display: none;
        }

        .screen-placeholder {
            color: #4a6a8a;
            text-align: center;
            padding: 40px;
        }

        .screen-placeholder i {
            font-size: 64px;
            margin-bottom: 20px;
            color: #2a4a7a;
        }

        .screen-placeholder h3 {
            color: #8ab4e6;
            margin-bottom: 10px;
        }

        /* Controls Panel */
        .controls-panel {
            background: #0d1b3e;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #2a3a5e;
        }

        .panel-section {
            margin-bottom: 24px;
        }

        .panel-section:last-child {
            margin-bottom: 0;
        }

        .panel-section h3 {
            color: #8ab4e6;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .peer-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .peer-input-group input {
            flex: 1;
            padding: 12px 16px;
            background: #0a1a3a;
            border: 1px solid #2a4a7a;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .peer-input-group input:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: #4a9eff;
            color: white;
        }

        .btn-primary:hover {
            background: #6ab4ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 158, 255, 0.3);
        }

        .btn-success {
            background: #44d47c;
            color: white;
        }

        .btn-success:hover {
            background: #66e89a;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ff4444;
            color: white;
        }

        .btn-danger:hover {
            background: #ff6666;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #1a2a4a;
            color: #a0b4d6;
        }

        .btn-secondary:hover {
            background: #2a4a7a;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .control-btn {
            padding: 12px;
            background: #0a1a3a;
            border: 1px solid #2a4a7a;
            border-radius: 8px;
            color: #a0b4d6;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-size: 13px;
        }

        .control-btn i {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .control-btn:hover {
            background: #1a2a5a;
            border-color: #4a9eff;
            color: white;
        }

        .control-btn.active {
            background: #2a4a7a;
            border-color: #4a9eff;
            color: #4a9eff;
        }

        .chat-box {
            background: #0a1a3a;
            border-radius: 10px;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #1a2a4a;
        }

        .chat-message {
            color: #a0b4d6;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid #0d1b3e;
        }

        .chat-message .sender {
            color: #4a9eff;
            font-weight: 600;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 10px 14px;
            background: #0a1a3a;
            border: 1px solid #2a4a7a;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .chat-input-group input:focus {
            border-color: #4a9eff;
        }

        /* Mouse position indicator */
        .mouse-indicator {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #4a9eff;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .connection-status {
                flex-wrap: wrap;
            }
            .peer-input-group {
                flex-direction: column;
            }
            .control-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-desktop"></i>
            <h1>Any<span>Desk</span> <span style="font-size: 14px; color: #4a6a8a;">· Escritorio Remoto</span></h1>
        </div>
        <div class="connection-status">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Desconectado</span>
            </div>
            <div class="peer-id-box" onclick="copyPeerId()">
                <i class="fas fa-id-card"></i> <span id="myPeerId">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
        <!-- Remote Screen -->
        <div class="remote-screen">
            <div class="screen-header">
                <div class="screen-title">
                    <i class="fas fa-monitor"></i>
                    <span id="remoteName">Pantalla remota</span>
                </div>
                <div class="screen-controls">
                    <button onclick="toggleFullscreen()"><i class="fas fa-expand"></i> Pantalla completa</button>
                    <button class="danger" onclick="disconnect()"><i class="fas fa-power-off"></i> Desconectar</button>
                </div>
            </div>
            <div class="screen-display" id="screenDisplay">
                <div class="screen-placeholder" id="placeholder">
                    <i class="fas fa-wifi"></i>
                    <h3>Esperando conexión...</h3>
                    <p style="color: #4a6a8a; font-size: 14px;">Comparte tu ID para recibir una conexión</p>
                </div>
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="mouse-indicator" id="mouseIndicator"></div>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <!-- Conexión -->
            <div class="panel-section">
                <h3><i class="fas fa-plug"></i> Conexión</h3>
                <div class="peer-input-group">
                    <input type="text" id="remotePeerId" placeholder="ID remoto" value="">
                    <button class="btn btn-primary" onclick="connectToPeer()">
                        <i class="fas fa-arrow-right"></i> Conectar
                    </button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="copyPeerId()" style="flex:1;">
                        <i class="fas fa-copy"></i> Copiar mi ID
                    </button>
                    <button class="btn btn-secondary" onclick="generateNewId()" style="flex:1;">
                        <i class="fas fa-sync"></i> Nuevo ID
                    </button>
                </div>
            </div>

            <!-- Controles remotos -->
            <div class="panel-section">
                <h3><i class="fas fa-mouse-pointer"></i> Controles remotos</h3>
                <div class="control-grid">
                    <div class="control-btn" onclick="sendKey('ctrl')">
                        <i class="fas fa-keyboard"></i> Ctrl
                    </div>
                    <div class="control-btn" onclick="sendKey('alt')">
                        <i class="fas fa-keyboard"></i> Alt
                    </div>
                    <div class="control-btn" onclick="sendKey('shift')">
                        <i class="fas fa-keyboard"></i> Shift
                    </div>
                    <div class="control-btn" onclick="sendKey('esc')">
                        <i class="fas fa-times"></i> Esc
                    </div>
                    <div class="control-btn" onclick="sendKey('tab')">
                        <i class="fas fa-arrow-right"></i> Tab
                    </div>
                    <div class="control-btn" onclick="sendKey('win')">
                        <i class="fab fa-windows"></i> Win
                    </div>
                </div>
            </div>

            <!-- Chat -->
            <div class="panel-section">
                <h3><i class="fas fa-comment"></i> Chat</h3>
                <div class="chat-box" id="chatBox">
                    <div class="chat-message"><span class="sender">Sistema:</span> Conéctate para chatear</div>
                </div>
                <div class="chat-input-group">
                    <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn btn-primary" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>

            <!-- Estado -->
            <div class="panel-section" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #1a2a4a;">
                <div style="display: flex; justify-content: space-between; color: #6a8aaa; font-size: 12px;">
                    <span><i class="fas fa-shield-alt"></i> Conexión cifrada</span>
                    <span id="connectionInfo">Esperando conexión...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // =============================================
    // PEERJS CONFIGURACIÓN (Servidor gratuito)
    // =============================================
    const peer = new Peer(undefined, {
        host: '0.peerjs.com',
        port: 443,
        path: '/',
        secure: true,
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        }
    });

    let remotePeerId = null;
    let conn = null;
    let call = null;
    let isConnected = false;
    let localStream = null;
    let remoteStream = null;

    // Elementos DOM
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const myPeerIdEl = document.getElementById('myPeerId');
    const remotePeerIdInput = document.getElementById('remotePeerId');
    const remoteVideo = document.getElementById('remoteVideo');
    const placeholder = document.getElementById('placeholder');
    const screenDisplay = document.getElementById('screenDisplay');
    const remoteName = document.getElementById('remoteName');
    const mouseIndicator = document.getElementById('mouseIndicator');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const connectionInfo = document.getElementById('connectionInfo');

    // =============================================
    // EVENTOS PEER
    // =============================================
    peer.on('open', (id) => {
        myPeerIdEl.textContent = id;
        updateStatus('disconnected', 'Esperando conexión');
        connectionInfo.textContent = 'ID: ' + id;
        console.log('Mi ID:', id);
        
        // Si hay URL con parámetro ?connect=ID, conectar automáticamente
        const params = new URLSearchParams(window.location.search);
        const autoConnect = params.get('connect');
        if (autoConnect) {
            remotePeerIdInput.value = autoConnect;
            setTimeout(connectToPeer, 500);
        }
    });

    peer.on('error', (err) => {
        console.error('Peer error:', err);
        if (err.type === 'peer-unavailable') {
            addChatMessage('Sistema', 'ID remoto no disponible');
            updateStatus('disconnected', 'Error de conexión');
        }
    });

    // =============================================
    // CONEXIÓN ENTRANTE (data + video)
    // =============================================
    peer.on('connection', (incomingConn) => {
        if (conn) {
            incomingConn.close();
            return;
        }
        conn = incomingConn;
        remotePeerId = conn.peer;
        setupConnection(conn);
    });

    peer.on('call', (incomingCall) => {
        if (call) {
            incomingCall.answer();
            incomingCall.close();
            return;
        }
        
        // Pedir permisos de cámara/screen
        navigator.mediaDevices.getDisplayMedia({
            video: {
                cursor: 'always',
                frameRate: 30
            },
            audio: true
        }).then((stream) => {
            localStream = stream;
            incomingCall.answer(stream);
            setupCall(incomingCall);
        }).catch((err) => {
            console.error('Error al compartir pantalla:', err);
            addChatMessage('Sistema', 'No se pudo compartir pantalla');
        });
    });

    // =============================================
    // CONEXIÓN SALIENTE
    // =============================================
    function connectToPeer() {
        const id = remotePeerIdInput.value.trim();
        if (!id) {
            addChatMessage('Sistema', 'Introduce un ID válido');
            return;
        }

        if (isConnected) {
            disconnect();
            setTimeout(() => connectToPeer(), 300);
            return;
        }

        // Conectar data channel
        const newConn = peer.connect(id);
        newConn.on('open', () => {
            conn = newConn;
            remotePeerId = id;
            setupConnection(conn);
        });

        newConn.on('error', (err) => {
            console.error('Error de conexión:', err);
            addChatMessage('Sistema', 'Error al conectar con ' + id);
        });

        // También llamada de video
        navigator.mediaDevices.getDisplayMedia({
            video: {
                cursor: 'always',
                frameRate: 30
            },
            audio: true
        }).then((stream) => {
            localStream = stream;
            const newCall = peer.call(id, stream);
            setupCall(newCall);
        }).catch((err) => {
            console.error('Error al compartir pantalla:', err);
            addChatMessage('Sistema', 'No se pudo compartir pantalla');
        });

        remoteName.textContent = 'Conectando a ' + id + '...';
    }

    // =============================================
    // SETUP CONEXIÓN
    // =============================================
    function setupConnection(connection) {
        conn = connection;
        remotePeerId = connection.peer;
        isConnected = true;

        updateStatus('connected', 'Conectado a ' + remotePeerId);
        connectionInfo.textContent = 'Conectado a: ' + remotePeerId;
        remoteName.textContent = 'Escritorio: ' + remotePeerId;
        placeholder.style.display = 'none';

        // Escuchar mensajes
        conn.on('data', (data) => {
            handleData(data);
        });

        conn.on('close', () => {
            disconnect();
        });

        addChatMessage('Sistema', 'Conectado a ' + remotePeerId);
        
        // Si estamos recibiendo, también mostramos su ID
        if (remotePeerIdInput.value !== remotePeerId) {
            remotePeerIdInput.value = remotePeerId;
        }
    }

    function setupCall(incomingCall) {
        call = incomingCall;
        
        incomingCall.on('stream', (stream) => {
            remoteStream = stream;
            remoteVideo.srcObject = stream;
            remoteVideo.style.display = 'block';
            placeholder.style.display = 'none';
            addChatMessage('Sistema', 'Stream de video recibido');
            
            // Mostrar indicador de mouse si es posible
            setupMouseTracking();
        });

        incomingCall.on('close', () => {
            disconnect();
        });

        incomingCall.on('error', (err) => {
            console.error('Call error:', err);
            disconnect();
        });
    }

    // =============================================
    // ENVÍO DE DATOS (control remoto)
    // =============================================
    function sendData(type, data) {
        if (!conn || !isConnected) {
            console.warn('No conectado');
            return false;
        }
        try {
            conn.send({
                type: type,
                data: data,
                timestamp: Date.now()
            });
            return true;
        } catch (e) {
            console.error('Error al enviar:', e);
            return false;
        }
    }

    function handleData(data) {
        console.log('Datos recibidos:', data);
        
        if (data.type === 'chat') {
            addChatMessage('Remoto', data.data);
        } else if (data.type === 'mouse') {
            // Simular movimiento de mouse en pantalla remota
            if (data.data.x !== undefined && data.data.y !== undefined) {
                const rect = screenDisplay.getBoundingClientRect();
                const x = rect.left + (data.data.x * rect.width / 100);
                const y = rect.top + (data.data.y * rect.height / 100);
                mouseIndicator.style.left = (x - 10) + 'px';
                mouseIndicator.style.top = (y - 10) + 'px';
                mouseIndicator.style.display = 'block';
                setTimeout(() => {
                    mouseIndicator.style.display = 'none';
                }, 300);
            }
        } else if (data.type === 'key') {
            addChatMessage('Sistema', 'Tecla: ' + data.data);
        }
    }

    // =============================================
    // CONTROLES REMOTOS
    // =============================================
    function sendKey(key) {
        if (!isConnected) {
            addChatMessage('Sistema', 'No estás conectado');
            return;
        }
        sendData('key', key);
        addChatMessage('Tú', 'Tecla: ' + key);
    }

    // Seguimiento de mouse (para enviar posición)
    function setupMouseTracking() {
        screenDisplay.addEventListener('mousemove', (e) => {
            if (!isConnected || !conn) return;
            const rect = screenDisplay.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            sendData('mouse', { x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y)) });
        });
    }

    // =============================================
    // CHAT
    // =============================================
    function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        if (!isConnected) {
            addChatMessage('Sistema', 'No estás conectado');
            chatInput.value = '';
            return;
        }
        sendData('chat', msg);
        addChatMessage('Tú', msg);
        chatInput.value = '';
    }

    function addChatMessage(sender, message) {
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `<span class="sender">${sender}:</span> ${message}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // =============================================
    // UTILIDADES
    // =============================================
    function updateStatus(state, text) {
        statusDot.className = 'status-dot' + (state === 'connected' ? ' connected' : '');
        statusText.textContent = text;
    }

    function disconnect() {
        if (call) {
            call.close();
            call = null;
        }
        if (conn) {
            conn.close();
            conn = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (remoteStream) {
            remoteStream.getTracks().forEach(track => track.stop());
            remoteStream = null;
        }
        
        remoteVideo.style.display = 'none';
        remoteVideo.srcObject = null;
        placeholder.style.display = 'flex';
        isConnected = false;
        updateStatus('disconnected', 'Desconectado');
        connectionInfo.textContent = 'Esperando conexión...';
        remoteName.textContent = 'Pantalla remota';
        mouseIndicator.style.display = 'none';
        addChatMessage('Sistema', 'Desconectado');
    }

    function copyPeerId() {
        const id = myPeerIdEl.textContent;
        if (id && id !== 'Cargando...') {
            navigator.clipboard.writeText(id).then(() => {
                addChatMessage('Sistema', 'ID copiado: ' + id);
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = id;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                addChatMessage('Sistema', 'ID copiado: ' + id);
            });
        }
    }

    function generateNewId() {
        if (isConnected) {
            disconnect();
        }
        // Reiniciar Peer
        peer.destroy();
        location.reload();
    }

    function toggleFullscreen() {
        const el = document.querySelector('.container');
        if (!document.fullscreenElement) {
            el.requestFullscreen().catch(err => {
                console.log('Error al entrar en pantalla completa:', err);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // =============================================
    // INICIALIZACIÓN
    // =============================================
    console.log('AnyDesk Clone iniciado');
    
    // Si hay un ID en la URL, auto-conectar
    const params = new URLSearchParams(window.location.search);
    const autoConnect = params.get('connect');
    if (autoConnect) {
        remotePeerIdInput.value = autoConnect;
    }

    // Atajo de teclado para enviar mensaje
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.fullscreenElement) {
            document.exitFullscreen();
        }
    });

    // Prevenir cierre accidental
    window.addEventListener('beforeunload', () => {
        if (isConnected) {
            disconnect();
        }
    });
</script>

</body>
</html>
