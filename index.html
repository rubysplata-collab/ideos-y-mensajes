<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveTok & WaveChat - Premium Edition</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-sidebar: #121b22;
      --accent: #00e676; 
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
      --streak-color: #ff9100;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA LATERAL */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      padding: 20px 10px;
      gap: 25px;
      flex-shrink: 0;
    }

    .brand h2 {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
    }

    .side-menu { display: flex; flex-direction: column; gap: 8px; }
    
    .menu-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:hover, .menu-item.active {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent);
    }
    .menu-item i { font-size: 1.2rem; width: 25px; }

    .separator {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-dim);
      letter-spacing: 1px;
      padding-left: 15px;
      margin-top: 10px;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: black;
    }

    /* PANTALLAS */
    .screen { display: none; width: 100%; height: 100%; flex-direction: column; background: var(--bg-dark); }
    .screen.active { display: flex; }

    .top-bar {
      background: var(--bg-sidebar);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .search-wrapper { position: relative; width: 300px; }
    .search-wrapper input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px 8px 35px;
      border-radius: 20px;
      color: white;
      outline: none;
    }
    .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

    /* REPRODUCTOR CORREGIDO PARA QUE NO SE COMA LOS BOTONES */
    .tok-feed-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      height: calc(100vh - 70px);
      overflow: hidden;
    }
    .tok-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: hidden;
    }
    .tok-post {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .tok-video { 
      width: 100%; 
      height: 100%; 
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; 
      background: #000; 
    }
    
    .tok-actions {
      position: absolute;
      right: 25px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      z-index: 999;
    }
    .circle-action {
      background: rgba(30, 44, 52, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      width: 48px; height: 48px;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .circle-action.liked { color: var(--danger); }
    .tok-actions span { font-size: 0.8rem; color: white; margin-top: -10px; text-shadow: 1px 1px 3px black; }

    .tok-meta {
      position: absolute;
      left: 30px;
      bottom: 40px;
      z-index: 10;
      max-width: 60%;
      text-shadow: 1px 1px 5px black;
    }

    .nav-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: white; width: 45px; height: 45px;
      border-radius: 50%; display: flex; align-items: center;
      justify-content: center; cursor: pointer; z-index: 15;
    }
    .nav-arrow:hover { background: var(--accent); color: black; }
    .arrow-left { left: 20px; }
    .arrow-right { right: 20px; }

    /* CHATS */
    .chat-layout { display: flex; flex: 1; height: 100%; }
    .chats-master {
      width: 320px;
      background: var(--bg-sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }
    .chats-detail { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
    
    .chat-item {
      display: flex; align-items: center; gap: 12px; padding: 15px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.02); cursor: pointer;
    }
    .chat-item:hover, .chat-item.active { background: rgba(255,255,255,0.03); }
    
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #233138;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent);
    }

    /* CONTADOR RACHAS */
    .streak-badge {
      background: rgba(255, 145, 0, 0.15);
      color: var(--streak-color);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .messages-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 65%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; color: white; }
    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }

    .share-card {
      background: #1c2732; border: 1px solid var(--accent);
      border-radius: 12px; padding: 12px; cursor: pointer; min-width: 180px;
    }

    .input-bar {
      padding: 15px 25px; background: var(--bg-sidebar);
      display: flex; align-items: center; gap: 15px;
    }
    .input-bar input {
      flex: 1; background: rgba(255,255,255,0.05); border: none;
      padding: 12px 20px; border-radius: 25px; color: white; outline: none;
    }
    .input-bar i { font-size: 1.3rem; color: var(--accent); cursor: pointer; }

    /* PERFIL */
    .profile-container { padding: 40px; display: flex; flex-direction: column; gap: 30px; overflow-y: auto; }
    .profile-header-box { display: flex; align-items: center; gap: 25px; }
    .profile-pic-wrapper { position: relative; width: 110px; height: 110px; }
    .p-avatar { width: 100%; height: 100%; border-radius: 50%; background: #054735; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; border: 3px solid var(--accent); background-size: cover; background-position: center; }
    .profile-pic-wrapper label { position: absolute; bottom: 0; right: 0; background: var(--accent); color: black; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .my-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .grid-card { position: relative; aspect-ratio: 9/16; background: black; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .grid-card video { width: 100%; height: 100%; object-fit: cover; }
    .del-btn { position: absolute; top: 8px; right: 8px; background: var(--danger); color: white; border: none; border-radius: 5px; width: 28px; height: 28px; cursor: pointer; z-index: 5; }

    /* MODALES */
    .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
    .modal-box { background: var(--bg-sidebar); border: 1px solid var(--accent); padding: 30px; border-radius: 20px; width: 360px; text-align: center; }
    .modal-box input { width:100%; padding:12px; margin:15px 0; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:#000; color:white; text-align:center; outline:none; }
    .btn-solid { background: var(--accent); color:black; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <h2><i class="fa-solid fa-clapperboard"></i> WaveTok</h2>
    </div>
    <nav class="side-menu">
      <div class="menu-item active" id="menu-tok" onclick="navegarHacia('tok')">
        <i class="fa-solid fa-house"></i> <span>Para ti</span>
      </div>
      <div class="menu-item" id="menu-chat" onclick="navegarHacia('chat')">
        <i class="fa-solid fa-comment-dots"></i> <span>Chats privados</span>
      </div>
      <div class="menu-item" id="menu-profile" onclick="navegarHacia('profile')">
        <i class="fa-solid fa-user"></i> <span>Mi Perfil</span>
      </div>
    </nav>
    <div class="separator">Descubrir</div>
    <div class="side-menu">
      <div class="menu-item" onclick="abrirModalSubir()">
        <i class="fa-solid fa-circle-plus" style="color:var(--accent)"></i> <span>Subir video</span>
      </div>
    </div>
  </aside>

  <main class="main-content">

    <div class="screen active" id="screen-tok">
      <div class="top-bar">
        <h3 style="color: white;">Explorar</h3>
      </div>
      <div class="tok-feed-container">
        <button class="nav-arrow arrow-left" onclick="cambiarVideoFeed(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="nav-arrow arrow-right" onclick="cambiarVideoFeed(1)"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="tok-wrapper" id="tokFeedIterator"></div>
      </div>
    </div>

    <div class="screen" id="screen-chat">
      <div class="chat-layout">
        <div class="chats-master">
          <div class="top-bar" style="padding: 15px;">
            <button class="btn-solid" style="width: 100%;" onclick="abrirModalConexion()"><i class="fa-solid fa-user-plus"></i> Conectar Amigo</button>
          </div>
          <div style="flex:1; overflow-y:auto;" id="chatListContainer"></div>
        </div>
        <div class="chats-detail">
          <div class="top-bar" id="chatDetailHeader" style="display: none;">
            <h4 id="targetChatName" style="color: white;">Amigo</h4>
          </div>
          <div class="messages-container" id="msgBox"></div>
          <div class="input-bar" id="chatInputBarArea" style="display: none;">
            <input type="text" id="chatInput" placeholder="Escribe un mensaje...">
            <i class="fa-solid fa-paper-plane" onclick="enviarMensaje()"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-profile">
      <div class="top-bar">
        <h3 style="color: white;">Ajustes de Perfil</h3>
      </div>
      <div class="profile-container">
        <div class="profile-header-box">
          <div class="profile-pic-wrapper">
            <div class="p-avatar" id="avatarPerfilGrafico">U</div>
            <label for="fileAvatarInput"><i class="fa-solid fa-camera"></i></label>
            <input type="file" id="fileAvatarInput" accept="image/*" style="display:none" onchange="procesarCambioAvatar(this)">
          </div>
          <div>
            <h2 id="txtLabelPerfilID" style="color: var(--accent);">@CREADOR</h2>
          </div>
        </div>
        <div>
          <h3 style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">Mis Publicaciones</h3>
          <div class="my-grid" id="gridMisVideosPublicados"></div>
        </div>
      </div>
    </div>

  </main>

  <div class="modal-bg" id="modalRegistroInicial" style="display: flex;">
    <div class="modal-box">
      <h2 style="color: var(--accent);">Crear ID WaveTok</h2>
      <input type="text" id="inputUsernameUnico" placeholder="Ej: marcos99">
      <button class="btn-solid" style="width: 100%;" onclick="registrarNodoCliente()">Ingresar</button>
    </div>
  </div>

  <div class="modal-bg" id="connectModal">
    <div class="modal-box">
      <h3>Vincular Amigo</h3>
      <input type="text" id="inputPeerIdDestino" placeholder="ID de tu amigo">
      <button class="btn-solid" style="width: 100%;" onclick="conectarConPeerAmigo()">Vincular</button>
      <p onclick="cerrarModal()" style="margin-top:15px; font-size:0.85rem; cursor:pointer; color:var(--text-dim)">Cerrar</p>
    </div>
  </div>

  <div class="modal-bg" id="modalSubirVideo">
    <div class="modal-box" style="width: 420px;">
      <h3>Publicar en WaveTok</h3>
      <input type="file" id="inputVideoFileSource" accept="video/*" onchange="cargarPrevisualizacionVideo(this)">
      <div style="width:100%; height:180px; background:black; margin:10px 0; border-radius:10px; overflow:hidden;">
        <video id="videoRenderPreview" style="width:100%; height:100%; object-fit:contain;" loop muted autoplay></video>
      </div>
      <input type="text" id="inputVideoCaption" placeholder="¿De qué trata tu video?">
      <button class="btn-solid" style="width: 100%;" onclick="guardarVideoEditadoDB()">🚀 Subir al Feed</button>
      <p onclick="cerrarCapaModal('modalSubirVideo')" style="margin-top:15px; font-size:0.85rem; cursor:pointer; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

<script>
  let peerInstance = null, conn = null, activePeerId = null, currentTargetPeerId = null;
  let dbIndexedStorage = null;
  let cacheVideoBase64 = "";
  let masterVideoArray = [];
  let currentFeedIndex = 0;

  // Inicialización de la Base de Datos con persistencia blindada
  function abrirManejadorDB(callback) {
    let peticion = indexedDB.open("WaveTokStorageMaster", 1);
    peticion.onupgradeneeded = function(e) {
      let db = e.target.result;
      if (!db.objectStoreNames.contains("videos")) {
        db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
      }
    };
    peticion.onsuccess = function(e) {
      dbIndexedStorage = e.target.result;
      if(callback) callback();
    };
    peticion.onerror = function() { 
      if(callback) callback(); 
    };
  }

  window.onload = () => {
    const sesionID = localStorage.getItem('wt_session_peer_id');
    abrirManejadorDB(() => {
      cargarVideosDesdeDisco(() => {
        if (sesionID) {
          document.getElementById('modalRegistroInicial').style.display = 'none';
          levantarInstanciaPeer(sesionID);
          sincronizarAtributosPerfilEstatico();
        }
      });
    });
  };

  // Carga estable desde disco para evitar pérdidas al actualizar
  function cargarVideosDesdeDisco(callback) {
    let videosPorDefecto = [
      { id: 101, author: "WAVETOK", caption: "¡Bienvenidos al feed estable! 🎬🔥", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", likes: 1024, liked: false },
      { id: 102, author: "SAMPLE", caption: "Prueba de scroll vertical interactivo 🐰🍃", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", likes: 582, liked: false }
    ];

    if (!dbIndexedStorage) {
      masterVideoArray = videosPorDefecto;
      if(callback) callback();
      return;
    }

    let transaccion = dbIndexedStorage.transaction(["videos"], "readonly");
    let almacen = transaccion.objectStore("videos");
    let solicitud = almacen.getAll();

    solicitud.onsuccess = function() {
      if (solicitud.result && solicitud.result.length > 0) {
        let deUsuario = [...solicitud.result].reverse();
        masterVideoArray = deUsuario.concat(videosPorDefecto);
      } else {
        masterVideoArray = videosPorDefecto;
      }
      if(callback) callback();
    };

    solicitud.onerror = function() {
      masterVideoArray = videosPorDefecto;
      if(callback) callback();
    };
  }

  function registrarNodoCliente() {
    const user = document.getElementById('inputUsernameUnico').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!user) return alert("Ingresa un identificador válido.");
    const idUnicoGenerado = 'wave-' + user;
    localStorage.setItem('wt_session_peer_id', idUnicoGenerado);
    document.getElementById('modalRegistroInicial').style.display = 'none';
    levantarInstanciaPeer(idUnicoGenerado);
    sincronizarAtributosPerfilEstatico();
  }

  function levantarInstanciaPeer(idMio) {
    peerInstance = new Peer(idMio);
    
    peerInstance.on('open', () => { 
      renderizarFeedPrincipalVideos(); 
    });

    peerInstance.on('connection', (incomingConn) => {
      conn = incomingConn;
      activePeerId = conn.peer;
      currentTargetPeerId = conn.peer;
      almacenarAmigoEnLista(currentTargetPeerId);
      actualizarRacha(currentTargetPeerId); 
      enlazarEscuchadoresDatos();
      despacharMensajesOffline(currentTargetPeerId);
    });
  }

  function conectarConPeerAmigo(idDirecto) {
    let target = idDirecto || document.getElementById('inputPeerIdDestino').value.trim().toLowerCase();
    if(!target) return;
    if(!target.startsWith('wave-')) target = 'wave-' + target;
    
    almacenarAmigoEnLista(target);
    cerrarModal();
    
    conn = peerInstance.connect(target);
    activePeerId = target;
    
    conn.on('open', () => {
      actualizarRacha(target);
      despacharMensajesOffline(target);
    });

    enlazarEscuchadoresDatos();
    if(!idDirecto) desplegarChatIndividual(target);
  }

  // Escuchador de datos corregido para Incógnito y Videos Compartidos
  function enlazarEscuchadoresDatos() {
    if (!conn) return;
    conn.on('data', (data) => {
      const box = document.getElementById('msgBox');
      const pantallaChatActiva = document.getElementById('screen-chat').classList.contains('active');
      
      if (data.type === 'text') {
        guardarEnHistorial(conn.peer, 'friend', data.content);
        actualizarRacha(conn.peer);
        
        if (pantallaChatActiva && currentTargetPeerId === conn.peer) {
          if (data.content.startsWith('SHARE_VD_IDX:')) {
            let partes = data.content.split(':');
            box.innerHTML += `
              <div class="bubble recv">
                <div class="share-card" onclick="saltarAVideoDesdeLink(${partes[1]})">
                  <span style="color:var(--accent); font-weight:bold;">🎬 Video Compartido</span>
                  <p style="margin-top:5px;">${partes[2] || 'Ver publicación'}</p>
                </div>
              </div>`;
          } else {
            box.innerHTML += `<div class="bubble recv">${data.content}</div>`;
          }
          box.scrollTop = box.scrollHeight;
        }
      }
    });
  }

  // Envío corregido: Guarda la variable antes de limpiar el input
  function enviarMensaje() {
    const input = document.getElementById('chatInput');
    const mensaje = input.value.trim();
    if (!mensaje || !conn) return;
    
    guardarEnHistorial(currentTargetPeerId, 'me', mensaje);
    actualizarRacha(currentTargetPeerId);

    if (conn && conn.open && conn.peer === currentTargetPeerId) {
      conn.send({ type: 'text', content: mensaje });
    } else {
      encolarMensajeOffline(currentTargetPeerId, { type: 'text', content: mensaje });
    }
    
    const box = document.getElementById('msgBox');
    box.innerHTML += `<div class="bubble sent">${mensaje}</div>`;
    input.value = '';
    box.scrollTop = box.scrollHeight;
  }

  // Compartición Offline vía Colas Locales
  function compartirVideoPorChat(idx) {
    let video = masterVideoArray[idx];
    let listAmigos = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    
    if (listAmigos.length === 0) {
      return alert("Vincula a un amigo en Chats privados primero.");
    }
    
    let targetFriend = currentTargetPeerId || listAmigos[0];
    let payloadStr = `SHARE_VD_IDX:${video.id}:${video.caption}`;
    
    guardarEnHistorial(targetFriend, 'me', payloadStr);
    actualizarRacha(targetFriend);

    if (conn && conn.peer === targetFriend && conn.open) {
      conn.send({ type: 'text', content: payloadStr });
      alert("¡Video compartido directo!");
    } else {
      encolarMensajeOffline(targetFriend, { type: 'text', content: payloadStr });
      alert("Amigo desconectado. Se enviará automáticamente cuando se conecte 🚀");
    }
  }

  function encolarMensajeOffline(pId, payload) {
    let queue = JSON.parse(localStorage.getItem(`queue_${pId}`) || '[]');
    queue.push(payload);
    localStorage.setItem(`queue_${pId}`, JSON.stringify(queue));
  }

  function despacharMensajesOffline(pId) {
    let queue = JSON.parse(localStorage.getItem(`queue_${pId}`) || '[]');
    if(queue.length > 0 && conn && conn.open) {
      queue.forEach(data => conn.send(data));
      localStorage.removeItem(`queue_${pId}`);
    }
  }

  // Sistema de Rachas de TikTok
  function actualizarRacha(pId) {
    let rachasMap = JSON.parse(localStorage.getItem('wt_rachas_data') || '{}');
    let hoy = new Date().toDateString();
    
    if (!rachasMap[pId]) {
      rachasMap[pId] = { count: 1, lastDate: hoy };
    } else {
      let ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
      if (rachasMap[pId].lastDate === ayer.toDateString()) {
        rachasMap[pId].count += 1;
        rachasMap[pId].lastDate = hoy;
      } else if (rachasMap[pId].lastDate !== hoy) {
        rachasMap[pId].count = 1; 
        rachasMap[pId].lastDate = hoy;
      }
    }
    localStorage.setItem('wt_rachas_data', JSON.stringify(rachasMap));
    renderizarListaChats();
  }

  function obtenerContadorRacha(pId) {
    let rachasMap = JSON.parse(localStorage.getItem('wt_rachas_data') || '{}');
    return rachasMap[pId] ? rachasMap[pId].count : 0;
  }

  function saltarAVideoDesdeLink(vId) {
    let indexFound = masterVideoArray.findIndex(v => v.id === vId);
    if(indexFound !== -1) {
      navegarHacia('tok');
      enfocarVideoSpecificoFeed(indexFound);
    } else {
      alert("Este video local no está guardado en este dispositivo.");
    }
  }

  function navegarHacia(pantalla) {
    document.querySelectorAll('.tok-video').forEach(v => v.pause());
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    if(document.getElementById(`menu-${pantalla}`)) document.getElementById(`menu-${pantalla}`).classList.add('active');
    document.getElementById(`screen-${pantalla}`).classList.add('active');

    if(pantalla === 'tok') reproducirVideoIndiceActual();
    else if(pantalla === 'chat') renderizarListaChats();
    else if(pantalla === 'profile') renderizarMosaicoVideosPerfil();
  }

  function desplegarChatIndividual(id) {
    currentTargetPeerId = id;
    document.getElementById('targetChatName').innerText = id.replace('wave-','').toUpperCase();
    document.getElementById('chatDetailHeader').style.display = 'flex';
    document.getElementById('chatInputBarArea').style.display = 'flex';
    if(!conn || conn.peer !== id) conectarConPeerAmigo(id);
    dibujarMensajesHistorial(id);
  }

  function guardarEnHistorial(pId, sender, text) {
    let hist = JSON.parse(localStorage.getItem(`h_v2_${pId}`) || '[]');
    hist.push({ sender, text });
    localStorage.setItem(`h_v2_${pId}`, JSON.stringify(hist));
  }

  function dibujarMensajesHistorial(pId) {
    let hist = JSON.parse(localStorage.getItem(`h_v2_${pId}`) || '[]');
    const box = document.getElementById('msgBox');
    box.innerHTML = '';
    hist.forEach(h => {
      if(h.text.startsWith('SHARE_VD_IDX:')) {
        let frag = h.text.split(':');
        box.innerHTML += `
          <div class="bubble ${h.sender === 'me' ? 'sent' : 'recv'}">
            <div class="share-card" onclick="saltarAVideoDesdeLink(${frag[1]})">
              <span style="color:var(--accent); font-weight:bold;">🎬 Video Compartido</span>
              <p style="margin-top:5px; font-size:0.9rem;">${frag[2] || 'Ver vídeo'}</p>
            </div>
          </div>`;
      } else {
        box.innerHTML += `<div class="bubble ${h.sender === 'me' ? 'sent' : 'recv'}">${h.text}</div>`;
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  function renderizarListaChats() {
    let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    list.forEach(id => {
      let racha = obtenerContadorRacha(id);
      let rachaHtml = racha > 0 ? `<div class="streak-badge"><i class="fa-solid fa-fire"></i> ${racha}</div>` : '';
      container.innerHTML += `
        <div class="chat-item" onclick="desplegarChatIndividual('${id}')">
          <div class="avatar">${id.replace('wave-','').substring(0,2).toUpperCase()}</div>
          <div style="flex:1; display:flex; justify-content:space-between; align-items:center;">
            <div style="margin-left: 10px;">
              <h5 style="color:white;">${id.replace('wave-','').toUpperCase()}</h5>
              <p style="color:var(--text-dim); font-size:0.8rem;">Click para chatear</p>
            </div>
            ${rachaHtml}
          </div>
        </div>`;
    });
  }

  function almacenarAmigoEnLista(id) {
    let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    if(!list.includes(id)) { list.push(id); localStorage.setItem('wave_chats', JSON.stringify(list)); }
  }

  function renderizarFeedPrincipalVideos() {
    const container = document.getElementById('tokFeedIterator');
    container.innerHTML = '';
    if(masterVideoArray.length === 0) {
      container.innerHTML = `<div style="color:white; margin:auto;">No hay videos en el feed.</div>`;
      return;
    }
    masterVideoArray.forEach((vid, idx) => {
      container.innerHTML += `
        <div class="tok-post">
          <video class="tok-video" src="${vid.url}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
          <div class="tok-actions">
            <div class="circle-action ${vid.liked?'liked':''}" onclick="reaccionarLikeVideo(${idx}, this)"><i class="fa-solid fa-heart"></i></div>
            <span>${vid.likes}</span>
            <div class="circle-action" style="color:var(--accent);" onclick="compartirVideoPorChat(${idx})"><i class="fa-solid fa-share"></i></div>
          </div>
          <div class="tok-meta">
            <h3>@${vid.author}</h3>
            <p>${vid.caption}</p>
          </div>
        </div>`;
    });
    currentFeedIndex = 0;
    container.scrollLeft = 0;
    setTimeout(reproducirVideoIndiceActual, 200);
  }

  function cambiarVideoFeed(dir) {
    const wrapper = document.getElementById('tokFeedIterator');
    let target = currentFeedIndex + dir;
    if (target >= 0 && target < masterVideoArray.length) {
      document.querySelectorAll('.tok-video').forEach(v => v.pause());
      currentFeedIndex = target;
      wrapper.scrollLeft = currentFeedIndex * wrapper.clientWidth;
      setTimeout(reproducirVideoIndiceActual, 150);
    }
  }

  function enfocarVideoSpecificoFeed(idx) {
    currentFeedIndex = idx;
    const wrapper = document.getElementById('tokFeedIterator');
    if(wrapper) {
      wrapper.scrollLeft = currentFeedIndex * wrapper.clientWidth;
      setTimeout(reproducirVideoIndiceActual, 150);
    }
  }

  function reproducirVideoIndiceActual() {
    const vids = document.querySelectorAll('.tok-video');
    if(vids[currentFeedIndex]) {
      vids[currentFeedIndex].play().catch(()=>{});
    }
  }

  function sincronizarAtributosPerfilEstatico() {
    const miID = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : 'USER';
    document.getElementById('txtLabelPerfilID').innerText = `@${miID}`;
    document.getElementById('avatarPerfilGrafico').innerText = miID.substring(0,1);
    const pic = localStorage.getItem('wt_custom_avatar_b64');
    if(pic) {
      document.getElementById('avatarPerfilGrafico').style.backgroundImage = `url(${pic})`;
      document.getElementById('avatarPerfilGrafico').innerText = '';
    }
  }

  function procesarCambioAvatar(input) {
    if(input.files && input.files[0]) {
      let r = new FileReader();
      r.onload = function(e) {
        localStorage.setItem('wt_custom_avatar_b64', e.target.result);
        sincronizarAtributosPerfilEstatico();
      };
      r.readAsDataURL(input.files[0]);
    }
  }

  function renderizarMosaicoVideosPerfil() {
    const grid = document.getElementById('gridMisVideosPublicados');
    grid.innerHTML = '';
    const miFirma = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : "ANÓNIMO";
    let filtrados = masterVideoArray.filter(v => v.author === miFirma);
    if(filtrados.length === 0) {
      grid.innerHTML = '<p style="color:gray; font-size:0.85rem; padding:15px;">No has subido clips de video todavía.</p>';
      return;
    }
    filtrados.forEach(v => {
      let orig = masterVideoArray.findIndex(m => m.id === v.id);
      grid.innerHTML += `
        <div class="grid-card">
          <button class="del-btn" onclick="event.stopPropagation(); destruirVideoEspecifico(${v.id})"><i class="fa-solid fa-trash"></i></button>
          <video src="${v.url}" muted onclick="navegarHacia('tok'); enfocarVideoSpecificoFeed(${orig});"></video>
        </div>`;
    });
  }

  function destruirVideoEspecifico(id) {
    if(confirm("¿Eliminar publicación permanentemente?")) {
      let tx = dbIndexedStorage.transaction(["videos"], "readwrite");
      tx.objectStore("videos").delete(id);
      tx.oncomplete = () => { cargarVideosDesdeDisco(() => { renderizarMosaicoVideosPerfil(); }); };
    }
  }

  function reaccionarLikeVideo(idx, node) {
    masterVideoArray[idx].liked = !masterVideoArray[idx].liked;
    masterVideoArray[idx].likes += masterVideoArray[idx].liked ? 1 : -1;
    node.classList.toggle('liked');
    node.nextElementSibling.innerText = masterVideoArray[idx].likes;
  }

  function cargarPrevisualizacionVideo(input) {
    if (!input.files[0]) return;
    const r = new FileReader();
    r.onload = (e) => {
      cacheVideoBase64 = e.target.result;
      document.getElementById('videoRenderPreview').src = cacheVideoBase64;
    };
    r.readAsDataURL(input.files[0]);
  }

  // Guardado Seguro en Base de Datos (Persistencia Real al actualizar)
  function guardarVideoEditadoDB() {
    const caption = document.getElementById('inputVideoCaption').value.trim() || "Clip de WaveTok";
    if(!cacheVideoBase64) return alert("Selecciona un archivo multimedia.");
    const miFirma = localStorage.getItem('wt_session_peer_id') ? localStorage.getItem('wt_session_peer_id').replace('wave-','').toUpperCase() : "ANÓNIMO";
    
    // Generamos una ID numérica única basada en la estampa de tiempo
    const pack = { id: Date.now(), author: miFirma, caption: caption, url: cacheVideoBase64, likes: 0, liked: false };

    let tx = dbIndexedStorage.transaction(["videos"], "readwrite");
    let almacen = tx.objectStore("videos");
    almacen.add(pack);

    tx.oncomplete = () => {
      document.getElementById('inputVideoCaption').value = '';
      cacheVideoBase64 = "";
      cerrarCapaModal('modalSubirVideo');
      // Recarga el feed leyendo directamente la base de datos de disco
      cargarVideosDesdeDisco(() => { 
        navegarHacia('tok'); 
        renderizarFeedPrincipalVideos(); 
      });
    };
  }

  function abrirModalConexion() { document.getElementById('connectModal').style.display = 'flex'; }
  function abrirModalSubir() { document.getElementById('modalSubirVideo').style.display = 'flex'; }
  function cerrarModal() { document.getElementById('connectModal').style.display = 'none'; }
  function cerrarCapaModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
