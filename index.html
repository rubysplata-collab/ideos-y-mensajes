<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok P2P Premium</title>
    <style>
        /* Reset de estilos básicos */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background-color: #0b0b0b; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        
        /* Contenedor móvil estilo TikTok */
        .phone-container { 
            width: 100%; 
            max-width: 410px; 
            height: 820px; 
            background: #000; 
            border: 10px solid #222; 
            border-radius: 40px; 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.9); 
            display: flex; 
            flex-direction: column; 
        }

        /* PANTALLA COMPLETA DE VIDEO FEED */
        .video-feed { 
            position: relative;
            width: 100%; 
            height: calc(100% - 60px); /* Restando la barra de navegación inferior */
            background: #000; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        .main-video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Barra Superior Flotante: Siguiendo | Para ti */
        .top-nav-tiktok {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 15;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        .top-nav-item {
            cursor: pointer;
            color: rgba(255,255,255,0.6);
            transition: color 0.2s;
        }
        .top-nav-item.active {
            color: #fff;
            border-bottom: 2px solid #fff;
            padding-bottom: 4px;
        }

        /* Buscador flotante en la esquina */
        .search-icon-top {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 20px;
            z-index: 15;
            cursor: pointer;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        /* Iconos Flotantes Derecha (TikTok Real) */
        .side-icons { 
            position: absolute; 
            right: 12px; 
            bottom: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            z-index: 10; 
        }
        
        /* Foto de perfil creador con el boton de seguir "+" */
        .profile-wrapper { 
            position: relative; 
            width: 50px; 
            height: 50px; 
            cursor: pointer; 
            margin-bottom: 5px;
        }
        .profile-pic { 
            width: 50px; 
            height: 50px; 
            border-radius: 50%; 
            border: 2px solid #fff; 
            object-fit: cover; 
        }
        .edit-badge { 
            position: absolute; 
            bottom: -5px; 
            left: 50%;
            transform: translateX(-50%);
            background: #fe2c55; 
            color: white; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            font-size: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            border: 1.5px solid #000; 
        }
        #inputFotoPerfil { display: none; }

        /* Botones de interacción con contadores */
        .icon-btn { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
        }
        .icon-symbol { 
            font-size: 28px; 
            margin-bottom: 2px; 
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.6));
            transition: transform 0.1s;
        }
        .icon-symbol:active {
            transform: scale(1.2);
        }

        /* Disco de música giratorio */
        .music-disc {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: conic-gradient(#333, #111, #333);
            border: 5px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: girarDisco 4s linear infinite;
            margin-top: 5px;
            cursor: pointer;
        }
        .music-disc-inner {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes girarDisco {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Información del video abajo a la izquierda */
        .video-info { 
            position: absolute; 
            left: 15px; 
            bottom: 30px; 
            z-index: 10; 
            text-align: left; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
            max-width: 270px; 
        }
        .video-info h3 { 
            font-size: 16px; 
            margin-bottom: 6px; 
            font-weight: bold;
            cursor: pointer; 
        }
        .video-info p { 
            font-size: 14px; 
            line-height: 1.3; 
            margin-bottom: 8px;
        }
        .music-title {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #fff;
        }

        /* BANDEJA DE COMENTARIOS TIKTOK (DESLIZABLE) */
        .inbox-panel {
            position: absolute;
            bottom: 60px; /* Arriba de la barra de navegación */
            left: 0;
            width: 100%;
            height: 480px;
            background: rgba(20, 20, 20, 0.98);
            border-top: 1px solid #292929;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            backdrop-filter: blur(10px);
        }
        .inbox-panel.open {
            transform: translateY(0);
        }

        /* Cabecera del chat deslizable */
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #222;
        }
        .inbox-header h4 {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            flex-grow: 1;
        }
        .close-inbox-btn {
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }

        /* Contenido interno de Comentarios */
        .chat-section { 
            padding: 15px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow-y: hidden;
        }
        
        .chat-box { 
            background: transparent; 
            padding: 5px; 
            height: 280px; 
            overflow-y: auto; 
            margin-bottom: 10px; 
            font-size: 13px; 
            text-align: left; 
        }
        .msg { 
            margin-bottom: 15px; 
            line-height: 1.4; 
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .msg-content {
            display: flex;
            flex-direction: column;
        }
        .msg-user { 
            color: #8a8b91; 
            font-weight: bold; 
            font-size: 12px;
            margin-bottom: 2px;
        }
        .msg-text {
            color: #fff;
            font-size: 13px;
        }

        .chat-controls { display: flex; gap: 8px; align-items: center; }
        .chat-controls input[type="text"] { 
            flex-grow: 1;
            padding: 12px; 
            border-radius: 20px; 
            border: none; 
            background: #2b2b2b; 
            color: white; 
            font-size: 13px; 
        }
        
        .btn-tiktok { 
            background: #fe2c55; 
            color: white; 
            border: none; 
            width: 40px;
            height: 40px;
            border-radius: 50%; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px; 
        }
        #subirVideoLocal { display: none; }

        /* BARRA DE NAVEGACIÓN INFERIOR (ESTILO TIKTOK) */
        .tiktok-nav { 
            background: #000; 
            height: 60px;
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid #161616; 
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 50; 
        }
        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-size: 10px; 
            color: #8a8b91; 
            cursor: pointer; 
            transition: color 0.1s;
        }
        .nav-item.active { color: white; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        
        /* Botón de subir central estilizado */
        .plus-btn-container {
            position: relative;
            width: 45px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .plus-btn-background {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, #25f4ee 0%, #fe2c55 100%);
            z-index: 1;
        }
        .plus-btn-foreground {
            position: absolute;
            width: 37px;
            height: 100%;
            border-radius: 8px;
            background: #fff;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        /* Overlay para pausar */
        .play-overlay { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 60px; 
            color: rgba(255,255,255,0.4); 
            pointer-events: none; 
            opacity: 0; 
            transition: opacity 0.2s; 
            z-index: 5;
        }

        /* Botón para navegar entre videos */
        .nav-arrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 15;
            font-weight: bold;
        }
        .nav-arrow-up { top: 70px; }
        .nav-arrow-down { bottom: 80px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de tu Firebase (¡Conectado directamente a tu proyecto!)
        const firebaseConfig = {
            apiKey: "AIzaSyBB3UvcGKDXdiCo3cX4nKiDVdFR31d4ytA",
            authDomain: "mensajes-tiktokk.firebaseapp.com",
            projectId: "mensajes-tiktokk",
            storageBucket: "mensajes-tiktokk.firebasestorage.app",
            messagingSenderId: "1079940811085",
            appId: "1:1079940811085:web:6ab00b6476ef4d85908f04"
        };

        // Inicializamos Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables de estado
        let videosGlobales = [];
        let indiceVideoActual = 0;
        let nombreUsuario = localStorage.getItem('nombreUsuario') || "@tu_usuario";
        let avatarBase64 = localStorage.getItem('avatarBase64') || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";

        // Aplicar avatar e identificación guardada en interfaz
        document.getElementById('miUsuario').innerText = nombreUsuario;
        document.getElementById('avatar').src = avatarBase64;
        document.getElementById('avatarDisc').src = avatarBase64;

        // --- SISTEMA DE NAVEGACIÓN Y CARGA DE VIDEOS DESDE FIRESTORE ---
        const videosCol = collection(db, "videos");
        const q = query(videosCol, orderBy("fecha", "desc"));

        onSnapshot(q, (snapshot) => {
            videosGlobales = [];
            snapshot.forEach((doc) => {
                videosGlobales.push({ id: doc.id, ...doc.data() });
            });

            if (videosGlobales.length > 0) {
                mostrarVideoActual();
            } else {
                // Video por defecto si la BD está vacía
                videosGlobales.push({
                    id: "defecto",
                    usuario: "@tiktok_p2p",
                    videoUrl: "https://v1.assets.tcgd.controlshift.club/mov_bbb.mp4",
                    descripcion: "¡Sé el primero en subir un video real presionando el botón central de '+' abajo! 🚀",
                    comentarios: []
                });
                mostrarVideoActual();
            }
        });

        function mostrarVideoActual() {
            const videoData = videosGlobales[indiceVideoActual];
            const reproductor = document.getElementById('reproductorVideo');

            reproductor.pause();
            reproductor.src = videoData.videoUrl;
            reproductor.load();
            reproductor.play().catch(err => console.log("Auto-play bloqueado temporalmente. Haz clic para reproducir."));

            document.getElementById('miUsuario').innerText = videoData.usuario;
            document.getElementById('videoDesc').innerText = videoData.descripcion || "¡Mira este increíble video!";
            document.getElementById('numComentarios').innerText = videoData.comentarios ? videoData.comentarios.length : 0;
            
            // Si el video tiene avatar de creador, lo cargamos
            if (videoData.creadorAvatar) {
                document.getElementById('avatar').src = videoData.creadorAvatar;
            }

            renderizarComentarios(videoData.comentarios || []);
        }

        // Navegación de videos (Arriba / Abajo)
        window.videoSiguiente = function() {
            if (indiceVideoActual < videosGlobales.length - 1) {
                indiceVideoActual++;
                mostrarVideoActual();
            } else {
                alert("¡Llegaste al final de los videos publicados!");
            }
        }

        window.videoAnterior = function() {
            if (indiceVideoActual > 0) {
                indiceVideoActual--;
                mostrarVideoActual();
            }
        }

        // --- PUBLICAR VIDEO NUEVO ---
        window.publicarVideoNuevo = async function(input) {
            const archivo = input.files[0];
            if (!archivo) return;

            document.getElementById('videoDesc').innerText = "Subiendo video a la red pública...";
            
            // Usamos un servicio libre y rápido de subida temporal de archivos (tmpfiles.org)
            const formData = new FormData();
            formData.append("file", archivo);

            try {
                const response = await fetch("https://tmpfiles.org/api/v1/upload", {
                    method: "POST",
                    body: formData
                });
                const resData = await response.json();
                
                if (resData.status === "success") {
                    // Convertimos la URL de visualización a una URL directa de descarga/reproducción
                    const urlDirecta = resData.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
                    
                    // Guardamos en Firebase Firestore
                    await addDoc(videosCol, {
                        usuario: nombreUsuario,
                        creadorAvatar: avatarBase64,
                        videoUrl: urlDirecta,
                        descripcion: "¡Nuevo video cargado en vivo! 🎬",
                        fecha: Date.now(),
                        comentarios: []
                    });

                    alert("¡Video publicado con éxito para todo el mundo!");
                    indiceVideoActual = 0; // Mostrar el video más reciente
                } else {
                    alert("Error al subir el archivo.");
                }
            } catch (error) {
                console.error(error);
                alert("Error al conectar con el servidor de subidas rápidas.");
            }
        }

        // --- SISTEMA DE COMENTARIOS CON FIRESTORE ---
        function renderizarComentarios(comentarios) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = "";

            if (comentarios.length === 0) {
                chatBox.innerHTML = `<div style="text-align:center; color:#aaa; margin-top:30px;">No hay comentarios todavía. ¡Sé el primero!</div>`;
                return;
            }

            comentarios.forEach(c => {
                const autorAvatar = c.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150";
                chatBox.innerHTML += `
                    <div class="msg">
                        <img src="${autorAvatar}" class="msg-avatar">
                        <div class="msg-content">
                            <span class="msg-user">${c.autor}</span>
                            <span class="msg-text">${c.texto}</span>
                        </div>
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.enviarMensaje = async function() {
            const inputTexto = document.getElementById('mensajeTexto');
            const texto = inputTexto.value.trim();
            if (texto === "") return;

            const videoActual = videosGlobales[indiceVideoActual];
            if (videoActual.id === "defecto") {
                alert("No puedes comentar en el video de demostración inicial. ¡Sube un video primero!");
                return;
            }

            const nuevoComentario = {
                autor: nombreUsuario,
                avatar: avatarBase64,
                texto: texto,
                fecha: Date.now()
            };

            const videoDocRef = doc(db, "videos", videoActual.id);
            try {
                await updateDoc(videoDocRef, {
                    comentarios: arrayUnion(nuevoComentario)
                });
                inputTexto.value = "";
            } catch (err) {
                console.error("Error al publicar comentario: ", err);
            }
        }

        // --- AJUSTES DE PERFIL Y NOMBRE DE USUARIO ---
        window.cambiarNombre = function() {
            const nuevoUser = prompt("Escribe tu nombre de usuario para comentar:", nombreUsuario);
            if(nuevoUser && nuevoUser.trim() !== "") {
                nombreUsuario = nuevoUser.trim().startsWith('@') ? nuevoUser.trim() : '@' + nuevoUser.trim();
                document.getElementById('miUsuario').innerText = nombreUsuario;
                localStorage.setItem('nombreUsuario', nombreUsuario);
            }
        }

        window.abrirSelectorFotoPerfil = function() {
            document.getElementById('inputFotoPerfil').click();
        }

        window.actualizarFotoPerfil = function(input) {
            const archivo = input.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    avatarBase64 = e.target.result;
                    document.getElementById('avatar').src = avatarBase64;
                    document.getElementById('avatarDisc').src = avatarBase64;
                    localStorage.setItem('avatarBase64', avatarBase64);
                };
                lector.readAsDataURL(archivo);
            }
        }
    </script>
</head>
<body>

    <div class="phone-container">
        
        <div class="top-nav-tiktok">
            <span class="top-nav-item">Siguiendo</span>
            <span class="top-nav-item active">Para ti</span>
            <span class="search-icon-top">🔍</span>
        </div>

        <button class="nav-arrow nav-arrow-up" onclick="videoAnterior()">▲ Anterior</button>
        <button class="nav-arrow nav-arrow-down" onclick="videoSiguiente()">▼ Siguiente</button>

        <div class="video-feed" id="feedVideo" onclick="togglePlay(document.getElementById('reproductorVideo'))">
            
            <video id="reproductorVideo" class="main-video" loop autoplay muted playsinline>
                <source id="fuenteVideo" src="" type="video/mp4">
            </video>
            <div class="play-overlay" id="playIndicator">▶</div>

            <div class="video-info" onclick="event.stopPropagation()">
                <h3 id="miUsuario" onclick="cambiarNombre()">@tu_usuario</h3>
                <p id="videoDesc">Cargando videos de la comunidad... 🎬</p>
                <div class="music-title">
                    <span>🎵</span>
                    <marquee scrollamount="3" width="150px">Sonido original de la comunidad</marquee>
                </div>
            </div>

            <div class="side-icons" onclick="event.stopPropagation()">
                <div class="profile-wrapper" onclick="abrirSelectorFotoPerfil()">
                    <img id="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="profile-pic" alt="Foto de perfil">
                    <div class="edit-badge">+</div>
                </div>
                <input type="file" id="inputFotoPerfil" accept="image/*" onchange="actualizarFotoPerfil(this)">

                <div class="icon-btn" onclick="alert('❤️ ¡Le diste Me Gusta!')">
                    <span class="icon-symbol">❤️</span>
                    <span>1.5M</span>
                </div>

                <div class="icon-btn" onclick="toggleInbox()">
                    <span class="icon-symbol">💬</span>
                    <span id="numComentarios">0</span>
                </div>

                <div class="icon-btn" onclick="alert('⭐ ¡Agregado a Favoritos!')">
                    <span class="icon-symbol">⭐</span>
                    <span>95K</span>
                </div>

                <div class="icon-btn" onclick="limpiarTodo()">
                    <span class="icon-symbol" style="font-size: 26px; transform: scaleX(-1);">↩️</span>
                    <span style="font-size: 10px; color: #ffeb3b; font-weight: bold;">Reset</span>
                </div>

                <div class="music-disc">
                    <img id="avatarDisc" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="music-disc-inner">
                </div>
            </div>
        </div>

        <div class="inbox-panel" id="inboxPanel">
            <div class="inbox-header">
                <h4>Comentarios públicos</h4>
                <span class="close-inbox-btn" onclick="toggleInbox()">✕</span>
            </div>

            <div class="chat-section">
                <div class="chat-box" id="chatBox"></div>

                <div class="chat-controls">
                    <input type="text" id="mensajeTexto" placeholder="Escribe un comentario público...">
                    <button class="btn-tiktok" onclick="enviarMensaje()">➜</button>
                </div>
            </div>
        </div>

        <input type="file" id="subirVideoLocal" accept="video/*" onchange="publicarVideoNuevo(this)">

        <div class="tiktok-nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>Inicio</span>
            </div>
            <div class="nav-item" onclick="cambiarNombre()">
                <span class="nav-icon">👥</span>
                <span>Amigos</span>
            </div>
            
            <div class="nav-item" onclick="document.getElementById('subirVideoLocal').click()">
                <div class="plus-btn-container">
                    <div class="plus-btn-background"></div>
                    <div class="plus-btn-foreground">+</div>
                </div>
            </div>

            <div class="nav-item" onclick="toggleInbox()" id="inboxNavTab">
                <span class="nav-icon">📥</span>
                <span>Comentar</span>
            </div>
            <div class="nav-item" onclick="cambiarNombre()">
                <span class="nav-icon">👤</span>
                <span>Perfil</span>
            </div>
        </div>

    </div>

    <script>
        // Desplegar/Ocultar bandeja de comentarios
        function toggleInbox() {
            const panel = document.getElementById('inboxPanel');
            const navTab = document.getElementById('inboxNavTab');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                navTab.classList.add('active');
            } else {
                navTab.classList.remove('active');
            }
        }

        // Play y Pausa del Video al hacer tap en la pantalla
        function togglePlay(videoElement) {
            const overlay = document.getElementById('playIndicator');
            if (videoElement.paused) {
                videoElement.play();
                overlay.style.opacity = 0;
            } else {
                videoElement.pause();
                overlay.style.opacity = 1;
            }
        }

        function limpiarTodo() {
            const confirmar = confirm("¿Quieres restablecer la aplicación y borrar tu perfil guardado en el navegador?");
            if (confirmar) {
                localStorage.clear();
                alert("¡Perfil reiniciado! Recargando...");
                location.reload();
            }
        }
    </script>
</body>
