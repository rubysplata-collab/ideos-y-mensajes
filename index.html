<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveChat 2.0 - Premium Edition</title>
  
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-card: #151d26;
      --accent: #00e676; 
      --text-main: #f5f5f7;
      --text-dim: #8b9bb4;
      --bubble-sent: #002d62;
      --bubble-recv: #1f2c34;
      --danger: #ff1744;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 850px;
      background-color: var(--bg-dark);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      position: relative;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    .screen { display: none; flex-direction: column; height: 100%; width: 100%; }
    .screen.active { display: flex; }

    /* --- REGISTRO INICIAL --- */
    .register-box {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* --- CABECERA --- */
    .header {
      background-color: #1f2c34;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .header h2 { color: var(--accent); font-size: 1.4rem; font-weight: 700; }

    .connect-btn {
      background-color: var(--accent);
      color: black;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* --- LISTA DE CHATS --- */
    .chat-list { flex: 1; overflow-y: auto; background-color: #121b22; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
    }

    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background-color: #054735;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      border: 2px solid var(--accent);
    }

    .chat-info { flex: 1; }
    .chat-info h4 { margin-bottom: 4px; font-size: 1.05rem; }
    .chat-preview { color: var(--text-dim); font-size: 0.85rem; }

    /* --- CHAT ACTIVO --- */
    .messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0b141a;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 5px;
      display: block;
    }

    .sent { background-color: var(--bubble-sent); align-self: flex-end; border-bottom-right-radius: 2px; }
    .recv { background-color: var(--bubble-recv); align-self: flex-start; border-bottom-left-radius: 2px; }

    .typing-status {
      font-size: 0.8rem;
      color: var(--accent);
      padding: 5px 20px;
      background-color: #0b141a;
      display: none;
    }

    /* --- BARRA DE ENTRADA --- */
    .input-bar {
      padding: 15px;
      background-color: #1f2c34;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-bar input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 18px;
      border-radius: 25px;
      color: white;
      outline: none;
    }

    .input-bar i {
      font-size: 1.2rem;
      color: var(--accent);
      cursor: pointer;
    }

    /* --- PANEL DE STICKERS BLINDADO --- */
    .tenor-panel {
      display: none;
      background: #151d26;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      height: 250px;
      flex-direction: column;
      gap: 10px;
    }

    .tenor-search-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .tenor-search {
      flex: 1;
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      background: #0b0e14;
      color: white;
      outline: none;
    }

    .tenor-results {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-y: auto;
    }

    .tenor-results img {
      width: 100%;
      height: 75px;
      object-fit: contain;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
      background: rgba(255,255,255,0.02);
    }

    .tenor-results img:hover { transform: scale(1.05); }

    /* --- MODALES --- */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .modal-content {
      background: var(--bg-card);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--accent);
    }

    .modal input, .register-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #0b0e14;
      color: white;
      text-align: center;
      outline: none;
    }

    /* --- VIDEO / PANTALLA --- */
    .call-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: black;
      z-index: 200;
      flex-direction: column;
    }

    #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #111; }
    #localVideo {
      position: absolute;
      top: 20px; right: 20px;
      width: 120px; height: 180px;
      border-radius: 15px;
      border: 2px solid var(--accent);
      object-fit: cover;
      z-index: 210;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="screen" id="registerScreen">
    <div class="register-box">
      <h2 style="color: var(--accent);">Crea tu ID WaveChat</h2>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Elige tu nombre (ej. fer, jheiler, juan). Sin espacios ni caracteres raros.</p>
      <input type="text" id="usernameInput" placeholder="Escribe tu nombre aquí">
      <button class="connect-btn" style="width:100%; justify-content:center; padding:12px;" onclick="guardarNombreDeUsuario()">
        Confirmar ID Único
      </button>
    </div>
  </div>

  <div class="screen" id="chatsScreen">
    <header class="header">
      <h2>WaveChat</h2>
      <button class="connect-btn" onclick="abrirModalConexion()">
        <i class="fa-solid fa-plus"></i> Conectar
      </button>
    </header>
    <div class="chat-list" id="chatListContainer"></div>
    
    <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #121b22; border-top: 1px solid rgba(255,255,255,0.05);">
      <span style="font-size: 0.8rem; color: var(--text-dim);">
        Tu ID: <strong id="myIdFooter" style="color: var(--accent);">...</strong>
      </span>
      <button onclick="forzarCambioDeNombre()" style="background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem;">
        <i class="fa-solid fa-pen-to-square"></i> Editar
      </button>
    </div>
  </div>

  <div class="screen" id="activeChatScreen">
    <header class="header">
      <div style="display:flex; align-items:center; gap:10px;">
        <i class="fa-solid fa-arrow-left" onclick="irAListaChats()" style="cursor:pointer"></i>
        <div id="activeChatName" style="font-weight: bold;">Nombre</div>
      </div>
      <div style="display:flex; gap: 15px; align-items: center;">
        <i class="fa-solid fa-trash" onclick="confirmarBorrarHistorial()" style="color:var(--text-dim); cursor:pointer"></i>
        <i class="fa-solid fa-desktop" onclick="iniciarLlamada(true)" style="color:var(--accent); cursor:pointer; font-size: 1.1rem;" title="Compartir Pantalla"></i>
        <i class="fa-solid fa-video" onclick="iniciarLlamada(false)" style="color:var(--accent); cursor:pointer; font-size: 1.1rem;" title="Videollamada"></i>
      </div>
    </header>
    
    <div class="messages-box" id="msgBox"></div>
    <div class="typing-status" id="typingLabel">Escribiendo...</div>

    <div class="tenor-panel" id="tenorPanel">
      <div class="tenor-search-box">
        <input type="text" class="tenor-search" id="tenorSearchInput" placeholder="Buscar Stickers (risas, meme, xd)..." onkeydown="detectarEnterSticker(event)">
        <button onclick="buscarStickers()" style="background:var(--accent); border:none; padding: 0 15px; border-radius:20px; color:black; cursor:pointer; font-weight:bold;">
          <i class="fa-solid fa-magnifying-glass" style="color:black; font-size:0.9rem;"></i>
        </button>
      </div>
      <div class="tenor-results" id="stickerResults"></div>
    </div>

    <div class="input-bar">
      <input type="file" id="fileInput" style="display: none;" onchange="enviarArchivo(this)">
      
      <i class="fa-solid fa-paperclip" onclick="document.getElementById('fileInput').click()" title="Mandar Foto o Archivo"></i>
      <i class="fa-regular fa-face-smile" onclick="toggleStickersPanel()" title="Buscar Stickers"></i>
      
      <input type="text" id="chatInput" placeholder="Mensaje..." oninput="detectarEscritura()">
      <i class="fa-solid fa-paper-plane" onclick="enviarMensaje()" title="Enviar"></i>
    </div>
  </div>

  <div class="modal" id="connectModal">
    <div class="modal-content">
      <h3 style="color:var(--accent)">Nueva Conexión</h3>
      <p style="font-size: 0.85rem; margin-top:10px; color: var(--text-dim)">Ingresa el ID de tu amigo para agregarlo a tus chats:</p>
      <input type="text" id="peerIdInput" placeholder="Ejemplo: wave-fer">
      <button class="connect-btn" style="width:100%; justify-content:center" onclick="conectarConPeer()">
        Vincular Chat
      </button>
      <p onclick="cerrarModal()" style="margin-top:15px; font-size:0.8rem; cursor:pointer; color:var(--text-dim)">Cancelar</p>
    </div>
  </div>

  <div class="call-overlay" id="callOverlay">
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <div style="position:absolute; bottom:40px; width:100%; display:flex; justify-content:center;">
      <button onclick="colgarLlamada()" style="background:var(--danger); border:none; padding:15px; border-radius:50%; color:white;">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

</div>

<script>
  let peer;
  let conn = null;
  let activePeerId = null;
  let localStream = null;
  let typingTimeout;

  // Colección de stickers 100% INMUNE A BLOQUEOS (SVGs Inline codificados en Base64)
  // No requieren internet, no hacen llamadas de red, jamás saldrá el icono roto.
  const backupStickers = [
    { name: 'xd', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFD15C"/><path d="M25 40 l15-10 l-15-10 M75 40 l-15-10 l15-10" stroke="%23472500" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M30 65 Q50 85 70 65" stroke="%23472500" stroke-width="6" fill="none" stroke-linecap="round"/></svg>' },
    { name: 'risa', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFD15C"/><ellipse cx="35" cy="35" rx="5" ry="10" fill="%23472500"/><ellipse cx="65" cy="35" rx="5" ry="10" fill="%23472500"/><path d="M25 60 Q50 90 75 60 Z" fill="%23472500"/><path d="M35 60 Q50 70 65 60" fill="white"/></svg>' },
    { name: 'meme', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFD15C"/><circle cx="32" cy="35" r="10" fill="white" stroke="%23472500" stroke-width="3"/><circle cx="32" cy="35" r="4" fill="black"/><circle cx="68" cy="35" r="14" fill="white" stroke="%23472500" stroke-width="3"/><circle cx="68" cy="35" r="7" fill="black"/><path d="M30 65 Q50 50 70 65" stroke="%23472500" stroke-width="6" fill="none" stroke-linecap="round"/></svg>' },
    { name: 'baile', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="30" r="15" fill="%23FFD15C"/><path d="M50 45 L50 75 M50 55 L25 40 M50 55 L75 50 M50 75 L35 95 M50 75 L65 95" stroke="%23FFD15C" stroke-width="8" stroke-linecap="round"/></svg>' },
    { name: 'llorar', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFD15C"/><ellipse cx="35" cy="40" rx="4" ry="7" fill="%23472500"/><ellipse cx="65" cy="40" rx="4" ry="7" fill="%23472500"/><path d="M35 70 Q50 55 65 70" stroke="%23472500" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M35 48 L35 80 M65 48 L65 80" stroke="%235CADFF" stroke-width="6" stroke-linecap="round"/></svg>' },
    { name: 'ok', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%2300E676"/><path d="M30 50 L45 65 L70 35" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>' },
    { name: 'gato', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M15 40 L35 15 L50 35 L65 15 L85 40 L80 80 L20 80 Z" fill="%23FFA726"/><circle cx="35" cy="50" r="5" fill="black"/><circle cx="65" cy="50" r="5" fill="black"/><path d="M45 60 L55 60 L50 65 Z" fill="%23FF7043"/><path d="M40 70 Q50 78 60 70" stroke="black" stroke-width="3" fill="none"/></svg>' },
    { name: 'perro', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M20 40 L80 40 L80 80 L20 80 Z" fill="%23A1887F"/><path d="M15 30 L30 30 L25 60 Z" fill="%237D6608"/><path d="M85 30 L70 30 L75 60 Z" fill="%237D6608"/><circle cx="35" cy="55" r="5" fill="black"/><circle cx="65" cy="55" r="5" fill="black"/><ellipse cx="50" cy="65" rx="7" ry="5" fill="black"/></svg>' },
    { name: 'love', url: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FFD15C"/><path d="M20 35 C 20 20, 45 20, 45 35 C 45 20, 70 20, 70 35 C 70 55, 45 70, 45 70 C 45 70, 20 55, 20 35 Z" fill="%23FF1744"/></svg>' }
  ];

  window.onload = () => {
    const savedId = localStorage.getItem('wave_my_id');
    if (savedId) {
      inicializarPeer(savedId);
    } else {
      mostrarPantalla('registerScreen');
    }
  };

  function mostrarPantalla(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function guardarNombreDeUsuario() {
    const input = document.getElementById('usernameInput');
    const rawName = input.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

    if (!rawName) return alert("Por favor, introduce un nombre válido.");

    const finalID = 'wave-' + rawName;
    localStorage.setItem('wave_my_id', finalID);
    inicializarPeer(finalID);
  }

  function forzarCambioDeNombre() {
    localStorage.removeItem('wave_my_id');
    mostrarPantalla('registerScreen');
    if (peer) peer.destroy();
  }

  function inicializarPeer(myId) {
    document.getElementById('myIdFooter').innerText = myId;
    mostrarPantalla('chatsScreen');
    renderizarListaChats();

    peer = new Peer(myId);
    
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert("Ese nombre ya está en uso. Por favor, elige otro.");
        localStorage.removeItem('wave_my_id');
        mostrarPantalla('registerScreen');
      }
    });

    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      activePeerId = conn.peer;
      vincularEventos();
      registrarChatEnLista(activePeerId);
    });

    peer.on('call', async (call) => {
      if(confirm("¿Recibir transmisión de " + call.peer.replace('wave-','').toUpperCase() + "?")) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
          document.getElementById('localVideo').srcObject = localStream;
        } catch(e) {
          console.log("No se pudo iniciar cámara local, solo recibiendo señal.");
        }
        document.getElementById('callOverlay').style.display = 'flex';
        call.answer(localStream);
        call.on('stream', (remote) => document.getElementById('remoteVideo').srcObject = remote);
      }
    });
  }

  // --- NAVEGACIÓN ---
  function abrirModalConexion() { document.getElementById('connectModal').style.display = 'flex'; }
  function cerrarModal() { document.getElementById('connectModal').style.display = 'none'; }
  
  function irAListaChats() {
    document.getElementById('tenorPanel').style.display = 'none';
    mostrarPantalla('chatsScreen');
    activePeerId = null;
    renderizarListaChats();
  }

  function renderizarListaChats() {
    const list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    if(list.length === 0) {
      container.innerHTML = '<p style="text-align:center; padding:40px; color:gray">No tienes chats activos todavía. Usa "Conectar" para agregar uno.</p>';
      return;
    }

    list.forEach(id => {
      container.innerHTML += `
        <div class="chat-item" onclick="abrirChat('${id}')">
          <div class="avatar">${id.replace('wave-','').substring(0,2).toUpperCase()}</div>
          <div class="chat-info">
            <h4>${id.replace('wave-','').toUpperCase()}</h4>
            <p class="chat-preview">Historial guardado localmente</p>
          </div>
        </div>
      `;
    });
  }

  function abrirChat(id) {
    activePeerId = id;
    document.getElementById('activeChatName').innerText = id.replace('wave-','').toUpperCase();
    mostrarPantalla('activeChatScreen');
    
    if(!conn || conn.peer !== id) {
      conectarConPeer(id);
    }
    
    cargarHistorial(id);
  }

  function conectarConPeer(idManual) {
    let id = idManual || document.getElementById('peerIdInput').value.trim().toLowerCase();
    if(!id) return;
    
    if(!id.startsWith('wave-')) id = 'wave-' + id;

    conn = peer.connect(id);
    vincularEventos();
    registrarChatEnLista(id);
    cerrarModal();
    if(!idManual) abrirChat(id);
  }

  function vincularEventos() {
    conn.on('data', (data) => {
      if(data.type === 'typing') {
        const typingText = activePeerId.replace('wave-','').toUpperCase() + ' está escribiendo...';
        document.getElementById('typingLabel').innerText = typingText;
        document.getElementById('typingLabel').style.display = data.status ? 'block' : 'none';
      } else if(data.type === 'text') {
        recibirMensaje(data.content, 'text');
      } else if(data.type === 'image') {
        recibirMensaje(data.content, 'image');
      } else if(data.type === 'file') {
        recibirMensaje(data, 'file');
      }
    });
  }

  function registrarChatEnLista(id) {
    let list = JSON.parse(localStorage.getItem('wave_chats') || '[]');
    if(!list.includes(id)) {
      list.push(id);
      localStorage.setItem('wave_chats', JSON.stringify(list));
    }
  }

  // --- ENVIAR MENSAJES ---
  function detectarEscritura() {
    if(conn && conn.open) {
      conn.send({ type: 'typing', status: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        conn.send({ type: 'typing', status: false });
      }, 1500);
    }
  }

  function enviarMensaje() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text || !conn) return;

    conn.send({ type: 'text', content: text });
    
    const box = document.getElementById('msgBox');
    box.innerHTML += `<div class="bubble sent">${text}</div>`;
    guardarEnHistorial(activePeerId, 'me', 'text', text);
    
    input.value = '';
    box.scrollTop = box.scrollHeight;
    conn.send({ type: 'typing', status: false });
  }

  function recibirMensaje(data, format) {
    const box = document.getElementById('msgBox');
    if (format === 'text') {
      box.innerHTML += `<div class="bubble recv">${data}</div>`;
      guardarEnHistorial(activePeerId, 'friend', 'text', data);
    } else if (format === 'image') {
      box.innerHTML += `<div class="bubble recv"><img src="${data}"></div>`;
      guardarEnHistorial(activePeerId, 'friend', 'image', data);
    } else if (format === 'file') {
      box.innerHTML += `
        <div class="bubble recv">
          <p style="font-size:0.8rem; color:var(--text-dim)">Archivo recibido:</p>
          <a href="${data.content}" download="${data.fileName}" class="connect-btn" style="margin-top:5px; text-decoration:none; display:inline-flex;">
            <i class="fa-solid fa-download"></i> ${data.fileName}
          </a>
        </div>`;
      guardarEnHistorial(activePeerId, 'friend', 'file', JSON.stringify({ name: data.fileName, data: data.content }));
    }
    box.scrollTop = box.scrollHeight;
  }

  // --- COMPARTIR FOTOS Y ARCHIVOS ---
  function enviarArchivo(element) {
    const file = element.files[0];
    if (!file || !conn) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const fileData = evt.target.result;
      const box = document.getElementById('msgBox');
      
      if (file.type.startsWith('image/')) {
        conn.send({ type: 'image', content: fileData });
        box.innerHTML += `<div class="bubble sent"><img src="${fileData}"></div>`;
        guardarEnHistorial(activePeerId, 'me', 'image', fileData);
      } else {
        conn.send({ type: 'file', content: fileData, fileName: file.name });
        box.innerHTML += `
          <div class="bubble sent">
            <p style="font-size:0.8rem; opacity:0.7">Archivo enviado:</p>
            <a href="${fileData}" download="${file.name}" class="connect-btn" style="margin-top:5px; text-decoration:none; display:inline-flex; background:rgba(255,255,255,0.1); color:white;">
              <i class="fa-solid fa-file"></i> ${file.name}
            </a>
          </div>`;
        guardarEnHistorial(activePeerId, 'me', 'file', JSON.stringify({ name: file.name, data: fileData }));
      }
      box.scrollTop = box.scrollHeight;
    };
    reader.readAsDataURL(file);
    element.value = ''; 
  }

  // --- BUSCADOR ULTRAESTABLE TENOR + NEKOS.BEST (CERO BLOQUEOS) ---
  function toggleStickersPanel() {
    const panel = document.getElementById('tenorPanel');
    if (panel.style.display === 'flex') {
      panel.style.display = 'none';
    } else {
      panel.style.display = 'flex';
      buscarStickers(); 
    }
  }

  function detectarEnterSticker(event) {
    if (event.key === "Enter") {
      buscarStickers();
    }
  }

  async function buscarStickers() {
    const query = document.getElementById('tenorSearchInput').value.trim() || 'smile';
    const resultsContainer = document.getElementById('stickerResults');
    resultsContainer.innerHTML = '<p style="grid-column: span 3; text-align:center; color:gray; padding:20px;">Buscando...</p>';

    // 1. INTENTO PRINCIPAL: Tenor v1 (No bloquea GitHub Pages y es ultra estable)
    try {
      const tenorUrl = `https://g.tenor.com/v1/search?q=${encodeURIComponent(query)}&key=LIVDSRZULELA&limit=12`;
      const res = await fetch(tenorUrl);
      if (res.ok) {
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          resultsContainer.innerHTML = '';
          data.results.forEach(sticker => {
            const media = sticker.media && sticker.media[0];
            const gifUrl = media?.tinygif?.url || media?.gif?.url || sticker.url;
            if (gifUrl) {
              resultsContainer.innerHTML += `<img src="${gifUrl}" onclick="enviarSticker('${gifUrl}')" onerror="this.style.display='none'">`;
            }
          });
          return; // Carga completada
        }
      }
    } catch(err) {
      console.warn("Tenor falló, intentando con API secundaria Nekos.best...");
    }

    // 2. INTENTO SECUNDARIO (TOTALMENTE LIBRE DE CORS Y HOTLINKING): nekos.best
    try {
      const fallbackUrl = `https://nekos.best/api/v2/search?q=${encodeURIComponent(query)}&limit=12`;
      const res = await fetch(fallbackUrl);
      if (res.ok) {
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          resultsContainer.innerHTML = '';
          data.results.forEach(item => {
            const gifUrl = item.url;
            if (gifUrl) {
              resultsContainer.innerHTML += `<img src="${gifUrl}" onclick="enviarSticker('${gifUrl}')" onerror="this.style.display='none'">`;
            }
          });
          return;
        }
      }
    } catch(err) {
      console.warn("Fallo general de red, cargando stickers internos...");
    }

    // 3. INTENTO SALVAVIDAS COMPLETAMENTE INTEGRADO E INMUNE A CAÍDAS (SVGs locatizados)
    resultsContainer.innerHTML = '';
    const queryClean = query.toLowerCase();
    const filtrados = backupStickers.filter(s => s.name.includes(queryClean) || queryClean === 'smile' || queryClean === 'risas' || queryClean === 'xd');
    const stickersAMostrar = filtrados.length > 0 ? filtrados : backupStickers;

    stickersAMostrar.forEach(st => {
      resultsContainer.innerHTML += `<img src="${st.url}" onclick="enviarSticker('${st.url}')" title="${st.name}">`;
    });
  }

  function enviarSticker(url) {
    if(!conn) return;
    conn.send({ type: 'image', content: url });
    
    const box = document.getElementById('msgBox');
    box.innerHTML += `<div class="bubble sent"><img src="${url}"></div>`;
    guardarEnHistorial(activePeerId, 'me', 'image', url);
    
    document.getElementById('tenorPanel').style.display = 'none'; 
    box.scrollTop = box.scrollHeight;
  }

  // --- HISTORIAL ---
  function guardarEnHistorial(id, sender, type, text) {
    const key = `hist_${id}`;
    let fillHist = JSON.parse(localStorage.getItem(key) || '[]');
    fillHist.push({ sender, type, text });
    localStorage.setItem(key, JSON.stringify(fillHist));
  }

  function cargarHistorial(id) {
    const key = `hist_${id}`;
    const hist = JSON.parse(localStorage.getItem(key) || '[]');
    const box = document.getElementById('msgBox');
    box.innerHTML = '';
    
    hist.forEach(m => {
      if (m.type === 'text') {
        box.innerHTML += `<div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'}">${m.text}</div>`;
      } else if (m.type === 'image') {
        box.innerHTML += `<div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'}"><img src="${m.text}"></div>`;
      } else if (m.type === 'file') {
        const fileObj = JSON.parse(m.text);
        box.innerHTML += `
          <div class="bubble ${m.sender === 'me' ? 'sent' : 'recv'}">
            <p style="font-size:0.8rem; opacity:0.7">Archivo guardado:</p>
            <a href="${fileObj.data}" download="${fileObj.name}" class="connect-btn" style="margin-top:5px; text-decoration:none; display:inline-flex; ${m.sender === 'me' ? 'background:rgba(255,255,255,0.1); color:white;' : ''}">
              <i class="fa-solid fa-download"></i> ${fileObj.name}
            </a>
          </div>`;
      }
    });
    box.scrollTop = box.scrollHeight;
  }

  function confirmarBorrarHistorial() {
    if(confirm("¿Borrar historial de este chat? Tu amigo seguirá teniendo su copia.")) {
      localStorage.removeItem(`hist_${activePeerId}`);
      cargarHistorial(activePeerId);
    }
  }

  // --- VIDEOLLAMADA / COMPARTIR PANTALLA ---
  async function iniciarLlamada(compartirPantalla = false) {
    try {
      if (compartirPantalla) {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } else {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      }
      
      document.getElementById('callOverlay').style.display = 'flex';
      document.getElementById('localVideo').srcObject = localStream;
      
      const call = peer.call(activePeerId, localStream);
      call.on('stream', (remote) => document.getElementById('remoteVideo').srcObject = remote);
      
      if(compartirPantalla) {
        localStream.getVideoTracks()[0].onended = () => colgarLlamada();
      }
    } catch(err) {
      console.error("Error al iniciar stream: ", err);
      alert("No se pudo iniciar la transmisión.");
    }
  }

  function colgarLlamada() {
    if(localStream) {
      localStream.getTracks().forEach(track => track.stop());
    }
    location.reload(); 
  }
</script>
