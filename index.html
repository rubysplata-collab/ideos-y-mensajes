<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JHEILER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff304f%22/><polygon points=%2238,28 78,50 38,72%22 fill=%22white%22/></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Roboto","Segoe UI",Arial,sans-serif;
  background:#0f0f0f;
  color:#ffffff;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;color:#fff;}
img{display:block;max-width:100%;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:#0f0f0f;}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:#ff304f;}

:root{
  --bg:#0f0f0f;
  --panel:#181818;
  --panel2:#212121;
  --text:#ffffff;
  --text-secondary:#aaaaaa;
  --accent:#ff304f;
  --border:#303030;
  --header-h:56px;
  --sidebar-w:240px;
  --sidebar-w-mini:72px;
}

.hidden{display:none !important;}

#appHeader{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  z-index:200;
  border-bottom:1px solid transparent;
}
.header-left{display:flex;align-items:center;gap:20px;min-width:0;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-size:20px;
  transition:background .15s;
  flex-shrink:0;
}
.icon-btn:hover{background:#3a3a3a;}
.brand{
  display:flex;align-items:center;gap:4px;
  font-size:20px;font-weight:700;letter-spacing:-0.5px;
  color:var(--text);white-space:nowrap;
}
.brand .play-ico{color:var(--accent);font-size:22px;transform:translateY(-1px);}

.header-center{
  flex:1;display:flex;justify-content:center;align-items:center;
  gap:8px;max-width:720px;margin:0 32px;
}
.search-form{
  display:flex;flex:1;align-items:center;
  border:1px solid var(--border);border-radius:20px 0 0 20px;
  background:var(--bg);height:40px;overflow:hidden;
}
.search-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:0 16px;font-size:15px;color:var(--text);
}
.search-btn{
  width:64px;height:40px;background:var(--panel2);
  border:1px solid var(--border);border-left:none;border-radius:0 20px 20px 0;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  flex-shrink:0;
}
.search-btn:hover{background:#3a3a3a;}

.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.create-btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:20px;background:var(--accent);
  font-size:14px;font-weight:600;white-space:nowrap;color:#fff;
}
.create-btn:hover{filter:brightness(0.9);}
.avatar-circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#fff;overflow:hidden;flex-shrink:0;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}

#sidebar{
  position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg);overflow-y:auto;z-index:150;
  transition:transform .2s ease, width .2s ease;
  padding-bottom:24px;
}
#sidebar.mini{width:var(--sidebar-w-mini);}
.sb-section{padding:12px 0;border-bottom:1px solid var(--border);}
.sb-section:last-child{border-bottom:none;}
.sb-title{
  padding:6px 24px;font-size:13px;font-weight:600;color:var(--text-secondary);
}
.sb-item{
  display:flex;align-items:center;gap:20px;
  padding:10px 24px;font-size:14px;border-radius:0 20px 20px 0;
  white-space:nowrap;overflow:hidden;
}
#sidebar.mini .sb-item{
  flex-direction:column;gap:4px;padding:14px 4px;font-size:10px;
  border-radius:8px;margin:0 4px;text-align:center;
}
#sidebar.mini .sb-title{display:none;}
.sb-item .sb-ico{font-size:20px;width:24px;text-align:center;flex-shrink:0;}
#sidebar.mini .sb-item .sb-ico{width:auto;font-size:20px;}
.sb-item:hover{background:#3a3a3a;}

#appBody{padding-top:var(--header-h);display:flex;min-height:100vh;}
#mainContent{
  flex:1;margin-left:var(--sidebar-w);padding:24px;min-width:0;
  transition:margin-left .2s ease;
}
#mainContent.mini-margin{margin-left:var(--sidebar-w-mini);}

@media (max-width:900px){
  #sidebar{transform:translateX(-100%);width:260px;}
  #sidebar.show{transform:translateX(0);}
  #mainContent{margin-left:0 !important;}
  .header-center{margin:0 12px;}
  .brand{font-size:17px;}
}
@media (max-width:600px){
  .header-center{display:none;}
  .create-btn span{display:none;}
  #mainContent{padding:12px;}
}

.section-heading{font-size:18px;font-weight:600;margin:4px 0 16px;}
.video-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px 12px;
}
.video-card{cursor:pointer;}
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--panel2);margin-bottom:8px;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;}
.thumb-wrap .no-thumb{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--text-secondary);background:linear-gradient(135deg,#212121,#0f0f0f);
}
.duration-badge{
  position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,0.85);
  color:#fff;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;
}
.card-meta{display:flex;gap:10px;}
.card-meta .avatar-circle{width:36px;height:36px;font-size:13px;margin-top:2px;}
.card-info{flex:1;min-width:0;}
.card-title{
  font-size:14px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:4px;
}
.card-channel{font-size:13px;color:var(--text-secondary);}
.card-stats{font-size:13px;color:var(--text-secondary);}

.state-box{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;text-align:center;color:var(--text-secondary);gap:12px;
}
.state-box h3{color:var(--text);font-size:18px;font-weight:600;}

#toastContainer{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:center;
}
.toast{
  background:#2a2a2a;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
}
.toast.error{background:#3a1418;border:1px solid var(--accent);}
.toast.success{background:#123a20;border:1px solid #2ecc71;}

.watch-layout{display:flex;gap:24px;align-items:flex-start;max-width:1600px;margin:0 auto;}
.watch-main{flex:1;min-width:0;}
.watch-side{width:360px;flex-shrink:0;}
@media (max-width:1100px){.watch-layout{flex-direction:column;}.watch-side{width:100%;}}

.player-wrap{width:100%;background:#000;border-radius:12px;overflow:hidden;margin-bottom:16px;}
.player-wrap video{width:100%;display:block;max-height:75vh;background:#000;}
.watch-title{font-size:20px;font-weight:600;margin-bottom:8px;}
.watch-meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.watch-stats{font-size:14px;color:var(--text-secondary);}

.channel-row{
  display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);margin-bottom:16px;
}
.channel-row-info{flex:1;}
.channel-row-info .cname{font-weight:600;font-size:15px;}

.watch-desc{background:var(--panel2);border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.5;margin-bottom:20px;}

.side-video-item{display:flex;gap:8px;margin-bottom:10px;cursor:pointer;}
.side-video-item .thumb-wrap{width:140px;flex-shrink:0;margin-bottom:0;}
.side-video-item .card-title{font-size:13px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal-card{
  background:var(--panel);border-radius:12px;padding:24px;width:100%;max-width:500px;
  display:flex;flex-direction:column;gap:14px;border:1px solid var(--border);
}
.modal-card input, .modal-card textarea{
  width:100%;padding:10px 14px;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;outline:none;font-size:14px;
}
.modal-card textarea{height:80px;resize:none;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
.btn-sec{padding:8px 16px;background:var(--panel2);border-radius:8px;font-weight:500;}
.btn-pri{padding:8px 16px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600;}

.spinner{
  width:24px;height:24px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.page-loading{display:flex;align-items:center;justify-content:center;padding:100px 0;}
</style>
</head>
<body>

<header id="appHeader">
  <div class="header-left">
    <button class="icon-btn" id="btnToggleSidebar">☰</button>
    <a href="#/home" class="brand"><span class="play-ico">▶</span> JHEILER</a>
  </div>

  <div class="header-center">
    <form class="search-form" id="searchForm">
      <input type="text" id="searchInput" placeholder="Buscar" autocomplete="off">
    </form>
    <button class="search-btn" id="searchSubmitBtn">🔍</button>
  </div>

  <div class="header-right">
    <button class="create-btn" id="btnCreate">➕ <span>Crear</span></button>
  </div>
</header>

<nav id="sidebar">
  <div class="sb-section">
    <a class="sb-item" href="#/home"><span class="sb-ico">🏠</span><span>Inicio</span></a>
    <a class="sb-item" href="#/shorts"><span class="sb-ico">⚡</span><span>Shorts</span></a>
    <a class="sb-item" href="#/subscriptions"><span class="sb-ico">📺</span><span>Suscripciones</span></a>
  </div>
  <div class="sb-section">
    <div class="sb-title">Biblioteca</div>
    <a class="sb-item" href="#/history"><span class="sb-ico">🕒</span><span>Historial</span></a>
    <a class="sb-item" href="#/your-videos"><span class="sb-ico">🎬</span><span>Tus videos</span></a>
  </div>
</nav>

<div id="appBody">
  <div id="mainContent"></div>
</div>

<div id="toastContainer"></div>

<script>
"use strict";

const SUPABASE_URL = "https://zrpaigevkndivtfsnkbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZNY7o83Xhn0ARxvH3_cxbw_AEyQah0q";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function qs(sel, root){ return (root||document).querySelector(sel); }
function escapeHTML(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDuration(sec){ sec=Math.floor(Number(sec)||0); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }

function toast(msg, type = 'info') {
  const container = qs('#toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function getRoute() {
  const hash = window.location.hash.slice(1) || '/home';
  const parts = hash.split('?');
  return { path: parts[0], query: new URLSearchParams(parts[1] || '') };
}

function navigate(path) { window.location.hash = path; }

async function renderPage() {
  const { path, query } = getRoute();
  const main = qs('#mainContent');
  if (!main) return;

  main.innerHTML = '<div class="page-loading"><div class="spinner"></div></div>';

  if (path === '/home' || path === '/') {
    await renderHome(main);
  } else if (path === '/watch') {
    await renderWatch(main, query.get('v'));
  } else if (path === '/shorts') {
    await renderShorts(main);
  } else if (path === '/search') {
    await renderSearchResults(main, query.get('q') || '');
  } else if (['/subscriptions', '/history', '/your-videos'].includes(path)) {
    main.innerHTML = `
      <div class="state-box">
        <h3>Sección vacía</h3>
        <p>Aún no hay elementos guardados en esta lista.</p>
      </div>`;
  } else {
    main.innerHTML = `<div class="state-box"><h3>Página no encontrada</h3></div>`;
  }
}

async function renderHome(container) {
  const { data: videos, error } = await supabase
    .from('videos')
    .select('*, profiles(*)')
    .order('created_at', { ascending: false });

  if (error || !videos || videos.length === 0) {
    container.innerHTML = `
      <div class="state-box">
        <h3>No hay videos cargados</h3>
        <p>Haz clic en el botón <strong>Crear</strong> arriba para publicar tu primer video.</p>
      </div>`;
    return;
  }

  container.innerHTML = `<div class="video-grid">${videos.map(v => renderVideoCard(v)).join('')}</div>`;
}

async function renderWatch(container, videoId) {
  if (!videoId) return;

  const { data: video } = await supabase
    .from('videos')
    .select('*, profiles(*)')
    .eq('id', videoId)
    .single();

  if (!video) return;

  const { data: related } = await supabase
    .from('videos')
    .select('*, profiles(*)')
    .neq('id', videoId)
    .limit(6);

  container.innerHTML = `
    <div class="watch-layout">
      <div class="watch-main">
        <div class="player-wrap">
          <video src="${escapeHTML(video.video_url)}" controls autoplay></video>
        </div>
        <h1 class="watch-title">${escapeHTML(video.title)}</h1>
        <div class="watch-meta-row">
          <div class="watch-stats">${video.views || 0} vistas</div>
        </div>
        <div class="channel-row">
          <div class="avatar-circle">U</div>
          <div class="channel-row-info">
            <div class="cname">${escapeHTML(video.profiles?.display_name || 'Canal')}</div>
          </div>
        </div>
        <div class="watch-desc">${escapeHTML(video.description || 'Sin descripción')}</div>
      </div>
      <div class="watch-side">
        <h3 class="section-heading">Más videos</h3>
        ${(related || []).map(r => `
          <div class="side-video-item" onclick="navigate('/watch?v=${r.id}')">
            <div class="thumb-wrap">
              ${r.thumbnail_url ? `<img src="${escapeHTML(r.thumbnail_url)}">` : '<div class="no-thumb">▶</div>'}
            </div>
            <div>
              <div class="card-title">${escapeHTML(r.title)}</div>
              <div class="card-channel">${escapeHTML(r.profiles?.display_name || 'Canal')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function renderShorts(container) {
  const { data: shorts } = await supabase
    .from('videos')
    .select('*')
    .eq('is_short', true);

  if (!shorts || shorts.length === 0) {
    container.innerHTML = `<div class="state-box"><h3>No hay Shorts disponibles</h3></div>`;
    return;
  }

  container.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;">
      <video src="${escapeHTML(shorts[0].video_url)}" controls loop style="max-height:80vh;border-radius:12px;"></video>
    </div>`;
}

async function renderSearchResults(container, query) {
  const { data: videos } = await supabase
    .from('videos')
    .select('*, profiles(*)')
    .ilike('title', `%${query}%`);

  container.innerHTML = `
    <h2 class="section-heading">Resultados para "${escapeHTML(query)}"</h2>
    <div class="video-grid">${(videos || []).map(v => renderVideoCard(v)).join('')}</div>
  `;
}

function renderVideoCard(video) {
  return `
    <div class="video-card" onclick="navigate('/watch?v=${video.id}')">
      <div class="thumb-wrap">
        ${video.thumbnail_url ? `<img src="${escapeHTML(video.thumbnail_url)}">` : '<div class="no-thumb">▶</div>'}
        <span class="duration-badge">${formatDuration(video.duration)}</span>
      </div>
      <div class="card-meta">
        <div class="avatar-circle">U</div>
        <div class="card-info">
          <div class="card-title">${escapeHTML(video.title)}</div>
          <div class="card-channel">${escapeHTML(video.profiles?.display_name || 'Canal')}</div>
          <div class="card-stats">${video.views || 0} vistas</div>
        </div>
      </div>
    </div>
  `;
}

function openUploadModal() {
  const modalHTML = `
    <div id="uploadModal" class="modal-backdrop">
      <div class="modal-card">
        <h2>Subir nuevo video</h2>
        <input type="text" id="upTitle" placeholder="Título del video">
        <input type="text" id="upUrl" placeholder="URL directa del archivo (.mp4)">
        <input type="text" id="upThumb" placeholder="URL de la miniatura (opcional)">
        <textarea id="upDesc" placeholder="Descripción"></textarea>
        <div class="modal-actions">
          <button class="btn-sec" onclick="document.getElementById('uploadModal').remove()">Cancelar</button>
          <button class="btn-pri" id="btnSaveVideo">Publicar</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHTML);

  qs('#btnSaveVideo').addEventListener('click', async () => {
    const title = qs('#upTitle').value.trim();
    const video_url = qs('#upUrl').value.trim();
    const thumbnail_url = qs('#upThumb').value.trim();
    const description = qs('#upDesc').value.trim();

    if (!title || !video_url) {
      toast('Título y URL del video son obligatorios', 'error');
      return;
    }

    const { error } = await supabase.from('videos').insert([
      { title, video_url, thumbnail_url, description }
    ]);

    if (error) {
      toast('Error al guardar: ' + error.message, 'error');
    } else {
      toast('¡Video subido con éxito!', 'success');
      qs('#uploadModal').remove();
      renderPage();
    }
  });
}

function setupEvents() {
  qs('#btnToggleSidebar')?.addEventListener('click', () => {
    qs('#sidebar')?.classList.toggle('mini');
    qs('#mainContent')?.classList.toggle('mini-margin');
  });

  qs('#btnCreate')?.addEventListener('click', openUploadModal);

  qs('#searchForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = qs('#searchInput').value.trim();
    if (val) navigate(`/search?q=${encodeURIComponent(val)}`);
  });

  window.addEventListener('hashchange', renderPage);
}

document.addEventListener('DOMContentLoaded', () => {
  setupEvents();
  renderPage();
});
</script>
</body>
</html>
